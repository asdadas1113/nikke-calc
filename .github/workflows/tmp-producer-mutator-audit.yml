name: tmp producer mutator audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - '.github/workflows/tmp-producer-mutator-audit.yml'
      - 'fast_engine/research/tmp_arcana_remove_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python fast_engine/research/tmp_arcana_remove_patch.py
      - name: Run focused regressions
        run: >-
          python -m unittest
          fast_engine.tests.test_damage_named_remove_dependency
          fast_engine.tests.test_damage_false_supported_guards
          fast_engine.tests.test_damage_real_squad_certification
          fast_engine.tests.test_damage_full_burst_conditional_passive -v
      - name: Commit semantic patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/engine/dispatcher.py fast_engine/engine/score.py fast_engine/tests/test_damage_named_remove_dependency.py
          git commit -m 'Fast: own full-burst-end named self removal'
          git push origin HEAD:fast-engine-phase2-20260901
