name: tmp producer mutator audit

on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Trace Arcana producer/remover ordering
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from calculator.timeline import simulate
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime

          members = list(snapshot.SQUADS['스쿼드3']['members'])
          squad = spec.build_squad(members)
          compiled = compile_moris_squad(squad)
          actor = members.index('아르카나 : 포츈 메이트')
          names = {'추억 남기기', '추억 남기기 3', '쌓여가는 사진첩 2', '쌓여가는 사진첩 3'}
          print('MEMBERS', members)
          for e in compiled.members[actor].effects:
              if e.name in names:
                  print('EFFECT', e.effect_id, e.actor_effect_index, e.name, e.effect_type, e.stat, e.duration, e.max_stack,
                        [(r.raw, r.event_key, r.mode.value) for r in e.triggers],
                        [r.raw for r in e.condition_rules], e.parameters)

          cfg = {'duration': 45.0, 'first_burst_time': 3.0, 'rng_mode': 'expected'}
          moris = simulate(squad, config=cfg, seed=42, verbose=True)
          print('MORIS_BURSTS')
          for row in moris.log.burst_log:
              print(row)
          print('MORIS_BUFF_EVENTS')
          for row in moris.log.buff_events:
              if row.name in {'추억 남기기', '추억 남기기 3'}:
                  print(row)
          print('MORIS_INSTANT_EVENTS')
          for row in moris.log.instant_events:
              if row.name in {'쌓여가는 사진첩 2', '쌓여가는 사진첩 3'}:
                  print(row)

          policy = compile_burst_policy(squad, compiled, {'duration': 45.0, 'first_burst_time': 3.0})
          fast = BurstRuntime(compiled, policy).run(duration=45.0)
          print('FAST_CASTS', fast.casts)
          print('FAST_STARTS', fast.full_burst_starts)
          print('FAST_ENDS', fast.full_burst_ends)
          PY
