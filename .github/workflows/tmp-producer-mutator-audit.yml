name: tmp producer mutator promotion

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - '.github/workflows/tmp-producer-mutator-audit.yml'
      - 'fast_engine/research/tmp_arcana_remove_patch.py'

jobs:
  promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run producer mutator audit
        run: python fast_engine/research/tmp_arcana_remove_patch.py
      - name: Run complete Fast discovery
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
