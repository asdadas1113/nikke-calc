name: Enikk bounded usage probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run bounded S33-S40 usage study
        run: python tests/benchmark_optimizer_meta_usage_enikk_bounds.py
