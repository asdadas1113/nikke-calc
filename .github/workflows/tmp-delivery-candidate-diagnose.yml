name: tmp delivery candidate diagnosis

on:
  workflow_dispatch:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - .github/workflows/tmp-delivery-candidate-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Tove named-event shape
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.damage_policy import is_direct_damage_buff_runtime_supported
          import fast_engine.engine.score as score

          squad=compile_moris_squad(spec.build_squad(list(snapshot.SQUADS['레이드_소다']['members'])))
          for owner_name,effect_name in (
              ('토브','급조 탄환'),
              ('토브','임시 개조 2'),
          ):
              effect=next(e for e in squad.effects if squad.members[e.actor].name==owner_name and e.name==effect_name)
              print('\n===',owner_name,effect_name,'===')
              print('id/type/stat/value',effect.effect_id,effect.effect_type,effect.stat,effect.value)
              print('duration/max_stack/max_trigger',effect.duration,effect.max_stack,effect.max_trigger)
              print('target',effect.target,repr(effect.target_spec),'possible',score._possible_ally_targets(squad,effect))
              print('conditions',[repr(x) for x in effect.condition_rules])
              print('triggers',[repr(x) for x in effect.triggers])
              print('parameters',dict(effect.parameters))
              print('capability',repr(effect.capability))
              print('dispatcher_executable',TriggerDispatcher.is_executable_effect(effect))
              print('direct_runtime_supported',is_direct_damage_buff_runtime_supported(effect) if effect.effect_type=='buff' else None)
              print('direct_score_supported',score._direct_damage_buff_score_supported(squad,effect) if effect.effect_type=='buff' else None)
          print('blockers',[x for x in score.static_score_blockers(squad) if '토브' in x])
          PY
      - name: Trace Moris and Fast instant named-event code
        run: |
          echo '--- instant handler registrations ---'
          grep -R -n -E "register_instant_event_handler|instant_event_handler" calculator | head -80 || true
          echo '--- named event emission ---'
          grep -R -n -E "event:\{.*name|event:\{.*effect|notify\(f\"event:|notify\(f'event:" calculator fast_engine | head -160 || true
          echo '--- Tove literal references ---'
          grep -R -n -E "급조 탄환|임시 개조 2" calculator context tests fast_engine | head -160 || true
