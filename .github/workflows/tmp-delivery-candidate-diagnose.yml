name: tmp delivery candidate diagnosis

on:
  workflow_dispatch:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - .github/workflows/tmp-delivery-candidate-diagnose.yml
      - fast_engine/research/tmp_tove_named_event_ab.py

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Tove pct instant named-event A/B
        run: PYTHONPATH=. python fast_engine/research/tmp_tove_named_event_ab.py
