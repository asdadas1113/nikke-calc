name: Optimizer batch apply

on:
  push:
    branches:
      - optimizer-debug-localized-ambiguity-20260831

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-debug-localized-ambiguity-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply batch patch
        run: |
          cat .github/patches/optimizer-batch-*.patch > /tmp/optimizer-batch.patch
          git apply --check /tmp/optimizer-batch.patch
          git apply /tmp/optimizer-batch.patch
      - name: Run optimizer tests
        run: python -m unittest discover -s tests -p 'test_optimizer_*.py'
      - name: Commit verified batch support
        run: |
          rm -f .github/workflows/optimizer-batch-apply.yml
          rm -f .github/workflows/optimizer-export-code.yml
          rm -rf .github/patches
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add optimizer/evaluator.py optimizer/budget.py optimizer/marginal.py optimizer/anytime.py optimizer/automatic_search.py optimizer/same_budget.py tests/test_optimizer_evaluator_raw_retention.py tests/test_optimizer_budget.py tests/benchmark_optimizer_same_budget_auto_worker.py tests/benchmark_optimizer_same_budget_auto_enikk_worker.py tests/benchmark_optimizer_transfer_set.py .github
          git commit -m 'feat: expose batch evaluation rounds for optimizer'
          git push origin HEAD:optimizer-debug-localized-ambiguity-20260831
