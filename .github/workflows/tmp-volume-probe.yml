name: tmp-volume-probe
on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-volume-probe.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply production patch
        run: python .github/tmp_volume_patch.py
      - name: Focused regressions after stale expectation update
        run: >-
          python -m unittest -v
          fast_engine.tests.test_damage_volume_cadence_rank
          fast_engine.tests.test_damage_charge_reload_cancel_control
          fast_engine.tests.test_damage_ammo_pct_named_event
          fast_engine.tests.test_damage_maid_mast_hangover_contract
          fast_engine.tests.test_damage_maid_mast_hangover_lifecycle
          fast_engine.tests.test_damage_maid_mast_stack_mutation
      - name: Commit production checkpoint
        run: |
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add fast_engine/engine/dispatcher.py fast_engine/engine/score.py
          git commit -m "Fast: own Volume live-ammo and lazy-rank cadence"
          git push origin HEAD:fast-engine-phase2-20260901
