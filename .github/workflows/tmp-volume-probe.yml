name: tmp-volume-probe
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/tmp-volume-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Moris ammo and lazy-rank code
        run: |
          python - <<'PY'
          import inspect
          import calculator.buff_manager as bm
          import calculator.timeline as tl

          for mod in (bm, tl):
              print('=== MODULE', mod.__name__, '===')
              for name, obj in inspect.getmembers(mod):
                  candidates=[]
                  if inspect.isfunction(obj):
                      candidates=[obj]
                  elif inspect.isclass(obj):
                      candidates=[fn for _, fn in inspect.getmembers(obj, inspect.isfunction)]
                  for fn in candidates:
                      try:
                          src=inspect.getsource(fn)
                      except Exception:
                          continue
                      if any(key in src for key in ('ammo_charge_pct','_resolve_lazy','target_chars is None','allies_lowest_atk_burst3','charge_speed_caster_based_pct')):
                          print('---', fn.__qualname__, '---')
                          print(src)
          PY