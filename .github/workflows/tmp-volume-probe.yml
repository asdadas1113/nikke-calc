name: tmp-volume-probe
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/tmp-volume-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit raid volume cadence recipients
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          import fast_engine.engine.score as score
          from fast_engine.engine.target_scope import possible_ally_targets
          from fast_engine.engine.dispatcher import TriggerDispatcher

          squad = compile_moris_squad(spec.build_squad(list(snapshot.SQUADS['레이드_볼륨']['members'])))
          for i,m in enumerate(squad.members):
              print('MEMBER',i,m.name,'burst=',m.burst_stage,'weapon=',dict(m.weapon))
              print('  charge_safe=',score._charge_actor_score_safe(squad,i),'rapid_safe=',score._rapid_actor_score_safe(squad,i))
          for e in squad.effects:
              if e.name in {'차분한 수심 4','화무십일홍 · 수라','화무십일홍 · 수라 2'}:
                  print('EFFECT',e.effect_id,e.name,e.effect_type,e.stat,e.value,'duration=',e.duration,'max_stack=',e.max_stack)
                  print(' target=',e.target_spec.mode,e.target_spec.raw,e.target_spec.runtime_supported,'possible=',[(i,squad.members[i].name) for i in possible_ally_targets(squad,e)])
                  print(' trigger=',[(r.mode.value,r.event_key,r.raw,r.threshold) for r in e.triggers],'cond=',e.condition_rules,'params=',dict(e.parameters),'cap=',e.capability.disposition.value,e.capability.blockers)
                  print(' executable=',TriggerDispatcher.is_executable_effect(e))
          PY