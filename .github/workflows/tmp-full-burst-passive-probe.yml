name: tmp-full-burst-passive-restore
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/tmp-full-burst-passive-probe.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply narrow full-burst conditional passive ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          # damage_policy: admit only permanent self ATK passives whose sole
          # runtime condition is during_full_burst.
          p=Path('fast_engine/engine/damage_policy.py')
          t=p.read_text(encoding='utf-8')
          marker='def _conditional_passive_runtime_owned(effect) -> bool:\n'
          if t.count(marker) != 1:
              raise SystemExit('damage_policy conditional passive marker changed')
          helper='''def full_burst_conditional_permanent_passive_shape(effect) -> bool:\n    """Own one sparse permanent self ATK passive gated by full-burst phase.\n\n    This first phase-edge slice deliberately excludes accuracy/cadence/state\n    toggles and every non-self or multi-stack shape.  Moris keeps the passive\n    row registered and gates contribution live; Fast materializes only the true\n    full-burst intervals.\n    """\n    return (\n        effect.effect_type == "buff"\n        and (effect.stat or "") in {"atk_pct", "atk_flat", "atk_caster_based_pct"}\n        and effect.value is not None\n        and effect.target_spec.mode is TargetMode.SELF\n        and effect.target_spec.runtime_supported\n        and effect.duration in (None, -1.0)\n        and effect.max_stack in (None, 1, 1.0)\n        and effect.max_trigger is None\n        and effect.tick_interval is None\n        and not effect.parameters\n        and len(effect.condition_rules) == 1\n        and effect.condition_rules[0].mode is ConditionMode.DURING_FULL_BURST\n        and len(effect.triggers) == 1\n        and effect.triggers[0].mode is TriggerMode.EVENT\n        and effect.triggers[0].raw == "passive"\n        and effect.triggers[0].event_key == "battle_start"\n    )\n\n\n'''
          t=t.replace(marker,helper+marker,1)
          old='''    if all(\n        rule.mode is ConditionMode.SELF_STACK_AT_LEAST and bool(rule.key)\n        for rule in effect.condition_rules\n    ):\n        return True\n'''
          new='''    if full_burst_conditional_permanent_passive_shape(effect):\n        return True\n    if all(\n        rule.mode is ConditionMode.SELF_STACK_AT_LEAST and bool(rule.key)\n        for rule in effect.condition_rules\n    ):\n        return True\n'''
          if t.count(old) != 1:
              raise SystemExit('damage_policy owned-family anchor changed')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          # dispatcher: keep a sparse list and sync it only on phase edges.
          p=Path('fast_engine/engine/dispatcher.py')
          t=p.read_text(encoding='utf-8')
          old='''from .damage_policy import (\n    DIRECT_DAMAGE_STATE_STATS,\n    is_direct_damage_buff_runtime_supported,\n)\n'''
          new='''from .damage_policy import (\n    DIRECT_DAMAGE_STATE_STATS,\n    full_burst_conditional_permanent_passive_shape,\n    is_direct_damage_buff_runtime_supported,\n)\n'''
          if t.count(old) != 1: raise SystemExit('dispatcher import anchor changed')
          t=t.replace(old,new,1)
          old='''        "_self_stack_dependency_names", "_self_state_passive_ids",\n        "_self_state_dependency_names", "_gauge_maxima",\n'''
          new='''        "_self_stack_dependency_names", "_self_state_passive_ids",\n        "_self_state_dependency_names", "_full_burst_passive_ids", "_gauge_maxima",\n'''
          if t.count(old) != 1: raise SystemExit('dispatcher slots anchor changed')
          t=t.replace(old,new,1)
          old='''        self._self_state_dependency_names = frozenset(\n            rule.key\n            for effect_id in self._self_state_passive_ids\n            for rule in self._effect_table[effect_id].condition_rules\n            if rule.key\n        )\n\n    def enable_strict_score_delivery(self) -> None:\n'''
          new='''        self._self_state_dependency_names = frozenset(\n            rule.key\n            for effect_id in self._self_state_passive_ids\n            for rule in self._effect_table[effect_id].condition_rules\n            if rule.key\n        )\n        self._full_burst_passive_ids = tuple(\n            effect.effect_id\n            for effect in self._effect_table\n            if full_burst_conditional_permanent_passive_shape(effect)\n            and self.is_runtime_executable_effect(effect)\n        )\n\n    def enable_strict_score_delivery(self) -> None:\n'''
          if t.count(old) != 1: raise SystemExit('dispatcher init anchor changed')
          t=t.replace(old,new,1)
          old='''    def can_activate_effect(self, effect: "CompiledEffect") -> bool:\n'''
          new='''    def sync_full_burst_conditional_passives(self, *, now: float) -> None:\n        """Materialize/de-materialize permanent passives on full-burst phase edges."""\n        for effect_id in self._full_burst_passive_ids:\n            effect = self._effect_table[effect_id]\n            targets = self.targets.resolve(\n                effect.target_spec, owner_actor=effect.actor, now=now\n            )\n            should_be_active = self.conditions.evaluate_all(\n                effect.condition_rules,\n                effect_id=effect.effect_id,\n                owner_actor=effect.actor,\n                target_actor=None,\n                now=now,\n                context=SignalContext(),\n            )\n            is_active = self.effects.group_active(effect.effect_id, targets, now=now)\n            if should_be_active and not is_active:\n                # This is a condition-gating transition, not a fresh trigger;\n                # activate_group itself does not broadcast a generic named event.\n                self.effects.activate_group(effect, targets, now, self.scheduler)\n            elif not should_be_active and is_active:\n                self.effects.deactivate_group(effect.effect_id, targets, now=now)\n\n    def can_activate_effect(self, effect: "CompiledEffect") -> bool:\n'''
          if t.count(old) != 1: raise SystemExit('dispatcher sync insertion anchor changed')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          # burst runtime: machine.handle changes phase first. Sync before the
          # full_burst_start/end notifications, matching Moris live get_buffs gate.
          p=Path('fast_engine/engine/burst_runtime.py')
          t=p.read_text(encoding='utf-8')
          old='''            signals = self.machine.handle(\n                event,\n                self.scheduler,\n                full_burst_extension=extension,\n                cooldown_buff_provider=self.dispatcher.burst_cooldown_buff,\n            )\n            for signal in signals:\n'''
          new='''            signals = self.machine.handle(\n                event,\n                self.scheduler,\n                full_burst_extension=extension,\n                cooldown_buff_provider=self.dispatcher.burst_cooldown_buff,\n            )\n            if event.kind in {EventKind.FULL_BURST_START, EventKind.FULL_BURST_END}:\n                self.dispatcher.sync_full_burst_conditional_passives(now=event.time)\n            for signal in signals:\n'''
          if t.count(old) != 1: raise SystemExit('burst runtime phase anchor changed')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          # score: dormant-at-battle-start named event/state consumers are not
          # yet modeled, so keep any such dependency fail-closed.
          p=Path('fast_engine/engine/score.py')
          t=p.read_text(encoding='utf-8')
          old='''from .damage_policy import (\n    DIRECT_DAMAGE_STATE_STATS,\n    is_direct_damage_buff_runtime_supported,\n    is_static_element_override_score_supported,\n)\n'''
          new='''from .damage_policy import (\n    DIRECT_DAMAGE_STATE_STATS,\n    full_burst_conditional_permanent_passive_shape,\n    is_direct_damage_buff_runtime_supported,\n    is_static_element_override_score_supported,\n)\n'''
          if t.count(old) != 1: raise SystemExit('score import anchor changed')
          t=t.replace(old,new,1)
          marker='''def _direct_damage_buff_score_supported(squad: CompiledSquad, effect) -> bool:\n'''
          helper='''def _full_burst_conditional_passive_dependency_score_safe(\n    squad: CompiledSquad, effect\n) -> bool:\n    if not full_burst_conditional_permanent_passive_shape(effect):\n        return True\n    if not effect.name:\n        return True\n    event_key = f"event:{effect.name}"\n    if any(\n        any((rule.event_key or "") == event_key for rule in other.triggers)\n        for other in squad.effects\n        if other.effect_id != effect.effect_id\n    ):\n        return False\n    return not any(\n        rule.key == effect.name\n        for other in squad.effects\n        if other.effect_id != effect.effect_id\n        for rule in other.condition_rules\n    )\n\n\n'''
          if t.count(marker) != 1: raise SystemExit('score direct helper marker changed')
          t=t.replace(marker,helper+marker,1)
          old='''    if not is_direct_damage_buff_runtime_supported(effect):\n        return False\n    if (\n'''
          new='''    if not is_direct_damage_buff_runtime_supported(effect):\n        return False\n    if not _full_burst_conditional_passive_dependency_score_safe(squad, effect):\n        return False\n    if (\n'''
          if t.count(old) != 1: raise SystemExit('score direct body anchor changed')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY

          cat > fast_engine/tests/test_damage_full_burst_conditional_passive.py <<'PY'
          from __future__ import annotations

          from dataclasses import replace
          import unittest
          from unittest.mock import patch

          from calculator.timeline import DT, simulate
          from context import snapshot, spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.conditions import compile_condition
          from fast_engine.engine.damage_policy import (
              full_burst_conditional_permanent_passive_shape,
              is_direct_damage_buff_runtime_supported,
          )
          from fast_engine.engine.effects import ActiveEffectStore
          from fast_engine.engine.score import static_score_blockers


          class FullBurstConditionalPassiveTests(unittest.TestCase):
              MEMBERS = [
                  '라피 : 레드 후드', '레드 후드', '프리카', '민트', '도로시 : 세렌디피티'
              ]

              def _fixture(self):
                  squad = spec.build_squad(self.MEMBERS)
                  compiled = compile_moris_squad(squad)
                  actor = self.MEMBERS.index('도로시 : 세렌디피티')
                  effect = next(e for e in compiled.members[actor].effects if e.name == '광익 2')
                  accuracy = next(e for e in compiled.members[actor].effects if e.name == '광익 3')
                  return squad, compiled, actor, effect, accuracy

              def test_real_dorothy_shape_is_owned_but_accuracy_neighbor_is_not(self):
                  _squad, compiled, _actor, effect, accuracy = self._fixture()
                  self.assertTrue(full_burst_conditional_permanent_passive_shape(effect))
                  self.assertTrue(is_direct_damage_buff_runtime_supported(effect))
                  self.assertFalse(full_burst_conditional_permanent_passive_shape(accuracy))
                  self.assertFalse(is_direct_damage_buff_runtime_supported(accuracy))

                  public = compile_moris_squad(
                      spec.build_squad(list(snapshot.SQUADS['스쿼드3']['members']))
                  )
                  blockers = set(static_score_blockers(public))
                  self.assertNotIn(
                      'normal_delivery:도로시 : 세렌디피티:광익 2:atk_pct', blockers
                  )
                  self.assertNotIn(
                      'skill_state_delivery:도로시 : 세렌디피티:광익 2:atk_pct', blockers
                  )
                  self.assertIn(
                      'normal_delivery:도로시 : 세렌디피티:광익 3:accuracy_pct', blockers
                  )

              def test_fast_materializes_exactly_on_full_burst_phase_edges(self):
                  squad, compiled, _actor, effect, _accuracy = self._fixture()
                  events = []
                  original_activate = ActiveEffectStore.activate_group
                  original_deactivate = ActiveEffectStore.deactivate_group

                  def activate(store, candidate, targets, now, scheduler):
                      out = original_activate(store, candidate, targets, now, scheduler)
                      if candidate.effect_id == effect.effect_id and out:
                          events.append(('activate', float(now)))
                      return out

                  def deactivate(store, effect_id, targets, now):
                      out = original_deactivate(store, effect_id, targets, now=now)
                      if effect_id == effect.effect_id and out:
                          events.append(('expire', float(now)))
                      return out

                  policy = compile_burst_policy(
                      squad, compiled, {'duration': 30.0, 'first_burst_time': 3.0}
                  )
                  with patch.object(ActiveEffectStore, 'activate_group', new=activate), patch.object(
                      ActiveEffectStore, 'deactivate_group', new=deactivate
                  ):
                      result = BurstRuntime(compiled, policy).run(duration=30.0)

                  expected = []
                  for i, start in enumerate(result.full_burst_starts):
                      expected.append(('activate', float(start)))
                      if i < len(result.full_burst_ends):
                          expected.append(('expire', float(result.full_burst_ends[i])))
                  self.assertEqual(events, expected)
                  self.assertEqual(len(result.full_burst_starts), 3)
                  self.assertEqual(len(result.full_burst_ends), 2)

              def test_moris_transition_log_is_one_tick_after_live_phase_edge(self):
                  squad, compiled, _actor, _effect, _accuracy = self._fixture()
                  policy = compile_burst_policy(
                      squad, compiled, {'duration': 30.0, 'first_burst_time': 3.0}
                  )
                  fast = BurstRuntime(compiled, policy).run(duration=30.0)
                  moris = simulate(
                      squad,
                      config={'duration': 30.0, 'first_burst_time': 3.0, 'rng_mode': 'expected'},
                      verbose=True,
                  )
                  rows = [row for row in moris.log.buff_events if row.name == '광익 2']
                  expected_edges = []
                  for i, start in enumerate(fast.full_burst_starts):
                      expected_edges.append(('activate', float(start)))
                      if i < len(fast.full_burst_ends):
                          expected_edges.append(('expire', float(fast.full_burst_ends[i])))
                  self.assertEqual([row.kind for row in rows], [kind for kind, _ in expected_edges])
                  self.assertEqual(len(rows), 5)
                  for row, (_kind, edge) in zip(rows, expected_edges):
                      self.assertAlmostEqual(float(row.t) - edge, DT, places=9)

              def test_neighboring_shapes_remain_fail_closed(self):
                  _squad, _compiled, _actor, effect, _accuracy = self._fixture()
                  self.assertFalse(full_burst_conditional_permanent_passive_shape(replace(effect, max_stack=2)))
                  self.assertFalse(full_burst_conditional_permanent_passive_shape(replace(effect, target='all_allies')))
                  self.assertFalse(full_burst_conditional_permanent_passive_shape(replace(effect, parameters={'x': 1})))
                  self.assertFalse(full_burst_conditional_permanent_passive_shape(replace(
                      effect,
                      conditions=('not_during_full_burst',),
                      condition_rules=(compile_condition('not_during_full_burst'),),
                  )))


          if __name__ == '__main__':
              unittest.main()
          PY
      - name: Focused regressions
        run: |
          python -m unittest fast_engine.tests.test_damage_full_burst_conditional_passive
          python -m unittest fast_engine.tests.test_conditional_passive_self_stack
          python -m unittest fast_engine.tests.test_damage_false_supported_guards
      - name: Full Fast discovery
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Public frontier probe
        if: always()
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus
          unique={}
          for members,source in _source_corpus(): unique.setdefault(tuple(members),source)
          fam=Counter(); cert=[]
          for members,source in unique.items():
              b=static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              if not b: cert.append(source)
              for row in b: fam[row.split(':',1)[0]]+=1
          print('FRONTIER',len(unique),'CERT',cert,'FAMILIES',dict(fam))
          PY
