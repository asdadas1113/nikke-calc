name: tmp-full-burst-passive-probe
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/tmp-full-burst-passive-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Isolate Dorothy full-burst passive edges
        run: |
          python - <<'PY'
          from calculator.timeline import simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad

          candidates = [
              ['라피 : 레드 후드','레드 후드','프리카','민트','도로시 : 세렌디피티'],
              ['리틀 머메이드','크라운','도로시 : 세렌디피티','미하라 : 본딩 체인','헬름'],
              ['미란다','그레이브','도로시 : 세렌디피티','미하라 : 본딩 체인','D : 킬러 와이프'],
          ]
          chosen = None
          for members in candidates:
              squad = spec.build_squad(members)
              compiled = compile_moris_squad(squad)
              print('TRY', members, [(m.name,m.burst_stage,m.weapon.get('fire_mode')) for m in compiled.members])
              try:
                  policy=compile_burst_policy(squad,compiled,{'duration':30.0,'first_burst_time':3.0})
                  result=BurstRuntime(compiled,policy).run(duration=30.0)
              except Exception as exc:
                  print('TRY_FAIL', type(exc).__name__, str(exc))
                  continue
              print('TRY_OK', result.full_burst_starts, result.full_burst_ends)
              if result.full_burst_starts and result.full_burst_ends:
                  chosen=(members,squad,compiled,result)
                  break
          if chosen is None:
              raise SystemExit('no isolated Fast runtime candidate')

          members,squad,compiled,fast_result=chosen
          actor=next(i for i,m in enumerate(compiled.members) if m.name=='도로시 : 세렌디피티')
          effect=next(e for e in compiled.members[actor].effects if e.name=='광익 2')
          print('CHOSEN', members, 'ACTOR', actor, 'EFFECT_ID', effect.effect_id)
          print('FAST_FB_STARTS', fast_result.full_burst_starts)
          print('FAST_FB_ENDS', fast_result.full_burst_ends)
          print('FAST_BEFORE_CURRENT_SUPPORT', [
              (t, BurstRuntime(compiled, compile_burst_policy(squad,compiled,{'duration':max(0.1,t+0.01),'first_burst_time':3.0})).dispatcher.effects.sum_stat(actor,'atk_pct',now=t))
              for t in ()
          ])

          moris=simulate(squad,config={'duration':30.0,'first_burst_time':3.0,'rng_mode':'expected'},verbose=True)
          rows=[]
          for row in moris.log.buff_events:
              if row.name=='광익 2':
                  rows.append((row.kind,float(row.t),row.caster,row.target,row.value,row.stat,row.stack))
          print('MORIS_PASSIVE_EVENTS', rows)
          print('EXPECTED_STARTS', fast_result.full_burst_starts)
          print('EXPECTED_ENDS', fast_result.full_burst_ends)
          PY
