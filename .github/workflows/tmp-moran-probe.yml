name: Temporary Moran production audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Focused semantic regression
        run: |
          python -m unittest fast_engine.tests.test_damage_moran_weapon_change_lifecycle
          python -m unittest fast_engine.tests.test_dynamic_weapon_change
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring
          python -m unittest fast_engine.tests.test_damage_little_mermaid_lifecycle
      - name: Audit Moran public frontier and 180s score
        run: python .github/tmp_moran_probe.py
