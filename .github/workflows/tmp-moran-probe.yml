name: Temporary Moran production audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Focused Moran regression
        run: python -m unittest fast_engine.tests.test_damage_moran_weapon_change_lifecycle
      - name: Moran production audit
        run: python -u .github/tmp_moran_probe.py
