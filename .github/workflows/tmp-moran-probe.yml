name: Temporary Moran follow-up gate

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Moran performance follow-up
        run: python .github/tmp_moran_followup.py
      - name: Focused regression and performance
        run: |
          python -m unittest fast_engine.tests.test_damage_moran_weapon_change_lifecycle
          python -m unittest fast_engine.tests.test_damage_charge_reload_cancel_control
          python -m unittest fast_engine.tests.test_damage_reference_stack_capture
          python -m unittest fast_engine.tests.test_damage_full_charge_bullet_lifetime
          python -m unittest fast_engine.tests.test_damage_full_charge_hit_charge_speed
          python -m unittest fast_engine.tests.test_damage_stat_applied_charge_speed
          python -m unittest fast_engine.tests.test_performance_contract
      - name: Commit follow-up semantic patch
        run: |
          if git diff --quiet -- fast_engine; then
            echo "No semantic changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine
          git commit -m "Fast: keep rapid weapon-change off baseline hot path"
          git push origin HEAD:fast-engine-phase2-20260901
