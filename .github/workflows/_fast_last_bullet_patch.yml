name: Fast last-bullet boundary patch

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/_fast_last_bullet_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply generic last-bullet rapid boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('fast_engine/engine/dynamic_reload.py')
          s = p.read_text(encoding='utf-8')
          old = '''        "_hit_thresholds",\n        "_pellet_thresholds",\n        "_states",'''
          new = '''        "_hit_thresholds",\n        "_pellet_thresholds",\n        "_last_bullet_actors",\n        "_states",'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        hit_thresholds: dict[int, tuple[int, ...]] = {}\n        pellet_thresholds: dict[int, tuple[int, ...]] = {}\n        for actor, character in enumerate(squad.members):\n            hits: set[int] = set()\n            pellets: set[int] = set()\n            for effect in character.effects:\n                if not effect_filter(effect):\n                    continue\n                for rule in effect.triggers:\n                    if rule.mode is not TriggerMode.MODULO or not rule.trigger_count_reducible:\n                        continue'''
          new = '''        hit_thresholds: dict[int, tuple[int, ...]] = {}\n        pellet_thresholds: dict[int, tuple[int, ...]] = {}\n        last_bullet_actors: set[int] = set()\n        for actor, character in enumerate(squad.members):\n            hits: set[int] = set()\n            pellets: set[int] = set()\n            for effect in character.effects:\n                if not effect_filter(effect):\n                    continue\n                for rule in effect.triggers:\n                    if rule.event_key == "last_bullet":\n                        last_bullet_actors.add(actor)\n                    if rule.mode is not TriggerMode.MODULO or not rule.trigger_count_reducible:\n                        continue'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        self._hit_thresholds = hit_thresholds\n        self._pellet_thresholds = pellet_thresholds\n'''
          new = '''        self._hit_thresholds = hit_thresholds\n        self._pellet_thresholds = pellet_thresholds\n        self._last_bullet_actors = frozenset(last_bullet_actors)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    def _shot_is_boundary(self, st: _RapidActorState) -> bool:\n        next_hit = st.hit_count + 1\n'''
          new = '''    def _shot_is_boundary(self, st: _RapidActorState) -> bool:\n        # Keep ordinary rapid shots compressed, but materialize the magazine's\n        # final physical shot when an executable post-shot last_bullet consumer\n        # exists. BurstRuntime dispatches last_bullet only after this shot scores.\n        if st.actor in self._last_bullet_actors and st.ammo <= 1:\n            return True\n        next_hit = st.hit_count + 1\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('fast_engine/engine/score.py')
          s = p.read_text(encoding='utf-8')
          old = '''            "last_bullet_fire",\n            "last_bullet",\n            "on_attack",'''
          new = '''            "last_bullet_fire",\n            "on_attack",'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('fast_engine/engine/dynamic_weapon.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def supports_dynamic_last_bullet(self, actor: int) -> bool:\n        if actor in self._rapid_reload.actors:\n            return False\n        return self.emits_every_charge_shot(actor)\n'''
          new = '''    def supports_dynamic_last_bullet(self, actor: int) -> bool:\n        if actor in self._rapid_reload.actors:\n            return actor in self._rapid_reload._last_bullet_actors\n        return self.emits_every_charge_shot(actor)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          test_b64 = ''
          Path('fast_engine/tests/test_dynamic_last_bullet_boundary.py').write_bytes(base64.b64decode(test_b64))
          PY
      - name: Run focused and Fast tests
        run: |
          python -m unittest fast_engine.tests.test_dynamic_last_bullet_boundary
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring
          python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/_fast_last_bullet_patch.yml
          git config user.name "fast-engine-bot"
          git config user.email "fast-engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "impl: materialize rapid last-bullet boundary"
          git push origin HEAD:fast-engine-phase2-20260901
