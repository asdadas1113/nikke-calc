name: Optimizer cache memory benchmark

on:
  push:
    branches:
      - optimizer-debug-localized-ambiguity-20260831

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run optimizer tests
        run: python -m unittest discover -s tests -p 'test_optimizer_*.py'
      - name: Measure production score-only retention at 500
        run: python tests/benchmark_optimizer_cache_memory.py --mode score-only --count 500
      - name: Measure diagnostic raw retention at 500
        run: python tests/benchmark_optimizer_cache_memory.py --mode raw --count 500
