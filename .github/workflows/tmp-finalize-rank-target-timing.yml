name: tmp-finalize-rank-target-timing

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-finalize-rank-target-timing.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply rank target fail-closed guard
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('fast_engine/engine/score.py')
          t = p.read_text(encoding='utf-8')
          old = 'from .target_scope import possible_ally_targets, target_scope_is_static\nfrom .triggers import TriggerMode\n'
          new = 'from .target_scope import possible_ally_targets, target_scope_is_static\nfrom .targets import TargetMode\nfrom .triggers import TriggerMode\n'
          if t.count(old) != 1:
              raise SystemExit('target import anchor changed')
          t = t.replace(old, new, 1)

          anchor = '''def _unsupported_remove_named_buff_changes_scored_state(\n'''
          helper = '''_DYNAMIC_ATK_RANK_TARGET_MODES = frozenset({\n    TargetMode.TOP_ATK,\n    TargetMode.TOP_ATK_EXCL_SELF,\n    TargetMode.LOWEST_ATK_BURST3,\n})\n_ATK_RANK_MUTATION_STATS = frozenset({\n    "atk_pct",\n    "atk_flat",\n    "atk_caster_based_pct",\n    "atk_from_hp_pct",\n    "atk_copy",\n    "atk_buff_mag_pct",\n})\n\n\ndef _dynamic_rank_target_transaction_unsafe(squad: CompiledSquad, effect) -> bool:\n    """Fail closed when a rank selector shares a timestamp with ATK mutation.\n\n    Moris resolves ATK-rank targets lazily within the actor/event transaction.\n    Fast currently resolves on activation. The one owned exception is a same-caster\n    sibling using the exact same raw rank selector: TargetResolver deliberately\n    shares that cohort, matching Moris' same-selector identity.\n    """\n\n    if effect.target_spec.mode not in _DYNAMIC_ATK_RANK_TARGET_MODES:\n        return False\n    if _is_patternless_unreachable(effect) or not effect.triggers:\n        return False\n    event_keys = {rule.event_key for rule in effect.triggers if rule.event_key}\n    if not event_keys:\n        return False\n    for other in squad.effects:\n        if other.effect_id == effect.effect_id:\n            continue\n        if (other.stat or "") not in _ATK_RANK_MUTATION_STATS:\n            continue\n        if other.effect_type != "buff":\n            continue\n        if _is_patternless_unreachable(other):\n            continue\n        if not _direct_damage_buff_score_supported(squad, other):\n            continue\n        if not any(rule.event_key in event_keys for rule in other.triggers):\n            continue\n        if (\n            other.actor == effect.actor\n            and other.target_spec.raw == effect.target_spec.raw\n            and other.target_spec.mode == effect.target_spec.mode\n        ):\n            continue\n        return True\n    return False\n\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('rank helper anchor changed')
          t = t.replace(anchor, helper + anchor, 1)

          old = '''    for effect in squad.effects:\n        if (\n            effect.effect_type == "damage"\n'''
          new = '''    for effect in squad.effects:\n        if _dynamic_rank_target_transaction_unsafe(squad, effect):\n            owner = squad.members[effect.actor].name\n            blockers.append(\n                f"normal_state:{owner}:{effect.name or effect.stat or 'rank_target'}:rank_target_timing"\n            )\n\n    for effect in squad.effects:\n        if (\n            effect.effect_type == "damage"\n'''
          if t.count(old) != 1:
              raise SystemExit('rank blocker insertion anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('fast_engine/tests/test_damage_false_supported_guards.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def test_unowned_remove_of_scored_buff_fails_closed(self):\n        provider = {\n            "source": "skill1", "type": "buff", "name": "AUDIT state",\n            "stat": "atk_pct", "fixed_value": 100.0,\n            "polarity": "beneficial", "target": "self", "duration": -1.0,\n            "trigger": {"timing": ["battle_start"], "condition": []},\n        }\n        remover = {\n            "source": "skill1", "type": "instant", "name": "AUDIT remove",\n            "stat": "remove_named_buff", "target": "self",\n            "target_effect": "AUDIT state",\n            "trigger": {"timing": ["full_burst_start"], "condition": []},\n        }\n        blockers = static_score_blockers(_compiled([provider, remover]))\n        self.assertIn(\n            "normal_state:라피:AUDIT remove:remove_named_buff", blockers\n        )\n'''
          new = old + '''\n    def test_rank_target_with_same_event_atk_mutation_fails_closed(self):\n        rank = {\n            "source": "skill1", "type": "buff", "name": "AUDIT rank",\n            "stat": "crit_rate", "fixed_value": 50.0,\n            "polarity": "beneficial", "target": "allies_top_atk:1",\n            "duration": 10.0,\n            "trigger": {"timing": ["full_burst_start"], "condition": []},\n        }\n        atk = {\n            "source": "skill1", "type": "buff", "name": "AUDIT atk",\n            "stat": "atk_pct", "fixed_value": 100.0,\n            "polarity": "beneficial", "target": "self",\n            "duration": 10.0,\n            "trigger": {"timing": ["full_burst_start"], "condition": []},\n        }\n        blockers = static_score_blockers(_compiled([rank, atk]))\n        self.assertIn(\n            "normal_state:라피:AUDIT rank:rank_target_timing", blockers\n        )\n'''
          if t.count(old) != 1:
              raise SystemExit('rank guard test anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Update withdrawn certification regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          # Historical frontier assertions now expect one certified public team.
          for name in (
              'test_damage_full_charge_bullet_lifetime.py',
              'test_damage_full_charge_hit_charge_speed.py',
              'test_damage_stat_applied_charge_speed.py',
          ):
              p = Path('fast_engine/tests') / name
              t = p.read_text(encoding='utf-8')
              old = 'self.assertEqual(certified, 2)'
              if t.count(old) != 1:
                  raise SystemExit(f'{name}: certified=2 anchor changed ({t.count(old)})')
              p.write_text(t.replace(old, 'self.assertEqual(certified, 1)', 1), encoding='utf-8')

          p = Path('fast_engine/tests/test_damage_real_squad_certification.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def test_miranda_mihara_control_is_certified(self):\n        _moris, compiled, policy, enemy = self._fixture()\n        self.assertEqual(compiled.members[4].weapon.get("control"), {"cover": {"policy": "own_full_burst"}})\n        self.assertNotIn("control:미하라 : 본딩 체인", static_score_blockers(compiled))\n        score = score_static_squad(compiled, policy, enemy, duration=30.0)\n        self.assertGreater(score.squad_total, 0.0)\n'''
          new = '''    def test_miranda_mihara_control_is_safe_but_rank_timing_fails_closed(self):\n        _moris, compiled, policy, enemy = self._fixture()\n        self.assertEqual(compiled.members[4].weapon.get("control"), {"cover": {"policy": "own_full_burst"}})\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn("control:미하라 : 본딩 체인", blockers)\n        self.assertIn("normal_state:미란다:파워 업!:rank_target_timing", blockers)\n        self.assertIn("normal_state:미란다:파워 업! 2:rank_target_timing", blockers)\n        with self.assertRaises(NotImplementedError):\n            score_static_squad(compiled, policy, enemy, duration=30.0)\n'''
          if t.count(old) != 1:
              raise SystemExit('real certification anchor changed')
          t = t.replace(old, new, 1)
          t = t.replace('The controlled variant is exercised by the\n        # certification test above and the rapid-control suite.', 'The controlled variant is exercised by the\n        # fail-closed certification test above and the rapid-control suite.', 1)
          p.write_text(t, encoding='utf-8')

          p = Path('fast_engine/tests/test_damage_rapid_cover_control.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def test_real_miranda_mihara_squad_clears_last_static_blocker(self):\n        moris = build_squad(REAL_NAMES)\n        compiled = compile_moris_squad(moris)\n        policy = compile_burst_policy(\n            moris,\n            compiled,\n            {"duration": 30.0, "first_burst_time": 3.0, "rng_mode": "expected"},\n        )\n        enemy = EnemyStaticProfile(\n            defense=31784.0,\n            element=None,\n            core_uptime=0.0,\n            core_px=0.0,\n            duration=30.0,\n        )\n\n        self.assertEqual(\n            compiled.members[4].weapon.get("control"),\n            {"cover": {"policy": "own_full_burst"}},\n        )\n        self.assertEqual(static_score_blockers(compiled), ())\n        score = score_static_squad(compiled, policy, enemy, duration=30.0)\n        self.assertGreater(score.squad_total, 0.0)\n'''
          new = '''    def test_real_miranda_mihara_squad_clears_control_but_not_rank_timing(self):\n        moris = build_squad(REAL_NAMES)\n        compiled = compile_moris_squad(moris)\n        policy = compile_burst_policy(\n            moris,\n            compiled,\n            {"duration": 30.0, "first_burst_time": 3.0, "rng_mode": "expected"},\n        )\n        enemy = EnemyStaticProfile(\n            defense=31784.0,\n            element=None,\n            core_uptime=0.0,\n            core_px=0.0,\n            duration=30.0,\n        )\n\n        self.assertEqual(\n            compiled.members[4].weapon.get("control"),\n            {"cover": {"policy": "own_full_burst"}},\n        )\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn("control:미하라 : 본딩 체인", blockers)\n        self.assertIn("normal_state:미란다:파워 업!:rank_target_timing", blockers)\n        self.assertIn("normal_state:미란다:파워 업! 2:rank_target_timing", blockers)\n        with self.assertRaises(NotImplementedError):\n            score_static_squad(compiled, policy, enemy, duration=30.0)\n'''
          if t.count(old) != 1:
              raise SystemExit('rapid control real-team anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('fast_engine/tests/test_damage_moris_frame_timing.py')
          t = p.read_text(encoding='utf-8')
          start = t.index('    def test_def55_near_tie_preserves_moris_order(self):\n')
          end = t.index('\n\n\nif __name__ == "__main__":', start)
          new = '''    def test_def55_near_tie_withdraws_unowned_miranda_side(self):\n        mm = (\n            "미란다", "브리드 : 사일런트 트랙", "헬름", "루주", "미하라 : 본딩 체인",\n        )\n        rhq = (\n            "라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸",\n        )\n        duration = 180.0\n        cfg = {"duration": duration, "first_burst_time": 3.0, "rng_mode": "expected"}\n        enemy = dict(DEFAULT_ENEMY)\n        enemy.update({"def": 55000.0, "code": "작열", "core_px": 10.0})\n        profile = EnemyStaticProfile(\n            defense=55000.0,\n            element="작열",\n            core_uptime=1.0,\n            core_px=10.0,\n            duration=duration,\n        )\n\n        mm_squad = spec.build_squad(list(mm))\n        mm_compiled = compile_moris_squad(mm_squad)\n        mm_blockers = static_score_blockers(mm_compiled)\n        self.assertIn("normal_state:미란다:파워 업!:rank_target_timing", mm_blockers)\n        self.assertIn("normal_state:미란다:파워 업! 2:rank_target_timing", mm_blockers)\n        mm_policy = compile_burst_policy(mm_squad, mm_compiled, dict(cfg))\n        with self.assertRaises(NotImplementedError):\n            score_static_squad(mm_compiled, mm_policy, profile, duration=duration)\n\n        rhq_squad = spec.build_squad(list(rhq))\n        rhq_compiled = compile_moris_squad(rhq_squad)\n        self.assertEqual(static_score_blockers(rhq_compiled), ())\n        rhq_policy = compile_burst_policy(rhq_squad, rhq_compiled, dict(cfg))\n        rhq_moris = simulate(\n            rhq_squad,\n            config=spec.build_config(rhq_squad, dict(cfg)),\n            enemy=enemy,\n            seed=42,\n            verbose=False,\n        )\n        rhq_fast = score_static_squad(rhq_compiled, rhq_policy, profile, duration=duration)\n        self.assertLess(abs(float(rhq_fast.squad_total) / float(rhq_moris.squad_total) - 1.0), 0.001)\n'''
          p.write_text(t[:start] + new + t[end:], encoding='utf-8')
          PY

      - name: Focused rank safety regressions
        run: |
          python -m unittest fast_engine.tests.test_damage_false_supported_guards
          python -m unittest fast_engine.tests.test_damage_real_squad_certification
          python -m unittest fast_engine.tests.test_damage_rapid_cover_control
          python -m unittest fast_engine.tests.test_damage_moris_frame_timing

      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'

      - name: Verify public frontier
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus
          unique = {}
          for members, source in _source_corpus():
              unique.setdefault(tuple(members), source)
          family = Counter(); rows = []
          for members, source in unique.items():
              blockers = static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              rows.append((source, blockers))
              for blocker in blockers:
                  family[blocker.split(':', 1)[0]] += 1
          certified = [source for source, blockers in rows if not blockers]
          miranda = next(blockers for source, blockers in rows if source == '컨트롤_미란다미하라')
          red = next(blockers for source, blockers in rows if source == '레이드_레드후드퀀시')
          print('FRONTIER', len(unique), 'CERTIFIED', certified, 'FAMILIES', dict(family))
          print('MIRANDA', miranda)
          print('RED', red)
          assert certified == ['레이드_레드후드퀀시'], certified
          assert 'normal_state:미란다:파워 업!:rank_target_timing' in miranda, miranda
          assert 'normal_state:미란다:파워 업! 2:rank_target_timing' in miranda, miranda
          assert red == (), red
          PY

      - name: Commit rank guard and clean temporary workflows
        run: |
          rm -f .github/workflows/tmp-audit-rank-target-timing.yml
          rm -f .github/workflows/tmp-close-rank-target-timing-hole.yml
          rm -f .github/workflows/tmp-finalize-rank-target-timing.yml
          git diff --check
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fast: fail closed on unsafe rank target timing"
          git push origin HEAD:fast-engine-phase2-20260901
