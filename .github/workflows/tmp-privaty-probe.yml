name: Temporary Privaty cadence probe

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-privaty-cadence-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Focused charge/Privaty regression
        run: |
          python -m unittest fast_engine.tests.test_dynamic_charge_max_ammo_semantics
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring
          python -m unittest fast_engine.tests.test_dynamic_weapon_change
          python -m unittest fast_engine.tests.test_performance_contract
      - name: Full Fast discovery
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Post-repair frontier audit
        run: python -u .github/tmp_privaty_probe.py
