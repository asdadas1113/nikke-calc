name: tmp-maid-mast-diag

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - .github/workflows/tmp-maid-mast-diag.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dump exact ownership neighborhood
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.target_scope import possible_ally_targets

          for label in ('레이드_루주', '레이드_브리드디젤'):
              moris = spec.build_squad(list(snapshot.SQUADS[label]['members']))
              squad = compile_moris_squad(moris)
              actor = squad.names.index('마스트 : 로망틱 메이드')
              member = squad.members[actor]
              print('\n===', label, 'actor', actor, '===')
              print('WEAPON_TYPE', member.weapon_type)
              print('WEAPON', dict(member.weapon))
              for e in squad.effects:
                  cond = [r.raw for r in e.condition_rules]
                  trig = [r.raw for r in e.triggers]
                  p = dict(e.parameters)
                  interesting = (
                      e.actor == actor
                      or any(r.key == '취기' for r in e.condition_rules)
                      or p.get('target_effect') == '취기'
                      or p.get('scaling_ref') == '취기'
                      or (e.stat or '') in {'stun','stun_immune','remove_named_buff','buff_stack_add','buff_stack_remove','buff_stack_init','debuff_stack_add','debuff_stack_remove'}
                  )
                  if not interesting:
                      continue
                  try:
                      targets = tuple(possible_ally_targets(squad, e))
                  except Exception as exc:
                      targets = ('ERR', repr(exc))
                  print('EFFECT', {
                      'id': e.effect_id, 'actor': e.actor, 'owner': squad.members[e.actor].name,
                      'name': e.name, 'type': e.effect_type, 'stat': e.stat,
                      'polarity': e.polarity, 'target': e.target_spec.mode.value,
                      'target_runtime': e.target_spec.runtime_supported,
                      'targets': targets, 'value': e.value, 'duration': e.duration,
                      'max_stack': e.max_stack, 'max_trigger': e.max_trigger,
                      'tick': e.tick_interval, 'params': p, 'conditions': cond,
                      'triggers': trig, 'cap': e.capability.disposition.value,
                      'blockers': list(e.capability.blockers),
                  })
          PY
