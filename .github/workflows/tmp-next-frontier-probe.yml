name: Temporary next frontier probe
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify protected baseline
        run: test "$(git rev-parse origin/master)" = "fb2fd9157aa14499daf6b9f185beb685d4393f90"
      - name: Apply Velvet staging patch
        run: python -u .github/tmp_next_frontier_probe.py
      - name: Connect exact weapon-change activation seam
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/engine/dispatcher.py')
          s=p.read_text()
          old='''                    self._temporary_self_charge_weapon_change_runtime_supported(effect)\n                    or self._temporary_self_rapid_weapon_change_runtime_supported(effect)\n                    or self._temporary_self_rapid_to_single_charge_weapon_change_runtime_supported(effect)\n'''
          new='''                    self._temporary_self_charge_weapon_change_runtime_supported(effect)\n                    or self._temporary_self_charge_to_rapid_weapon_change_runtime_supported(effect)\n                    or self._temporary_self_rapid_weapon_change_runtime_supported(effect)\n                    or self._temporary_self_rapid_to_single_charge_weapon_change_runtime_supported(effect)\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
      - name: Align direct lifecycle fixture with dispatched crossings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/tests/test_damage_charge_to_rapid_weapon_change.py')
          s=p.read_text()
          old='''        st.phase = "firing"\n        st.phase_end = 13.2\n        expiry = next(\n'''
          new='''        st.phase = "firing"\n        st.phase_end = 13.2\n        # In a real session the nine 50-hit crossings have already advanced\n        # dispatcher count from the pre-mode 2 to 450. This direct fixture\n        # jumps the cadence state, so mirror that already-dispatched phase.\n        runtime.dispatcher._event_counts[(actor, "hit_count")] = 450\n        expiry = next(\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
      - name: Graduate Velvet from stale class-change regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/tests/test_dynamic_weapon_change.py')
          s=p.read_text()
          old='''    def test_other_class_changing_weapon_changes_stay_blocked(self):\n        for name, blocker in (\n            ("레이드_네온벨벳", "weapon_change:벨벳:깔끔한 마무리"),\n            ("레이드_작열짬", "weapon_change:모더니아:섬멸 모드"),\n        ):\n            with self.subTest(name=name):\n                case = snapshot.SQUADS[name]\n                compiled = compile_moris_squad(spec.build_squad(list(case["members"])))\n                self.assertIn(blocker, static_score_blockers(compiled))\n'''
          new='''    def test_other_class_changing_weapon_changes_stay_blocked(self):\n        name = "레이드_작열짬"\n        blocker = "weapon_change:모더니아:섬멸 모드"\n        case = snapshot.SQUADS[name]\n        compiled = compile_moris_squad(spec.build_squad(list(case["members"])))\n        self.assertIn(blocker, static_score_blockers(compiled))\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
      - name: Align aggregate cadence expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'fast_engine/tests/test_damage_full_charge_hit_charge_speed.py',
              'fast_engine/tests/test_damage_stat_applied_charge_speed.py',
          ):
              p=Path(name)
              s=p.read_text()
              old='        self.assertEqual(cadence, 52)\n'
              new='        self.assertEqual(cadence, 51)\n'
              assert s.count(old)==1, (name, s.count(old))
              p.write_text(s.replace(old,new,1))
          PY
      - name: Compile staged Fast code
        run: python -m compileall -q fast_engine
      - name: Focused Velvet lifecycle
        run: python -m unittest -v fast_engine.tests.test_damage_charge_to_rapid_weapon_change
      - name: Neighboring weapon-change regressions
        run: |
          python -m unittest -v \
            fast_engine.tests.test_damage_moran_weapon_change_lifecycle \
            fast_engine.tests.test_damage_single_charge_weapon_change \
            fast_engine.tests.test_damage_nayuta_cross_mode_weapon_change \
            fast_engine.tests.test_dynamic_weapon_change
      - name: Full Fast discovery
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Public blocker frontier
        run: python -u fast_engine/research/public_blocker_frontier.py
      - name: Scope and diff
        run: |
          test -z "$(git diff --name-only -- calculator)"
          git diff --check -- fast_engine
          git diff --stat -- fast_engine
          git status --short
