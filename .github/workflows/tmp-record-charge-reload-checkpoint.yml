홍련 : 흑영의 weapon control인 `reload.cancel_on_full`을 캐릭터 이름 특례 없이 좁은 generic charge control로 소유한다.

지원 범위는 다음 exact shape뿐이다.

- charge weapon
- non-clip
- control top-level key가 정확히 `reload` 하나
- reload key가 정확히 `cancel_on_full` 하나
