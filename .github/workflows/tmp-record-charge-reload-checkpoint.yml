`calculator/timeline.py`의 실제 계약을 추적했다.

탄약 회복으로 현재 탄창이 full에 도달했을 때만, 해당 캐릭터의 명시적 `reload.cancel_on_full` control이 켜져 있고 실제 재장전 중이면 reload를 취소한다.

