name: tmp-find-safe-score-fixture
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: [.github/workflows/tmp-find-safe-score-fixture.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply candidate ordering guard locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/engine/score.py')
          t=p.read_text(encoding='utf-8')
          anchor='def _unsupported_remove_named_buff_changes_scored_state(\n'
          helper='''_POST_SHOT_CROSS_ACTOR_EVENT_KEYS = frozenset({"on_attack", "hit_count", "pellet_hit", "full_charge_hit", "last_bullet", "core_hit", "squad_body_hit"})\n\ndef _post_shot_cross_actor_score_unsafe(squad: CompiledSquad, effect) -> bool:\n    if effect.effect_type != "buff" or _is_patternless_unreachable(effect): return False\n    if not TriggerDispatcher.is_executable_effect(effect): return False\n    if not _direct_damage_buff_score_supported(squad, effect): return False\n    if not any((rule.event_key or "") in _POST_SHOT_CROSS_ACTOR_EVENT_KEYS or (rule.event_key or "").startswith("weapon_hit:") for rule in effect.triggers): return False\n    if effect.target_spec.mode.value == "enemy": return effect.actor < len(squad.members) - 1\n    return any(target > effect.actor for target in _possible_ally_targets(squad, effect))\n\n'''
          if t.count(anchor)!=1: raise SystemExit('helper anchor changed')
          t=t.replace(anchor,helper+anchor,1)
          old='''        if _is_patternless_unreachable(effect):\n            continue\n\n        if (\n            _has_unowned_reference_stack_scaling(effect)\n'''
          new='''        if _is_patternless_unreachable(effect):\n            continue\n\n        if _post_shot_cross_actor_score_unsafe(squad, effect):\n            blockers.append(f"normal_state:{owner}:{effect.name or stat}:same_timestamp_actor_order")\n\n        if (\n            _has_unowned_reference_stack_scaling(effect)\n'''
          if t.count(old)!=1: raise SystemExit('blocker anchor changed')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Measure blocker-safe parity candidates
        run: |
          python - <<'PY'
          from calculator.sim_result import _is_normal
          from calculator.timeline import simulate
          from context.spec import build_squad
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_normal_squad, static_normal_score_blockers, static_score_blockers

          candidates=[
              ('라피','아니스','델타','프로덕트 12','iDoll 오션'),
              ('라피','아니스','델타','프로덕트 12','iDoll 썬'),
              ('라피','아니스','델타','iDoll 오션','iDoll 썬'),
              ('라피','아니스','프로덕트 12','iDoll 오션','iDoll 썬'),
              ('라피','델타','프로덕트 12','iDoll 오션','iDoll 썬'),
              ('아니스','델타','프로덕트 12','iDoll 오션','iDoll 썬'),
          ]
          duration=180.0
          for names in candidates:
              squad=build_squad(list(names))
              compiled=compile_moris_squad(squad)
              blockers=static_normal_score_blockers(compiled)
              total=static_score_blockers(compiled)
              if blockers or total:
                  print('BLOCKED',names,'NORMAL',blockers,'TOTAL',total)
                  continue
              cfg={'duration':duration,'rng_mode':'expected'}
              policy=compile_burst_policy(squad,compiled,cfg)
              moris=simulate(squad,config=cfg,verbose=False)
              fast=score_static_normal_squad(compiled,policy,EnemyStaticProfile(duration=duration),duration=duration)
              errs=[]
              for actor,name in enumerate(names):
                  auth=sum(hit.damage for hit in moris.hits if hit.caster==name and _is_normal(hit))
                  est=float(fast.char_total[actor])
                  rel=0.0 if auth<=0 else abs(est-float(auth))/float(auth)
                  errs.append((name,rel))
              team_auth=sum(sum(hit.damage for hit in moris.hits if hit.caster==name and _is_normal(hit)) for name in names)
              team_rel=abs(float(fast.squad_total)-float(team_auth))/float(team_auth)
              print('PARITY',names,'MAX',max(r for _,r in errs),'TEAM',team_rel,'DETAIL',errs)
          PY
