name: Temporary Little Mermaid mixed ammo probe
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify protected baseline
        run: test "$(git rev-parse origin/master)" = "fb2fd9157aa14499daf6b9f185beb685d4393f90"
      - name: Apply mixed squad-ammo staging patch
        run: |
          python -u .github/tmp_little_mermaid_mixed_patch.py
          python -u .github/tmp_little_mermaid_mixed_fix.py
      - name: Compile staged Fast code
        run: python -m compileall -q fast_engine
      - name: Trace threshold-32 planning
        run: |
          python - <<'PY'
          from dataclasses import replace
          from unittest.mock import patch
          from context import snapshot,spec
          from fast_engine.engine.dynamic_rapid import DynamicRapidCadenceRuntime
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.tests.test_damage_little_mermaid_mixed_squad_ammo import _compiled,_barrage,_replace_effect,_runtime

          base=_compiled(); barrage=_barrage(base)
          rule=replace(barrage.triggers[0],threshold=32.0,raw='squad_ammo_consume:32')
          squad=_replace_effect(base,barrage.effect_id,replace(barrage,triggers=(rule,)))
          rows=[]
          orig_plan=DynamicRapidCadenceRuntime._plan_squad_ammo
          def traced_plan(self,now):
              probe=self._predict_next_squad_ammo_boundary() if self._states else None
              ext=()
              if self._squad_ammo_external_shots_getter is not None:
                  ext=self._squad_ammo_external_shots_getter()[:3]
              rows.append(('PLAN',float(now),self._current_squad_ammo_count() if self._states else None,probe,ext,self._squad_ammo_scheduled_time,self._squad_ammo_external_expected))
              return orig_plan(self,now)
          orig_pre=DynamicRapidCadenceRuntime.handle_pre_shot_boundary
          def traced_pre(self,event):
              rows.append(('PRE_ENTER',float(event.time),event.actor,repr(event.payload),self._current_squad_ammo_count(),self._squad_ammo_external_expected))
              out=orig_pre(self,event)
              rows.append(('PRE_EXIT',float(event.time),event.actor,repr(out),self._current_squad_ammo_count(),self._squad_ammo_external_expected))
              return out
          orig_ext=DynamicRapidCadenceRuntime.record_external_squad_ammo
          def traced_ext(self,actor,now):
              rows.append(('EXT_ENTER',float(now),actor,self._current_squad_ammo_count(),self._squad_ammo_external_expected))
              out=orig_ext(self,actor,now)
              rows.append(('EXT_EXIT',float(now),actor,out,self._current_squad_ammo_count(),self._squad_ammo_external_expected))
              return out
          signals=[]
          orig_dispatch=TriggerDispatcher.dispatch_team_hit
          def traced_dispatch(dispatcher,event_key,**kwargs):
              if event_key=='squad_ammo_consume':
                  signals.append((float(kwargs['time']),int(kwargs['attacker']),int(kwargs.get('count_increment',1))))
              return orig_dispatch(dispatcher,event_key,**kwargs)
          with patch.object(DynamicRapidCadenceRuntime,'_plan_squad_ammo',new=traced_plan), \
               patch.object(DynamicRapidCadenceRuntime,'handle_pre_shot_boundary',new=traced_pre), \
               patch.object(DynamicRapidCadenceRuntime,'record_external_squad_ammo',new=traced_ext), \
               patch.object(TriggerDispatcher,'dispatch_team_hit',new=traced_dispatch):
              runtime=_runtime(squad,1.1)
              runtime.run(duration=1.1)
          print('SIGNALS=',signals)
          for row in rows[:120]: print(row)
          PY
