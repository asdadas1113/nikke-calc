name: Temporary Little Mermaid mixed ammo probe
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify protected baseline
        run: test "$(git rev-parse origin/master)" = "fb2fd9157aa14499daf6b9f185beb685d4393f90"
      - name: Apply mixed squad-ammo staging patch
        run: |
          python -u .github/tmp_little_mermaid_mixed_patch.py
          python -u .github/tmp_little_mermaid_mixed_fix.py
          python -u .github/tmp_little_mermaid_mixed_fix2.py
      - name: Compile staged Fast code
        run: python -m compileall -q fast_engine
      - name: Compare Helm charge shots
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from calculator.buff_manager import BuffManager
          from calculator.timeline import simulate
          from context import snapshot,spec
          from fast_engine.tests.test_damage_little_mermaid_mixed_squad_ammo import _compiled,_runtime

          squad=_compiled()
          runtime=_runtime(squad,12.0)
          fast=[]
          runtime.weapons.attach_score_shot_sink((4,),lambda actor,time: fast.append(float(time)))
          runtime.run(duration=12.0)

          moris=[]
          orig=BuffManager._notify
          def traced(self,event,t,caster):
              if event=='squad_ammo_consume' and caster=='헬름':
                  moris.append(float(t))
              return orig(self,event,t,caster)
          raw=spec.build_squad(list(snapshot.SQUADS['스쿼드1']['members']))
          with patch.object(BuffManager,'_notify',new=traced):
              simulate(raw,config={'duration':12.0,'rng_mode':'expected'},seed=42,verbose=False)
          print('FAST_HELM=',fast)
          print('MORIS_HELM=',moris)
          for i,(f,m) in enumerate(zip(fast,moris),1):
              if abs(f-m)>1e-9:
                  print('FIRST_HELM_DIVERGENCE=',i,'FAST',f,'MORIS',m,'DELTA',f-m)
                  break
          print('COUNTS=',len(fast),len(moris))
          PY
