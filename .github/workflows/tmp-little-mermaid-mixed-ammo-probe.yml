name: Temporary Little Mermaid mixed ammo probe
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify protected baseline
        run: test "$(git rev-parse origin/master)" = "fb2fd9157aa14499daf6b9f185beb685d4393f90"
      - name: Apply mixed squad-ammo staging patch
        run: python -u .github/tmp_little_mermaid_mixed_patch.py
      - name: Compile staged Fast code
        run: python -m compileall -q fast_engine
      - name: Focused mixed squad-ammo tests
        run: python -m unittest -v fast_engine.tests.test_damage_little_mermaid_mixed_squad_ammo
      - name: Neighboring Little Mermaid and cadence tests
        run: |
          python -m unittest -v \
            fast_engine.tests.test_damage_little_mermaid_lifecycle \
            fast_engine.tests.test_damage_charge_to_rapid_weapon_change \
            fast_engine.tests.test_damage_nayuta_cross_mode_weapon_change \
            fast_engine.tests.test_dynamic_weapon_change
      - name: Scope diff
        run: |
          test -z "$(git diff --name-only -- calculator)"
          git diff --check -- fast_engine
          git diff --stat -- fast_engine
          git status --short
