name: tmp-reference-stack-dependency-probe

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-reference-stack-dependency-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply candidate patch
        run: |
          cat > fast_engine/engine/reference_stack.py <<'PY'
          from __future__ import annotations
          def finite_reference_stack_capture_shape(effect) -> bool:
              ref = effect.parameters.get("scaling_ref"); duration = effect.duration
              max_stack = effect.max_stack if effect.max_stack is not None else 1.0
              return (effect.effect_type == "buff" and effect.parameters.get("scaling") == "stack_count"
                      and isinstance(ref, str) and bool(ref)
                      and set(effect.parameters) == {"scaling", "scaling_ref"}
                      and duration is not None and float(duration) > 0.0
                      and float(max_stack) == 1.0 and effect.max_trigger is None
                      and effect.tick_interval is None)
          PY
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/tmp-reference-stack-probe.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"; start = source.find(marker) + len(marker); stop = source.find("\n          PY", start)
          patch = textwrap.dedent(source[start:stop])
          patch = patch.replace("old = '''            self._index_remove(effect, key)\\n            self.state.touch(token.target, StateDomain.EFFECT)\\n            return effect\\n'''", "old = '''        self._index_remove(effect, key)\\n        self.state.touch(token.target, StateDomain.EFFECT)\\n        return effect\\n'''", 1)
          patch = patch.replace("new = '''            self._index_remove(effect, key)\\n            self.state.touch(token.target, StateDomain.EFFECT)\\n            if effect.name:\\n                self._touch_live_reference_consumers(active.source_actor, effect.name, now=event.time)\\n            return effect\\n'''", "new = '''        self._index_remove(effect, key)\\n        self.state.touch(token.target, StateDomain.EFFECT)\\n        if effect.name:\\n            self._touch_live_reference_consumers(active.source_actor, effect.name, now=event.time)\\n        return effect\\n'''", 1)
          exec(compile(patch, '<candidate>', 'exec'), {})
          PY
      - name: Compare downstream activation traces
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from calculator.timeline import simulate
          from context import snapshot, spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.effects import ActiveEffectStore
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus
          from collections import Counter

          moris_squad = spec.build_squad(list(snapshot.SQUADS['레이드_앨리스브래디']['members']))
          squad = compile_moris_squad(moris_squad)
          brady = next(i for i,m in enumerate(squad.members) if m.name == '브래디')
          split = next(e for e in squad.members[brady].effects if e.name == '나누고 싶은 맛')
          fast=[]; original=ActiveEffectStore.activate_group
          def traced(store,effect,targets,now,scheduler):
              if effect.effect_id == split.effect_id: fast.append(float(now))
              return original(store,effect,targets,now,scheduler)
          duration=40.0; policy=compile_burst_policy(moris_squad,squad,{'duration':duration})
          with patch.object(ActiveEffectStore,'activate_group',new=traced):
              BurstRuntime(squad,policy).run(duration=duration)
          moris=simulate(moris_squad,config={'duration':duration,'rng_mode':'expected'},verbose=True)
          mt=[float(row.t) for row in moris.log.buff_events if row.name=='나누고 싶은 맛']
          print('FAST_SPLIT', fast)
          print('MORIS_SPLIT', mt)
          print('PAIR_DIFF', [a-b for a,b in zip(fast,mt)], 'LENS',len(fast),len(mt))
          print('DEPENDENCY_SAFE', TriggerDispatcher.stat_applied_dependency_score_safe(squad,split,'event:stat_applied:split_dmg_pct'))
          print('BRADY_BLOCKERS', static_score_blockers(squad))

          unique={}
          for members,src in _source_corpus(): unique.setdefault(tuple(members),src)
          fam=Counter(); cert=[]; matches=[]
          for members,src in unique.items():
              c=compile_moris_squad(spec.build_squad(list(members))); b=static_score_blockers(c)
              if not b: cert.append(src)
              for x in b: fam[x.split(':',1)[0]]+=1
              for e in c.effects:
                  if TriggerDispatcher._stat_applied_charge_speed_shape_supported(e):
                      key=e.triggers[0].event_key or ''
                      if TriggerDispatcher.stat_applied_dependency_score_safe(c,e,key):
                          matches.append((c.members[e.actor].name,e.name,key,src))
          print('FRONTIER',len(unique),'CERT',cert,'FAMILIES',dict(fam),'STAT_MATCHES',matches)
          PY
