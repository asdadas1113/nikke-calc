name: Fast frontier probe tmp
on:
  push:
    branches: [fast-engine-phase2-20260901]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect compiled Red Hood weapon change
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          case=snapshot.SQUADS['레이드_레드후드퀀시']
          squad=spec.build_squad(list(case['members']))
          compiled=compile_moris_squad(squad)
          for e in compiled.effects:
              if e.effect_type=='weapon_change' and compiled.members[e.actor].name=='레드 후드':
                  print('COMPILED',repr(e))
                  print('PARAMS',repr(e.parameters))
          PY
