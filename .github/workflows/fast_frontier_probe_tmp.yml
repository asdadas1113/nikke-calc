name: Fast frontier probe tmp
on:
  push:
    branches: [fast-engine-phase2-20260901]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Moris weapon-change semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('calculator').glob('*.py'):
              lines=path.read_text(encoding='utf-8').splitlines()
              hits=[i for i,line in enumerate(lines) if 'weapon_change' in line or 'weapon change' in line.lower()]
              for i in hits:
                  lo=max(0,i-22); hi=min(len(lines),i+45)
                  print(f'=== {path}:{i+1} ===')
                  for j in range(lo,hi):
                      print(f'{j+1:05d}: {lines[j]}')
          PY
