name: Fast weapon-change finalizer
on:
  push:
    branches: [fast-engine-phase2-20260901]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated implementation
        run: |
          python fast_engine/research/_tmp_weapon_change_probe.py patch
          python fast_engine/research/_tmp_weapon_change_fix_v2.py
          python fast_engine/research/_tmp_weapon_change_fix_v3.py
          python fast_engine/research/_tmp_weapon_change_fix_v4.py
          python fast_engine/research/_tmp_weapon_change_fix_v5.py
      - name: Focused regression
        run: python -m unittest fast_engine.tests.test_dynamic_weapon_change -v
      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Standard 24-team audit
        env:
          PYTHONPATH: .
        run: python fast_engine/research/_tmp_weapon_change_probe.py audit
      - name: Remove temporary probe helpers
        run: |
          git rm .github/workflows/fast_frontier_probe_tmp.yml
          git rm fast_engine/research/_tmp_weapon_change_probe.py
          git rm fast_engine/research/_tmp_weapon_change_fix_v2.py
          git rm fast_engine/research/_tmp_weapon_change_fix_v3.py
          git rm fast_engine/research/_tmp_weapon_change_fix_v4.py
          git rm fast_engine/research/_tmp_weapon_change_fix_v5.py
      - name: Commit validated checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_engine/engine fast_engine/tests fast_engine/research/public_ranking_probe.py
          git status --short
          git commit -m 'impl: support same-class charge weapon change'
          git push origin HEAD:fast-engine-phase2-20260901
