name: tmp-close-scaling-hole

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-close-scaling-hole.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Add fail-closed scaling guards and adversarial regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fast_engine/engine/damage_policy.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if effect.effect_type != "buff" or (effect.stat or "") not in DIRECT_DAMAGE_STATE_STATS:\n        return False\n    if not _one_shot_lifetime_supported(effect):\n'''
          new = '''    if effect.effect_type != "buff" or (effect.stat or "") not in DIRECT_DAMAGE_STATE_STATS:\n        return False\n    # Reference/live scaling is Moris stateful semantics. Until Fast captures the\n    # referenced value at the correct activation boundary, emitting an unscaled\n    # numeric buff is false support rather than an approximation.\n    if any(key in effect.parameters for key in ("scaling", "scaling_ref")):\n        return False\n    if not _one_shot_lifetime_supported(effect):\n'''
          if text.count(old) != 1:
              raise SystemExit('direct damage support anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('fast_engine/engine/score.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def _is_patternless_unreachable(effect) -> bool:\n    return (\n'''
          helper = '''def _has_unowned_scaling(effect) -> bool:\n    return any(key in effect.parameters for key in ("scaling", "scaling_ref"))\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('score helper anchor changed')
          text = text.replace(anchor, helper + anchor, 1)

          old = '''        if _is_patternless_unreachable(effect):\n            continue\n\n        if effect.effect_type == "weapon_change":\n'''
          new = '''        if _is_patternless_unreachable(effect):\n            continue\n\n        # Cadence buffs with reference/live scaling must not be folded or run as\n        # if their raw value were final. Direct-damage scaling is rejected by\n        # is_direct_damage_buff_runtime_supported() and becomes delivery blockers.\n        if _has_unowned_scaling(effect) and stat in _CADENCE_OR_SHAPE_STATS:\n            blockers.append(f"cadence:{label}")\n            continue\n\n        if effect.effect_type == "weapon_change":\n'''
          if text.count(old) != 1:
              raise SystemExit('score blocker anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('fast_engine/tests/test_damage_false_supported_guards.py')
          test.write_text('''from __future__ import annotations\n\nimport unittest\nfrom unittest.mock import patch\n\nfrom calculator.buff_manager import BuffManager\nfrom context.spec import build_squad\nfrom fast_engine.engine.compiler import compile_moris_squad\nfrom fast_engine.engine.score import static_score_blockers\n\n\n_NAMES = ["라피", "폴리", "프로덕트 12", "미란다", "아니스"]\n\n\ndef _effect(name: str, stat: str, *, target: str, duration: float, timing: str):\n    return {\n        "source": "skill1",\n        "type": "buff",\n        "name": name,\n        "stat": stat,\n        "fixed_value": 100.0,\n        "polarity": "beneficial",\n        "target": target,\n        "duration": duration,\n        "trigger": {"timing": [timing], "condition": []},\n        "scaling": "stack_count",\n        "scaling_ref": "AUDIT reference",\n    }\n\n\ndef _compiled(raw_effects):\n    mapping = {_NAMES[0]: raw_effects}\n\n    def fake_char_effects(self, name):\n        return mapping.get(name, [])\n\n    with patch.object(BuffManager, "char_effects", new=fake_char_effects):\n        return compile_moris_squad(build_squad(_NAMES))\n\n\nclass FalseSupportedScalingGuardTests(unittest.TestCase):\n    def test_reference_scaled_direct_buff_fails_closed(self):\n        squad = _compiled([\n            _effect(\n                "AUDIT scaled atk", "atk_pct",\n                target="all_allies", duration=10.0, timing="burst_cast",\n            )\n        ])\n        blockers = static_score_blockers(squad)\n        self.assertIn(\n            "normal_delivery:라피:AUDIT scaled atk:atk_pct", blockers\n        )\n        self.assertIn(\n            "skill_state_delivery:라피:AUDIT scaled atk:atk_pct", blockers\n        )\n\n    def test_reference_scaled_permanent_cadence_buff_is_not_static_folded(self):\n        squad = _compiled([\n            _effect(\n                "AUDIT scaled reload", "reload_speed_pct",\n                target="self", duration=-1.0, timing="battle_start",\n            )\n        ])\n        blockers = static_score_blockers(squad)\n        self.assertIn(\n            "cadence:라피:AUDIT scaled reload:reload_speed_pct", blockers\n        )\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Focused adversarial regression
        run: python -m unittest fast_engine.tests.test_damage_false_supported_guards
      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Recompute public frontier after fail-closed guard
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus

          unique = {}
          for members, source in _source_corpus():
              unique.setdefault(tuple(members), source)
          family = Counter()
          rows = []
          for members, source in unique.items():
              blockers = static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              for blocker in blockers:
                  family[blocker.split(':', 1)[0]] += 1
              rows.append((source, len(blockers), blockers))
          certified = sum(count == 0 for _, count, _ in rows)
          print('FRONTIER', len(unique), 'CERTIFIED', certified, 'FAMILIES', dict(family))
          for source, count, blockers in rows:
              if source in {'레이드_볼륨', '스쿼드4', '스쿼드3', '레이드_소다', '레이드_앨리스브래디', '레이드_루주', '레이드_브리드디젤'}:
                  print('ROW', source, count, blockers)
          assert len(unique) == 23
          assert certified == 2
          volume = next((count, blockers) for source, count, blockers in rows if source == '레이드_볼륨')
          assert volume[0] > 1, volume
          assert any('마스트 : 로망틱 메이드' in b for b in volume[1]), volume
          PY
      - name: Commit scaling guard and remove temporary workflow
        run: |
          rm -f .github/workflows/tmp-close-scaling-hole.yml
          git diff --check
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fast: fail closed on unowned reference scaling"
          git push origin HEAD:fast-engine-phase2-20260901
