name: tmp-restore-lazy-rank

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-restore-lazy-rank.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Implement lazy rank target materialization
        run: |
          python - <<'PY'
          from pathlib import Path

          # ActiveEffectStore: keep unresolved rank buffs outside concrete target indexes
          # until the first stat query, matching Moris target_chars=None semantics.
          p = Path('fast_engine/engine/effects.py')
          t = p.read_text(encoding='utf-8')
          old = 'from typing import TYPE_CHECKING, Iterable\n'
          new = 'from typing import Callable, TYPE_CHECKING, Iterable\n'
          if t.count(old) != 1:
              raise SystemExit('effects import anchor changed')
          t = t.replace(old, new, 1)

          old = '''@dataclass(frozen=True, slots=True)\nclass EffectExpiryToken:\n    effect_id: int\n    target: int\n    cohort: tuple[int, ...]\n    generation: int\n    post_shot: bool = False\n\n\nclass ActiveEffectStore:\n'''
          new = '''@dataclass(frozen=True, slots=True)\nclass EffectExpiryToken:\n    effect_id: int\n    target: int\n    cohort: tuple[int, ...]\n    generation: int\n    post_shot: bool = False\n\n\n@dataclass(slots=True)\nclass PendingTargetEffect:\n    \"\"\"One Moris-style lazy target buff waiting for its first stat read.\"\"\"\n\n    effect_id: int\n    source_actor: int\n    activated_at: float\n    expires_at: float\n    stacks: float\n    scheduler: EventScheduler\n\n\nclass ActiveEffectStore:\n'''
          if t.count(old) != 1:
              raise SystemExit('pending dataclass anchor changed')
          t = t.replace(old, new, 1)

          old = '''        \"_by_target_name\", \"_generation\", \"_dynamic_bullet_targets\",\n        \"_bullet_remaining\",\n    )\n'''
          new = '''        \"_by_target_name\", \"_generation\", \"_dynamic_bullet_targets\",\n        \"_bullet_remaining\", \"_pending_target\", \"_lazy_target_resolver\",\n        \"_resolving_lazy_target\",\n    )\n'''
          if t.count(old) != 1:
              raise SystemExit('effects slots anchor changed')
          t = t.replace(old, new, 1)

          old = '''        self._dynamic_bullet_targets: frozenset[int] = frozenset()\n        self._bullet_remaining: dict[ActiveKey, int] = {}\n\n    def enable_dynamic_bullet_lifetime_targets(self, actors: Iterable[int]) -> None:\n'''
          new = '''        self._dynamic_bullet_targets: frozenset[int] = frozenset()\n        self._bullet_remaining: dict[ActiveKey, int] = {}\n        self._pending_target: dict[int, PendingTargetEffect] = {}\n        self._lazy_target_resolver: Callable[[\"CompiledEffect\", float, float], tuple[int, ...]] | None = None\n        self._resolving_lazy_target = False\n\n    def attach_lazy_target_resolver(\n        self,\n        resolver: Callable[[\"CompiledEffect\", float, float], tuple[int, ...]],\n    ) -> None:\n        \"\"\"Attach the rank resolver after TargetResolver is constructed.\"\"\"\n\n        self._lazy_target_resolver = resolver\n\n    def defer_target_group(\n        self,\n        effect: \"CompiledEffect\",\n        now: float,\n        scheduler: EventScheduler,\n    ) -> None:\n        \"\"\"Register one unresolved target cohort without guessing its recipient.\n\n        Moris keeps lazy rank buffs active with target_chars=None.  A refresh of\n        an already-resolved buff keeps that cohort; a refresh before first read\n        merely moves the unresolved activation timestamp.  Pending activation\n        invalidates ally EFFECT caches conservatively because the future cohort\n        is not known yet.\n        \"\"\"\n\n        max_stack = effect.max_stack if effect.max_stack is not None else 1.0\n        if float(max_stack) != 1.0:\n            raise NotImplementedError(\n                \"Fast lazy rank target currently requires max_stack=1\"\n            )\n\n        live = tuple(\n            active\n            for active in self._active.values()\n            if active.effect_id == effect.effect_id and active.active(now)\n        )\n        if live:\n            cohort = max(live, key=lambda active: active.generation).cohort\n            for target in cohort:\n                self._activate_one(effect, target, cohort, now, scheduler)\n            return\n\n        duration = effect.duration\n        expires = inf if duration is None or duration == -1 else now + max(0.0, duration)\n        self._pending_target[effect.effect_id] = PendingTargetEffect(\n            effect.effect_id,\n            effect.actor,\n            float(now),\n            float(expires),\n            1.0,\n            scheduler,\n        )\n        # DamageTermResolver caches by concrete actor EFFECT versions.  Until the\n        # lazy cohort is known every ally is a possible recipient, so invalidate\n        # those snapshots without materializing a target.\n        for actor in range(len(self.squad.members)):\n            self.state.touch(actor, StateDomain.EFFECT)\n\n    def _materialize_pending_stat(self, stat: str, now: float) -> None:\n        \"\"\"Resolve pending buffs of ``stat`` on their first observable read.\"\"\"\n\n        if self._resolving_lazy_target or self._lazy_target_resolver is None:\n            return\n        for effect_id, pending in tuple(self._pending_target.items()):\n            effect = self._effects[effect_id]\n            if (effect.stat or \"\") != stat:\n                continue\n            if pending.expires_at != inf and now >= pending.expires_at:\n                self._pending_target.pop(effect_id, None)\n                continue\n\n            self._resolving_lazy_target = True\n            try:\n                targets = self._lazy_target_resolver(\n                    effect, pending.activated_at, float(now)\n                )\n            finally:\n                self._resolving_lazy_target = False\n\n            self._pending_target.pop(effect_id, None)\n            cohort = self._cohort(targets)\n            if not cohort:\n                continue\n            # Lifetimes start at activation, not at first read.  This slice does\n            # not defer duration_bullets, so scheduling from activated_at cannot\n            # create a missed post-shot expiry.\n            for target in cohort:\n                self._activate_one(\n                    effect,\n                    target,\n                    cohort,\n                    pending.activated_at,\n                    pending.scheduler,\n                )\n\n    def enable_dynamic_bullet_lifetime_targets(self, actors: Iterable[int]) -> None:\n'''
          if t.count(old) != 1:
              raise SystemExit('effects init/method anchor changed')
          t = t.replace(old, new, 1)

          old = '''    def has_stat(self, target: int, stat: str, *, now: float) -> bool:\n        return bool(self._active_keys(self._by_target_stat, target, stat, now))\n\n    def sum_stat(self, target: int, stat: str, *, now: float) -> float:\n        total = 0.0\n'''
          new = '''    def has_stat(self, target: int, stat: str, *, now: float) -> bool:\n        self._materialize_pending_stat(stat, now)\n        return bool(self._active_keys(self._by_target_stat, target, stat, now))\n\n    def sum_stat(self, target: int, stat: str, *, now: float) -> float:\n        self._materialize_pending_stat(stat, now)\n        total = 0.0\n'''
          if t.count(old) != 1:
              raise SystemExit('sum_stat anchor changed')
          t = t.replace(old, new, 1)

          old = '''    def effective_atk(self, actor: int, *, now: float) -> float:\n        base = float(self.squad.members[actor].base_atk)\n        atk_pct = self.sum_stat(actor, \"atk_pct\", now=now)\n        atk_flat = self.sum_stat(actor, \"atk_flat\", now=now)\n        for key in self._active_keys(\n            self._by_target_stat, actor, \"atk_caster_based_pct\", now\n        ):\n            active = self._active[key]\n            effect = self._effects[active.effect_id]\n            caster_base = float(self.squad.members[active.source_actor].base_atk)\n            atk_flat += caster_base * float(effect.value or 0.0) * active.stacks / 100.0\n        return base * (1.0 + atk_pct / 100.0) + atk_flat\n'''
          new = '''    def effective_atk(self, actor: int, *, now: float) -> float:\n        \"\"\"Return current ATK without forcing unresolved rank buffs to resolve.\n\n        Moris _effective_atk sees lazy ActiveBuff rows with target_chars=None and\n        therefore excludes them while choosing that very cohort.\n        \"\"\"\n\n        previous = self._resolving_lazy_target\n        self._resolving_lazy_target = True\n        try:\n            base = float(self.squad.members[actor].base_atk)\n            atk_pct = self.sum_stat(actor, \"atk_pct\", now=now)\n            atk_flat = self.sum_stat(actor, \"atk_flat\", now=now)\n            for key in self._active_keys(\n                self._by_target_stat, actor, \"atk_caster_based_pct\", now\n            ):\n                active = self._active[key]\n                effect = self._effects[active.effect_id]\n                caster_base = float(self.squad.members[active.source_actor].base_atk)\n                atk_flat += caster_base * float(effect.value or 0.0) * active.stacks / 100.0\n            return base * (1.0 + atk_pct / 100.0) + atk_flat\n        finally:\n            self._resolving_lazy_target = previous\n'''
          if t.count(old) != 1:
              raise SystemExit('effective_atk anchor changed')
          t = t.replace(old, new, 1)

          old = '''    def iter_stat(self, stat: str, *, now: float):\n        seen: set[ActiveKey] = set()\n'''
          new = '''    def iter_stat(self, stat: str, *, now: float):\n        self._materialize_pending_stat(stat, now)\n        seen: set[ActiveKey] = set()\n'''
          if t.count(old) != 1:
              raise SystemExit('iter_stat anchor changed')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # TargetResolver: separate the activation identity used for cohort sharing
          # from the later wall-clock time whose live ATK is ranked.
          p = Path('fast_engine/engine/targets.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def _cache_key(\n        self, spec: TargetSpec, *, owner_actor: int, now: float\n    ) -> tuple[int, float, str] | None:\n        if spec.mode not in _SHARED_SELECTION_MODES or not isinstance(spec.raw, str):\n            return None\n        return owner_actor, float(now), spec.raw\n'''
          new = '''    def _cache_key(\n        self,\n        spec: TargetSpec,\n        *,\n        owner_actor: int,\n        now: float,\n        selection_time: float | None = None,\n    ) -> tuple[int, float, str] | None:\n        if spec.mode not in _SHARED_SELECTION_MODES or not isinstance(spec.raw, str):\n            return None\n        identity_time = now if selection_time is None else selection_time\n        return owner_actor, float(identity_time), spec.raw\n'''
          if t.count(old) != 1:
              raise SystemExit('target cache key anchor changed')
          t = t.replace(old, new, 1)

          old = '''    def _remember(\n        self,\n        spec: TargetSpec,\n        *,\n        owner_actor: int,\n        now: float,\n        targets: tuple[int, ...],\n    ) -> tuple[int, ...]:\n        key = self._cache_key(spec, owner_actor=owner_actor, now=now)\n'''
          new = '''    def _remember(\n        self,\n        spec: TargetSpec,\n        *,\n        owner_actor: int,\n        now: float,\n        selection_time: float | None = None,\n        targets: tuple[int, ...],\n    ) -> tuple[int, ...]:\n        key = self._cache_key(\n            spec,\n            owner_actor=owner_actor,\n            now=now,\n            selection_time=selection_time,\n        )\n'''
          if t.count(old) != 1:
              raise SystemExit('target remember anchor changed')
          t = t.replace(old, new, 1)

          old = '''    def resolve(self, spec: TargetSpec, *, owner_actor: int, now: float) -> tuple[int, ...]:\n        key = self._cache_key(spec, owner_actor=owner_actor, now=now)\n'''
          new = '''    def resolve(\n        self,\n        spec: TargetSpec,\n        *,\n        owner_actor: int,\n        now: float,\n        selection_time: float | None = None,\n    ) -> tuple[int, ...]:\n        key = self._cache_key(\n            spec,\n            owner_actor=owner_actor,\n            now=now,\n            selection_time=selection_time,\n        )\n'''
          if t.count(old) != 1:
              raise SystemExit('target resolve anchor changed')
          t = t.replace(old, new, 1)

          old = 'for actor in self.resolve(child, owner_actor=owner_actor, now=now):\n'
          new = 'for actor in self.resolve(child, owner_actor=owner_actor, now=now, selection_time=selection_time):\n'
          if t.count(old) != 1:
              raise SystemExit('composite target anchor changed')
          t = t.replace(old, new, 1)

          # Every shared dynamic selector remembers by activation identity while
          # still sorting on the live `now` state.
          needle = '''                owner_actor=owner_actor,\n                now=now,\n                targets='''
          replacement = '''                owner_actor=owner_actor,\n                now=now,\n                selection_time=selection_time,\n                targets='''
          count = t.count(needle)
          if count != 6:
              raise SystemExit(f'shared remember anchors changed: {count}')
          t = t.replace(needle, replacement)
          p.write_text(t, encoding='utf-8')

          # Dispatcher: defer only the narrow direct-damage rank slice.  Bullet
          # lifetimes and named/state dependencies remain on their existing path.
          p = Path('fast_engine/engine/dispatcher.py')
          t = p.read_text(encoding='utf-8')
          old = '''        self.effects = ActiveEffectStore(squad, state)\n        self.targets = TargetResolver(squad, state, self.effects, burst)\n        self.conditions = ConditionEvaluator(squad, state, self.effects, enemy, burst)\n'''
          new = '''        self.effects = ActiveEffectStore(squad, state)\n        self.targets = TargetResolver(squad, state, self.effects, burst)\n        self.effects.attach_lazy_target_resolver(self._resolve_lazy_rank_targets)\n        self.conditions = ConditionEvaluator(squad, state, self.effects, enemy, burst)\n'''
          if t.count(old) != 1:
              raise SystemExit('dispatcher resolver attach anchor changed')
          t = t.replace(old, new, 1)

          anchor = '''    def _bullet_lifetime_runtime_safe(self, effect: \"CompiledEffect\") -> bool:\n'''
          helper = '''    _LAZY_ATK_RANK_MODES = frozenset({\n        TargetMode.TOP_ATK,\n        TargetMode.TOP_ATK_EXCL_SELF,\n        TargetMode.LOWEST_ATK_BURST3,\n    })\n\n    @staticmethod\n    def _lazy_rank_target_shape_supported(effect: \"CompiledEffect\") -> bool:\n        \"\"\"Own simple Moris lazy ATK-rank direct buffs without bullet lifetimes.\"\"\"\n\n        max_stack = effect.max_stack if effect.max_stack is not None else 1.0\n        return (\n            effect.effect_type == \"buff\"\n            and effect.target_spec.mode in TriggerDispatcher._LAZY_ATK_RANK_MODES\n            and is_direct_damage_buff_runtime_supported(effect)\n            and float(max_stack) == 1.0\n            and effect.max_trigger is None\n            and effect.tick_interval is None\n            and effect.parameters.get(\"duration_bullets\") is None\n            and effect.parameters.get(\"event_scope\") != \"recipients\"\n            and not effect.condition_rules\n        )\n\n    def _lazy_rank_target_runtime_supported(self, effect: \"CompiledEffect\") -> bool:\n        if not self._lazy_rank_target_shape_supported(effect):\n            return False\n        if effect.name:\n            if effect.name in self._named_event_names_needed:\n                return False\n            if any(\n                rule.key == effect.name\n                for candidate in self._effect_table\n                for rule in candidate.condition_rules\n            ):\n                return False\n        return True\n\n    def _resolve_lazy_rank_targets(\n        self,\n        effect: \"CompiledEffect\",\n        activated_at: float,\n        now: float,\n    ) -> tuple[int, ...]:\n        return self.targets.resolve(\n            effect.target_spec,\n            owner_actor=effect.actor,\n            now=now,\n            selection_time=activated_at,\n        )\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('dispatcher lazy helper anchor changed')
          t = t.replace(anchor, helper + anchor, 1)

          old = '''        targets = self.targets.resolve(\n            effect.target_spec,\n            owner_actor=(effect.actor if target_owner_actor is None else target_owner_actor),\n            now=now,\n        )\n'''
          new = '''        if (\n            target_owner_actor is None\n            and self._lazy_rank_target_runtime_supported(effect)\n        ):\n            self.effects.defer_target_group(effect, now, self.scheduler)\n            self._activation_counts[effect.effect_id] += 1\n            return True\n\n        targets = self.targets.resolve(\n            effect.target_spec,\n            owner_actor=(effect.actor if target_owner_actor is None else target_owner_actor),\n            now=now,\n        )\n'''
          if t.count(old) != 1:
              raise SystemExit('dispatcher activate target anchor changed')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # Static certification: remove rank timing guard only for the exact lazy
          # shape above and only when no named/state consumer needs a concrete target.
          p = Path('fast_engine/engine/score.py')
          t = p.read_text(encoding='utf-8')
          anchor = '''def _dynamic_rank_target_transaction_unsafe(squad: CompiledSquad, effect) -> bool:\n'''
          helper = '''def _lazy_rank_target_score_safe(squad: CompiledSquad, effect) -> bool:\n    if not TriggerDispatcher._lazy_rank_target_shape_supported(effect):\n        return False\n    if not effect.name:\n        return True\n    named_event_key = f\"event:{effect.name}\"\n    if any(\n        any((rule.event_key or \"\") == named_event_key for rule in other.triggers)\n        for other in squad.effects\n        if other.effect_id != effect.effect_id\n    ):\n        return False\n    return not any(\n        rule.key == effect.name\n        for other in squad.effects\n        if other.effect_id != effect.effect_id\n        for rule in other.condition_rules\n    )\n\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('score lazy helper anchor changed')
          t = t.replace(anchor, helper + anchor, 1)

          old = '''    if effect.target_spec.mode not in _DYNAMIC_ATK_RANK_TARGET_MODES:\n        return False\n    if _is_patternless_unreachable(effect) or not effect.triggers:\n'''
          new = '''    if effect.target_spec.mode not in _DYNAMIC_ATK_RANK_TARGET_MODES:\n        return False\n    if _lazy_rank_target_score_safe(squad, effect):\n        return False\n    if _is_patternless_unreachable(effect) or not effect.triggers:\n'''
          if t.count(old) != 1:
              raise SystemExit('score guard bypass anchor changed')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Restore and add rank semantics regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('fast_engine/tests/test_damage_false_supported_guards.py')
          t = p.read_text(encoding='utf-8')
          old = '''from fast_engine.engine.compiler import compile_moris_squad\nfrom fast_engine.engine.score import static_score_blockers\n'''
          new = '''from fast_engine.engine.burst import BurstPolicy, BurstSignal\nfrom fast_engine.engine.burst_runtime import BurstRuntime\nfrom fast_engine.engine.compiler import compile_moris_squad\nfrom fast_engine.engine.score import static_score_blockers\n'''
          if t.count(old) != 1:
              raise SystemExit('false guard imports anchor changed')
          t = t.replace(old, new, 1)

          old = '''    def test_rank_target_with_same_event_atk_mutation_fails_closed(self):\n        rank = {\n            \"source\": \"skill1\", \"type\": \"buff\", \"name\": \"AUDIT rank\",\n            \"stat\": \"crit_rate\", \"fixed_value\": 50.0,\n            \"polarity\": \"beneficial\", \"target\": \"allies_top_atk:1\",\n            \"duration\": 10.0,\n            \"trigger\": {\"timing\": [\"full_burst_start\"], \"condition\": []},\n        }\n        atk = {\n            \"source\": \"skill1\", \"type\": \"buff\", \"name\": \"AUDIT atk\",\n            \"stat\": \"atk_pct\", \"fixed_value\": 100.0,\n            \"polarity\": \"beneficial\", \"target\": \"self\",\n            \"duration\": 10.0,\n            \"trigger\": {\"timing\": [\"full_burst_start\"], \"condition\": []},\n        }\n        blockers = static_score_blockers(_compiled([rank, atk]))\n        self.assertIn(\n            \"normal_state:라피:AUDIT rank:rank_target_timing\", blockers\n        )\n'''
          new = '''    def test_rank_target_resolves_after_same_event_atk_mutation(self):\n        rank = {\n            \"source\": \"skill1\", \"type\": \"buff\", \"name\": \"AUDIT rank\",\n            \"stat\": \"crit_rate\", \"fixed_value\": 50.0,\n            \"polarity\": \"beneficial\", \"target\": \"allies_top_atk:1\",\n            \"duration\": 10.0,\n            \"trigger\": {\"timing\": [\"full_burst_start\"], \"condition\": []},\n        }\n        sibling = {\n            \"source\": \"skill1\", \"type\": \"buff\", \"name\": \"AUDIT rank sibling\",\n            \"stat\": \"crit_dmg\", \"fixed_value\": 20.0,\n            \"polarity\": \"beneficial\", \"target\": \"allies_top_atk:1\",\n            \"duration\": 10.0,\n            \"trigger\": {\"timing\": [\"full_burst_start\"], \"condition\": []},\n        }\n        atk = {\n            \"source\": \"skill1\", \"type\": \"buff\", \"name\": \"AUDIT atk\",\n            \"stat\": \"atk_pct\", \"fixed_value\": 10000.0,\n            \"polarity\": \"beneficial\", \"target\": \"폴리\",\n            \"duration\": 10.0,\n            \"trigger\": {\"timing\": [\"full_burst_start\"], \"condition\": []},\n        }\n        compiled = _compiled([rank, sibling, atk])\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn(\n            \"normal_state:라피:AUDIT rank:rank_target_timing\", blockers\n        )\n        runtime = BurstRuntime(\n            compiled,\n            BurstPolicy(duration=2.0, first_burst_time=2.0, max_burst_count=0),\n        )\n        runtime.dispatcher.dispatch(BurstSignal(1.0, \"full_burst_start\", 0, 0))\n        poli = _NAMES.index(\"폴리\")\n        # Query the sibling first: both same caster/time/raw effects must share\n        # the post-mutation cohort even when their stats are read in reverse order.\n        self.assertEqual(\n            runtime.dispatcher.effects.sum_stat(poli, \"crit_dmg\", now=1.0),\n            20.0,\n        )\n        self.assertEqual(\n            runtime.dispatcher.effects.sum_stat(poli, \"crit_rate\", now=1.0),\n            50.0,\n        )\n        for actor in range(len(_NAMES)):\n            if actor == poli:\n                continue\n            self.assertEqual(\n                runtime.dispatcher.effects.sum_stat(actor, \"crit_rate\", now=1.0),\n                0.0,\n            )\n'''
          if t.count(old) != 1:
              raise SystemExit('rank synthetic test anchor changed')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('fast_engine/tests/test_target_snapshot.py')
          t = p.read_text(encoding='utf-8')
          anchor = '''    def test_lowest_atk_burst3_uses_base_stage_and_effective_atk(self):\n'''
          extra = '''    def test_lazy_selection_identity_uses_activation_time_but_live_rank_state(self):\n        runtime = self._runtime()\n        resolver = runtime.dispatcher.targets\n        actor_by_name = {\n            member.name: actor for actor, member in enumerate(runtime.squad.members)\n        }\n        spec = compile_target(\"allies_top_atk:1\", actor_by_name=actor_by_name)\n\n        first = resolver.resolve(\n            spec, owner_actor=0, now=5.1, selection_time=5.0\n        )\n        # A later read of the same activation keeps the already chosen cohort,\n        # even though its wall-clock query time changed.\n        runtime.dispatcher.effects.activate(\n            next(\n                e for e in runtime.squad.effects\n                if e.effect_type == \"buff\" and (e.stat or \"\") == \"atk_pct\"\n                and e.target_spec.mode.value == \"self\"\n            ),\n            1,\n            5.15,\n            runtime.scheduler,\n        )\n        same = resolver.resolve(\n            spec, owner_actor=0, now=5.2, selection_time=5.0\n        )\n        self.assertEqual(same, first)\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('target snapshot insertion anchor changed')
          t = t.replace(anchor, extra + anchor, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('fast_engine/tests/test_damage_real_squad_certification.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def test_miranda_mihara_control_is_safe_but_rank_timing_fails_closed(self):\n        _moris, compiled, policy, enemy = self._fixture()\n        self.assertEqual(compiled.members[4].weapon.get(\"control\"), {\"cover\": {\"policy\": \"own_full_burst\"}})\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn(\"control:미하라 : 본딩 체인\", blockers)\n        self.assertIn(\"normal_state:미란다:파워 업!:rank_target_timing\", blockers)\n        self.assertIn(\"normal_state:미란다:파워 업! 2:rank_target_timing\", blockers)\n        with self.assertRaises(NotImplementedError):\n            score_static_squad(compiled, policy, enemy, duration=30.0)\n'''
          new = '''    def test_miranda_mihara_control_and_lazy_rank_are_certified(self):\n        _moris, compiled, policy, enemy = self._fixture()\n        self.assertEqual(compiled.members[4].weapon.get(\"control\"), {\"cover\": {\"policy\": \"own_full_burst\"}})\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn(\"control:미하라 : 본딩 체인\", blockers)\n        self.assertFalse(any(\"rank_target_timing\" in item for item in blockers), blockers)\n        self.assertEqual(blockers, ())\n        score = score_static_squad(compiled, policy, enemy, duration=30.0)\n        self.assertGreater(score.squad_total, 0.0)\n'''
          if t.count(old) != 1:
              raise SystemExit('real squad rank cert anchor changed')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # Restore the pre-guard near-tie parity contract now that the semantics
          # are actually owned rather than merely unblocked.
          p = Path('fast_engine/tests/test_damage_moris_frame_timing.py')
          t = p.read_text(encoding='utf-8')
          start = t.index('    def test_def55_near_tie_withdraws_unowned_miranda_side(self):\n')
          end = t.index('\n\n\nif __name__ == "__main__":', start)
          new_func = '''    def test_def55_near_tie_preserves_moris_order(self):\n        mm = (\n            \"미란다\", \"브리드 : 사일런트 트랙\", \"헬름\", \"루주\", \"미하라 : 본딩 체인\",\n        )\n        rhq = (\n            \"라피 : 레드 후드\", \"레드 후드\", \"프리카\", \"민트\", \"퀀시 : 이스케이프 퀸\",\n        )\n        duration = 180.0\n        cfg = {\"duration\": duration, \"first_burst_time\": 3.0, \"rng_mode\": \"expected\"}\n        enemy = dict(DEFAULT_ENEMY)\n        enemy.update({\"def\": 55000.0, \"code\": \"작열\", \"core_px\": 10.0})\n        profile = EnemyStaticProfile(\n            defense=55000.0,\n            element=\"작열\",\n            core_uptime=1.0,\n            core_px=10.0,\n            duration=duration,\n        )\n\n        def run(names):\n            squad = spec.build_squad(list(names))\n            compiled = compile_moris_squad(squad)\n            self.assertEqual(static_score_blockers(compiled), ())\n            policy = compile_burst_policy(squad, compiled, dict(cfg))\n            moris = simulate(\n                squad,\n                config=spec.build_config(squad, dict(cfg)),\n                enemy=enemy,\n                seed=42,\n                verbose=False,\n            )\n            fast = score_static_squad(compiled, policy, profile, duration=duration)\n            return float(moris.squad_total), float(fast.squad_total)\n\n        mm_m, mm_f = run(mm)\n        rhq_m, rhq_f = run(rhq)\n        moris_margin = (mm_m - rhq_m) / max(mm_m, rhq_m)\n        fast_margin = (mm_f - rhq_f) / max(mm_f, rhq_f)\n        self.assertGreater(moris_margin, 0.0)\n        self.assertGreater(fast_margin, 0.0)\n        self.assertLess(abs(mm_f / mm_m - 1.0), 0.001)\n        self.assertLess(abs(rhq_f / rhq_m - 1.0), 0.001)\n        self.assertLess(abs(fast_margin - moris_margin), 0.0005)\n'''
          t = t[:start] + new_func + t[end:]
          p.write_text(t, encoding='utf-8')

          for name in (\n              'test_damage_full_charge_bullet_lifetime.py',\n              'test_damage_full_charge_hit_charge_speed.py',\n              'test_damage_stat_applied_charge_speed.py',\n          ):
              p = Path('fast_engine/tests') / name
              t = p.read_text(encoding='utf-8')
              old = 'self.assertEqual(certified, 1)'
              if t.count(old) != 1:
                  raise SystemExit(f'{name}: certified=1 anchor changed ({t.count(old)})')
              p.write_text(t.replace(old, 'self.assertEqual(certified, 2)', 1), encoding='utf-8')
          PY

      - name: Focused lazy rank regressions
        run: |
          python -m unittest fast_engine.tests.test_damage_false_supported_guards
