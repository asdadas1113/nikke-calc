name: tmp Ada one-shot charge state

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - '.github/workflows/tmp-ada-one-shot.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Moris one-shot lifetime source
        run: |
          echo '=== calculator lifetime / charge references ==='
          grep -n -C 14 -E 'duration_bullets|charge_speed_pct|charge_time' calculator/timeline.py calculator/buff_manager.py | head -n 1200 || true
          echo '=== fast capability / score references ==='
          grep -n -C 24 -E 'field:duration_bullets|is_runtime_executable_effect|state_end_timing|_valid_dynamic_bullet_lifetime|_is_dynamic_charge_score_supported|direct_damage_buff_runtime' fast_engine/engine/dispatcher.py fast_engine/engine/score.py | head -n 1600 || true
