name: tmp-quency-normal-diagnosis
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace Quency burst damage state
        run: |
          python - <<'PY' | tee quency-diagnosis.txt
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile

          members = ['라피 : 레드 후드','레드 후드','프리카','민트','퀀시 : 이스케이프 퀸']
          target = '퀀시 : 이스케이프 퀸'
          qi = members.index(target)
          duration = 10.0
          cfg = {'duration':duration,'first_burst_time':3.0,'rng_mode':'expected'}
          enemy = dict(DEFAULT_ENEMY)
          squad = spec.build_squad(members)
          compiled = compile_moris_squad(squad)

          print('QUENCY_COMPILED')
          for eff in compiled.effects:
              if eff.actor == qi:
                  print(eff.actor_effect_index, eff.effect_type, eff.name, eff.stat, eff.value, eff.parameters, [r.raw for r in eff.triggers])

          class TraceSink(SimpleDamageScoreSink):
              def _score_spec(self, effect_id, *, now, full_burst):
                  eff = self.squad.effects[effect_id]
                  if eff.name == '위대한 도둑 3':
                      terms = self.resolver.resolve(eff.actor, now=now)
                      print('FAST_HIT_TIME', now, 'FULL_BURST', full_burst)
                      print('FAST_TERMS', terms)
                      for stat in ('atk_pct','atk_flat','atk_caster_based_pct','atk_dmg_pct','crit_rate','crit_dmg'):
                          rows=[]
                          for src, active in self.runtime.dispatcher.effects.iter_stat(stat, now=now):
                              if active.target == eff.actor:
                                  rows.append((self.squad.members[src.actor].name, src.name, src.stat, src.value, active.stacks))
                          if rows: print('FAST_ACTIVE', stat, rows)
                  return super()._score_spec(effect_id, now=now, full_burst=full_burst)

          ep = EnemyStaticProfile(defense=float(enemy.get('def',31784.0)), element=enemy.get('code'), core_uptime=0.0, core_px=0.0, duration=duration)
          policy = compile_burst_policy(squad, compiled, dict(cfg))
          sink = TraceSink(compiled, ep)
          runtime = BurstRuntime(compiled, policy, ep, damage_sink=sink)
          result = runtime.run(duration=duration)
          print('FAST_CASTS', result.casts)
          print('FAST_SKILL_TOTAL', sink.char_total[qi])

          moris = simulate(squad, config=spec.build_config(squad, dict(cfg)), enemy=dict(enemy), seed=42, verbose=True)
          skill_hits = [h for h in moris.hits if h.caster == target and h.skill_name == '위대한 도둑 3']
          print('MORIS_HITS', [(h.t,h.damage,h.hit_tag) for h in skill_hits])
          print('MORIS_BURST_LOG', [(x.t,x.event,x.caster) for x in moris.log.burst_log if x.t < 5])
          if skill_hits:
              ht = skill_hits[0].t
              print('MORIS_ACTIVE_AT_HIT')
              active={}
              for e in sorted(moris.log.buff_events, key=lambda x:(x.t, 0 if x.kind=='activate' else 1)):
                  if e.target != target or e.t > ht + 1e-9: continue
                  key=(e.caster,e.name,e.stat)
                  if e.kind=='activate': active[key]=e
                  else: active.pop(key,None)
              for key,e in active.items():
                  print(e.caster,e.name,e.stat,e.value,e.stack,e.expires_at)
          PY
      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: quency-diagnosis
          path: quency-diagnosis.txt
