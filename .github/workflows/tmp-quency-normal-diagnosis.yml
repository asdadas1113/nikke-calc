name: tmp-quency-normal-diagnosis
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply generic conditional-passive patch
        run: python fast_engine/research/tmp_apply_conditional_passive_patch.py
      - name: Focused test
        run: python -m unittest fast_engine.tests.test_conditional_passive_self_stack -v
      - name: Commit implementation when changed
        run: |
          if git diff --quiet -- fast_engine/engine/dispatcher.py fast_engine/engine/effects.py fast_engine/tests/test_conditional_passive_self_stack.py; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/engine/dispatcher.py fast_engine/engine/effects.py fast_engine/tests/test_conditional_passive_self_stack.py
          git commit -m "fix: sync self-stack conditional passives"
          git push origin HEAD:fast-engine-phase2-20260901
