name: Fast post-named public audit

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: [.github/workflows/_fast_post_named_audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit standard 24 public squads
        run: |
          python - <<'PY'
          from collections import Counter
          from context.snapshot import SQUADS
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          DELIVERY={"normal_delivery","skill_state_delivery","damage_delivery"}
          def concept(b):
              p=b.split(':')
              return ':'.join(p[1:]) if p and p[0] in DELIVERY else b

          rows=[]; pressure=Counter()
          for name,row in SQUADS.items():
              if name.startswith('지그_'):
                  continue
              members=list(row.get('members') or ())
              if len(members)!=5:
                  continue
              squad=compile_moris_squad(build_squad(members))
              blockers=tuple(static_score_blockers(squad))
              concepts=tuple(sorted(set(map(concept, blockers))))
              rows.append((name,blockers,concepts))
              pressure.update(concepts)
          certified=[r for r in rows if not r[1]]
          print('TEAMS',len(rows),'CERTIFIED',len(certified),'GAPS',len(rows)-len(certified))
          print('CERTIFIED_NAMES', [r[0] for r in certified])
          print('FRIKA_TEAMS')
          for r in rows:
              if r[0] in {'레이드_레드후드퀀시','컨트롤_리버렐리오프리카','레이드_리버렐리오프리카'} or any('프리카' in c for c in r[2]):
                  print(r[0], 'RAW',len(r[1]),'CONCEPT',len(r[2]))
                  for c in r[2]: print(' C',c)
          print('TOP_PRESSURE')
          for b,n in pressure.most_common(25): print(n,b)
          PY
      - name: Remove helper
        run: |
          rm .github/workflows/_fast_post_named_audit.yml
          git config user.name "fast-engine-bot"
          git config user.email "fast-engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove post-named audit helper"
          git push origin HEAD:fast-engine-phase2-20260901
