name: Optimizer bounded runner migration

on:
  push:
    branches:
      - optimizer-debug-localized-ambiguity-20260831

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-debug-localized-ambiguity-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch production runners
        run: python .github/scripts/migrate_optimizer_bounded_runner.py
      - name: Run optimizer tests
        run: python -m unittest discover -s tests -p 'test_optimizer_*.py'
      - name: Commit migration
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tests/benchmark_optimizer_same_budget_auto_worker.py tests/benchmark_optimizer_same_budget_auto_enikk_worker.py tests/test_optimizer_same_budget_auto_enikk_worker.py
          git commit -m 'test: use bounded meta input in production worker runners'
          git push origin HEAD:optimizer-debug-localized-ambiguity-20260831
