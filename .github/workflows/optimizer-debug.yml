name: Optimizer debug

on:
  push:
    branches:
      - optimizer-debug-localized-ambiguity-20260831

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run optimizer tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_optimizer_*.py' 2>&1 | tee /tmp/optimizer-test.txt
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: optimizer-test-output
          path: |
            /tmp/optimizer-test.txt
            /tmp/status.txt
          retention-days: 1
