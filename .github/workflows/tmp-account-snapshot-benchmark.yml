name: Temporary account snapshot benchmark

on:
  pull_request:
    branches: [master]

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run optimizer unit tests
        run: python -m unittest discover -s tests -p 'test_optimizer_*.py'
      - name: Run account snapshot real-Moris E2E
        run: PYTHONPATH=. python tests/benchmark_optimizer_account_e2e_real.py
