name: tmp-restore-lazy-rank-v4

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-restore-lazy-rank-v4.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply lazy rank patch and stale-test repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('.github/workflows/tmp-restore-lazy-rank.yml').read_text(encoding='utf-8')
          text = text.replace('if count != 6:', 'if count != 4:')
          marker = "          python - <<'PY'\n"
          end = "\n          PY"
          blocks = []
          pos = 0
          while True:
              start = text.find(marker, pos)
              if start < 0:
                  break
              start += len(marker)
              stop = text.find(end, start)
              if stop < 0:
                  raise SystemExit('unterminated embedded python block')
              blocks.append(textwrap.dedent(text[start:stop]))
              pos = stop + len(end)
          if len(blocks) < 2:
              raise SystemExit(f'expected >=2 embedded python blocks, got {len(blocks)}')

          broken = "for name in (\\n              'test_damage_full_charge_bullet_lifetime.py',\\n              'test_damage_full_charge_hit_charge_speed.py',\\n              'test_damage_stat_applied_charge_speed.py',\\n          ):"
          fixed = "for name in (\n              'test_damage_full_charge_bullet_lifetime.py',\n              'test_damage_full_charge_hit_charge_speed.py',\n              'test_damage_stat_applied_charge_speed.py',\n          ):"
          if broken not in blocks[1]:
              raise SystemExit('serialized file-list anchor not found')
          blocks[1] = blocks[1].replace(broken, fixed, 1)

          for i, block in enumerate(blocks[:2], 1):
              exec(compile(block, f'<lazy-rank-patch-{i}>', 'exec'), {})

          p = Path('fast_engine/tests/test_damage_rapid_cover_control.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def test_real_miranda_mihara_squad_clears_control_but_not_rank_timing(self):\n        moris = build_squad(REAL_NAMES)\n        compiled = compile_moris_squad(moris)\n        policy = compile_burst_policy(\n            moris,\n            compiled,\n            {\"duration\": 30.0, \"first_burst_time\": 3.0, \"rng_mode\": \"expected\"},\n        )\n        enemy = EnemyStaticProfile(\n            defense=31784.0,\n            element=None,\n            core_uptime=0.0,\n            core_px=0.0,\n            duration=30.0,\n        )\n\n        self.assertEqual(\n            compiled.members[4].weapon.get(\"control\"),\n            {\"cover\": {\"policy\": \"own_full_burst\"}},\n        )\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn(\"control:미하라 : 본딩 체인\", blockers)\n        self.assertIn(\"normal_state:미란다:파워 업!:rank_target_timing\", blockers)\n        self.assertIn(\"normal_state:미란다:파워 업! 2:rank_target_timing\", blockers)\n        with self.assertRaises(NotImplementedError):\n            score_static_squad(compiled, policy, enemy, duration=30.0)\n'''
          new = '''    def test_real_miranda_mihara_squad_clears_control_and_rank_timing(self):\n        moris = build_squad(REAL_NAMES)\n        compiled = compile_moris_squad(moris)\n        policy = compile_burst_policy(\n            moris,\n            compiled,\n            {\"duration\": 30.0, \"first_burst_time\": 3.0, \"rng_mode\": \"expected\"},\n        )\n        enemy = EnemyStaticProfile(\n            defense=31784.0,\n            element=None,\n            core_uptime=0.0,\n            core_px=0.0,\n            duration=30.0,\n        )\n\n        self.assertEqual(\n            compiled.members[4].weapon.get(\"control\"),\n            {\"cover\": {\"policy\": \"own_full_burst\"}},\n        )\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn(\"control:미하라 : 본딩 체인\", blockers)\n        self.assertFalse(any(\"rank_target_timing\" in item for item in blockers), blockers)\n        self.assertEqual(blockers, ())\n        score = score_static_squad(compiled, policy, enemy, duration=30.0)\n        self.assertGreater(score.squad_total, 0.0)\n'''
          if t.count(old) != 1:
              raise SystemExit('rapid control stale rank anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Focused lazy rank regressions
        run: |
          python -m unittest fast_engine.tests.test_damage_false_supported_guards
          python -m unittest fast_engine.tests.test_target_snapshot
          python -m unittest fast_engine.tests.test_damage_real_squad_certification
          python -m unittest fast_engine.tests.test_damage_rapid_cover_control
          python -m unittest fast_engine.tests.test_damage_moris_frame_timing

      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'

      - name: Verify restored public frontier
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus

          unique = {}
          for members, source in _source_corpus():
              unique.setdefault(tuple(members), source)
          families = Counter()
          certified = []
          for members, source in unique.items():
              blockers = static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              if not blockers:
                  certified.append(source)
              for blocker in blockers:
                  families[blocker.split(':', 1)[0]] += 1
          print('FRONTIER', len(unique), 'CERTIFIED', certified, 'FAMILIES', dict(families))
          assert len(unique) == 23
          assert set(certified) == {'컨트롤_미란다미하라', '레이드_레드후드퀀시'}, certified
          PY

      - name: Commit semantic restoration and remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-restore-lazy-rank.yml
          rm -f .github/workflows/tmp-restore-lazy-rank-v2.yml
          rm -f .github/workflows/tmp-restore-lazy-rank-v3.yml
          rm -f .github/workflows/tmp-restore-lazy-rank-v4.yml
          git diff --check
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fast: own lazy dynamic-rank target resolution"
          git push origin HEAD:fast-engine-phase2-20260901
