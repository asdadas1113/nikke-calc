name: Fast Naga blocker diagnosis

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose Naga delivery blockers
        run: |
          python - <<'PY'
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.engine.dispatcher import TriggerDispatcher
          import fast_engine.engine.score as score

          names = ["리틀 머메이드", "나가", "크라운", "아스카 : WILLE", "루드밀라 : 윈터 오너"]
          squad = compile_moris_squad(build_squad(names))
          actor = names.index("나가")
          print("BLOCKERS", static_score_blockers(squad))
          for e in squad.members[actor].effects:
              if e.name in {"우정의 가드 2", "친구들과 함께라면! 3"}:
                  print("EFFECT", e.name)
                  print(" type/stat/value/duration", e.effect_type, e.stat, e.value, e.duration)
                  print(" target", e.target, e.target_spec)
                  print(" triggers", [(r.raw, r.event_key, r.mode.value, r.threshold, r.trigger_count_reducible) for r in e.triggers])
                  print(" conditions", e.conditions, e.condition_rules)
                  print(" capability", e.capability.disposition.value, e.capability.blockers, e.capability.category.value, e.capability.timing_families, e.capability.condition_families, e.capability.target_family)
                  print(" dispatcher_exec", TriggerDispatcher.is_executable_effect(e))

          print("--- SCORE SOURCE HITS ---")
          import inspect
          src = inspect.getsource(score)
          lines = src.splitlines()
          needles = ("core_dmg_pct", "atk_caster_based_pct", "normal_delivery", "skill_state_delivery", "damage_delivery")
          for i, line in enumerate(lines):
              if any(n in line for n in needles):
                  lo=max(0,i-8); hi=min(len(lines),i+13)
                  print(f"@@ {i+1} @@")
                  print("\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi)))
          PY
