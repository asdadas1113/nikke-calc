name: Fast timed shield runtime patch

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply narrow timed-shield bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # damage_policy: runtime can evaluate shield presence and consume the
          # event, while score.py will separately prove every producer.
          path = "fast_engine/engine/damage_policy.py"
          replace_once(
              path,
              "    ConditionMode.NOT_DURING_FULL_BURST,\n",
              "    ConditionMode.NOT_DURING_FULL_BURST,\n    ConditionMode.DURING_SHIELD,\n",
          )
          replace_once(
              path,
              '    "event:ally_burst_cast",\n    "last_bullet",\n',
              '    "event:ally_burst_cast",\n    "event:shield_applied",\n    "last_bullet",\n',
          )

          # Dispatcher: only finite, positive, ordinary timed shields with
          # static ally targets and simple controller-event timing are materialized.
          path = "fast_engine/engine/dispatcher.py"
          replace_once(
              path,
              '    _GAUGE_STATS = frozenset({"gauge_charge", "gauge_consume"})\n',
              '\n'.join([
                  '    _SHIELD_STATS = frozenset({"shield_from_max_hp_pct"})',
                  '    _SHIELD_SAFE_EVENT_KEYS = frozenset({',
                  '        "battle_start",',
                  '        "burst_cast",',
                  '        "full_burst_start",',
                  '        "full_burst_end",',
                  '        "event:ally_burst_cast",',
                  '    })',
                  '',
                  '    _GAUGE_STATS = frozenset({"gauge_charge", "gauge_consume"})',
                  '',
              ]),
          )
          anchor = '    @staticmethod\n    def is_executable_effect(effect: "CompiledEffect") -> bool:\n'
          method = '\n'.join([
              '    @classmethod',
              '    def _timed_shield_shape_supported(cls, effect: "CompiledEffect") -> bool:',
              '        """Certify the presence-only timed shield slice owned by Fast."""',
              '',
              '        if not (',
              '            effect.effect_type == "buff"',
              '            and (effect.stat or "") in cls._SHIELD_STATS',
              '            and effect.value is not None',
              '            and float(effect.value) > 0.0',
              '            and effect.duration is not None',
              '            and float(effect.duration) > 0.0',
              '            and effect.max_stack in (None, 1, 1.0)',
              '            and not effect.parameters',
              '            and target_scope_is_static(effect.target_spec)',
              '            and effect.target_spec.runtime_supported',
              '            and not effect.condition_rules',
              '            and bool(effect.triggers)',
              '        ):',
              '            return False',
              '        for rule in effect.triggers:',
              '            if rule.mode is not TriggerMode.EVENT:',
              '                return False',
              '            key = rule.event_key or ""',
              '            if key in cls._SHIELD_SAFE_EVENT_KEYS:',
              '                continue',
              '            if key.startswith("burst_enter:") or key.startswith("squad_burst_cast:"):',
              '                continue',
              '            return False',
              '        return True',
              '',
              '    @staticmethod',
              '    def is_executable_effect(effect: "CompiledEffect") -> bool:',
              '',
          ])
          replace_once(path, anchor, method)
          replace_once(
              path,
              '        if self.is_executable_effect(effect):\n            return self._bullet_lifetime_runtime_safe(effect)\n',
              '        if self._timed_shield_shape_supported(effect):\n            return True\n        if self.is_executable_effect(effect):\n            return self._bullet_lifetime_runtime_safe(effect)\n',
          )
          replace_once(
              path,
              '    def _is_state_dependency(self, effect: "CompiledEffect") -> bool:\n',
              '\n'.join([
                  '    def _sync_shield_target(self, target: int, *, now: float) -> None:',
                  '        present = any(',
                  '            active.target == target and float(effect.value or 0.0) > 0.0',
                  '            for effect, active in self.effects.iter_stat("shield_from_max_hp_pct", now=now)',
                  '        )',
                  '        self.state.set_shield(target, 1.0 if present else 0.0)',
                  '',
                  '    def _is_state_dependency(self, effect: "CompiledEffect") -> bool:',
                  '',
              ]),
          )
          replace_once(
              path,
              '        elif effect.effect_type == "buff":\n            self.effects.activate_group(effect, targets, now, self.scheduler)\n            if stat.startswith("burst_stage_override:"):\n',
              '\n'.join([
                  '        elif effect.effect_type == "buff":',
                  '            if stat in self._SHIELD_STATS and any(target == ENEMY for target in targets):',
                  '                return False',
                  '            self.effects.activate_group(effect, targets, now, self.scheduler)',
                  '            if stat in self._SHIELD_STATS:',
                  '                from .burst import BurstSignal',
                  '                actor_targets = tuple(int(target) for target in targets)',
                  '                for target in actor_targets:',
                  '                    self._sync_shield_target(target, now=now)',
                  '                # Moris establishes shield state before notifying each recipient.',
                  '                for target in actor_targets:',
                  '                    self.dispatch(BurstSignal(now, "event:shield_applied", target, target))',
                  '            if stat.startswith("burst_stage_override:"):',
                  '',
              ]),
          )
          replace_once(
              path,
              '        stat = expired.stat or ""\n        if stat.startswith("burst_stage_override:"):\n',
              '        stat = expired.stat or ""\n        if stat in self._SHIELD_STATS and event.actor != ENEMY:\n            self._sync_shield_target(int(event.actor), now=event.time)\n        if stat.startswith("burst_stage_override:"):\n',
          )

          # Score gate: shield consumers are certifiable only when every shield
          # source that may reach the owner is the narrow runtime shape above.
          path = "fast_engine/engine/score.py"
          replace_once(
              path,
              'from .core_events import is_static_expected_core_count_rule\n',
              'from .conditions import ConditionMode\nfrom .core_events import is_static_expected_core_count_rule\n',
          )
          anchor = 'def _direct_damage_buff_score_supported(squad: CompiledSquad, effect) -> bool:\n'
          helpers = '\n'.join([
              '_SHIELD_SOURCE_STATS = frozenset({"shield_from_max_hp_pct", "shared_shield_from_max_hp_pct"})',
              '',
              '',
              'def _uses_shield_runtime_semantics(effect) -> bool:',
              '    return (',
              '        any(rule.mode is ConditionMode.DURING_SHIELD for rule in effect.condition_rules)',
              '        or any((rule.event_key or "") == "event:shield_applied" for rule in effect.triggers)',
              '    )',
              '',
              '',
              'def _shield_runtime_dependency_score_safe(squad: CompiledSquad, effect) -> bool:',
              '    owner = effect.actor',
              '    sources = tuple(',
              '        source',
              '        for source in squad.effects',
              '        if (source.stat or "") in _SHIELD_SOURCE_STATS',
              '        and owner in _possible_ally_targets(squad, source)',
              '    )',
              '    if not sources:',
              '        return False',
              '    if not all(TriggerDispatcher._timed_shield_shape_supported(source) for source in sources):',
              '        return False',
              '    source_names = {source.name for source in sources if source.name}',
              '    if any(',
              '        other.parameters.get("target_effect") in source_names',
              '        for other in squad.effects',
              '        if other is not effect',
              '    ):',
              '        return False',
              '    return True',
              '',
              '',
              'def _direct_damage_buff_score_supported(squad: CompiledSquad, effect) -> bool:',
              '',
          ])
          replace_once(path, anchor, helpers)
          replace_once(
              path,
              '    if not is_direct_damage_buff_runtime_supported(effect):\n        return False\n    if effect.parameters.get("duration_bullets") is None:\n',
              '    if not is_direct_damage_buff_runtime_supported(effect):\n        return False\n    if _uses_shield_runtime_semantics(effect) and not _shield_runtime_dependency_score_safe(squad, effect):\n        return False\n    if effect.parameters.get("duration_bullets") is None:\n',
          )

          # Damage resolver: during_shield is a live condition, not activation-only.
          path = "fast_engine/engine/damage_state.py"
          replace_once(
              path,
              'from .damage import DamageTerms\n',
              'from .conditions import ConditionMode\nfrom .damage import DamageTerms\n',
          )
          replace_once(
              path,
              '    def _token(self, actor: int) -> tuple[int, ...]:\n        return self.state.dependency_token(\n            entities=(actor, ENEMY),\n            domains=(StateDomain.EFFECT,),\n        )\n\n    def _sum(self, actor: int, stat: str, now: float) -> float:\n        return self.effects.sum_stat(actor, stat, now=now)\n',
              '\n'.join([
                  '    def _token(self, actor: int) -> tuple[int, ...]:',
                  '        effect_token = self.state.dependency_token(',
                  '            entities=(actor, ENEMY),',
                  '            domains=(StateDomain.EFFECT,),',
                  '        )',
                  '        # A shield-conditioned buff may be sourced by another ally, so',
                  '        # HEALTH invalidation is squad-global for this sparse state change.',
                  '        return effect_token + (self.state.domain_version(StateDomain.HEALTH),)',
                  '',
                  '    def _runtime_condition_ok(self, effect) -> bool:',
                  '        for rule in effect.condition_rules:',
                  '            if (',
                  '                rule.mode is ConditionMode.DURING_SHIELD',
                  '                and self.state.actors[effect.actor].shield <= 0.0',
                  '            ):',
                  '                return False',
                  '        return True',
                  '',
                  '    def _sum(self, actor: int, stat: str, now: float) -> float:',
                  '        total = 0.0',
                  '        for effect, active in self.effects.iter_stat(stat, now=now):',
                  '            if active.target != actor or not self._runtime_condition_ok(effect):',
                  '                continue',
                  '            total += float(effect.value or 0.0) * active.stacks',
                  '        return total',
                  '',
                  '    def _has(self, actor: int, stat: str, now: float) -> bool:',
                  '        return any(',
                  '            active.target == actor and self._runtime_condition_ok(effect)',
                  '            for effect, active in self.effects.iter_stat(stat, now=now)',
                  '        )',
                  '',
              ]),
          )
          replace_once(
              path,
              '            if active.target != actor:\n                continue\n            caster_base = self.squad.members[active.source_actor].base_atk\n',
              '            if active.target != actor or not self._runtime_condition_ok(effect):\n                continue\n            caster_base = self.squad.members[active.source_actor].base_atk\n',
          )
          replace_once(
              path,
              '            pierce_enabled=self.effects.has_stat(\n                actor, "pierce_enabled", now=now\n            ),\n            armor_break_enabled=self.effects.has_stat(\n                actor, "armor_break_enabled", now=now\n            ),\n',
              '            pierce_enabled=self._has(actor, "pierce_enabled", now),\n            armor_break_enabled=self._has(actor, "armor_break_enabled", now),\n',
          )

          # Real-public regression tests exercise event ordering, live condition
          # re-evaluation, stale refresh expiry, and the frontier blocker contract.
          test = Path("fast_engine/tests/test_damage_shield_runtime.py")
          if test.exists():
              raise SystemExit("shield runtime test file already exists")
          test.write_text('''from __future__ import annotations

import unittest

from context.spec import build_squad
from fast_engine.engine.burst import BurstPolicy, BurstSignal
from fast_engine.engine.burst_runtime import BurstRuntime
from fast_engine.engine.compiler import compile_moris_squad
from fast_engine.engine.damage_state import DamageTermResolver
from fast_engine.engine.model import EnemyStaticProfile
from fast_engine.engine.scheduler import EventKind
from fast_engine.engine.score import static_score_blockers


NAMES = ["리틀 머메이드", "나가", "크라운", "아스카 : WILLE", "루드밀라 : 윈터 오너"]


class TimedShieldRuntimeTests(unittest.TestCase):
    @staticmethod
    def _runtime():
        squad = compile_moris_squad(build_squad(NAMES))
        runtime = BurstRuntime(
            squad,
            BurstPolicy(duration=40.0, first_burst_time=30.0),
            EnemyStaticProfile(defense=0.0, duration=40.0),
        )
        return squad, runtime

    @staticmethod
    def _expire_through(runtime, time: float) -> None:
        while runtime.scheduler and (runtime.scheduler.peek_time() or 0.0) <= time + 1e-9:
            event = runtime.scheduler.pop()
            if event.kind is EventKind.STATE_EXPIRE:
                runtime.dispatcher.handle_expiry(event)

    def test_public_naga_shield_damage_blockers_are_removed_but_crown_stays(self):
        squad, _runtime = self._runtime()
        blockers = static_score_blockers(squad)
        self.assertFalse(any("나가:우정의 가드 2:core_dmg_pct" in item for item in blockers))
        self.assertFalse(any("나가:친구들과 함께라면! 3:atk_caster_based_pct" in item for item in blockers))
        self.assertIn("normal_delivery:크라운:로얄 에타이어 4:atk_dmg_pct", blockers)
        self.assertIn("skill_state_delivery:크라운:로얄 에타이어 4:atk_dmg_pct", blockers)

    def test_shield_state_precedes_same_time_shield_applied_consumer(self):
        squad, runtime = self._runtime()
        naga = NAMES.index("나가")
        crown = NAMES.index("크라운")
        runtime.dispatcher.dispatch(BurstSignal(0.0, "burst_cast", crown, crown))
        self.assertGreater(runtime.state.actors[naga].shield, 0.0)
        guard = next(e for e in squad.members[naga].effects if e.name == "우정의 가드 2")
        self.assertGreater(runtime.dispatcher._activation_counts.get(guard.effect_id, 0), 0)
        for actor in range(len(NAMES)):
            self.assertAlmostEqual(
                runtime.dispatcher.effects.sum_stat(actor, "core_dmg_pct", now=0.01),
                float(guard.value or 0.0),
                places=9,
            )

    def test_during_shield_damage_state_rechecks_after_shield_expiry(self):
        squad, runtime = self._runtime()
        naga = NAMES.index("나가")
        crown = NAMES.index("크라운")
        target = NAMES.index("리틀 머메이드")
        runtime.dispatcher.dispatch(BurstSignal(0.0, "burst_cast", crown, crown))
        runtime.dispatcher.dispatch(BurstSignal(14.0, "burst_cast", naga, naga))
        resolver = DamageTermResolver(squad, runtime.dispatcher.effects, runtime.state, runtime.enemy)
        before = resolver.resolve(target, now=14.1).atk_flat
        conditional = next(e for e in squad.members[naga].effects if e.name == "친구들과 함께라면! 3")
        expected_drop = squad.members[naga].base_atk * float(conditional.value or 0.0) / 100.0
        self._expire_through(runtime, 15.0)
        self.assertEqual(runtime.state.actors[naga].shield, 0.0)
        after = resolver.resolve(target, now=15.01).atk_flat
        self.assertAlmostEqual(before - after, expected_drop, places=6)

    def test_shield_refresh_invalidates_old_expiry(self):
        _squad, runtime = self._runtime()
        naga = NAMES.index("나가")
        crown = NAMES.index("크라운")
        runtime.dispatcher.dispatch(BurstSignal(0.0, "burst_cast", crown, crown))
        runtime.dispatcher.dispatch(BurstSignal(10.0, "burst_cast", crown, crown))
        self._expire_through(runtime, 15.0)
        self.assertGreater(runtime.state.actors[naga].shield, 0.0)
        self._expire_through(runtime, 25.0)
        self.assertEqual(runtime.state.actors[naga].shield, 0.0)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY
      - name: Focused regression
        run: |
          python -m unittest fast_engine.tests.test_damage_shield_runtime
          python -m unittest discover -s fast_engine/tests -p 'test_damage*.py'
          python -m unittest fast_engine.tests.test_dispatcher
          python -m unittest fast_engine.tests.test_burst_runtime
      - name: Commit source patch and remove helper
        run: |
          rm .github/workflows/_fast_naga_diag.yml
          git config user.name "fast-engine-bot"
          git config user.email "fast-engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "impl: support presence-only timed shields"
          git push origin HEAD:fast-engine-phase2-20260901
