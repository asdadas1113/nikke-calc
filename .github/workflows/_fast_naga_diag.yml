name: Fast Naga blocker diagnosis

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Moris shield semantics
        run: |
          grep -RIn -C 8 -E 'shield_from_max_hp_pct|shield_applied|during_shield|set_shield|\.shield' calculator context | head -n 500
