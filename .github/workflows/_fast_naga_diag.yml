name: Fast Naga blocker diagnosis

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Fast condition lifetime tests
        run: |
          grep -RIn -C 6 -E 'during_full_burst|not_during_full_burst|self_state|target_state|runtime condition|condition.*expire|condition.*buff' fast_engine/tests fast_engine/engine | head -n 700
