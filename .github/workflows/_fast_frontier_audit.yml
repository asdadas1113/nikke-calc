name: Fast public frontier audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run standardized public frontier
        run: python -m fast_engine.research.public_blocker_frontier
      - name: Remove audit helper
        run: |
          rm .github/workflows/_fast_frontier_audit.yml
          git config user.name "fast-engine-bot"
          git config user.email "fast-engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove public frontier audit helper"
          git push origin HEAD:fast-engine-phase2-20260901
