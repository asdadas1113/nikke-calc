name: tmp maid mast multistack audit
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - 'fast_engine/research/tmp_maid_mast_promotion.py'
      - 'fast_engine/tests/test_damage_reference_stack_capture.py'
      - '.github/workflows/tmp-maid-mast-multistack-audit.yml'
jobs:
  promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit public frontier
        run: PYTHONPATH=. python fast_engine/research/tmp_maid_mast_promotion.py
      - name: Complete Fast discovery
        run: PYTHONPATH=. python -m unittest discover -s fast_engine/tests -p 'test_*.py'
