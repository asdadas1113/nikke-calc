name: tmp-stat-applied-record-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-stat-applied-record-frontier.yml

permissions:
  contents: write

jobs:
  record-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record canonical CI result
        run: |
          python - <<'PY'
          from pathlib import Path

          checkpoint = Path('fast_engine/research/STAT_APPLIED_CHARGE_SPEED_CHECKPOINT_20260905.md')
          text = checkpoint.read_text(encoding='utf-8')
          old = '''production semantic promotion 자체는 runner에서 full Fast `258/258`까지 통과했다.

cleanup 뒤 `.github/workflows`를 `ci.yml`, `pages.yml`만 남긴 clean HEAD에서 canonical CI를 다시 실행한다. 이 절의 최종 run/job/count는 clean canonical 결과가 확보된 뒤 기록한다.
'''
          new = '''production semantic promotion 자체는 runner에서 full Fast `258/258`까지 통과했다.

cleanup commit:

- `e467103c992786d8259229840005e1d672284bb6` — docs/cleanup finalizer
- cleanup 뒤 `.github/workflows`는 `ci.yml`, `pages.yml`만 남았다.

cleanup commit은 GitHub Actions token push라 recursive canonical CI가 생성되지 않았다. 따라서 docs-only metadata commit `f55579ffd586eee15fa21b79c754b27d3e2959d5`로 동일 production tree의 canonical CI를 직접 실행했다.

- run: `33931819590`
- job: `101211793772`
- workflow conclusion: `success`
- doclint: success
- Fast — damage: `151/151`
- calculator: `137/137` (1 skip)
- optimizer: `374/374`
- bridge: `31/31` (1 skip)
- site: `385/385`
- golden snapshot: `29/29`

Brady 신규 `test_damage_stat_applied_charge_speed.py`는 canonical `test_damage*.py` discovery에 포함된 상태로 검증됐다.
'''
          if old not in text:
              raise SystemExit('checkpoint canonical marker missing')
          checkpoint.write_text(text.replace(old, new, 1), encoding='utf-8')

          handoff = Path('fast_engine/research/HANDOFF_FAST_ENGINE_20260905.md')
          h = handoff.read_text(encoding='utf-8')
          marker = '## 9. CI / cleanup 계약\n'
          if marker not in h:
              raise SystemExit('handoff CI marker missing')
          prefix = h.split(marker, 1)[0]
          section = '''## 9. CI / cleanup 완료

이번 Brady checkpoint의 production semantic commit은 `8880049678c9270de8d7b98c456b93fa00a67502`다.

cleanup finalizer commit:

- `e467103c992786d8259229840005e1d672284bb6`

cleanup 뒤 `.github/workflows`에는 `ci.yml`, `pages.yml`만 남았다. recursive CI가 생성되지 않아 docs-only metadata commit `f55579ffd586eee15fa21b79c754b27d3e2959d5`로 canonical CI를 직접 실행했다.

canonical CI:

- run `33931819590`
- job `101211793772`
- result `success`
- Fast damage `151/151`
- calculator `137/137` (1 skip)
- optimizer `374/374`
- bridge `31/31` (1 skip)
- site `385/385`
- golden `29/29`

따라서 Brady stat-applied checkpoint는 production / regression / canonical CI까지 닫혔다.

다음 단일 checkpoint는 section 7대로 cadence `63` unique-23 frontier fresh audit에서 고른다.

`master`는 그대로 둔다.
'''
          handoff.write_text(prefix + section, encoding='utf-8')
          PY
      - name: Fresh cadence-63 frontier audit
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          rows = []
          seen = set()
          for source_name, case in snapshot.SQUADS.items():
              if str(source_name).startswith('지그_'):
                  continue
              members = tuple(str(x) for x in case['members'])
              if len(members) != 5 or any(x.startswith('test_') for x in members):
                  continue
              if members in seen:
                  continue
              seen.add(members)
              compiled = compile_moris_squad(spec.build_squad(list(members)))
              blockers = tuple(static_score_blockers(compiled))
              rows.append((len(blockers), str(source_name), members, compiled, blockers))

          print('UNIQUE_COUNT', len(rows))
          print('CERTIFIED_COUNT', sum(1 for row in rows if row[0] == 0))
          fam = Counter(b.split(':', 1)[0] for row in rows for b in row[4])
          print('FAMILIES', sorted(fam.items(), key=lambda x: (-x[1], x[0])))
          exact = Counter(b for row in rows for b in row[4])
          print('REPEATED_EXACT')
          for blocker, count in exact.most_common(30):
              if count > 1:
                  print(count, blocker)

          for count, source_name, members, compiled, blockers in sorted(rows, key=lambda x: (x[0], x[1])):
              print('\nTEAM', count, source_name, members)
              for blocker in blockers:
                  print(' B', blocker)
              if count > 10:
                  continue
              print(' EFFECT_SHAPES')
              for effect in compiled.effects:
                  cap = effect.capability
                  cap_blocks = tuple(getattr(cap, 'blockers', ()) or ())
                  disp_obj = getattr(cap, 'disposition', None)
                  disp = getattr(disp_obj, 'value', str(disp_obj))
                  if not cap_blocks and str(disp).lower().endswith('ready'):
                      continue
                  actor = effect.actor
                  member = compiled.members[actor]
                  name = getattr(member, 'name', str(actor))
                  triggers = []
                  for rule in effect.triggers:
                      triggers.append({
                          'mode': getattr(getattr(rule, 'mode', None), 'value', str(getattr(rule, 'mode', None))),
                          'event': getattr(rule, 'event_key', None),
                          'threshold': getattr(rule, 'threshold', None),
                          'modulo': getattr(rule, 'modulo', None),
                      })
                  conditions = []
                  for rule in effect.condition_rules:
                      conditions.append({
                          'mode': getattr(getattr(rule, 'mode', None), 'value', str(getattr(rule, 'mode', None))),
                          'key': getattr(rule, 'key', None),
                          'value': getattr(rule, 'value', None),
                      })
                  target = getattr(effect, 'target_spec', None)
                  target_mode = getattr(getattr(target, 'mode', None), 'value', str(getattr(target, 'mode', None)))
                  print('  E', {
                      'actor': name,
                      'effect_id': effect.effect_id,
                      'name': effect.name,
                      'type': effect.effect_type,
                      'stat': effect.stat,
                      'value': effect.value,
                      'duration': effect.duration,
                      'max_stack': effect.max_stack,
                      'target': target_mode,
                      'target_runtime': getattr(target, 'runtime_supported', None),
                      'triggers': triggers,
                      'conditions': conditions,
                      'parameters': effect.parameters,
                      'cap_disposition': disp,
                      'cap_blockers': cap_blocks,
                  })
          PY
      - name: Validate docs
        run: python -m context.doclint
      - name: Remove temporary metadata
        run: |
          rm -f fast_engine/research/STAT_APPLIED_CANONICAL_CI_TRIGGER_20260905.md
          rm -f .github/workflows/tmp-stat-applied-record-frontier.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "ci.yml pages.yml "
      - name: Commit docs and cleanup
        run: |
          git config user.name 'asdadas1113'
          git config user.email 'crony06@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: close stat-applied canonical checkpoint'
          git push origin HEAD:fast-engine-phase2-20260901
