name: tmp-stat-applied-record-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-stat-applied-record-frontier.yml

permissions:
  contents: write

jobs:
  record-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record canonical CI and scan frontier
        run: PYTHONPATH=. python .github/scripts/tmp_stat_applied_record_frontier.py
      - name: Validate docs
        run: python -m context.doclint
      - name: Remove temporary metadata
        run: |
          rm -f fast_engine/research/STAT_APPLIED_CANONICAL_CI_TRIGGER_20260905.md
          rm -f .github/scripts/tmp_stat_applied_record_frontier.py
          rm -f .github/workflows/tmp-stat-applied-record-frontier.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "ci.yml pages.yml "
      - name: Commit docs and cleanup
        run: |
          git config user.name 'asdadas1113'
          git config user.email 'crony06@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: close stat-applied canonical checkpoint'
          git push origin HEAD:fast-engine-phase2-20260901
