name: tmp-next-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - 'fast_engine/research/tmp_next_frontier_probe.py'
      - 'fast_engine/research/tmp_encounter_unreachable_probe.py'
      - 'fast_engine/research/tmp_apply_patternless_encounter.py'
      - 'fast_engine/research/tmp_validate_patternless_encounter.py'
      - '.github/workflows/tmp-next-frontier.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baseline post-Asuka frontier
        run: python -m fast_engine.research.tmp_next_frontier_probe
      - name: Probe Moris encounter-event reachability
        run: python -m fast_engine.research.tmp_encounter_unreachable_probe
      - name: Apply runner-only patternless encounter patch
        run: python -m fast_engine.research.tmp_apply_patternless_encounter
      - name: Validate narrow blocker removal
        run: python -m fast_engine.research.tmp_validate_patternless_encounter
      - name: Patched frontier
        run: python -m fast_engine.research.tmp_next_frontier_probe
      - name: Inspect stale board test provenance
        run: |
          echo '--- ls-files stage/type/verbose ---'
          git ls-files --stage fast_engine/tests/test_damage_patternless_board.py || true
          git ls-files -t fast_engine/tests/test_damage_patternless_board.py || true
          git ls-files -v fast_engine/tests/test_damage_patternless_board.py || true
          echo '--- check-ignore ---'
          git check-ignore -v fast_engine/tests/test_damage_patternless_board.py || true
          echo '--- stat ---'
          stat fast_engine/tests/test_damage_patternless_board.py || true
          echo '--- body 220-270 ---'
          sed -n '220,270p' fast_engine/tests/test_damage_patternless_board.py || true
          echo '--- status ---'
          git status --short --ignored fast_engine/tests/test_damage_patternless_board.py || true
      - name: Fast regression suite
        run: python -m pytest fast_engine/tests -q
