name: Temporary next semantic frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect single-charge post-shot consumer graph
        run: |
          python - <<'PY'
          from context import snapshot,spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          cases=[('스쿼드2','츠바이'),('레이드_헬름아쿠아스노우','스노우 화이트')]
          keys={'full_charge_hit','on_attack','hit_count','pellet_hit'}
          for source,actor in cases:
              sq=compile_moris_squad(spec.build_squad(list(snapshot.SQUADS[source]['members'])))
              idx=sq.names.index(actor)
              print('\nCASE',source,actor)
              for e in sq.members[idx].effects:
                  interesting=any((r.event_key or '') in keys for r in e.triggers)
                  if not interesting:
                      continue
                  print('POST',e.effect_id,e.name,e.effect_type,e.stat,'value=',e.value,'dur=',e.duration,'stack=',e.max_stack,'target=',e.target_spec.mode.value,'params=',dict(e.parameters),'cap=',e.capability.disposition.value,e.capability.blockers,'exec=',TriggerDispatcher.is_executable_effect(e),'triggers=',[(r.mode.value,r.event_key,r.threshold,r.trigger_count_reducible,r.raw) for r in e.triggers],'conditions=',[(r.mode.value,r.key) for r in e.condition_rules])
          PY
