name: Temporary next semantic frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Little Mermaid and Crown candidate shapes
        run: |
          echo '=== sequential support references ==='
          grep -R -n "sequential_damage\|sequential_dmg" fast_engine/engine fast_engine/tests | head -250 || true
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers, _possible_ally_targets
          from fast_engine.engine.dispatcher import TriggerDispatcher

          rosters = {
            '스쿼드1': ['리틀 머메이드','크라운','라피 : 레드 후드','미하라 : 본딩 체인','헬름'],
            '스쿼드5': ['아니스 : 스타','아르카나','이사벨','신데렐라','크라운'],
            '레이드_일레그': ['아니스 : 스타','크라운','일레그 : 붐 앤 쇼크','헬름','루드밀라 : 윈터 오너'],
          }
          for label,names in rosters.items():
              sq=compile_moris_squad(spec.build_squad(names))
              print('\nROSTER',label, sq.names)
              print('BLOCKERS', static_score_blockers(sq))
              for e in sq.effects:
                  if e.name == '로얄 에타이어 4' or e.name == '거품 난사' or any(k in (e.stat or '') for k in ('heal','life')):
                      print('EFFECT',e.effect_id,e.actor,sq.members[e.actor].name,e.name,e.effect_type,e.stat,'value=',e.value,'dur=',e.duration,'stack=',e.max_stack,'tick=',e.tick_interval,'target=',e.target_spec.mode.value,'targets=',_possible_ally_targets(sq,e),'cap=',e.capability.disposition.value,e.capability.blockers,'params=',dict(e.parameters),'conds=',[(c.mode.value,c.key,c.threshold) for c in e.condition_rules],'triggers=',[(t.mode.value,t.event_key,t.threshold,t.raw) for t in e.triggers])
              crown=next((e for e in sq.effects if e.name=='로얄 에타이어 4'),None)
              if crown:
                  print('CROWN_EXEC', TriggerDispatcher.is_executable_effect(crown))
                  try:
                      print('CROWN_HEAL_SAFE', TriggerDispatcher(sq).heal_received_dependency_score_safe(crown))
                  except Exception as exc:
                      print('CROWN_HEAL_SAFE_ERR',type(exc).__name__,exc)
          PY
