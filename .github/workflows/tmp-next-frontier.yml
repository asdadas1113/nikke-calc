name: Temporary next semantic frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare remaining public weapon changes
        run: |
          echo '=== related existing tests/docs ==='
          grep -R -n "과충전 공식\|세븐스 드워프 : I\|깔끔한 마무리\|섬멸 모드" fast_engine/tests fast_engine/research | head -300 || true
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers, _possible_ally_targets
          from fast_engine.engine.dispatcher import TriggerDispatcher

          rosters={
            '스쿼드2':['츠바이','나유타','프리바티','스노우 화이트 : 헤비암즈','리틀 머메이드'],
            '레이드_헬름아쿠아스노우':['미란다','헬름 : 아쿠아마린','에이드 : 에이전트 바니','스노우 화이트','에이다'],
            '레이드_네온벨벳':['리틀 머메이드','벨벳','나유타','네온 : 비전 아이','리버렐리오'],
            '레이드_작열짬':['리타','그레이브','레이','앨리스','모더니아'],
          }
          nameset={'과충전 공식','세븐스 드워프 : I','깔끔한 마무리','섬멸 모드'}
          for label,names in rosters.items():
              sq=compile_moris_squad(spec.build_squad(names))
              print('\nROSTER',label,sq.names)
              print('BLOCKERS',[b for b in static_score_blockers(sq) if b.startswith('weapon_change:')])
              for e in sq.effects:
                  if e.name not in nameset: continue
                  m=sq.members[e.actor]
                  print('WEAPON_CHANGE',m.name,'base=',m.weapon_type,dict(m.weapon),'effect_id=',e.effect_id,'effect=',e.effect_type,e.stat,'value=',e.value,'dur=',e.duration,'stack=',e.max_stack,'target=',e.target_spec.mode.value,'params=',dict(e.parameters),'conds=',[(c.mode.value,c.key,getattr(c,'value',None)) for c in e.condition_rules],'triggers=',[(t.mode.value,t.event_key,t.threshold,t.raw) for t in e.triggers],'cap=',e.capability.disposition.value,e.capability.blockers)
                  print('  rapid_shape=',TriggerDispatcher._temporary_self_rapid_weapon_change_shape_supported(e))
                  print('  charge_shape=',TriggerDispatcher._temporary_self_charge_weapon_change_shape_supported(e))
                  print('  rapid_charge_skill_shape=',TriggerDispatcher._temporary_self_rapid_to_charge_skill_weapon_change_shape_supported(e))
                  for o in sq.effects:
                      if o.effect_id==e.effect_id: continue
                      refs=(any(c.key==e.name for c in o.condition_rules) or any((r.event_key or '')==f'event:state_end:{e.name}' for r in o.triggers) or o.parameters.get('target_effect')==e.name or o.parameters.get('scaling_ref')==e.name)
                      if refs:
                          print('  CONSUMER',sq.members[o.actor].name,o.name,o.effect_type,o.stat,'value=',o.value,'dur=',o.duration,'target=',o.target_spec.mode.value,'params=',dict(o.parameters),'conds=',[(c.mode.value,c.key,getattr(c,'value',None)) for c in o.condition_rules],'triggers=',[(r.mode.value,r.event_key,r.threshold,r.raw) for r in o.triggers])
          PY
