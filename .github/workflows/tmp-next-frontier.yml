name: tmp-next-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - 'fast_engine/research/tmp_next_frontier_probe.py'
      - 'fast_engine/research/tmp_encounter_unreachable_probe.py'
      - 'fast_engine/research/tmp_apply_patternless_encounter.py'
      - 'fast_engine/research/tmp_validate_patternless_encounter.py'
      - '.github/workflows/tmp-next-frontier.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: State immediately after checkout
        run: |
          echo '--- gitignore lines ---'
          wc -l .gitignore
          tail -n 20 .gitignore
          echo '--- board file ---'
          test -e fast_engine/tests/test_damage_patternless_board.py && echo PRESENT || echo ABSENT
          git status --short --ignored | tail -n 40
      - name: Import context only
        run: python -c 'import context; print("context imported")'
      - name: State after context import
        run: |
          echo '--- gitignore lines ---'
          wc -l .gitignore
          tail -n 20 .gitignore
          echo '--- board file ---'
          test -e fast_engine/tests/test_damage_patternless_board.py && echo PRESENT || echo ABSENT
          git status --short --ignored | tail -n 40
      - name: Baseline post-Asuka frontier
        run: python -m fast_engine.research.tmp_next_frontier_probe
      - name: State after frontier import/run
        run: |
          echo '--- gitignore lines ---'
          wc -l .gitignore
          tail -n 20 .gitignore
          echo '--- board file ---'
          test -e fast_engine/tests/test_damage_patternless_board.py && echo PRESENT || echo ABSENT
          git status --short --ignored | tail -n 40
      - name: Probe Moris encounter-event reachability
        run: python -m fast_engine.research.tmp_encounter_unreachable_probe
      - name: Apply runner-only patternless encounter patch
        run: python -m fast_engine.research.tmp_apply_patternless_encounter
      - name: Validate narrow blocker removal
        run: python -m fast_engine.research.tmp_validate_patternless_encounter
      - name: Patched frontier
        run: python -m fast_engine.research.tmp_next_frontier_probe
      - name: Fast regression suite excluding stale ignored board
        run: python -m pytest fast_engine/tests -q --ignore=fast_engine/tests/test_damage_patternless_board.py
