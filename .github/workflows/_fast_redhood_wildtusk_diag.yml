name: Fast Red Hood Wild Tusk diagnostics
on:
  push:
    branches: [fast-engine-phase2-20260901]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose Wild Tusk 4 blocker
        shell: bash
        run: |
          python - <<'PY'
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers, _direct_damage_buff_score_supported
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.damage_policy import is_direct_damage_buff_runtime_supported

          names=['라피 : 레드 후드','레드 후드','프리카','민트','퀀시 : 이스케이프 퀸']
          squad=compile_moris_squad(build_squad(names))
          print('BLOCKERS', [b for b in static_score_blockers(squad) if '레드 후드' in b])
          member=squad.members[1]
          for e in member.effects:
              if e.name.startswith('와일드 투스'):
                  print('EFFECT',e.effect_id,e.name,e.effect_type,e.stat,e.value,e.target,e.duration,e.max_stack,e.parameters)
                  print('TRIGGERS',[(r.raw,r.event_key,getattr(r.mode,'value',str(r.mode)),r.threshold,r.is_runtime_supported) for r in e.triggers])
                  print('CONDS',[repr(r) for r in e.condition_rules])
                  print('CAP',e.capability.disposition,e.capability.blockers)
                  print('EXEC',TriggerDispatcher.is_executable_effect(e))
                  print('DIRECT_RUNTIME',is_direct_damage_buff_runtime_supported(e))
                  print('DIRECT_SCORE',_direct_damage_buff_score_supported(squad,e))
          PY
      - name: Remove helper
        if: always()
        shell: bash
        run: |
          rm .github/workflows/_fast_redhood_wildtusk_diag.yml
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add -A
          git commit -m "chore: remove Red Hood Wild Tusk diagnostic helper" || exit 0
          git push origin HEAD:fast-engine-phase2-20260901
