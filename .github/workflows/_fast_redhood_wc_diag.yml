name: Red Wolf weapon-change diagnosis
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/_fast_redhood_wc_diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Diagnose weapon change
        run: |
          python - <<'PY'
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_normal_score_blockers
          names=["라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"]
          squad=compile_moris_squad(build_squad(names)); red=1
          for e in squad.members[red].effects:
              if e.effect_type=='weapon_change':
                  print('WC',e.effect_id,e.name,'stat=',e.stat,'value=',e.value,'duration=',e.duration,'max_stack=',e.max_stack,'target=',e.target_spec.mode.value,'params=',e.parameters,'cap=',e.capability.disposition,e.capability.blockers,'exec=',TriggerDispatcher.is_executable_effect(e))
                  print('TRIGGERS',[(r.raw,r.event_key,r.mode.value,r.threshold,r.trigger_count_reducible) for r in e.triggers])
                  print('CONDS',[(r.raw,r.mode.value,r.key,r.threshold) for r in e.condition_rules])
          print('BLOCKERS',static_normal_score_blockers(squad))
          PY
      - name: Remove helper
        if: always()
        run: |
          rm -f .github/workflows/_fast_redhood_wc_diag.yml
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add -A
          git commit -m "chore: remove Red Wolf diagnosis helper" || exit 0
          git push origin HEAD:fast-engine-phase2-20260901
