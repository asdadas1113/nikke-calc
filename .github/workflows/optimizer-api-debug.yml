name: Optimizer API debug

on:
  push:
    branches:
      - optimizer-debug-localized-ambiguity-20260831

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run optimizer tests
        run: python -m unittest discover -s tests -p 'test_optimizer_*.py'
