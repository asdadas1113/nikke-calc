name: Fast reload inspect once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect reload effects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          skills = json.loads(Path('data/parsed_skills.json').read_text(encoding='utf-8'))
          nikke = json.loads(Path('data/parsed_nikke.json').read_text(encoding='utf-8'))
          mech = json.loads(Path('data/weapon_mechanics.json').read_text(encoding='utf-8'))
          clips = {w: set(v) for w, v in mech.get('clip_characters', {}).items()}
          names = [
              '크라운', '마스트 : 로망틱 메이드', '프리바티', '앵커 : 이노센트 메이드',
              '그레이브', '루드밀라 : 윈터 오너', '아니스 : 스파클링 서머',
              '아스카 : WILLE', '트리나', '퀀시 : 이스케이프 퀸'
          ]
          for name in names:
              row = nikke.get(name, {})
              wt = row.get('weapon_type') or row.get('weapon')
              print(f'CHAR {name} weapon={wt!r} clip={name in clips.get(str(wt), set())}')
              for effect in skills.get(name, []):
                  if effect.get('stat') != 'reload_speed_pct':
                      continue
                  print('  EFFECT', json.dumps({
                      'name': effect.get('name'),
                      'type': effect.get('type'),
                      'target': effect.get('target'),
                      'trigger': effect.get('trigger'),
                      'duration': effect.get('duration'),
                      'fixed_value': effect.get('fixed_value'),
                      'max_stack': effect.get('max_stack'),
                  }, ensure_ascii=False, sort_keys=True))
          PY
