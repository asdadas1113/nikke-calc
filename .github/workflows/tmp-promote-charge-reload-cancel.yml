name: tmp-promote-charge-reload-cancel

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-promote-charge-reload-cancel.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify parent checkpoint
        run: |
          test "$(git rev-parse HEAD^)" = "25ccc1e66fc87f36db015502e2518f3fb80faa96"
      - name: Apply narrow production slice
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('fast_engine/engine/weapon.py')
          s = p.read_text(encoding='utf-8')
          marker = '\n\ndef _round_half_up(value: float) -> int:\n'
          helper = '''\n\ndef is_supported_charge_reload_cancel_control(member) -> bool:\n    """Certify pure non-clip charge ``reload.cancel_on_full`` control.\n\n    Mixed charge controls and any additional reload policy remain fail-closed.\n    """\n\n    weapon = member.weapon\n    if str(weapon.get("fire_mode") or "") != "charge":\n        return False\n    if weapon.get("is_clip"):\n        return False\n    control = weapon.get("control") or {}\n    if not isinstance(control, dict) or set(control) != {"reload"}:\n        return False\n    reload_control = control.get("reload")\n    return (\n        isinstance(reload_control, dict)\n        and set(reload_control) == {"cancel_on_full"}\n        and reload_control.get("cancel_on_full") is True\n    )\n'''
          if marker not in s or 'def is_supported_charge_reload_cancel_control' in s:
              raise SystemExit('weapon insertion point changed')
          p.write_text(s.replace(marker, helper + marker, 1), encoding='utf-8')

          p = Path('fast_engine/engine/dynamic_weapon.py')
          s = p.read_text(encoding='utf-8')
          old_import = 'from .weapon import DynamicChargeCadenceRuntime, is_supported_charge_hold_control'
          new_import = '''from .weapon import (\n    DynamicChargeCadenceRuntime,\n    is_supported_charge_hold_control,\n    is_supported_charge_reload_cancel_control,\n)'''
          if old_import not in s:
              raise SystemExit('dynamic import point changed')
          s = s.replace(old_import, new_import, 1)
          old_doc = '''        All recipients are validated before mutation. Reload-cancel-on-full is\n        intentionally outside this slice; certification rejects such controls.\n'''
          new_doc = '''        All recipients are validated before mutation. Pure charge\n        ``reload.cancel_on_full`` cancels only an active reload filled to full.\n'''
          if old_doc not in s:
              raise SystemExit('dynamic doc point changed')
          s = s.replace(old_doc, new_doc, 1)
          old = '''            st.ammo = min(full, st.ammo + gain)\n            if st.phase == "post_fire_reload" and st.ammo > 0:\n                # Refill arrived after the last shot but before reload start.\n                # Keep the existing post-fire boundary, then charge again.\n                st.phase = "post_fire"\n            self._invalidate(st)\n'''
          new = '''            st.ammo = min(full, st.ammo + gain)\n            if (\n                st.phase == "reloading"\n                and st.ammo >= full\n                and is_supported_charge_reload_cancel_control(self.squad.members[actor])\n            ):\n                # Moris keeps the refill, cancels the active reload without\n                # full_reload/post-reload semantics, and may charge immediately.\n                self._enter_charge(st, float(now), float(now))\n            elif st.phase == "post_fire_reload" and st.ammo > 0:\n                # Refill arrived after the last shot but before reload start.\n                # Keep the existing post-fire boundary, then charge again.\n                st.phase = "post_fire"\n            self._invalidate(st)\n'''
          if old not in s:
              raise SystemExit('ammo charge insertion point changed')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('fast_engine/engine/score.py')
          s = p.read_text(encoding='utf-8')
          old_import = 'from .weapon import StaticCadenceModifiers, is_supported_charge_hold_control'
          new_import = '''from .weapon import (\n    StaticCadenceModifiers,\n    is_supported_charge_hold_control,\n    is_supported_charge_reload_cancel_control,\n)'''
          if old_import not in s:
              raise SystemExit('score import point changed')
          s = s.replace(old_import, new_import, 1)
          old = '''    control = member.weapon.get("control") or {}\n    if control and not is_supported_charge_hold_control(member):\n        return False\n'''
          new = '''    control = member.weapon.get("control") or {}\n    if control and not (\n        is_supported_charge_hold_control(member)\n        or is_supported_charge_reload_cancel_control(member)\n    ):\n        return False\n'''
          if old not in s:
              raise SystemExit('score control point changed')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          for path in (
              Path('fast_engine/tests/test_damage_full_charge_hit_charge_speed.py'),
              Path('fast_engine/tests/test_damage_stat_applied_charge_speed.py'),
          ):
              text = path.read_text(encoding='utf-8')
              needle = 'self.assertEqual(cadence, 63)'
              if needle not in text:
                  raise SystemExit(f'frontier expectation changed: {path}')
              path.write_text(text.replace(needle, 'self.assertEqual(cadence, 59)', 1), encoding='utf-8')
          PY
      - name: Add permanent regression
        run: |
          cat > fast_engine/tests/test_damage_charge_reload_cancel_control.py <<'PY'
          from __future__ import annotations

          from types import SimpleNamespace
          import unittest

          from context import snapshot, spec
          from fast_engine.engine.burst import BurstPolicy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.engine.weapon import is_supported_charge_reload_cancel_control


          class ChargeReloadCancelControlTests(unittest.TestCase):
              @staticmethod
              def _member(control, *, fire_mode='charge', is_clip=False):
                  return SimpleNamespace(
                      weapon={
                          'fire_mode': fire_mode,
                          'is_clip': is_clip,
                          'control': control,
                      }
                  )

              def test_only_exact_pure_charge_cancel_on_full_shape_is_owned(self):
                  self.assertTrue(
                      is_supported_charge_reload_cancel_control(
                          self._member({'reload': {'cancel_on_full': True}})
                      )
                  )
                  for control in (
                      {'reload': {'cancel_on_full': False}},
                      {'reload': {'cancel_on_full': True, 'lead': 0.1}},
                      {'reload': {'cancel_on_full': True}, 'hold': {'policy': 'own_full_burst'}},
                  ):
                      self.assertFalse(
                          is_supported_charge_reload_cancel_control(self._member(control))
                      )
                  self.assertFalse(
                      is_supported_charge_reload_cancel_control(
                          self._member({'reload': {'cancel_on_full': True}}, fire_mode='auto')
                      )
                  )
                  self.assertFalse(
                      is_supported_charge_reload_cancel_control(
                          self._member({'reload': {'cancel_on_full': True}}, is_clip=True)
                      )
                  )

              @staticmethod
              def _public_runtime():
                  entry = snapshot.SQUADS['레이드_볼륨']
                  moris_squad = spec.build_squad(list(entry['members']))
                  compiled = compile_moris_squad(moris_squad)
                  actor = next(i for i, member in enumerate(compiled.members) if member.name == '홍련 : 흑영')
                  runtime = BurstRuntime(
                      compiled,
                      BurstPolicy(duration=8.0, first_burst_time=30.0),
                      EnemyStaticProfile(defense=0.0, duration=8.0),
                  )
                  runtime.weapons.actors = tuple(sorted(set(runtime.weapons.actors) | {actor}))
                  runtime.start(duration=8.0)
                  return runtime, actor

              def test_full_refill_cancels_active_reload_and_partial_refill_does_not(self):
                  runtime, actor = self._public_runtime()
                  state = runtime.weapons._states[actor]
                  full = runtime.weapons._full_ammo(actor, 0.1)
                  state.ammo = 0
                  state.phase = 'reloading'
                  state.phase_end = 2.0
                  old_generation = state.generation

                  self.assertTrue(
                      runtime.weapons.apply_ammo_charge(
                          'ammo_charge_flat', (actor,), float(full), 0.1
                      )
                  )
                  self.assertEqual(state.ammo, full)
                  self.assertEqual(state.phase, 'charging')
                  self.assertGreater(state.generation, old_generation)
                  self.assertLess(state.phase_end, 2.0)

                  runtime, actor = self._public_runtime()
                  state = runtime.weapons._states[actor]
                  full = runtime.weapons._full_ammo(actor, 0.1)
                  state.ammo = 0
                  state.phase = 'reloading'
                  state.phase_end = 2.0
                  self.assertTrue(
                      runtime.weapons.apply_ammo_charge(
                          'ammo_charge_flat', (actor,), float(max(1, full - 1)), 0.1
                      )
                  )
                  self.assertLess(state.ammo, full)
                  self.assertEqual(state.phase, 'reloading')

              def test_public_frontier_keeps_scarlet_ammo_charge_fail_closed(self):
                  volume = compile_moris_squad(
                      spec.build_squad(list(snapshot.SQUADS['레이드_볼륨']['members']))
                  )
                  self.assertEqual(
                      static_score_blockers(volume),
                      ('cadence:홍련 : 흑영:화무십일홍 · 수라 2:ammo_charge_pct',),
                  )

                  squad4 = compile_moris_squad(
                      spec.build_squad(list(snapshot.SQUADS['스쿼드4']['members']))
                  )
                  blockers = static_score_blockers(squad4)
                  self.assertNotIn('control:홍련 : 흑영', blockers)
                  self.assertIn('weapon_change:목단:정정당당 승부다!', blockers)
                  self.assertIn(
                      'cadence:홍련 : 흑영:화무십일홍 · 수라 2:ammo_charge_pct',
                      blockers,
                  )


          if __name__ == '__main__':
              unittest.main()
          PY
      - name: Focused regression
        run: |
          python -m unittest -q fast_engine.tests.test_damage_charge_reload_cancel_control
          python -m unittest -q fast_engine.tests.test_damage_dynamic_ammo_charge fast_engine.tests.test_damage_dynamic_charge_scoring fast_engine.tests.test_damage_dynamic_reload_scoring fast_engine.tests.test_damage_charge_hold_control
      - name: Full Fast damage regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_damage*.py'
      - name: Verify exact public frontier
        run: |
          python - <<'PY'
          from collections import Counter
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          rows=[]; seen=set()
          for name, case in snapshot.SQUADS.items():
              if str(name).startswith('지그_'):
                  continue
              members=tuple(str(x) for x in case['members'])
              if len(members)!=5 or any(x.startswith('test_') for x in members) or members in seen:
                  continue
              seen.add(members)
              blockers=tuple(static_score_blockers(compile_moris_squad(spec.build_squad(list(members)))))
              rows.append((str(name), blockers))
          fam=Counter(b.split(':',1)[0] for _, bs in rows for b in bs)
          expected={
              'cadence':59,
              'skill_state_delivery':43,
              'normal_delivery':41,
              'skill_damage':27,
              'weapon_change':12,
              'normal_state':7,
              'control':4,
              'periodic_grid':1,
          }
          actual=dict(fam)
          print('ACCOUNT',len(rows),'CERTIFIED',sum(not bs for _,bs in rows))
          print('FAMILIES',sorted(fam.items(),key=lambda x:(-x[1],x[0])))
          if len(rows)!=23 or sum(not bs for _,bs in rows)!=2 or actual!=expected:
              raise SystemExit('public accounting changed unexpectedly')
          volume=next(bs for name,bs in rows if name=='레이드_볼륨')
          squad4=next(bs for name,bs in rows if name=='스쿼드4')
          print('VOLUME',volume)
          print('SQUAD4',squad4)
          if volume != ('cadence:홍련 : 흑영:화무십일홍 · 수라 2:ammo_charge_pct',):
              raise SystemExit('Volume boundary changed')
          if len(squad4)!=4 or 'control:홍련 : 흑영' in squad4:
              raise SystemExit('Squad4 boundary changed')
          PY
      - name: Commit production slice
        run: |
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add fast_engine/engine/weapon.py fast_engine/engine/dynamic_weapon.py fast_engine/engine/score.py \
            fast_engine/tests/test_damage_charge_reload_cancel_control.py \
            fast_engine/tests/test_damage_full_charge_hit_charge_speed.py \
            fast_engine/tests/test_damage_stat_applied_charge_speed.py
          git diff --cached --check
          git commit -m "Fast: support charge reload cancel-on-full"
          git push origin HEAD:fast-engine-phase2-20260901
