name: tmp-close-remove-mutator-hole

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-close-remove-mutator-hole.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Add dependency-aware remove_named_buff blocker
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('fast_engine/engine/score.py')
          t = p.read_text(encoding='utf-8')
          anchor = '''def static_normal_score_blockers(squad: CompiledSquad) -> tuple[str, ...]:\n'''
          helper = '''def _unsupported_remove_named_buff_changes_scored_state(\n    squad: CompiledSquad,\n    effect,\n    damage_sink,\n) -> bool:\n    """Return true only when an unowned remover can alter a state Fast scores.\n\n    This is deliberately dependency-aware rather than a blanket state-mutator\n    ban. Marker-only removals stay out of the blocker set; removals of a direct\n    damage state that Fast otherwise accepts must fail closed until their\n    mutation semantics are owned.\n    """\n\n    if (effect.stat or "") != "remove_named_buff" or effect.effect_type != "instant":\n        return False\n    if _is_patternless_unreachable(effect):\n        return False\n    if damage_sink.supports_state_operation(effect):\n        return False\n    if (\n        TriggerDispatcher._self_stack_remove_shape_supported(effect)\n        and TriggerDispatcher._stack_reach_source_shape_supported(squad, effect)\n    ):\n        return False\n\n    name = effect.parameters.get("target_effect")\n    if not isinstance(name, str) or not name:\n        return False\n    providers = tuple(\n        provider\n        for provider in squad.effects\n        if provider.effect_id != effect.effect_id and provider.name == name\n    )\n    if not providers:\n        return False\n\n    mutator_enemy = effect.target_spec.mode.value == "enemy"\n    mutator_targets = set(_possible_ally_targets(squad, effect))\n    for provider in providers:\n        if provider.effect_type != "buff":\n            continue\n        if (provider.stat or "") not in DIRECT_DAMAGE_STATE_STATS:\n            continue\n        if not (\n            _direct_damage_buff_score_supported(squad, provider)\n            or _is_score_safe_fixed_periodic(provider)\n        ):\n            continue\n        provider_enemy = provider.target_spec.mode.value == "enemy"\n        if mutator_enemy or provider_enemy:\n            if mutator_enemy and provider_enemy:\n                return True\n            continue\n        provider_targets = set(_possible_ally_targets(squad, provider))\n        if mutator_targets & provider_targets:\n            return True\n    return False\n\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('static blocker anchor changed')
          t = t.replace(anchor, helper + anchor, 1)

          old = '''    damage_sink = SimpleDamageScoreSink(\n        squad, EnemyStaticProfile(defense=0.0, duration=1.0)\n    )\n    for effect in squad.effects:\n'''
          new = '''    damage_sink = SimpleDamageScoreSink(\n        squad, EnemyStaticProfile(defense=0.0, duration=1.0)\n    )\n    for effect in squad.effects:\n        if _unsupported_remove_named_buff_changes_scored_state(\n            squad, effect, damage_sink\n        ):\n            owner = squad.members[effect.actor].name\n            blockers.append(\n                f"normal_state:{owner}:{effect.name or 'remove_named_buff'}:remove_named_buff"\n            )\n\n    for effect in squad.effects:\n'''
          if t.count(old) != 1:
              raise SystemExit('static_score damage sink anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('fast_engine/tests/test_damage_false_supported_guards.py')
          t = p.read_text(encoding='utf-8')
          old = '''    def test_unowned_full_burst_conditional_passive_fails_closed(self):\n        squad = _compiled([_conditional_passive(\n            "AUDIT conditional", "atk_pct", "during_full_burst"\n        )])\n        blockers = static_score_blockers(squad)\n        self.assertIn("normal_delivery:라피:AUDIT conditional:atk_pct", blockers)\n        self.assertIn("skill_state_delivery:라피:AUDIT conditional:atk_pct", blockers)\n'''
          new = old + '''\n    def test_unowned_remove_of_scored_buff_fails_closed(self):\n        provider = {\n            "source": "skill1", "type": "buff", "name": "AUDIT state",\n            "stat": "atk_pct", "fixed_value": 100.0,\n            "polarity": "beneficial", "target": "self", "duration": -1.0,\n            "trigger": {"timing": ["battle_start"], "condition": []},\n        }\n        remover = {\n            "source": "skill1", "type": "instant", "name": "AUDIT remove",\n            "stat": "remove_named_buff", "target": "self",\n            "target_effect": "AUDIT state",\n            "trigger": {"timing": ["full_burst_start"], "condition": []},\n        }\n        blockers = static_score_blockers(_compiled([provider, remover]))\n        self.assertIn(\n            "normal_state:라피:AUDIT remove:remove_named_buff", blockers\n        )\n'''
          if t.count(old) != 1:
              raise SystemExit('false-supported insertion anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused adversarial regression
        run: python -m unittest fast_engine.tests.test_damage_false_supported_guards
      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Public dependency regression and frontier
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus

          unique={}
          for members,source in _source_corpus(): unique.setdefault(tuple(members),source)
          family=Counter(); rows=[]
          for members,source in unique.items():
              blockers=static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              rows.append((source,blockers))
              for b in blockers: family[b.split(':',1)[0]] += 1
          certified=sum(not b for _,b in rows)
          print('FRONTIER',len(unique),'CERTIFIED',certified,'FAMILIES',dict(family))
          delta=next(b for source,b in rows if source=='레이드_델타')
          red=next(b for source,b in rows if source=='레이드_레드후드퀀시')
          miranda=next(b for source,b in rows if source=='컨트롤_미란다미하라')
          print('DELTA',delta)
          print('RED',red)
          print('MIRANDA',miranda)
          assert any('리틀 머메이드:터진 거품 3:remove_named_buff' in b for b in delta), delta
          assert red == (), red
          assert miranda == (), miranda
          assert len(unique)==23 and certified==2
          PY
      - name: Commit mutator guard and clean temporary workflows
        run: |
          rm -f .github/workflows/tmp-audit-mutator-dependencies.yml
          rm -f .github/workflows/tmp-close-remove-mutator-hole.yml
          git diff --check
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fast: fail closed on scored-state removers"
          git push origin HEAD:fast-engine-phase2-20260901
