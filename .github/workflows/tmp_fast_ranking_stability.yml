name: Fast ranking stability tmp
on:
  push:
    branches: [fast-engine-phase2-20260901]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Two-team common-scenario ranking grid
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          TEAM_NAMES = ('컨트롤_미란다미하라', '레이드_레드후드퀀시')
          DURATIONS = (30.0, 60.0, 90.0, 180.0)
          DEFENSES = (0.0, 31784.0, 60000.0)
          built = {}
          for name in TEAM_NAMES:
              members = list(snapshot.SQUADS[name]['members'])
              squad = spec.build_squad(members)
              compiled = compile_moris_squad(squad)
              blockers = tuple(dict.fromkeys(static_score_blockers(compiled)))
              print('TEAM', name, 'BLOCKERS', blockers)
              if blockers:
                  raise SystemExit(f'certified team regressed: {name}: {blockers}')
              built[name] = (squad, compiled)

          rows = []
          for duration in DURATIONS:
              for defense in DEFENSES:
                  scores = {}
                  for name in TEAM_NAMES:
                      squad, compiled = built[name]
                      cfg = spec.build_config(squad, {
                          'duration': duration,
                          'first_burst_time': 3.0,
                          'rng_mode': 'expected',
                      })
                      enemy = dict(DEFAULT_ENEMY)
                      enemy['def'] = defense
                      moris = simulate(squad, config=cfg, enemy=enemy, seed=42, verbose=False)
                      policy = compile_burst_policy(squad, compiled, cfg)
                      fast = score_static_squad(
                          compiled,
                          policy,
                          EnemyStaticProfile(defense=defense, duration=duration),
                      )
                      if fast.unsupported:
                          raise SystemExit(f'runtime gap: {name}: {fast.unsupported}')
                      scores[name] = (float(moris.squad_total), float(fast.squad_total))
                  a, b = TEAM_NAMES
                  ma, fa = scores[a]
                  mb, fb = scores[b]
                  md = ma - mb
                  fd = fa - fb
                  agree = (md == 0 and fd == 0) or (md > 0) == (fd > 0)
                  margin_m = md / max(abs(ma), abs(mb), 1.0)
                  margin_f = fd / max(abs(fa), abs(fb), 1.0)
                  rows.append((duration, defense, agree, margin_m, margin_f, ma, mb, fa, fb))
                  print(
                      'SCENARIO',
                      f'duration={duration:.0f}', f'def={defense:.0f}',
                      'AGREE', int(agree),
                      'MORIS_MARGIN', f'{margin_m:.9f}',
                      'FAST_MARGIN', f'{margin_f:.9f}',
                      'MORIS_A', f'{ma:.3f}', 'MORIS_B', f'{mb:.3f}',
                      'FAST_A', f'{fa:.3f}', 'FAST_B', f'{fb:.3f}',
                  )

          agrees = sum(int(row[2]) for row in rows)
          moris_signs = {0 if abs(row[3]) < 1e-12 else (1 if row[3] > 0 else -1) for row in rows}
          fast_signs = {0 if abs(row[4]) < 1e-12 else (1 if row[4] > 0 else -1) for row in rows}
          closest_m = min(rows, key=lambda row: abs(row[3]))
          closest_f = min(rows, key=lambda row: abs(row[4]))
          print('SUMMARY', 'agree', agrees, 'total', len(rows), 'accuracy', agrees / len(rows))
          print('MORIS_SIGNS', sorted(moris_signs), 'FAST_SIGNS', sorted(fast_signs))
          print('CLOSEST_MORIS', closest_m[:5])
          print('CLOSEST_FAST', closest_f[:5])
          PY
