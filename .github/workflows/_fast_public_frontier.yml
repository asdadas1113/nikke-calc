name: Fast Frika chorus producer diagnostics

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: [.github/workflows/_fast_public_frontier.yml]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Locate chorus producer
        run: |
          python - <<'PY'
          from context.snapshot import SQUADS
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher

          names = next(row['members'] for key, row in SQUADS.items() if key == '레이드_레드후드퀀시')
          squad = compile_moris_squad(build_squad(list(names)))
          print('MEMBERS', list(names))
          for effect in squad.effects:
              trigger_text = ' '.join((r.event_key or '') + ' ' + (r.raw or '') for r in effect.triggers)
              param_text = repr(effect.parameters)
              if '떼창' not in (effect.name or '') and '떼창' not in trigger_text and '떼창' not in param_text:
                  continue
              owner = squad.members[effect.actor].name
              print('=== MATCH ===')
              print('OWNER', owner, 'ID', effect.effect_id, 'NAME', effect.name)
              print('TYPE', effect.effect_type, 'STAT', effect.stat, 'VALUE', effect.value, 'DURATION', effect.duration)
              print('TARGET', effect.target, 'PARAM', effect.parameters)
              print('TRIGGERS', [(r.raw, r.event_key, getattr(r.mode, 'value', str(r.mode)), r.threshold, r.interval) for r in effect.triggers])
              print('CONDS', [repr(r) for r in effect.condition_rules])
              print('CAP', effect.capability.disposition.value, effect.capability.blockers)
              print('EXEC', TriggerDispatcher.is_executable_effect(effect))

          print('=== RAW CHARACTER DATA MATCHES ===')
          import pathlib
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in {'.py','.json','.md'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if '떼창' not in text:
                  continue
              print('FILE', p)
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if '떼창' in line:
                      lo=max(0,i-3); hi=min(len(lines),i+4)
                      for j in range(lo,hi): print(f'{j+1}: {lines[j]}')
                      print('---')
          PY
