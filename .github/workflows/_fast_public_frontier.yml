name: Fast Frika named-event diagnostics

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: [.github/workflows/_fast_public_frontier.yml]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Frika chain and Moris event semantics
        run: |
          python - <<'PY'
          from context.snapshot import SQUADS
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher

          names = next(row['members'] for key, row in SQUADS.items() if key == '레이드_레드후드퀀시')
          squad = compile_moris_squad(build_squad(list(names)))
          for effect in squad.effects:
              owner = squad.members[effect.actor].name
              if owner != '프리카':
                  continue
              print('=== FRIKA ===')
              print('ID', effect.effect_id, 'NAME', effect.name, 'TYPE', effect.effect_type, 'STAT', effect.stat)
              print('VALUE', effect.value, 'DURATION', effect.duration, 'TARGET', effect.target)
              print('PARAM', effect.parameters)
              print('TRIGGERS', [(r.raw, r.event_key, getattr(r.mode, 'value', str(r.mode)), r.threshold, r.interval) for r in effect.triggers])
              print('CONDS', [repr(r) for r in effect.condition_rules])
              print('CAP', effect.capability.disposition.value, effect.capability.blockers)
              print('EXEC', TriggerDispatcher.is_executable_effect(effect))
          print('=== SOURCE GREP ===')
          import pathlib
          for root in ['calculator', 'fast_engine']:
              for p in pathlib.Path(root).rglob('*.py'):
                  text = p.read_text(encoding='utf-8')
                  for needle in ['notify_event', 'event:', 'effect.name', 'named_event']:
                      if needle in text and ('notify_event' in text or 'effect.name' in text or 'named_event' in text):
                          lines = text.splitlines()
                          hits = [(i+1, line.strip()) for i, line in enumerate(lines) if needle in line]
                          if hits:
                              print('FILE', p, 'NEEDLE', needle)
                              for hit in hits[:20]: print(' ', hit)
          PY
