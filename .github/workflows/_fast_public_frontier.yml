name: Fast blocker diagnostics

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: [.github/workflows/_fast_public_frontier.yml]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose top blocker gates
        run: |
          python - <<'PY'
          from context.snapshot import SQUADS
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import (
              _possible_ally_targets,
              _reload_recipient_score_safe,
              _charge_actor_score_safe,
              _rapid_actor_score_safe,
              _is_dynamic_reload_score_supported,
              _is_dynamic_charge_score_supported,
              _actor_has_live_max_ammo_mutation,
              static_score_blockers,
          )

          targets = [
              ("프리바티", "EX 매거진 2"),
              ("프리바티", "EX 매거진 3"),
              ("마스트 : 로망틱 메이드", "파이레츠 스피릿 2"),
              ("에이다", "특수 개조"),
          ]

          def rule_view(rule):
              return {
                  "event_key": rule.event_key,
                  "mode": getattr(rule.mode, "value", str(rule.mode)),
                  "threshold": rule.threshold,
                  "interval": rule.interval,
                  "trigger_count_reducible": rule.trigger_count_reducible,
              }

          seen = set()
          for squad_name, row in SQUADS.items():
              if squad_name.startswith("지그_"):
                  continue
              members = list(row.get("members") or ())
              if len(members) != 5:
                  continue
              if not any(owner in members for owner, _ in targets):
                  continue
              squad = compile_moris_squad(build_squad(members))
              for owner, effect_name in targets:
                  if owner not in members:
                      continue
                  effects = [e for e in squad.effects if squad.members[e.actor].name == owner and e.name == effect_name]
                  for effect in effects:
                      key = (owner, effect_name, effect.stat, str(effect.target), str(effect.triggers), str(effect.condition_rules), str(effect.parameters))
                      if key in seen:
                          continue
                      seen.add(key)
                      print("=== EFFECT ===")
                      print("OWNER", owner)
                      print("NAME", effect.name)
                      print("STAT", effect.stat)
                      print("TYPE", effect.effect_type)
                      print("VALUE", effect.value)
                      print("DURATION", effect.duration)
                      print("TARGET", effect.target)
                      print("TARGET_MODE", effect.target_spec.mode.value)
                      print("PARAMETERS", effect.parameters)
                      print("TRIGGERS", [rule_view(r) for r in effect.triggers])
                      print("CONDITIONS", [getattr(r.mode, "value", str(r.mode)) for r in effect.condition_rules])
                      print("EXECUTABLE", TriggerDispatcher.is_executable_effect(effect))
                      recipients = _possible_ally_targets(squad, effect)
                      print("RECIPIENTS", [(i, squad.members[i].name, squad.members[i].weapon.get("fire_mode"), bool(squad.members[i].weapon.get("control")), bool(squad.members[i].weapon.get("is_clip"))) for i in recipients])
                      if effect.stat == "reload_speed_pct":
                          print("RELOAD_SUPPORTED", _is_dynamic_reload_score_supported(squad, effect))
                          for i in recipients:
                              print("  RECIPIENT", squad.members[i].name,
                                    "reload_safe=", _reload_recipient_score_safe(squad, i),
                                    "rapid_safe=", _rapid_actor_score_safe(squad, i),
                                    "charge_safe=", _charge_actor_score_safe(squad, i),
                                    "live_max_ammo=", _actor_has_live_max_ammo_mutation(squad, i))
                      elif effect.stat == "charge_speed_pct":
                          print("CHARGE_SUPPORTED", _is_dynamic_charge_score_supported(squad, effect))
                          for i in range(len(squad.members)):
                              if squad.members[i].weapon.get("fire_mode") == "charge":
                                  print("  CHARGE_ACTOR", squad.members[i].name,
                                        "safe=", _charge_actor_score_safe(squad, i),
                                        "control=", bool(squad.members[i].weapon.get("control")))
                      elif effect.stat in {"max_ammo_pct", "max_ammo_flat"}:
                          for i in recipients:
                              print("  MAX_RECIPIENT", squad.members[i].name,
                                    "rapid_safe=", _rapid_actor_score_safe(squad, i),
                                    "charge_safe=", _charge_actor_score_safe(squad, i),
                                    "live_max_ammo=", _actor_has_live_max_ammo_mutation(squad, i))
                      print("SQUAD_EXAMPLE", squad_name)
                      print("BLOCKERS", static_score_blockers(squad))
          PY
