name: Fast named-buff event patch

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: [.github/workflows/_fast_public_frontier.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply named-buff bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('fast_engine/engine/effects.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    def has_stat(self, target: int, stat: str, *, now: float) -> bool:\n'''
          methods = '''    def group_active(\n        self,\n        effect_id: int,\n        targets: Iterable[int],\n        *,\n        now: float,\n    ) -> bool:\n        \"\"\"Return whether this exact Moris target cohort is already active.\"\"\"\n\n        cohort = self._cohort(targets)\n        if not cohort:\n            return False\n        return any(\n            (active := self._active.get((int(effect_id), target, cohort))) is not None\n            and active.active(now)\n            for target in cohort\n        )\n\n    def extend_named_states(\n        self,\n        targets: Iterable[int],\n        name: str,\n        delta: float,\n        *,\n        now: float,\n        scheduler: EventScheduler,\n    ) -> tuple[int, ...]:\n        \"\"\"Extend finite active ``name``/``name N`` states by one sparse boundary.\"\"\"\n\n        selected = frozenset(int(target) for target in targets)\n        amount = float(delta)\n        if not selected or not name or amount <= 0.0:\n            return ()\n        prefix = name + \" \"\n        changed: list[int] = []\n        touched: set[int] = set()\n        for active in tuple(self._active.values()):\n            if active.target not in selected or not active.active(now):\n                continue\n            effect = self._effects[active.effect_id]\n            effect_name = effect.name or \"\"\n            if effect_name != name and not effect_name.startswith(prefix):\n                continue\n            if active.expires_at == inf:\n                continue\n            if effect.parameters.get(\"duration_bullets\") is not None:\n                raise NotImplementedError(\n                    \"Fast named duration extension over bullet lifetime not certified\"\n                )\n            active.expires_at += amount\n            active.generation = self._next_generation()\n            scheduler.schedule(\n                active.expires_at,\n                EventKind.STATE_EXPIRE,\n                actor=active.target,\n                payload=EffectExpiryToken(\n                    active.effect_id,\n                    active.target,\n                    active.cohort,\n                    active.generation,\n                ),\n            )\n            changed.append(active.effect_id)\n            touched.add(active.target)\n        for target in touched:\n            self.state.touch(target, StateDomain.EFFECT)\n        return tuple(changed)\n\n'''
          assert anchor in s
          s = s.replace(anchor, methods + anchor, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('fast_engine/engine/damage_policy.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if rule.event_key in _SAFE_EVENT_KEYS:\n        return True\n    if rule.event_key and rule.event_key.startswith(\"burst_enter:\"):\n'''
          new = '''    if rule.event_key in _SAFE_EVENT_KEYS:\n        return True\n    if (\n        rule.mode is TriggerMode.EVENT\n        and rule.event_key\n        and rule.event_key.startswith(\"event:\")\n        and not rule.event_key.startswith(\"event:state_end:\")\n    ):\n        # Runtime can represent a named-buff activation signal. Score\n        # certification separately proves that a concrete executable provider\n        # exists, so external events such as heal_received remain fail-closed.\n        return True\n    if rule.event_key and rule.event_key.startswith(\"burst_enter:\"):\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('fast_engine/engine/dispatcher.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '''        \"_unsafe_gauge_families\", \"_strict_score_delivery\", \"_ammo_charge_sink\",\n        \"_force_reload_sink\",\n''',
              '''        \"_unsafe_gauge_families\", \"_strict_score_delivery\", \"_ammo_charge_sink\",\n        \"_force_reload_sink\", \"_named_event_names_needed\",\n''',
              1,
          )
          s = s.replace(
              '''        \"charge_time_flat\",\n    })\n''',
              '''        \"charge_time_flat\",\n        \"named_buff_duration_extend\",\n    })\n''',
              1,
          )
          old = '''        self._force_reload_sink: Callable[[tuple[int, ...], float], bool] | None = None\n\n        unsafe_gauges: set[tuple[int, str]] = set()\n'''
          new = '''        self._force_reload_sink: Callable[[tuple[int, ...], float], bool] | None = None\n        self._named_event_names_needed = frozenset(\n            (rule.event_key or \"\")[len(\"event:\"):]\n            for effect in self._effect_table\n            for rule in effect.triggers\n            if self._is_generic_named_event_key(rule.event_key or \"\")\n        )\n\n        unsafe_gauges: set[tuple[int, str]] = set()\n'''
          assert old in s
          s = s.replace(old, new, 1)

          anchor = '''    @staticmethod\n    def is_executable_effect(effect: \"CompiledEffect\") -> bool:\n'''
          methods = '''    _NAMED_EVENT_EXEMPT = frozenset({\n        \"event:enemy_spawn\",\n        \"event:target_spawn\",\n        \"event:ally_burst_cast\",\n        \"event:shield_applied\",\n    })\n\n    @classmethod\n    def _is_generic_named_event_key(cls, key: str) -> bool:\n        return (\n            key.startswith(\"event:\")\n            and not key.startswith(\"event:state_end:\")\n            and key not in cls._NAMED_EVENT_EXEMPT\n        )\n\n    @classmethod\n    def _named_event_keys(cls, effect: \"CompiledEffect\") -> tuple[str, ...]:\n        return tuple(\n            rule.event_key or \"\"\n            for rule in effect.triggers\n            if cls._is_generic_named_event_key(rule.event_key or \"\")\n        )\n\n    @classmethod\n    def _named_event_control_shape_supported(cls, effect: \"CompiledEffect\") -> bool:\n        return (\n            effect.capability.disposition is CapabilityDisposition.PLANNED\n            and effect.effect_type == \"instant\"\n            and (effect.stat or \"\") == \"burst_cooldown_reduce\"\n            and effect.value is not None\n            and effect.target_spec.runtime_supported\n            and all(rule.is_runtime_supported for rule in effect.condition_rules)\n            and bool(effect.triggers)\n            and all(\n                rule.mode is TriggerMode.EVENT\n                and cls._is_generic_named_event_key(rule.event_key or \"\")\n                for rule in effect.triggers\n            )\n        )\n\n    @classmethod\n    def _named_duration_extend_shape_supported(cls, effect: \"CompiledEffect\") -> bool:\n        target_effect = effect.parameters.get(\"target_effect\")\n        return (\n            effect.capability.disposition is CapabilityDisposition.PLANNED\n            and effect.effect_type == \"instant\"\n            and (effect.stat or \"\") == \"named_buff_duration_extend\"\n            and effect.value is not None\n            and float(effect.value) > 0.0\n            and isinstance(target_effect, str)\n            and bool(target_effect)\n            and set(effect.parameters) == {\"target_effect\"}\n            and target_scope_is_static(effect.target_spec)\n            and effect.target_spec.runtime_supported\n            and all(rule.is_runtime_supported for rule in effect.condition_rules)\n            and bool(effect.triggers)\n            and all(\n                rule.mode is TriggerMode.EVENT\n                and cls._is_generic_named_event_key(rule.event_key or \"\")\n                for rule in effect.triggers\n            )\n        )\n\n'''
          assert anchor in s
          s = s.replace(anchor, methods + anchor, 1)

          old = '''        stat = effect.stat or \"\"\n        if stat in TriggerDispatcher._AUXILIARY_STATS:\n'''
          new = '''        stat = effect.stat or \"\"\n        if (\n            TriggerDispatcher._named_event_control_shape_supported(effect)\n            or TriggerDispatcher._named_duration_extend_shape_supported(effect)\n        ):\n            return True\n        if stat in TriggerDispatcher._AUXILIARY_STATS:\n'''
          assert old in s
          s = s.replace(old, new, 1)

          anchor = '''    def is_runtime_executable_effect(self, effect: \"CompiledEffect\") -> bool:\n'''
          method = '''    def _named_event_source_runtime_safe(self, effect: \"CompiledEffect\") -> bool:\n        keys = self._named_event_keys(effect)\n        if not keys:\n            return True\n        for key in keys:\n            name = key[len(\"event:\"):]\n            providers = tuple(\n                provider\n                for provider in self._effect_table\n                if provider.effect_id != effect.effect_id\n                and provider.effect_type == \"buff\"\n                and provider.name == name\n            )\n            if not providers:\n                return False\n            for provider in providers:\n                if self._named_event_keys(provider):\n                    return False\n                if provider.parameters.get(\"event_scope\") not in (None, \"\", \"squad\", \"recipients\"):\n                    return False\n                if not provider.target_spec.runtime_supported:\n                    return False\n                if not self.is_executable_effect(provider):\n                    return False\n        return True\n\n'''
          assert anchor in s
          s = s.replace(anchor, method + anchor, 1)

          old = '''        if self.is_executable_effect(effect):\n            return self._bullet_lifetime_runtime_safe(effect)\n'''
          new = '''        if self.is_executable_effect(effect):\n            if not self._named_event_source_runtime_safe(effect):\n                return False\n            return self._bullet_lifetime_runtime_safe(effect)\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    def can_activate_effect(self, effect: \"CompiledEffect\") -> bool:\n        return self.is_runtime_executable_effect(effect) or self._is_state_dependency(effect)\n'''
          new = '''    def can_activate_effect(self, effect: \"CompiledEffect\") -> bool:\n        if self.is_runtime_executable_effect(effect):\n            return True\n        return self._is_state_dependency(effect) and self._named_event_source_runtime_safe(effect)\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            elif stat == \"force_reload\":\n                if self._force_reload_sink is None or any(target == ENEMY for target in targets):\n                    return False\n                actor_targets = tuple(int(target) for target in targets)\n                if not self._force_reload_sink(actor_targets, now):\n                    return False\n            elif stat in self._GAUGE_STATS:\n'''
          new = '''            elif stat == \"force_reload\":\n                if self._force_reload_sink is None or any(target == ENEMY for target in targets):\n                    return False\n                actor_targets = tuple(int(target) for target in targets)\n                if not self._force_reload_sink(actor_targets, now):\n                    return False\n            elif stat == \"named_buff_duration_extend\":\n                if any(target == ENEMY for target in targets):\n                    return False\n                target_effect = effect.parameters.get(\"target_effect\")\n                if not isinstance(target_effect, str) or not target_effect:\n                    return False\n                self.effects.extend_named_states(\n                    tuple(int(target) for target in targets),\n                    target_effect,\n                    value,\n                    now=now,\n                    scheduler=self.scheduler,\n                )\n            elif stat in self._GAUGE_STATS:\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        elif effect.effect_type == \"buff\":\n            if stat in self._SHIELD_STATS and any(target == ENEMY for target in targets):\n                return False\n            self.effects.activate_group(effect, targets, now, self.scheduler)\n            if stat in self._SHIELD_STATS:\n'''
          new = '''        elif effect.effect_type == \"buff\":\n            if stat in self._SHIELD_STATS and any(target == ENEMY for target in targets):\n                return False\n            was_active = self.effects.group_active(effect.effect_id, targets, now=now)\n            activated_group = self.effects.activate_group(effect, targets, now, self.scheduler)\n            max_stack = effect.max_stack if effect.max_stack is not None else 1.0\n            if (\n                activated_group\n                and effect.name\n                and effect.name in self._named_event_names_needed\n                and (not was_active or float(max_stack) != 1.0)\n            ):\n                from .burst import BurstSignal\n                if effect.parameters.get(\"event_scope\") == \"recipients\":\n                    audience = tuple(int(target) for target in targets if target != ENEMY)\n                else:\n                    audience = tuple(range(len(self.squad.members)))\n                for observer in audience:\n                    self.dispatch(BurstSignal(now, f\"event:{effect.name}\", observer, observer))\n            if stat in self._SHIELD_STATS:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('fast_engine/engine/score.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''def _direct_damage_buff_score_supported(squad: CompiledSquad, effect) -> bool:\n'''
          helper = '''def _named_buff_event_dependency_score_safe(squad: CompiledSquad, effect) -> bool:\n    keys = TriggerDispatcher._named_event_keys(effect)\n    if not keys:\n        return True\n    for key in keys:\n        name = key[len(\"event:\"):]\n        providers = tuple(\n            provider\n            for provider in squad.effects\n            if provider.effect_id != effect.effect_id\n            and provider.effect_type == \"buff\"\n            and provider.name == name\n        )\n        if not providers:\n            return False\n        for provider in providers:\n            if TriggerDispatcher._named_event_keys(provider):\n                return False\n            if provider.parameters.get(\"event_scope\") not in (None, \"\", \"squad\", \"recipients\"):\n                return False\n            if not provider.target_spec.runtime_supported:\n                return False\n            if not TriggerDispatcher.is_executable_effect(provider):\n                return False\n    return True\n\n\n'''
          assert anchor in s
          s = s.replace(anchor, helper + anchor, 1)
          old = '''    if _uses_shield_runtime_semantics(effect) and not _shield_runtime_dependency_score_safe(squad, effect):\n        return False\n    if effect.parameters.get(\"duration_bullets\") is None:\n'''
          new = '''    if _uses_shield_runtime_semantics(effect) and not _shield_runtime_dependency_score_safe(squad, effect):\n        return False\n    if not _named_buff_event_dependency_score_safe(squad, effect):\n        return False\n    if effect.parameters.get(\"duration_bullets\") is None:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          test_b64 = ''
          Path('fast_engine/tests/test_named_buff_event_runtime.py').write_bytes(base64.b64decode(test_b64))

          for src in [
              'fast_engine/engine/effects.py',
              'fast_engine/engine/damage_policy.py',
              'fast_engine/engine/dispatcher.py',
              'fast_engine/engine/score.py',
              'fast_engine/tests/test_named_buff_event_runtime.py',
          ]:
              compile(Path(src).read_text(encoding='utf-8'), src, 'exec')
          PY
      - name: Run focused and Fast suites
        run: |
          python -m unittest fast_engine.tests.test_named_buff_event_runtime
          python -m unittest fast_engine.tests.test_damage_shield_runtime
          python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Commit implementation and remove helper
        shell: bash
        run: |
          rm .github/workflows/_fast_public_frontier.yml
          git config user.name "fast-engine-bot"
          git config user.email "fast-engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "impl: bridge deterministic named buff events"
          git push origin HEAD:fast-engine-phase2-20260901
