name: tmp-phase-guard-ab

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  phase-guard-ab:
    if: ${{ !contains(github.event.head_commit.message, '[skip-phase-guard-ab]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run scheduler phase A/B matrix
        run: |
          set -u
          REPORT=fast_engine/research/tmp_phase_guard_ab_report.txt
          : > "$REPORT"

          reset_runtime() {
            git checkout "$GITHUB_SHA" -- \
              fast_engine/engine/scheduler.py \
              fast_engine/engine/dynamic_reload.py \
              fast_engine/engine/dynamic_rapid.py
          }

          run_variant() {
            name="$1"
            echo "===== VARIANT: $name =====" | tee -a "$REPORT"
            set +e
            PYTHONPATH=. python fast_engine/research/tmp_validate_asuka_mg_v2.py >> "$REPORT" 2>&1
            asuka_rc=$?
            python -m unittest \
              fast_engine.tests.test_damage_dynamic_reload_scoring \
              fast_engine.tests.test_damage_dynamic_mg_warmup \
              fast_engine.tests.test_damage_moris_frame_timing \
              fast_engine.tests.test_damage_rapid_cover_control \
              >> "$REPORT" 2>&1
            focused_rc=$?
            set -e
            echo "RESULT variant=$name asuka_rc=$asuka_rc focused_rc=$focused_rc" | tee -a "$REPORT"
            echo | tee -a "$REPORT"
          }

          reset_runtime
          run_variant baseline

          reset_runtime
          PYTHONPATH=. python fast_engine/research/tmp_apply_phase_monotonic_scheduler.py
          python -m py_compile fast_engine/engine/scheduler.py
          run_variant phase_guard_only

          reset_runtime
          PYTHONPATH=. python fast_engine/research/tmp_apply_mg_v2.py
          run_variant mg_v2_only

          reset_runtime
          PYTHONPATH=. python fast_engine/research/tmp_apply_phase_monotonic_scheduler.py
          PYTHONPATH=. python fast_engine/research/tmp_apply_mg_v2.py
          python -m py_compile \
            fast_engine/engine/scheduler.py \
            fast_engine/engine/dynamic_reload.py \
            fast_engine/engine/dynamic_rapid.py
          run_variant phase_guard_plus_mg_v2

          reset_runtime
          git diff --check

      - name: Record A/B report only
        if: always()
        run: |
          git checkout "$GITHUB_SHA" -- \
            fast_engine/engine/scheduler.py \
            fast_engine/engine/dynamic_reload.py \
            fast_engine/engine/dynamic_rapid.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/research/tmp_phase_guard_ab_report.txt
          git commit -m 'tmp: record scheduler phase guard A/B [skip-phase-guard-ab] [skip-expiry-core] [skip-expiry-ab] [skip-mg-gate]'
          git push
