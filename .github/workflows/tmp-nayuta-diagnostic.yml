name: Temporary Nayuta WIP integration

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-nayuta-wip-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Integrate diagnosed helper fixes
        run: python -u .github/tmp_nayuta_integrate.py
      - name: Commit helper integration if changed
        run: |
          if git diff --quiet -- .github/tmp_nayuta_apply.py; then
            echo "No helper change"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/tmp_nayuta_apply.py
          git commit -m "test: integrate Nayuta proof and isolated timing fixes"
          git push origin HEAD:fast-engine-phase2-20260901
