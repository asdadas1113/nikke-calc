name: Temporary Nayuta staged gate

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-nayuta-staged-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staged-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply staged Nayuta implementation
        run: python -u .github/tmp_nayuta_apply.py
      - name: Run focused Nayuta gate
        run: python -m unittest fast_engine.tests.test_damage_nayuta_cross_mode_weapon_change
      - name: Run neighboring weapon regressions
        run: |
          python -m unittest \
            fast_engine.tests.test_damage_moran_weapon_change_lifecycle \
            fast_engine.tests.test_damage_dynamic_reload_scoring \
            fast_engine.tests.test_dynamic_weapon_signals \
            fast_engine.tests.test_dynamic_charge_max_ammo_semantics \
            fast_engine.tests.test_performance_contract
