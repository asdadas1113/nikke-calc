name: Temporary Nayuta frontier A-B

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-nayuta-frontier-ab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontier-ab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Baseline public frontier
        run: |
          python - <<'PY'
          from collections import Counter
          from fast_engine.research.public_blocker_frontier import scan_public_blockers
          r=scan_public_blockers()
          fam=Counter(b.split(':',1)[0] for row in r['rows'] for b in row['blockers'])
          print('BASE_COUNTS',r['team_count'],r['certified_team_count'],r['coverage_gap_count'])
          print('BASE_FAMILIES',sorted(fam.items()))
          for row in r['rows']:
              bs=[b for b in row['blockers'] if '나유타' in b]
              if bs:
                  print('BASE_NAYUTA',row['source_name'],bs)
          PY
      - name: Apply staged Nayuta implementation
        run: python -u .github/tmp_nayuta_apply.py
      - name: Patched public frontier
        run: |
          python - <<'PY'
          from collections import Counter
          from fast_engine.research.public_blocker_frontier import scan_public_blockers
          r=scan_public_blockers()
          fam=Counter(b.split(':',1)[0] for row in r['rows'] for b in row['blockers'])
          print('PATCH_COUNTS',r['team_count'],r['certified_team_count'],r['coverage_gap_count'])
          print('PATCH_FAMILIES',sorted(fam.items()))
          for row in r['rows']:
              bs=[b for b in row['blockers'] if '나유타' in b]
              if bs:
                  print('PATCH_NAYUTA',row['source_name'],bs)
          PY
      - name: Assert intended frontier delta
        run: |
          python - <<'PY'
          from collections import Counter
          from context import snapshot,spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          expected={'스쿼드2','레이드_네온벨벳','레이드_소다'}
          seen=set()
          for name,case in snapshot.SQUADS.items():
              members=tuple(case['members'])
              if '나유타' not in members:
                  continue
              blockers=static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              if not any(b.startswith('weapon_change:나유타:기억 연소') for b in blockers):
                  seen.add(name)
          print('NAYUTA_WEAPON_CHANGE_CLEARED_SOURCE_CASES',sorted(seen))
          assert expected <= seen, (expected,seen)
          PY
