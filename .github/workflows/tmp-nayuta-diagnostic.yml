name: Temporary Nayuta frontier diagnostic

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-nayuta-frontier-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontier-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Locate public frontier audit code
        run: |
          echo '=== blocker/certification references ==='
          grep -RInE 'certified|coverage gaps|blocker family|blockers|unsupported' fast_engine .github --include='*.py' --include='*.yml' --include='*.yaml' | head -n 500
          echo '=== public squad references ==='
          grep -RInE 'snapshot\.SQUADS|unique.*membership|ordered.*membership|source.*24' fast_engine .github --include='*.py' --include='*.yml' --include='*.yaml' | head -n 500
