name: Temporary Nayuta proof diagnostic

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-nayuta-proof-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply staged Nayuta implementation
        run: python -u .github/tmp_nayuta_apply.py
      - name: Correct compiled target proof representation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/engine/score.py')
          s=p.read_text(encoding='utf-8')
          old='''        expected_target=("all_enemies" if stat == "damage" else "same_target")\n        if not (\n            consumer.actor == actor\n            and consumer.effect_type == "damage"\n            and stat in {"damage","bonus_damage"}\n            and stat not in seen\n            and target_mode == expected_target\n'''
          new='''        if not (\n            consumer.actor == actor\n            and consumer.effect_type == "damage"\n            and stat in {"damage","bonus_damage"}\n            and stat not in seen\n            and target_mode == "enemy"\n'''
          if old not in s:
              raise SystemExit('target proof anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Inspect Nayuta live ammo sources
        run: |
          python - <<'PY'
          from context import snapshot,spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import _possible_ally_targets
          squad=compile_moris_squad(spec.build_squad(list(snapshot.SQUADS['스쿼드2']['members'])))
          actor=next(i for i,m in enumerate(squad.members) if m.name=='나유타')
          print('NAYUTA',actor,squad.members[actor].weapon)
          for e in squad.effects:
              if (e.stat or '') not in {'max_ammo_pct','max_ammo_flat','max_ammo_infinite','reload_speed_pct'}:
                  continue
              if actor not in _possible_ally_targets(squad,e):
                  continue
              print('SRC',squad.members[e.actor].name,e.effect_id,e.name,e.effect_type,e.stat,e.value,e.duration,e.target_spec.mode.value,e.target_spec.runtime_supported,
                    [(r.mode.value,r.event_key,r.threshold) for r in e.triggers],
                    [(r.mode.value,r.key,r.value) for r in e.condition_rules],e.parameters,e.capability.disposition.value,e.capability.blockers)
          PY
