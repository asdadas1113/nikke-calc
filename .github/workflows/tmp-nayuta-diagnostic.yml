name: Temporary Nayuta proof diagnostic

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-nayuta-proof-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply staged Nayuta implementation
        run: python -u .github/tmp_nayuta_apply.py
      - name: Correct compiled target proof representation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/engine/score.py')
          s=p.read_text(encoding='utf-8')
          old='''        expected_target=("all_enemies" if stat == "damage" else "same_target")\n        if not (\n            consumer.actor == actor\n            and consumer.effect_type == "damage"\n            and stat in {"damage","bonus_damage"}\n            and stat not in seen\n            and target_mode == expected_target\n'''
          new='''        if not (\n            consumer.actor == actor\n            and consumer.effect_type == "damage"\n            and stat in {"damage","bonus_damage"}\n            and stat not in seen\n            and target_mode == "enemy"\n'''
          if old not in s:
              raise SystemExit('target proof anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify Moris post-expiry normal shots
        run: |
          python - <<'PY'
          from context import snapshot,spec
          from calculator.timeline import simulate
          from calculator.sim_result import _is_normal
          case=snapshot.SQUADS['스쿼드2']
          squad=spec.build_squad(list(case['members']))
          cfg=spec.build_config(squad,{'duration':13.25,'first_burst_time':3.0})
          result=simulate(squad,config=cfg,enemy={'def':0,'code':'','core_px':0,'has_parts':False},seed=42,verbose=True)
          rows=[(h.t,h.skill_name) for h in result.hits if h.caster=='나유타' and _is_normal(h) and h.t>=13.19]
          print('normal_after_13_19',rows)
          assert len(rows)==2,rows
          assert abs(rows[0][0]-13.2)<1e-6,rows
          assert abs(rows[1][0]-13.241666666666667)<1e-6,rows
          PY
