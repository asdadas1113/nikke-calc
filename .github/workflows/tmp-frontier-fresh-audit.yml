name: tmp-frontier-fresh-audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-frontier-fresh-audit.yml

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify current unique-23 frontier
        run: |
          python - <<'PY' > frontier-after.txt
          from collections import Counter
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          rows=[]
          seen=set()
          for name, entry in snapshot.SQUADS.items():
              if name.startswith('지그_'):
                  continue
              members=tuple(entry['members'])
              if len(members) != 5 or any(str(x).startswith('test_') for x in members) or members in seen:
                  continue
              seen.add(members)
              compiled=compile_moris_squad(spec.build_squad(list(members)))
              blockers=tuple(static_score_blockers(compiled))
              rows.append((name,members,blockers))

          fam=Counter(b.split(':',1)[0] for _,_,bs in rows for b in bs)
          print('UNIQUE_COUNT', len(rows))
          print('CERTIFIED_COUNT', sum(not bs for _,_,bs in rows))
          print('FAMILIES', sorted(fam.items(), key=lambda x:(-x[1],x[0])))
          target='normal_delivery:D : 킬러 와이프:캄 스나이핑:pierce_enabled'
          print('D_BLOCKER_PRESENT', any(target in bs for _,_,bs in rows))
          print('TEAMS')
          for name,members,bs in sorted(rows,key=lambda row:(len(row[2]),row[0])):
              print(len(bs), name, members)
          PY
          cat frontier-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-after
          path: frontier-after.txt
          retention-days: 1
