name: tmp-frontier-fresh-audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-frontier-fresh-audit.yml

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Classify current frontier blocker shapes
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          rows = []
          seen = set()
          for source_name, case in snapshot.SQUADS.items():
              if str(source_name).startswith('지그_'):
                  continue
              members = tuple(str(x) for x in case['members'])
              if len(members) != 5 or any(x.startswith('test_') for x in members):
                  continue
              if members in seen:
                  continue
              seen.add(members)
              compiled = compile_moris_squad(spec.build_squad(list(members)))
              blockers = tuple(static_score_blockers(compiled))
              rows.append((str(source_name), members, compiled, blockers))

          out = []
          emit = out.append
          emit(f'UNIQUE_COUNT {len(rows)}')
          emit(f'CERTIFIED_COUNT {sum(1 for _,_,_,b in rows if not b)}')
          fam = Counter(b.split(':', 1)[0] for *_, blockers in rows for b in blockers)
          emit('FAMILIES ' + repr(sorted(fam.items(), key=lambda x: (-x[1], x[0]))))
          emit('BLOCKED_EFFECTS')

          families = {'normal_delivery','skill_state_delivery','skill_damage','normal_state','cadence','periodic_grid','weapon_change'}
          seen_shapes = set()
          for source_name, members, compiled, blockers in rows:
              for blocker in blockers:
                  family = blocker.split(':', 1)[0]
                  if family == 'control':
                      actor_name = blocker.split(':',1)[1]
                      for idx, member in enumerate(compiled.members):
                          if str(getattr(member,'name','')) == actor_name:
                              shape = ('CONTROL', actor_name, repr(member.weapon.get('control')), str(member.weapon.get('fire_mode')), str(member.weapon.get('weapon_type') or member.weapon_type))
                              if shape not in seen_shapes:
                                  seen_shapes.add(shape)
                                  emit('\t'.join(shape))
                      continue
                  if family not in families:
                      continue
                  for effect in compiled.effects:
                      actor = compiled.members[effect.actor]
                      actor_name = str(getattr(actor, 'name', effect.actor))
                      stat = str(effect.stat or '')
                      name = str(effect.name or '')
                      labels = {
                          f'{actor_name}:{name}:{stat}',
                          f'{actor_name}:{name}',
                      }
                      suffix = blocker.split(':',1)[1] if ':' in blocker else blocker
                      if suffix not in labels:
                          continue
                      triggers = tuple((
                          getattr(getattr(r,'mode',None),'value',str(getattr(r,'mode',None))),
                          getattr(r,'event_key',None),
                          getattr(r,'threshold',None),
                          getattr(r,'modulo',None),
                          getattr(r,'trigger_count_reducible',None),
                      ) for r in effect.triggers)
                      conditions = tuple((
                          getattr(getattr(r,'mode',None),'value',str(getattr(r,'mode',None))),
                          getattr(r,'key',None),
                          getattr(r,'value',None),
                      ) for r in effect.condition_rules)
                      target = getattr(effect,'target_spec',None)
                      shape = (
                          family, actor_name, name, stat,
                          str(effect.effect_type),
                          str(getattr(getattr(target,'mode',None),'value',getattr(target,'mode',None))),
                          repr(effect.value), repr(effect.duration), repr(effect.max_stack),
                          repr(triggers), repr(conditions), repr(effect.parameters),
                      )
                      if shape not in seen_shapes:
                          seen_shapes.add(shape)
                          emit('\t'.join(shape))

          Path('frontier-shapes.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-shapes
          path: frontier-shapes.txt
          retention-days: 1
      - name: Confirm diagnostic only
        run: git diff --exit-code
