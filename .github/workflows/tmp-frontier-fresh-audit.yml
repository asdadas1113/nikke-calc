name: tmp-frontier-fresh-audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-frontier-fresh-audit.yml

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build concise unique-23 frontier audit
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          rows = []
          seen = set()
          for source_name, case in snapshot.SQUADS.items():
              if str(source_name).startswith('지그_'):
                  continue
              members = tuple(str(x) for x in case['members'])
              if len(members) != 5 or any(x.startswith('test_') for x in members):
                  continue
              if members in seen:
                  continue
              seen.add(members)
              compiled = compile_moris_squad(spec.build_squad(list(members)))
              blockers = tuple(static_score_blockers(compiled))
              rows.append((len(blockers), str(source_name), members, compiled, blockers))

          lines = []
          emit = lines.append
          emit(f'UNIQUE_COUNT {len(rows)}')
          emit(f'CERTIFIED_COUNT {sum(1 for row in rows if row[0] == 0)}')
          fam = Counter(b.split(':', 1)[0] for row in rows for b in row[4])
          emit('FAMILIES ' + repr(sorted(fam.items(), key=lambda x: (-x[1], x[0]))))
          exact = Counter(b for row in rows for b in row[4])
          emit('REPEATED_EXACT')
          for blocker, count in exact.most_common():
              if count > 1:
                  emit(f'{count}\t{blocker}')

          emit('TEAMS')
          for count, source_name, members, compiled, blockers in sorted(rows, key=lambda x: (x[0], x[1])):
              emit(f'TEAM\t{count}\t{source_name}\t{members!r}')
              for blocker in blockers:
                  emit(f'B\t{blocker}')
              if 0 < count <= 6:
                  for effect in compiled.effects:
                      cap = effect.capability
                      cap_blocks = tuple(getattr(cap, 'blockers', ()) or ())
                      if not cap_blocks:
                          continue
                      actor = effect.actor
                      member = compiled.members[actor]
                      actor_name = getattr(member, 'name', str(actor))
                      triggers = tuple((
                          getattr(getattr(rule, 'mode', None), 'value', str(getattr(rule, 'mode', None))),
                          getattr(rule, 'event_key', None),
                          getattr(rule, 'threshold', None),
                          getattr(rule, 'modulo', None),
                          getattr(rule, 'params', None),
                      ) for rule in effect.triggers)
                      conditions = tuple((
                          getattr(getattr(rule, 'mode', None), 'value', str(getattr(rule, 'mode', None))),
                          getattr(rule, 'key', None),
                          getattr(rule, 'value', None),
                      ) for rule in effect.condition_rules)
                      target = getattr(effect, 'target_spec', None)
                      target_mode = getattr(getattr(target, 'mode', None), 'value', str(getattr(target, 'mode', None)))
                      emit('E\t' + repr({
                          'actor': actor_name,
                          'effect_id': effect.effect_id,
                          'type': effect.effect_type,
                          'stat': effect.stat,
                          'value': effect.value,
                          'duration': effect.duration,
                          'duration_bullets': getattr(effect, 'duration_bullets', None),
                          'max_stack': effect.max_stack,
                          'max_trigger': getattr(effect, 'max_trigger', None),
                          'tick_interval': getattr(effect, 'tick_interval', None),
                          'target': target_mode,
                          'target_runtime': getattr(target, 'runtime_supported', None),
                          'triggers': triggers,
                          'conditions': conditions,
                          'parameters': effect.parameters,
                          'cap_blockers': cap_blocks,
                      }))

          text = '\n'.join(lines) + '\n'
          Path('frontier-audit.txt').write_text(text, encoding='utf-8')
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-audit
          path: frontier-audit.txt
          retention-days: 1
      - name: Confirm diagnostic only
        run: git diff --exit-code
