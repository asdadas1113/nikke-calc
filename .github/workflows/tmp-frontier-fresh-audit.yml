name: tmp-frontier-fresh-audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-frontier-fresh-audit.yml

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch candidate in checkout only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fast_engine/engine/damage_policy.py')
          text = p.read_text(encoding='utf-8')
          needle = '    "event:ally_burst_cast",\n})\n\n\ndef _target_supported'
          replacement = '    "event:ally_burst_cast",\n    "full_charge_hit",\n})\n\n\ndef _target_supported'
          if needle not in text:
              raise SystemExit('candidate insertion point not found')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Probe real D next-bullet lifetime parity
        run: |
          python - <<'PY' | tee full-charge-lifetime-probe.txt
          from unittest.mock import patch
          from calculator.timeline import simulate
          from context import snapshot, spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_policy import is_direct_damage_buff_runtime_supported
          from fast_engine.engine.effects import ActiveEffectStore
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers

          entry = next(v for k, v in snapshot.SQUADS.items() if not k.startswith('지그_') and 'D : 킬러 와이프' in v['members'])
          moris_squad = spec.build_squad(list(entry['members']))
          compiled = compile_moris_squad(moris_squad)
          actor = next(i for i,m in enumerate(compiled.members) if m.name == 'D : 킬러 와이프')
          effect = next(e for e in compiled.members[actor].effects if e.name == '캄 스나이핑')
          print('TEAM', tuple(entry['members']))
          print('ACTOR', actor, compiled.members[actor].weapon)
          print('EFFECT', effect.effect_type, effect.stat, effect.parameters, [(r.mode.value,r.event_key,r.threshold,r.trigger_count_reducible) for r in effect.triggers])
          print('RUNTIME_SUPPORTED', is_direct_damage_buff_runtime_supported(effect))
          before = [b for b in static_score_blockers(compiled) if 'D : 킬러 와이프:캄 스나이핑' in b]
          print('D_BLOCKERS_AFTER_PATCH', before)

          duration = 12.0
          policy = compile_burst_policy(moris_squad, compiled, {'duration': duration, 'rng_mode':'expected'})
          activations=[]
          removals=[]
          original_activate = ActiveEffectStore.activate_group
          original_consume = ActiveEffectStore.consume_dynamic_bullet

          def traced_activate(store, candidate, targets, now, scheduler):
              result = original_activate(store, candidate, targets, now, scheduler)
              if candidate.effect_id == effect.effect_id and result:
                  activations.append(float(now))
              return result

          def traced_consume(store, owner, now, count=1):
              removed = original_consume(store, owner, now=now, count=count)
              if effect.effect_id in removed:
                  removals.append(float(now))
              return removed

          runtime = BurstRuntime(compiled, policy)
          observer = StaticNormalAttackObserver(runtime, duration=duration)
          print('DYNAMIC_CHARGE_ACTORS', observer.dynamic_charge_actors)
          with patch.object(ActiveEffectStore,'activate_group',new=traced_activate), patch.object(ActiveEffectStore,'consume_dynamic_bullet',new=traced_consume):
              runtime.run(duration=duration, score_observer=observer)
          print('FAST_ACTIVATE', activations)
          print('FAST_REMOVE', removals)

          moris = simulate(moris_squad, config={'duration':duration,'rng_mode':'expected'}, verbose=True)
          ma = [float(row.t) for row in moris.log.buff_events if row.name == '캄 스나이핑' and row.kind == 'activate']
          mr = [float(row.t) for row in moris.log.buff_events if row.name == '캄 스나이핑' and row.kind in {'remove','expire','deactivate'}]
          print('MORIS_ACTIVATE', ma)
          print('MORIS_REMOVE', mr)
          if len(activations) != len(ma):
              raise SystemExit(f'activation count mismatch {len(activations)} != {len(ma)}')
          for a,b in zip(activations,ma):
              if abs(a-b) > 1e-9:
                  raise SystemExit(f'activation mismatch {a} != {b}')
          if not removals:
              raise SystemExit('Fast candidate never consumed one-bullet lifetime')
          if any(r <= a + 1e-9 for a,r in zip(activations,removals)):
              raise SystemExit('candidate consumed on triggering shot instead of a later shot')
          if before:
              raise SystemExit('candidate blocker remained after narrow policy patch')
          print('PROBE_OK')
          PY
      - name: Focused regressions
        run: |
          python -m pytest -q \
            fast_engine/tests/test_damage_helm_bullet_lifetime.py \
            fast_engine/tests/test_damage_full_charge_hit_charge_speed.py \
            fast_engine/tests/test_dynamic_weapon_signals.py \
            fast_engine/tests/test_damage_policy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-charge-lifetime-probe
          path: full-charge-lifetime-probe.txt
          retention-days: 1
