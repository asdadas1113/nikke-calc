name: tmp-final-cleanup

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 0
      - name: Record checkpoint and remove diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          items = [
              (Path('fast_engine/research/HANDOFF_FAST_ENGINE_20260904.md'), '## 12. Asuka state-end enemy-stack checkpoint', ''),
              (Path('fast_engine/research/COVERAGE_FRONTIER_CHECKPOINT_20260904.md'), '## 11. 후속 채택 — finite state-end enemy-stack damage', '')
          ]
          for path, marker, payload in items:
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  text = text.rstrip() + base64.b64decode(payload).decode('utf-8') + '\n'
                  path.write_text(text, encoding='utf-8')
          PY
          git ls-files '.github/workflows/tmp-*.yml' 'fast_engine/research/tmp_*.py' -z | xargs -0 -r git rm -f --
          git diff --check
      - name: Commit clean checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: close Asuka state-end coverage checkpoint [skip ci]"
          git fetch origin fast-engine-phase2-20260901
          git rebase origin/fast-engine-phase2-20260901
          git push origin HEAD:fast-engine-phase2-20260901
