name: tmp-asuka-release-validation

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Focused semantic regression
        run: python -m unittest fast_engine.tests.test_damage_state_end_named_stack
      - name: Certified near-tie ranking guard
        run: python -m unittest fast_engine.tests.test_damage_moris_frame_timing
      - name: Public coverage frontier
        run: python -m fast_engine.research.public_blocker_frontier
