name: Fast bullet scope patch once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: enable recipient-scope patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply recipient-scope patch
        run: python -m fast_engine.research._patch_bullet_scope_once
      - name: Run focused tests
        run: |
          python -m unittest fast_engine.tests.test_damage_helm_bullet_lifetime
          python -m unittest fast_engine.tests.test_damage_score fast_engine.tests.test_damage_score_safety
      - name: Commit patch and remove temporary patch files
        run: |
          rm .github/workflows/fast-bullet-scope-patch-once.yml
          rm fast_engine/research/_patch_bullet_scope_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_engine/engine/target_scope.py fast_engine/engine/score.py fast_engine/engine/dispatcher.py fast_engine/tests/test_damage_helm_bullet_lifetime.py .github/workflows/fast-bullet-scope-patch-once.yml fast_engine/research/_patch_bullet_scope_once.py
          git commit -m 'feat: scope bullet lifetime safety to recipients'
          git push origin HEAD:fast-engine-phase2-20260901
