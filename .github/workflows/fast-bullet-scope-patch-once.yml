name: Fast bullet scope patch once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: patch recipient-scoped bullet lifetime safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply generalized recipient-scope patch
        run: |
          python - <<'PY'
          from pathlib import Path

          target_scope = '''from __future__ import annotations

from typing import TYPE_CHECKING

if TYPE_CHECKING:
    from .model import CompiledEffect, CompiledSquad


def possible_ally_targets(
    squad: "CompiledSquad",
    effect: "CompiledEffect",
) -> tuple[int, ...]:
    """Conservative ally recipient set for pre-runtime safety certification.

    Selectors whose membership is immutable from squad metadata are narrowed
    exactly. Dynamic rank/history/state selectors widen to all allies so the
    caller cannot certify a static cadence assumption that may become false
    later in combat.
    """

    mode = effect.target_spec.mode.value
    n = len(squad.members)
    if mode == "self":
        return (effect.actor,)
    if mode == "named_actor":
        return () if effect.target_spec.count is None else (effect.target_spec.count,)
    if mode == "enemy":
        return ()
    if mode == "all_allies":
        return tuple(range(n))
    if mode == "all_allies_excl_self":
        return tuple(i for i in range(n) if i != effect.actor)
    if mode in {"weapon", "weapon_excl_self"}:
        return tuple(
            i
            for i, member in enumerate(squad.members)
            if member.weapon_type == effect.target_spec.arg
            and (mode == "weapon" or i != effect.actor)
        )
    if mode == "character_class":
        aliases = {"공격": "화력형", "방어": "방어형", "지원": "지원형"}
        cls = aliases.get(effect.target_spec.arg or "", effect.target_spec.arg)
        return tuple(
            i for i, member in enumerate(squad.members) if member.character_class == cls
        )
    if mode == "element":
        return tuple(
            i for i, member in enumerate(squad.members) if member.element == effect.target_spec.arg
        )
    if mode == "element_weapon":
        code, weapon = (effect.target_spec.arg or ":").split(":", 1)
        return tuple(
            i
            for i, member in enumerate(squad.members)
            if member.element == code and member.weapon_type == weapon
        )
    if mode == "same_squad":
        group = squad.members[effect.actor].squad_group
        return tuple(
            i
            for i, member in enumerate(squad.members)
            if group and member.squad_group == group
        )
    if mode in {"model_excluded", "unsupported"}:
        return tuple(range(n))
    return tuple(range(n))
'''
          Path('fast_engine/engine/target_scope.py').write_text(target_scope, encoding='utf-8')

          score = Path('fast_engine/engine/score.py')
          text = score.read_text(encoding='utf-8')
          old_import = '''from .shot_blocks import (
    ShotBlockCursor,
    compile_static_shot_blocks,
    static_bullet_lifetime_cadence_safe,
)
from .triggers import TriggerMode
'''
          new_import = '''from .shot_blocks import (
    ShotBlockCursor,
    compile_static_shot_blocks,
    static_bullet_lifetime_cadence_safe,
)
from .target_scope import possible_ally_targets
from .triggers import TriggerMode
'''
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          start = text.index('def _possible_ally_targets(')
          end = text.index('\n\ndef _actor_has_executable_event(', start)
          wrapper = '''def _possible_ally_targets(squad: CompiledSquad, effect) -> tuple[int, ...]:
    return possible_ally_targets(squad, effect)
'''
          text = text[:start] + wrapper + text[end:]

          old_score_gate = '''    return all(
        static_bullet_lifetime_cadence_safe(squad, actor)
        for actor in range(len(squad.members))
    )
'''
          new_score_gate = '''    targets = _possible_ally_targets(squad, effect)
    return bool(targets) and all(
        static_bullet_lifetime_cadence_safe(squad, actor)
        for actor in targets
    )
'''
          assert old_score_gate in text
          text = text.replace(old_score_gate, new_score_gate, 1)
          score.write_text(text, encoding='utf-8')

          dispatcher = Path('fast_engine/engine/dispatcher.py')
          text = dispatcher.read_text(encoding='utf-8')
          old_import = '''from .state import ENEMY, StateStore
from .targets import TargetMode, TargetResolver
from .triggers import TriggerMode
'''
          new_import = '''from .state import ENEMY, StateStore
from .target_scope import possible_ally_targets
from .targets import TargetMode, TargetResolver
from .triggers import TriggerMode
'''
          assert old_import in text
          text = text.replace(old_import, new_import, 1)
          old_dispatch_gate = '''        return all(
            static_bullet_lifetime_cadence_safe(self.squad, actor)
            for actor in range(len(self.squad.members))
        )
'''
          new_dispatch_gate = '''        targets = possible_ally_targets(self.squad, effect)
        return bool(targets) and all(
            static_bullet_lifetime_cadence_safe(self.squad, actor)
            for actor in targets
        )
'''
          assert old_dispatch_gate in text
          text = text.replace(old_dispatch_gate, new_dispatch_gate, 1)
          dispatcher.write_text(text, encoding='utf-8')

          test = Path('fast_engine/tests/test_damage_helm_bullet_lifetime.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'from fast_engine.engine.scheduler import EventKind, EventScheduler\n',
              'from fast_engine.engine.scheduler import EventKind, EventScheduler\nfrom fast_engine.engine.score import static_score_blockers\n',
              1,
          )
          marker = '''    def test_reactivation_resets_ten_shot_generation(self):
'''
          addition = '''    def test_unrelated_control_does_not_poison_self_bullet_lifetime(self):
        squad = build_squad(NAMES)
        compiled = compile_moris_squad(squad)
        policy = compile_burst_policy(
            squad,
            compiled,
            {"duration": 180.0, "first_burst_time": 3.0, "rng_mode": "expected"},
        )
        helm = next(
            e for e in compiled.effects
            if e.actor == 2 and e.name == "이지스 캐논 3" and e.stat == "charge_dmg_mag_pct"
        )
        miranda = next(
            e for e in compiled.effects
            if e.actor == 0 and e.name == "웨이크업! 4" and e.stat == "crit_rate"
        )

        blockers = static_score_blockers(compiled)
        self.assertNotIn(
            "normal_delivery:헬름:이지스 캐논 3:charge_dmg_mag_pct",
            blockers,
        )
        self.assertNotIn(
            "skill_state_delivery:헬름:이지스 캐논 3:charge_dmg_mag_pct",
            blockers,
        )
        self.assertIn(
            "normal_delivery:미란다:웨이크업! 4:crit_rate",
            blockers,
        )

        dispatcher = TriggerDispatcher(
            compiled,
            StateStore.from_compiled_squad(compiled),
            EnemyStaticProfile(defense=31784.0, duration=180.0),
            BurstMachine(compiled, policy),
            EventScheduler(),
        )
        self.assertTrue(dispatcher.is_runtime_executable_effect(helm))
        self.assertFalse(dispatcher.is_runtime_executable_effect(miranda))

'''
          assert marker in text
          text = text.replace(marker, addition + marker, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Run focused tests
        run: |
          python -m unittest fast_engine.tests.test_damage_helm_bullet_lifetime
          python -m unittest fast_engine.tests.test_damage_score fast_engine.tests.test_damage_score_safety
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/fast-bullet-scope-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_engine/engine/target_scope.py fast_engine/engine/score.py fast_engine/engine/dispatcher.py fast_engine/tests/test_damage_helm_bullet_lifetime.py .github/workflows/fast-bullet-scope-patch-once.yml
          git commit -m 'feat: scope bullet lifetime safety to recipients'
          git push origin HEAD:fast-engine-phase2-20260901
