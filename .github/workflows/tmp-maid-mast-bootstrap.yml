name: tmp-maid-mast-bootstrap

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - .github/workflows/tmp-maid-mast-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply embedded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/tmp-maid-mast-patch.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          out = []
          in_raw_file = False
          for line in block.splitlines():
              if in_raw_file:
                  if "''', encoding='utf-8')" in line:
                      out.append(line[10:] if line.startswith('          ') else line)
                      in_raw_file = False
                  else:
                      out.append(line)
                  continue
              normalized = line[10:] if line.startswith('          ') else line
              out.append(normalized)
              if "write_text(r'''" in normalized and "''', encoding='utf-8')" not in normalized:
                  in_raw_file = True
          script = '\n'.join(out) + '\n'

          old = '''        passives = tuple(\n            row for row in squad.members[actor].effects\n            if any(\n                rule.mode is ConditionMode.SELF_STATE and rule.key == provider.name\n                for rule in row.condition_rules\n            )\n        )\n        if len(passives) != 2 or not all(\n            _passive_shape(row, actor=actor, provider_name=provider.name)\n            for row in passives\n        ):\n            continue\n'''
          new = '''        passives = tuple(\n            row for row in squad.members[actor].effects\n            if _passive_shape(row, actor=actor, provider_name=provider.name)\n        )\n        if len(passives) != 2:\n            continue\n'''
          if old not in script:
              raise SystemExit('passive proof transform target not found')
          script = script.replace(old, new, 1)

          old = '''        allowed_condition_ids = {\n            control.effect_id,\n            remover.effect_id,\n            *(row.effect_id for row in passives),\n        }\n        if any(\n            row.effect_id not in allowed_condition_ids\n            and any(rule.key == provider.name for rule in row.condition_rules)\n            for row in effects\n        ):\n            continue\n'''
          new = '''        allowed_condition_ids = {\n            control.effect_id,\n            remover.effect_id,\n            *(row.effect_id for row in passives),\n        }\n        if any(\n            row.effect_id not in allowed_condition_ids\n            and not (\n                row.actor == actor\n                and row.parameters.get("scaling_ref") == provider.name\n                and finite_reference_stack_capture_shape(row)\n            )\n            and any(rule.key == provider.name for rule in row.condition_rules)\n            for row in effects\n        ):\n            continue\n'''
          if old not in script:
              raise SystemExit('condition proof transform target not found')
          script = script.replace(old, new, 1)

          exec(compile(script, '<maid-mast-patch>', 'exec'), {'__name__': '__main__'})

          path = Path('fast_engine/tests/test_damage_maid_mast_hangover_lifecycle.py')
          tests = path.read_text(encoding='utf-8')
          old = '''                policy = compile_burst_policy(\n                    moris, compiled, {'duration': 40.0, 'first_burst_time': 3.0}\n                )\n                runtime = BurstRuntime(\n                    compiled, policy, EnemyStaticProfile(duration=40.0, core_px=0.0)\n                )\n                result = runtime.run(duration=40.0)\n                row = certified_stack3_self_stun_remove_lifecycles(compiled)[0]\n                start = result.full_burst_ends[2]\n                end = runtime.dispatcher.control_block_until(row.actor, start + 1e-6)\n'''
          new = '''                policy = compile_burst_policy(\n                    moris, compiled, {'duration': 90.0, 'first_burst_time': 3.0}\n                )\n                probe = BurstRuntime(\n                    compiled, policy, EnemyStaticProfile(duration=90.0, core_px=0.0)\n                )\n                probe_result = probe.run(duration=90.0)\n                row = certified_stack3_self_stun_remove_lifecycles(compiled)[0]\n                start = probe_result.full_burst_ends[2]\n                runtime = BurstRuntime(\n                    compiled, policy, EnemyStaticProfile(duration=90.0, core_px=0.0)\n                )\n                runtime.run(duration=start + 1e-5)\n                end = runtime.dispatcher.control_block_until(row.actor, start + 1e-6)\n'''
          if old not in tests:
              raise SystemExit('runtime horizon test transform target not found')
          tests = tests.replace(old, new, 1)

          old = '''        policy = compile_burst_policy(moris, compiled, {'duration': 43.0, 'first_burst_time': 3.0})\n        runtime = BurstRuntime(compiled, policy, EnemyStaticProfile(duration=43.0, core_px=0.0))\n        result = runtime.run(duration=43.0)\n        row = certified_stack3_self_stun_remove_lifecycles(compiled)[0]\n        start = result.full_burst_ends[2]\n        self.assertTrue(runtime.dispatcher.effects.has_named_state(row.actor, '숙취', now=42.0))\n        self.assertEqual(runtime.dispatcher.effects.named_stack(row.actor, '취기', now=42.0), 1.0)\n        for passive_id in row.passive_effect_ids:\n            passive = compiled.effects[passive_id]\n            self.assertTrue(any(\n                active.effect_id == passive.effect_id and active.active(42.0)\n                for active in runtime.dispatcher.effects._active.values()\n            ))\n        self.assertAlmostEqual(\n            runtime.dispatcher.control_block_until(row.actor, 42.0),\n            start + 10.0,\n            places=9,\n        )\n'''
          new = '''        policy = compile_burst_policy(moris, compiled, {'duration': 90.0, 'first_burst_time': 3.0})\n        probe = BurstRuntime(compiled, policy, EnemyStaticProfile(duration=90.0, core_px=0.0))\n        probe_result = probe.run(duration=90.0)\n        row = certified_stack3_self_stun_remove_lifecycles(compiled)[0]\n        start = probe_result.full_burst_ends[2]\n        next_b1 = next(\n            t for t, _actor, stage in probe_result.casts\n            if t > start + 1e-9 and stage == '1'\n        )\n        self.assertLess(next_b1, start + 10.0)\n        runtime = BurstRuntime(compiled, policy, EnemyStaticProfile(duration=90.0, core_px=0.0))\n        runtime.run(duration=next_b1 + 1e-5)\n        self.assertTrue(runtime.dispatcher.effects.has_named_state(row.actor, '숙취', now=next_b1))\n        self.assertEqual(runtime.dispatcher.effects.named_stack(row.actor, '취기', now=next_b1), 1.0)\n        for passive_id in row.passive_effect_ids:\n            passive = compiled.effects[passive_id]\n            self.assertTrue(any(\n                active.effect_id == passive.effect_id and active.active(next_b1)\n                for active in runtime.dispatcher.effects._active.values()\n            ))\n        self.assertAlmostEqual(\n            runtime.dispatcher.control_block_until(row.actor, next_b1),\n            start + 10.0,\n            places=9,\n        )\n'''
          if old not in tests:
              raise SystemExit('next B1 horizon test transform target not found')
          tests = tests.replace(old, new, 1)
          path.write_text(tests, encoding='utf-8')
          PY
      - name: Focused Maid Mast tests
        run: |
          python -m unittest \
            fast_engine.tests.test_damage_maid_mast_stack_mutation \
            fast_engine.tests.test_damage_maid_mast_hangover_lifecycle
      - name: Commit production checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/engine fast_engine/tests
          git commit -m "Fast: own Maid Mast hangover lifecycle"
          git push origin HEAD:fast-engine-phase2-20260901
