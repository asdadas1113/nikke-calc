name: Temporary Nayuta lifecycle probe

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

concurrency:
  group: temp-nayuta-lifecycle-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Nayuta cross-mode implementation
        run: python -u .github/tmp_nayuta_apply.py
      - name: Focused Nayuta regression
        run: |
          python -m unittest fast_engine.tests.test_damage_nayuta_cross_mode_weapon_change
          python -m unittest fast_engine.tests.test_damage_moran_weapon_change_lifecycle
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring
          python -m unittest fast_engine.tests.test_dynamic_weapon_signals
          python -m unittest fast_engine.tests.test_dynamic_charge_max_ammo_semantics
          python -m unittest fast_engine.tests.test_performance_contract
      - name: Commit semantic checkpoint
        run: |
          if git diff --quiet -- fast_engine; then
            echo "No semantic changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine
          git commit -m "Fast: own rapid-to-charge skill weapon lifecycle"
          git push origin HEAD:fast-engine-phase2-20260901
