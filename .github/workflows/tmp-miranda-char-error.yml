name: tmp-miranda-char-error
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Character error probe
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          members = ['미란다','브리드 : 사일런트 트랙','헬름','루주','미하라 : 본딩 체인']
          cfg = {'duration':180.0,'first_burst_time':3.0,'rng_mode':'expected'}
          enemy = dict(DEFAULT_ENEMY)
          squad = spec.build_squad(members)
          mcfg = spec.build_config(squad, dict(cfg))
          moris = simulate(squad, config=mcfg, enemy=dict(enemy), seed=42, verbose=False)
          compiled = compile_moris_squad(squad)
          blockers = static_score_blockers(compiled)
          assert not blockers, blockers
          policy = compile_burst_policy(squad, compiled, dict(cfg))
          fast_enemy = EnemyStaticProfile(
              defense=float(enemy.get('def',31784.0)),
              element=enemy.get('code'),
              core_uptime=0.0,
              core_px=float(enemy.get('core_px',0.0) or 0.0),
              duration=policy.duration,
          )
          fast = score_static_squad(compiled, policy, fast_enemy)
          assert not fast.unsupported, fast.unsupported
          print('TEAM', moris.squad_total, fast.squad_total, fast.squad_total/moris.squad_total-1.0)
          print('name\tmoris\tfast\tdelta\trel_error\tmoris_share')
          for i,name in enumerate(members):
              m = float(moris.char_total.get(name,0))
              f = float(fast.char_total[i])
              rel = (f/m-1.0) if m else 0.0
              print(f'{name}\t{m:.0f}\t{f:.6f}\t{f-m:.6f}\t{rel:.8%}\t{m/moris.squad_total:.8%}')
          print('SUM_MORIS', sum(moris.char_total.values()))
          print('SUM_FAST', sum(fast.char_total))
          PY
