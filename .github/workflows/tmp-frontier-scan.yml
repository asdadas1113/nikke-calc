name: tmp coverage frontier scan

on:
  workflow_dispatch:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - .github/workflows/tmp-frontier-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rank unique public gaps by blocker count
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          seen={}
          rows=[]
          for name, case in snapshot.SQUADS.items():
              if str(name).startswith('지그_'):
                  continue
              members=tuple(str(x) for x in case['members'])
              if len(members)!=5 or any(x.startswith('test_') for x in members):
                  continue
              if members in seen:
                  continue
              seen[members]=name
              squad=compile_moris_squad(spec.build_squad(list(members)))
              blockers=tuple(static_score_blockers(squad))
              rows.append((len(blockers),name,members,blockers,squad))

          for n,name,members,blockers,_ in sorted(rows, key=lambda x:(x[0],x[1])):
              print('\nGAP',n,name)
              print(' members',members)
              for b in blockers:
                  print(' ',b)

          shapes=Counter()
          examples=defaultdict(list)
          for _,name,_,blockers,squad in rows:
              blocker_set=set(blockers)
              for effect in squad.effects:
                  owner=squad.members[effect.actor].name
                  stat=effect.stat or ''
                  label=f'{owner}:{effect.name or stat}:{stat}'
                  families=[]
                  if f'normal_delivery:{label}' in blocker_set: families.append('normal_delivery')
                  if f'skill_state_delivery:{label}' in blocker_set: families.append('skill_state_delivery')
                  if not families:
                      continue
                  trig=tuple((r.event_key,r.mode.value,r.threshold,r.trigger_count_reducible) for r in effect.triggers)
                  cond=tuple(r.raw for r in effect.condition_rules)
                  key=(tuple(families),effect.effect_type,stat,effect.target_spec.mode.value,trig,cond,tuple(sorted(effect.parameters.items())))
                  shapes[key]+=1
                  if len(examples[key])<4:
                      examples[key].append((name,owner,effect.name))

          print('\n=== REPEATED DELIVERY SHAPES ===')
          for key,count in shapes.most_common():
              if count<2:
                  continue
              print('COUNT',count,'KEY',key,'EXAMPLES',examples[key])
          PY
