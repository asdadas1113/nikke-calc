name: Optimizer current code export

on:
  push:
    branches:
      - optimizer-debug-localized-ambiguity-20260831

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-debug-localized-ambiguity-20260831
      - name: Pack repository
        run: tar -czf /tmp/nikke-calc-current.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: nikke-calc-current-code
          path: /tmp/nikke-calc-current.tar.gz
          retention-days: 1
