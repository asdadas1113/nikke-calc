name: tmp-little-mermaid-probe
on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-little-mermaid-probe.yml
      - .github/tmp_little_mermaid_patch.py
      - .github/tmp_little_mermaid_fix.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply staged Little Mermaid patch
        run: |
          python .github/tmp_little_mermaid_patch.py
          python .github/tmp_little_mermaid_fix.py
          git diff --check
      - name: Focused semantic contract
        run: |
          python -m unittest -v \
            fast_engine.tests.test_damage_little_mermaid_lifecycle \
            fast_engine.tests.test_damage_charge_reload_cancel_control \
            fast_engine.tests.test_damage_maid_mast_hangover_lifecycle \
            fast_engine.tests.test_dispatch_burst_runtime \
            fast_engine.tests.test_performance_contract
      - name: Full Fast discovery
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Patched frontier audit
        run: |
          python - <<'PY'
          from collections import Counter
          from context import snapshot,spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          source=[]
          for label,row in snapshot.SQUADS.items():
              if str(label).startswith('지그_'): continue
              members=tuple(row.get('members') or ())
              if len(members)!=5 or any(str(x).startswith('test_') for x in members): continue
              source.append((label,members))
          seen=set(); unique=[]
          for label,members in source:
              if members in seen: continue
              seen.add(members); unique.append((label,members))
          certified=[]; cats=Counter()
          for label,members in unique:
              rows=static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              if not rows: certified.append(label)
              for row in rows: cats[row.split(':',1)[0]]+=1
          print('SOURCE',len(source),'UNIQUE',len(unique),'CERTIFIED',certified,'GAPS',len(unique)-len(certified))
          print('CATEGORIES',dict(sorted(cats.items())))
          print('DELTA_BLOCKERS',static_score_blockers(compile_moris_squad(spec.build_squad(list(snapshot.SQUADS['레이드_델타']['members'])))))
          PY
      - name: Promote semantic checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fast_engine/engine/enemy_replacement.py \
            fast_engine/engine/scheduler.py \
            fast_engine/engine/dynamic_reload.py \
            fast_engine/engine/dynamic_rapid.py \
            fast_engine/engine/dynamic_weapon.py \
            fast_engine/engine/dispatcher.py \
            fast_engine/engine/damage_runtime.py \
            fast_engine/engine/score.py \
            fast_engine/engine/burst_runtime.py \
            fast_engine/tests/test_damage_little_mermaid_lifecycle.py
          git diff --cached --check
          git commit -m "Fast: own Little Mermaid replacement and squad-ammo lifecycle"
          git push origin HEAD:fast-engine-phase2-20260901
