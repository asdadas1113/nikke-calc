name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect public bonus-damage blocker shapes
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_events import compile_simple_damage_event, compile_pending_b3_bonus_damage_event
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.research.public_ranking_probe import _source_corpus

          seen_members = set()
          seen_effects = set()
          for members, source_name in _source_corpus():
              if members in seen_members:
                  continue
              seen_members.add(members)
              compiled = compile_moris_squad(spec.build_squad(list(members)))
              sink = SimpleDamageScoreSink(compiled, EnemyStaticProfile(defense=0.0, duration=180.0))
              for effect in compiled.effects:
                  if effect.effect_type != 'damage' or (effect.stat or '') != 'bonus_damage':
                      continue
                  key = (compiled.members[effect.actor].name, effect.name)
                  if key in seen_effects:
                      continue
                  seen_effects.add(key)
                  print('EFFECT|owner=', key[0], '|name=', key[1])
                  print('  source=', effect.source, 'value=', effect.value, 'target=', effect.target)
                  print('  triggers=', [repr(r) for r in effect.triggers])
                  print('  conditions=', [repr(r) for r in effect.condition_rules])
                  print('  params=', repr(effect.parameters), 'duration=', effect.duration)
                  print('  simple=', repr(compile_simple_damage_event(effect, compiled.members[effect.actor])))
                  print('  pending_b3=', repr(compile_pending_b3_bonus_damage_event(effect, compiled.members[effect.actor])))
                  print('  sink_supports=', sink.supports(effect))
          PY
