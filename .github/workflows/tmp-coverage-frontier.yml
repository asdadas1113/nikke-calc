name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch periodic scheduling in workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('fast_engine/engine/burst_runtime.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              'from .dispatcher import TriggerDispatcher\n',
              'from .dispatcher import TriggerDispatcher\nfrom .frame_lattice import moris_observed_tick\n',
              1,
          )
          text=text.replace(
              'class PeriodicTickToken:\n    effect_id: int\n    rule_index: int\n    interval: float\n',
              'class PeriodicTickToken:\n    effect_id: int\n    rule_index: int\n    interval: float\n    nominal_time: float\n',
              1,
          )
          old='''            self.scheduler.schedule(\n                interval,\n                EventKind.PERIODIC_TICK,\n                actor=effect.actor,\n                payload=PeriodicTickToken(\n                    effect.effect_id, indexed.rule_index, interval\n                ),\n            )\n'''
          new='''            observed = moris_observed_tick(interval, horizon=horizon)\n            if observed >= horizon:\n                continue\n            self.scheduler.schedule(\n                observed,\n                EventKind.PERIODIC_TICK,\n                actor=effect.actor,\n                payload=PeriodicTickToken(\n                    effect.effect_id, indexed.rule_index, interval, interval\n                ),\n            )\n'''
          if old not in text: raise SystemExit('initial periodic anchor missing')
          text=text.replace(old,new,1)
          old='''                next_t = event.time + token.interval\n                if next_t < horizon:\n                    self.scheduler.schedule(\n                        next_t,\n                        EventKind.PERIODIC_TICK,\n                        actor=event.actor,\n                        payload=token,\n                    )\n'''
          new='''                next_nominal = token.nominal_time + token.interval\n                if next_nominal < horizon:\n                    next_t = moris_observed_tick(next_nominal, horizon=horizon)\n                    if next_t < horizon:\n                        self.scheduler.schedule(\n                            next_t,\n                            EventKind.PERIODIC_TICK,\n                            actor=event.actor,\n                            payload=PeriodicTickToken(\n                                token.effect_id, token.rule_index, token.interval, next_nominal\n                            ),\n                        )\n'''
          if old not in text: raise SystemExit('recurring periodic anchor missing')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Run existing periodic and timing regressions
        run: |
          PYTHONPATH=. python -m unittest fast_engine.tests.test_periodic_runtime fast_engine.tests.test_damage_moris_frame_timing -v
          python -m py_compile fast_engine/engine/burst_runtime.py
          git diff --check
      - name: Compare Snow White periodic timing after projection
        run: |
          PYTHONPATH=. python - <<'PY'
          from unittest.mock import patch
          from calculator.buff_manager import BuffManager
          from calculator.timeline import simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.triggers import TriggerMode

          names=['미란다','헬름 : 아쿠아마린','스노우 화이트','브리드 : 사일런트 트랙','미하라 : 본딩 체인']
          raw=spec.build_squad(names); squad=compile_moris_squad(raw); sw=names.index('스노우 화이트')
          target=next(e for e in squad.effects if e.actor==sw and e.name=='세븐스 드워프 : V&VI 2')
          original_exec=TriggerDispatcher.is_executable_effect
          def snow_periodic(e):
              return (e.effect_type=='buff' and (e.stat or '')=='crit_rate' and e.target_spec.mode.value=='self'
                      and e.duration is not None and float(e.duration)>0 and e.max_stack in (None,1,1.0)
                      and not e.parameters and len(e.triggers)==1 and e.triggers[0].mode is TriggerMode.PERIODIC
                      and e.triggers[0].interval is not None and float(e.triggers[0].interval)>0
                      and len(e.condition_rules)==1 and e.condition_rules[0].mode.value=='during_full_burst')
          def patched_exec(e): return snow_periodic(e) or original_exec(e)
          fast_rows=[]; original_periodic=TriggerDispatcher.dispatch_periodic
          def traced_periodic(dispatcher,effect_id,rule_index,*,time,context):
              effect=dispatcher._effect_table[effect_id]
              result=original_periodic(dispatcher,effect_id,rule_index,time=time,context=context)
              if effect.effect_id==target.effect_id:
                  active=dispatcher.effects.has_named_state(effect.actor,effect.name,now=time)
                  fast_rows.append((time,dispatcher.burst.phase,active,result.activated_effect_ids))
              return result
          config={'duration':70.0,'first_burst_time':3.0,'rng_mode':'expected'}
          policy=compile_burst_policy(raw,squad,config)
          with patch.object(TriggerDispatcher,'is_executable_effect',new=staticmethod(patched_exec)), patch.object(TriggerDispatcher,'dispatch_periodic',new=traced_periodic):
              fast=BurstRuntime(squad,policy,EnemyStaticProfile(defense=0,duration=70)).run(duration=70)
          print('FAST_ROWS',fast_rows)

          moris_rows=[]; orig_tick=BuffManager.tick
          def snapshot(bm):
              return tuple((ab.activated_at,ab.expires_at) for ab in bm._active if ab.effect.get('name')=='세븐스 드워프 : V&VI 2')
          def traced_tick(bm,t):
              before=snapshot(bm); out=orig_tick(bm,t); after=snapshot(bm)
              if before!=after: moris_rows.append((float(t),before,after))
              return out
          with patch.object(BuffManager,'tick',new=traced_tick):
              simulate(raw,config=config,verbose=True)
          print('MORIS_ROWS',moris_rows)
          PY
