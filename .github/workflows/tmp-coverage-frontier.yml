name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe last-bullet damage delivery
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          import fast_engine.engine.damage_runtime as dr

          names = ['리틀 머메이드', '크라운', '라피 : 레드 후드', '앨리스', '프리바티']
          squad = compile_moris_squad(spec.build_squad(names))

          def report(label):
              sink = dr.SimpleDamageScoreSink(squad, EnemyStaticProfile(defense=0.0, duration=180.0))
              print(label)
              for effect in squad.effects:
                  if squad.members[effect.actor].name != '프리바티' or effect.name not in {'LD 어설트 2', 'LD 어설트 3'}:
                      continue
                  print('EFFECT', effect.name)
                  print(' target_spec=', repr(effect.target_spec))
                  print(' conditions=', [(repr(r), r.is_runtime_supported) for r in effect.condition_rules])
                  print(' supports=', sink.supports(effect))
              return sink

          report('BASE')
          old = dr._SAFE_EVENT_KEYS
          dr._SAFE_EVENT_KEYS = frozenset(set(old) | {'last_bullet'})
          try:
              report('WITH_LAST_BULLET')
          finally:
              dr._SAFE_EVENT_KEYS = old

          print('STATE_PROVIDERS')
          for effect in squad.effects:
              if effect.name == '타겟 지정' or any('타겟 지정' in c for c in effect.conditions):
                  print(repr(effect))
          PY
