name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  asuka-cadence-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Print Asuka cadence and state-chain effects
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          names=['미란다','아스카 : WILLE','브리드 : 사일런트 트랙','헬름','루주']
          squad=compile_moris_squad(spec.build_squad(names))
          for e in squad.members[1].effects:
              print({
                  'id':e.effect_id,'idx':e.actor_effect_index,'name':e.name,
                  'type':e.effect_type,'stat':e.stat,'value':e.value,
                  'duration':e.duration,'max_stack':e.max_stack,'target':e.target,
                  'triggers':[(r.raw,r.event_key,r.mode.value,r.threshold) for r in e.triggers],
                  'conditions':e.conditions,'parameters':e.parameters,
                  'blockers':e.capability.blockers,
              })
          PY
