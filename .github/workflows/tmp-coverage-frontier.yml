name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run marker regressions
        run: |
          PYTHONPATH=. python -m unittest fast_engine.tests.test_statless_named_state_marker fast_engine.tests.test_damage_state_end_force_reload fast_engine.tests.test_named_buff_event_runtime -v
          python -m py_compile fast_engine/engine/dispatcher.py fast_engine/tests/test_statless_named_state_marker.py
          git diff --check
      - name: Scan public coverage frontier
        run: |
          PYTHONPATH=. python -m fast_engine.research.public_blocker_frontier
      - name: Print affected public teams
        run: |
          PYTHONPATH=. python - <<'PY'
          from fast_engine.research.public_blocker_frontier import scan_public_blockers
          report = scan_public_blockers()
          for row in report['rows']:
              if row['source_name'] in {'레이드_미하라에이다','레이드_작열짬'}:
                  print('TEAM',row['source_name'])
                  print('BLOCKERS',row['blockers'])
                  print('UNSUPPORTED',row['unsupported'])
          PY
