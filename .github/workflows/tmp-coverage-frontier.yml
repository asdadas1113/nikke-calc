name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  asuka-stack-drift-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Trace Asuka hit-count stack chronology in Moris and Fast
        run: |
          PYTHONPATH=. python - <<'PY'
          from unittest.mock import patch
          from calculator.buff_manager import BuffManager
          from calculator.timeline import simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.state import ENEMY
          from fast_engine.engine.targets import TargetMode
          from fast_engine.engine.triggers import TriggerMode

          names=['미란다','아스카 : WILLE','브리드 : 사일런트 트랙','헬름','루주']
          raw=spec.build_squad(names); squad=compile_moris_squad(raw)
          asuka=1
          field=next(e for e in squad.effects if e.actor==asuka and e.name=='안티 AT 필드' and e.effect_type=='buff')
          annihilate=next(e for e in squad.effects if e.actor==asuka and e.name=='섬멸' and e.effect_type=='damage')

          def state_end_safe(squad_obj,effect):
              keys=[r.event_key or '' for r in effect.triggers]
              if not keys or any(r.mode is not TriggerMode.EVENT or not k.startswith('event:state_end:') for r,k in zip(effect.triggers,keys)):
                  return False
              for key in keys:
                  n=key[len('event:state_end:'):]
                  ps=[p for p in squad_obj.effects if p.actor==effect.actor and p.effect_id!=effect.effect_id and p.name==n]
                  if len(ps)!=1: return False
                  p=ps[0]
                  if not (p.effect_type=='buff' and p.target_spec.mode is TargetMode.SELF and p.duration is not None
                          and float(p.duration)>=0 and p.parameters.get('duration_bullets') is None
                          and TriggerDispatcher.is_executable_effect(p)):
                      return False
              return True
          def finite_provider(sink,effect,ref,runtime=False):
              ps=[p for p in sink.squad.effects if p.actor==effect.actor and p.name==ref]
              if len(ps)!=1: return None
              p=ps[0]
              ok=(p.effect_type=='buff' and p.target_spec.mode is TargetMode.ENEMY and p.duration is not None
                  and float(p.duration)>0 and p.max_stack is not None and float(p.max_stack)>1 and not p.parameters
                  and all(r.is_runtime_supported for r in p.condition_rules) and TriggerDispatcher.is_executable_effect(p))
              if not ok: return None
              if runtime and sink.runtime is not None and not sink.runtime.dispatcher.can_activate_effect(p): return None
              return p
          od=SimpleDamageScoreSink._delivery_supported
          def td(s,e): return od(s,e) or (e.target_spec.mode is TargetMode.ENEMY and all(r.is_runtime_supported for r in e.condition_rules) and state_end_safe(s.squad,e))
          os=SimpleDamageScoreSink._stack_count_shape_supported
          def ts(s,e,sp): return os(s,e,sp) or finite_provider(s,e,sp.ref) is not None
          ors=SimpleDamageScoreSink._stack_count_runtime_supported
          def trs(s,e):
              if ors(s,e): return True
              sp=s.stack_specs.get(e.effect_id)
              return sp is not None and finite_provider(s,e,sp.ref,runtime=True) is not None
          orr=TriggerDispatcher._enemy_remove_named_state_runtime_supported
          def trr(d,e):
              if orr(d,e): return True
              if not (e.effect_type=='instant' and (e.stat or '')=='remove_named_buff' and e.target_spec.mode is TargetMode.ENEMY
                      and set(e.parameters)=={'target_effect'} and not e.condition_rules and state_end_safe(d.squad,e)): return False
              ref=str(e.parameters.get('target_effect') or '')
              ps=[p for p in d.squad.effects if p.actor==e.actor and p.name==ref]
              if len(ps)!=1: return False
              p=ps[0]
              return (p.effect_type=='buff' and p.target_spec.mode is TargetMode.ENEMY and p.duration is not None
                      and float(p.duration)>0 and p.max_stack is not None and float(p.max_stack)>1 and not p.parameters
                      and TriggerDispatcher.is_executable_effect(p) and d.can_activate_effect(p))

          duration=100.0; cfg={'duration':duration,'first_burst_time':3.0,'rng_mode':'expected'}

          moris_rows=[]; moris_state=[]
          oa=BuffManager._activate; on=BuffManager.notify
          def mstack(bm):
              return max((ab.stack for ab in bm._active if ab.caster=='아스카 : WILLE' and ab.effect.get('name')=='안티 AT 필드'),default=0)
          def ma(bm,eff,caster,t,*args,**kwargs):
              watch=caster=='아스카 : WILLE' and eff.get('name') in {'섬멸 태세','안티 AT 필드','긴급 수복 2','긴급 수복 3','긴급 수복 5','섬멸','섬멸 2'}
              before=mstack(bm) if watch else None
              out=oa(bm,eff,caster,t,*args,**kwargs)
              if watch: moris_rows.append((float(t),'activate',eff.get('name'),before,mstack(bm)))
              return out
          def mn(bm,event,t,caster,**ctx):
              if caster=='아스카 : WILLE' and event in {'burst_cast','event:state_end:섬멸 태세'}:
                  moris_state.append((float(t),event,mstack(bm)))
              return on(bm,event,t,caster,**ctx)
          with patch.object(BuffManager,'_activate',new=ma), patch.object(BuffManager,'notify',new=mn):
              simulate(raw,config=spec.build_config(raw,cfg),verbose=False)

          fast_rows=[]; fast_signals=[]
          fa=TriggerDispatcher._activate; fd=TriggerDispatcher.dispatch
          def fstack(d,now): return d.effects.named_stack(ENEMY,'안티 AT 필드',now=now)
          def f_activate(d,e,*,now,context,conditions_prechecked=False,target_owner_actor=None):
              watch=e.actor==asuka and e.name in {'섬멸 태세','안티 AT 필드','긴급 수복 2','긴급 수복 3','긴급 수복 5','섬멸','섬멸 2'}
              before=fstack(d,now) if watch else None
              out=fa(d,e,now=now,context=context,conditions_prechecked=conditions_prechecked,target_owner_actor=target_owner_actor)
              if watch: fast_rows.append((float(now),'activate',e.name,before,fstack(d,now),out))
              return out
          def f_dispatch(d,signal,*,context=None):
              if signal.owner_actor==asuka and signal.event_key in {'burst_cast','hit_count','event:state_end:섬멸 태세'}:
                  fast_signals.append((float(signal.time),signal.event_key,int(getattr(signal,'count_increment',1)),fstack(d,float(signal.time))))
              if context is None:
                  return fd(d,signal)
              return fd(d,signal,context=context)

          profile=EnemyStaticProfile(defense=0,duration=duration)
          with (patch.object(SimpleDamageScoreSink,'_delivery_supported',new=td),
                patch.object(SimpleDamageScoreSink,'_stack_count_shape_supported',new=ts),
                patch.object(SimpleDamageScoreSink,'_stack_count_runtime_supported',new=trs),
                patch.object(TriggerDispatcher,'_enemy_remove_named_state_runtime_supported',new=trr),
                patch.object(TriggerDispatcher,'_activate',new=f_activate),
                patch.object(TriggerDispatcher,'dispatch',new=f_dispatch)):
              sink=SimpleDamageScoreSink(squad,profile)
              policy=compile_burst_policy(raw,squad,cfg)
              rt=BurstRuntime(squad,policy,profile,damage_sink=sink)
              rt.run(duration=duration)

          print('MORIS_STATE')
          for x in moris_state: print(x)
          print('MORIS_WATCH')
          for x in moris_rows: print(x)
          print('FAST_SIGNALS')
          for x in fast_signals: print(x)
          print('FAST_WATCH')
          for x in fast_rows: print(x)
          PY
