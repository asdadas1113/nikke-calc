name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare Snow White periodic activation timing
        run: |
          PYTHONPATH=. python - <<'PY'
          from unittest.mock import patch
          from calculator.buff_manager import BuffManager
          from calculator.timeline import simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.triggers import TriggerMode

          names=['미란다','헬름 : 아쿠아마린','스노우 화이트','브리드 : 사일런트 트랙','미하라 : 본딩 체인']
          raw=spec.build_squad(names)
          squad=compile_moris_squad(raw)
          sw=names.index('스노우 화이트')
          target=next(e for e in squad.effects if e.actor==sw and e.name=='세븐스 드워프 : V&VI 2')
          original_exec=TriggerDispatcher.is_executable_effect

          def snow_periodic(e):
              return (
                  e.effect_type=='buff'
                  and (e.stat or '')=='crit_rate'
                  and e.target_spec.mode.value=='self'
                  and e.duration is not None and float(e.duration)>0.0
                  and e.max_stack in (None,1,1.0)
                  and not e.parameters
                  and len(e.triggers)==1
                  and e.triggers[0].mode is TriggerMode.PERIODIC
                  and e.triggers[0].interval is not None and float(e.triggers[0].interval)>0.0
                  and len(e.condition_rules)==1
                  and e.condition_rules[0].mode.value=='during_full_burst'
              )
          def patched_exec(e):
              return snow_periodic(e) or original_exec(e)

          # Fast trace: periodic scheduler plus live full-burst condition.
          fast_rows=[]
          original_periodic=TriggerDispatcher.dispatch_periodic
          def traced_periodic(dispatcher,effect_id,rule_index,*,time,context):
              effect=dispatcher._effect_table[effect_id]
              before=dispatcher.effects.has_named_state(effect.actor,effect.name,now=time)
              result=original_periodic(dispatcher,effect_id,rule_index,time=time,context=context)
              after=dispatcher.effects.has_named_state(effect.actor,effect.name,now=time)
              if effect.effect_id==target.effect_id:
                  fast_rows.append((round(time,9),dispatcher.burst.phase,before,after,result.activated_effect_ids,result.skipped_unsupported))
              return result

          config={'duration':70.0,'first_burst_time':3.0,'rng_mode':'expected'}
          policy=compile_burst_policy(raw,squad,config)
          with patch.object(TriggerDispatcher,'is_executable_effect',new=staticmethod(patched_exec)), patch.object(TriggerDispatcher,'dispatch_periodic',new=traced_periodic):
              fast_runtime=BurstRuntime(squad,policy,EnemyStaticProfile(defense=0.0,duration=70.0))
              fast_result=fast_runtime.run(duration=70.0)
          print('FAST_FB',fast_result.full_burst_starts,fast_result.full_burst_ends)
          print('FAST_PERIODIC',fast_rows)

          # Moris trace: detect target effect entering/leaving active set around tick().
          moris_rows=[]
          orig_tick=BuffManager.tick
          def snapshot(bm):
              rows=[]
              for ab in bm._active:
                  eff=ab.effect
                  if eff.get('name')=='세븐스 드워프 : V&VI 2':
                      rows.append((ab.activated_at,ab.expires_at,getattr(ab,'stacks',None),eff.get('value')))
              return tuple(rows)
          def traced_tick(bm,t):
              before=snapshot(bm)
              out=orig_tick(bm,t)
              after=snapshot(bm)
              if before!=after:
                  moris_rows.append((round(float(t),9),before,after,bool(bm.battle_state.get('full_burst'))))
              return out
          with patch.object(BuffManager,'tick',new=traced_tick):
              moris=simulate(raw,config=config,verbose=True)
          moris_fb=[row.t for row in moris.log.burst_log if row.event=='full_burst 시작']
          moris_end=[row.t for row in moris.log.burst_log if row.event=='full_burst 종료']
          print('MORIS_FB',moris_fb,moris_end)
          print('MORIS_STATE_CHANGES',moris_rows)
          PY
