name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Crown and Little Mermaid blockers
        run: |
          PYTHONPATH=. python - <<'PY'
          from dataclasses import asdict
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_events import compile_simple_damage_event
          from fast_engine.engine.damage_policy import is_direct_damage_buff_runtime_supported
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import (
              _direct_damage_buff_score_supported,
              _named_buff_event_dependency_score_safe,
              _shield_runtime_dependency_score_safe,
              _uses_shield_runtime_semantics,
          )

          names = ['리틀 머메이드', '크라운', '라피 : 레드 후드', '미하라 : 본딩 체인', '헬름']
          squad = spec.build_squad(names)
          compiled = compile_moris_squad(squad)
          sink = SimpleDamageScoreSink(compiled, EnemyStaticProfile(defense=0.0, duration=180.0))

          for effect in compiled.effects:
              if effect.name not in {'로얄 에타이어 4', '거품 난사'}:
                  continue
              owner = compiled.members[effect.actor].name
              print(f'EFFECT|owner={owner}|name={effect.name}|type={effect.effect_type}|stat={effect.stat}|value={effect.value}|duration={effect.duration}|target={effect.target}')
              print('  parameters=', effect.parameters)
              print('  triggers=', [(r.raw, r.event_key, r.mode.value, r.threshold, r.is_runtime_supported) for r in effect.triggers])
              print('  conditions=', [(r.raw, r.mode.value, r.is_runtime_supported) for r in effect.condition_rules])
              print('  target_spec=', effect.target_spec)
              print('  capability=', effect.capability)
              if effect.name == '로얄 에타이어 4':
                  print('  direct_runtime=', is_direct_damage_buff_runtime_supported(effect))
                  print('  uses_shield=', _uses_shield_runtime_semantics(effect))
                  print('  shield_safe=', _shield_runtime_dependency_score_safe(compiled, effect))
                  print('  named_event_safe=', _named_buff_event_dependency_score_safe(compiled, effect))
                  print('  score_supported=', _direct_damage_buff_score_supported(compiled, effect))
              else:
                  print('  simple_spec=', compile_simple_damage_event(effect, compiled.members[effect.actor]))
                  print('  delivery_supported=', sink._delivery_supported(effect))
                  print('  sink_supports=', sink.supports(effect))
                  print('  unsupported_id=', effect.effect_id in sink.unsupported_effect_ids)
          PY
