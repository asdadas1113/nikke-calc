name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run last-bullet focused tests
        run: |
          PYTHONPATH=. python -m unittest \
            fast_engine.tests.test_damage_last_bullet \
            fast_engine.tests.test_dynamic_last_bullet_boundary -v
      - name: Scan public blockers after last-bullet support
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          from fast_engine.research.public_blocker_frontier import scan_public_blockers, _conceptual_key

          report = scan_public_blockers()
          unique = {}
          for row in report['rows']:
              unique.setdefault(tuple(row['members']), row)
          gaps = []
          privaty = Counter()
          for members, row in unique.items():
              raw = tuple(row['blockers']) + tuple('unsupported:' + x for x in row['unsupported'])
              concepts = tuple(dict.fromkeys(_conceptual_key(x) for x in raw))
              if concepts:
                  gaps.append(row['source_name'])
              for item in concepts:
                  if '프리바티:LD 어설트' in item:
                      privaty[item] += 1
          print('SUMMARY', len(report['rows']), len(unique), len(unique)-len(gaps), len(gaps))
          print('PRIVATY_LD_BLOCKERS', dict(privaty))
          for row in report['rows']:
              if row['source_name'] in {'스쿼드2','레이드_라피앨리스','레이드_아니스서머메이든','레이드_트리나홍련'}:
                  print('TEAM', row['source_name'])
                  print(' blockers=', row['blockers'])
                  print(' unsupported=', row['unsupported'])
          PY
