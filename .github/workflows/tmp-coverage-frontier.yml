name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  inspect-near-certified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Crown and Little Mermaid blocker shapes
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.damage_policy import is_direct_damage_buff_runtime_supported

          members=tuple(snapshot.SQUADS['스쿼드1']['members'])
          raw=spec.build_squad(list(members))
          squad=compile_moris_squad(raw)
          print('MEMBERS',members)
          print('BLOCKERS',static_score_blockers(squad))

          wanted={
              ('크라운','로얄 에타이어 4'),
              ('리틀 머메이드','거품 난사'),
          }
          for effect in squad.effects:
              owner=squad.members[effect.actor].name
              if (owner,effect.name) not in wanted:
                  continue
              print('\nEFFECT',owner)
              print({
                  'id':effect.effect_id,
                  'name':effect.name,
                  'type':effect.effect_type,
                  'stat':effect.stat,
                  'value':effect.value,
                  'target':effect.target,
                  'target_mode':effect.target_spec.mode.value,
                  'duration':effect.duration,
                  'tick_interval':effect.tick_interval,
                  'max_stack':effect.max_stack,
                  'max_trigger':effect.max_trigger,
                  'polarity':effect.polarity,
                  'parameters':dict(effect.parameters),
                  'conditions':[(r.mode.value,r.key,r.value,r.raw) for r in effect.condition_rules],
                  'triggers':[(r.mode.value,r.event_key,r.threshold,r.interval,r.raw) for r in effect.triggers],
                  'capability':effect.capability.disposition.value,
                  'capability_blockers':tuple(effect.capability.blockers),
                  'direct_damage_runtime':is_direct_damage_buff_runtime_supported(effect),
                  'dispatcher_executable':TriggerDispatcher.is_executable_effect(effect),
              })

          print('\nCROWN_ALL')
          for effect in squad.effects:
              if squad.members[effect.actor].name!='크라운': continue
              print(effect.effect_id,effect.name,effect.effect_type,effect.stat,effect.target,
                    [(r.mode.value,r.event_key,r.raw) for r in effect.triggers],
                    [(r.mode.value,r.key,r.value,r.raw) for r in effect.condition_rules],
                    dict(effect.parameters),effect.duration,effect.max_stack,
                    effect.capability.disposition.value,tuple(effect.capability.blockers))

          print('\nMERMAID_ALL_DAMAGE')
          for effect in squad.effects:
              if squad.members[effect.actor].name!='리틀 머메이드' or effect.effect_type!='damage': continue
              print(effect.effect_id,effect.name,effect.stat,effect.value,effect.target,
                    [(r.mode.value,r.event_key,r.raw) for r in effect.triggers],
                    [(r.mode.value,r.key,r.value,r.raw) for r in effect.condition_rules],
                    dict(effect.parameters),effect.capability.disposition.value,tuple(effect.capability.blockers))
          PY
