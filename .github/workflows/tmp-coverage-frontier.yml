name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  inspect-snow-periodic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Snow White periodic direct-state shape and blockers
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          seen_members=set()
          for source_name, case in snapshot.SQUADS.items():
              members=tuple(str(x) for x in case.get('members', ()))
              if len(members)!=5 or '스노우 화이트' not in members or str(source_name).startswith('지그_'):
                  continue
              if members in seen_members:
                  continue
              seen_members.add(members)
              raw=spec.build_squad(list(members))
              squad=compile_moris_squad(raw)
              actor=members.index('스노우 화이트')
              print('\nTEAM', source_name, members)
              for effect in squad.effects:
                  if effect.actor != actor:
                      continue
                  if any(rule.is_periodic for rule in effect.triggers):
                      print('PERIODIC_EFFECT', {
                          'id':effect.effect_id,
                          'name':effect.name,
                          'type':effect.effect_type,
                          'stat':effect.stat,
                          'value':effect.value,
                          'target':effect.target,
                          'target_mode':effect.target_spec.mode.value,
                          'duration':effect.duration,
                          'max_stack':effect.max_stack,
                          'parameters':dict(effect.parameters),
                          'conditions':[(r.mode.value,r.key,r.value) for r in effect.condition_rules],
                          'triggers':[(r.mode.value,r.event_key,r.interval,r.raw) for r in effect.triggers],
                          'capability':effect.capability.disposition.value,
                          'blockers':tuple(effect.capability.blockers),
                      })
              print('TEAM_BLOCKERS', static_score_blockers(squad))
          PY
