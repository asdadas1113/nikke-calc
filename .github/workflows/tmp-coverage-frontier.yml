name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect alternate coverage candidates
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import (
              _is_dynamic_reload_score_supported,
              _is_dynamic_max_ammo_score_supported,
              _temporary_self_charge_weapon_change_score_supported,
              static_score_blockers,
          )

          candidates = {
              'MOTAN': ['목단', '마스트 : 로망틱 메이드', '홍련 : 흑영', '리버렐리오', '앵커 : 이노센트 메이드'],
              'PRIVATY': ['리틀 머메이드', '크라운', '라피 : 레드 후드', '앨리스', '프리바티'],
          }
          for tag, names in candidates.items():
              print('===', tag, '===')
              compiled = compile_moris_squad(spec.build_squad(names))
              print('BLOCKERS', static_score_blockers(compiled))
              for effect in compiled.effects:
                  owner = compiled.members[effect.actor].name
                  if owner == '목단' and effect.effect_type == 'weapon_change':
                      print('MOTAN_WC|name=', effect.name)
                      print('  effect=', repr(effect))
                      print('  member_weapon=', repr(compiled.members[effect.actor].weapon))
                      print('  temp_charge_safe=', _temporary_self_charge_weapon_change_score_supported(compiled, effect))
                  if owner == '프리바티' and (effect.stat or '') in {'reload_speed_pct', 'max_ammo_pct'}:
                      print('PRIVATY_CADENCE|name=', effect.name, '|stat=', effect.stat)
                      print('  effect=', repr(effect))
                      print('  member_weapon=', repr(compiled.members[effect.actor].weapon))
                      if effect.stat == 'reload_speed_pct':
                          print('  reload_supported=', _is_dynamic_reload_score_supported(compiled, effect))
                      if effect.stat == 'max_ammo_pct':
                          print('  max_ammo_supported=', _is_dynamic_max_ammo_score_supported(compiled, effect))
          PY
