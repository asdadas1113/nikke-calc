name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-coverage-frontier]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scan public blocker frontier
        run: |
          python fast_engine/research/public_blocker_frontier.py
