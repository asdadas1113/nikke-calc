name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  asuka-max-ammo-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Asuka max ammo sources and live values
        run: |
          PYTHONPATH=. python - <<'PY'
          from unittest.mock import patch
          from calculator.timeline import CharState, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.dynamic_reload import DynamicRapidReloadRuntime
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver
          from fast_engine.engine.weapon import WeaponCadenceMachine, compile_static_cadence_modifiers
          from fast_engine.engine.targets import TargetMode
          from fast_engine.engine.triggers import TriggerMode

          names=['미란다','아스카 : WILLE','브리드 : 사일런트 트랙','헬름','루주']
          raw=spec.build_squad(names); squad=compile_moris_squad(raw); asuka=1
          member=squad.members[asuka]
          print('WEAPON',member.weapon)
          print('STATIC_MODS',compile_static_cadence_modifiers(member))
          wm=WeaponCadenceMachine(asuka,member,duration=45.0)
          print('STATIC_FULL_AMMO',wm._full_ammo())
          print('MAX_AMMO_EFFECTS')
          for e in squad.effects:
              if (e.stat or '') in {'max_ammo_pct','max_ammo_flat','max_ammo_infinite'} and asuka in range(len(squad.members)):
                  print(e.effect_id,e.actor,squad.members[e.actor].name,e.name,e.stat,e.value,e.duration,e.max_stack,e.target,e.triggers,e.conditions,e.parameters)

          # Moris value exactly when the second empty reload completes.
          moris=[]
          of=CharState._finish_reload
          def mf(cs,t,bm):
              if cs.name=='아스카 : WILLE' and 34.0 <= float(t) <= 35.0:
                  buffs=bm.get_buffs(cs.name,'__enemy__',t)
                  moris.append(('before',float(t),cs._full_ammo(bm,t),buffs.get('max_ammo_pct'),buffs.get('max_ammo_flat'),(buffs.get('_quant_parts') or {}).get('max_ammo_pct')))
              out=of(cs,t,bm)
              if cs.name=='아스카 : WILLE' and 34.0 <= float(t) <= 35.0:
                  moris.append(('after',float(t),cs.ammo,cs._full_ammo(bm,t)))
              return out
          with patch.object(CharState,'_finish_reload',new=mf):
              simulate(raw,config=spec.build_config(raw,{'duration':39.0,'first_burst_time':3.0,'rng_mode':'expected'}),verbose=False)
          print('MORIS',moris)

          # Fast compile/runtime value at its corresponding second reload completion.
          # We only need normal/cadence runtime, so attach observer to initialize dynamic rapid state.
          raw2=spec.build_squad(names); squad2=compile_moris_squad(raw2)
          cfg={'duration':39.0,'first_burst_time':3.0,'rng_mode':'expected'}
          policy=compile_burst_policy(raw2,squad2,cfg)
          profile=EnemyStaticProfile(defense=0.0,duration=39.0)
          rt=BurstRuntime(squad2,policy,profile)
          # Build a minimal dynamic rapid path by selecting Asuka as score actor directly.
          rows=[]
          def sink(actor,count,t): pass
          rt.weapons.attach_score_block_sink((asuka,),sink)
          orig=DynamicRapidReloadRuntime._finish_nonshot_phase
          def ff(dr,st,tt):
              if st.actor==asuka and st.phase=='reloading' and 34.0 <= float(tt) <= 35.0:
                  vals=[]
                  for stat in ('max_ammo_pct','max_ammo_flat'):
                      vals.append((stat,[(e.name,e.value,a.stacks,a.source_actor,a.target) for e,a in dr.effects.iter_stat(stat,now=tt) if a.target==asuka]))
                  rows.append(('before',float(tt),dr._full_ammo(asuka,float(tt)),vals,dr._signature(asuka,float(tt))))
              out=orig(dr,st,tt)
              if st.actor==asuka and 34.0 <= float(tt) <= 35.0:
                  rows.append(('after',float(tt),st.ammo,dr._full_ammo(asuka,float(tt))))
              return out
          with patch.object(DynamicRapidReloadRuntime,'_finish_nonshot_phase',new=ff):
              rt.run(duration=39.0)
          print('FAST',rows)
          PY
