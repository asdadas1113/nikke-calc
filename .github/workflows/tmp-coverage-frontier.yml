name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect squad ammo consumer semantics
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers

          names = ['리틀 머메이드', '크라운', '라피 : 레드 후드', '미하라 : 본딩 체인', '헬름']
          compiled = compile_moris_squad(spec.build_squad(names))
          sink = SimpleDamageScoreSink(compiled, EnemyStaticProfile(defense=0.0, duration=180.0))
          print('BLOCKERS', static_score_blockers(compiled))
          for effect in compiled.effects:
              if not any(rule.event_key == 'squad_ammo_consume' for rule in effect.triggers):
                  continue
              print('EFFECT', compiled.members[effect.actor].name, repr(effect))
              print('  dispatcher_static_executable=', TriggerDispatcher.is_executable_effect(effect))
              print('  damage_sink_supports=', sink.supports(effect))
              print('  damage_state_supports=', sink.supports_state_operation(effect))
          PY
