name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare Privaty last-bullet damage parity
        run: |
          PYTHONPATH=. python - <<'PY'
          from calculator.timeline import simulate, DEFAULT_ENEMY
          from context import spec
          from fast_engine.engine.burst import BurstPolicy, compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers
          import fast_engine.engine.damage_runtime as dr

          class TrackingSink(dr.SimpleDamageScoreSink):
              __slots__ = ('events',)
              def __init__(self, squad, enemy):
                  super().__init__(squad, enemy)
                  self.events = []
              def _score_spec(self, effect_id, *, now, full_burst):
                  actor = self._effect_actor.get(effect_id)
                  before = None if actor is None else self.char_total[actor]
                  fired = super()._score_spec(effect_id, now=now, full_burst=full_burst)
                  if fired and actor is not None and before is not None:
                      self.events.append((effect_id, float(now), self.char_total[actor] - before))
                  return fired

          def enemy(duration):
              core_px = float(DEFAULT_ENEMY.get('core_px', 0.0) or 0.0)
              return EnemyStaticProfile(
                  defense=float(DEFAULT_ENEMY.get('def', 31784.0)),
                  element=DEFAULT_ENEMY.get('code'),
                  core_uptime=1.0 if core_px > 0 else 0.0,
                  core_px=core_px,
                  duration=duration,
              )

          old = dr._SAFE_EVENT_KEYS
          dr._SAFE_EVENT_KEYS = frozenset(set(old) | {'last_bullet'})
          try:
              # Case A: no burst, isolate unconditional LD Assault 2 over several magazines.
              duration = 35.0
              names = ['프리바티']
              moris_squad = spec.build_squad(names)
              moris = simulate(
                  moris_squad,
                  config={'duration': duration, 'rng_mode': 'expected', 'first_burst_time': duration, 'max_burst_count': 0},
                  enemy=dict(DEFAULT_ENEMY), seed=42, verbose=True,
              )
              compiled = compile_moris_squad(moris_squad, require_five=False)
              ld2 = next(e for e in compiled.effects if e.name == 'LD 어설트 2')
              ld3 = next(e for e in compiled.effects if e.name == 'LD 어설트 3')
              sink = TrackingSink(compiled, enemy(duration))
              print('CASE_A_SUPPORT', sink.supports(ld2), sink.supports(ld3))
              runtime = BurstRuntime(
                  compiled,
                  BurstPolicy(duration=duration, first_burst_time=duration, max_burst_count=0, no_burst_actors=frozenset({0})),
                  enemy(duration), damage_sink=sink,
              )
              runtime.run(duration=duration)
              fast2 = [(t, d) for eid, t, d in sink.events if eid == ld2.effect_id]
              fast3 = [(t, d) for eid, t, d in sink.events if eid == ld3.effect_id]
              moris2 = [(float(h.t), float(h.damage)) for h in moris.hits if h.caster == '프리바티' and h.skill_name == 'LD 어설트 2']
              moris3 = [(float(h.t), float(h.damage)) for h in moris.hits if h.caster == '프리바티' and h.skill_name == 'LD 어설트 3']
              print('CASE_A_COUNTS', len(moris2), len(fast2), len(moris3), len(fast3))
              for i, (m, f) in enumerate(zip(moris2, fast2)):
                  rel = f[1] / m[1] - 1.0 if m[1] else 0.0
                  print(f'CASE_A|{i}|m_t={m[0]:.12f}|f_t={f[0]:.12f}|dt={f[0]-m[0]:+.12f}|m_d={m[1]:.6f}|f_d={f[1]:.6f}|rel={rel:+.8%}')

              # Case B: minimal B1/B2/B3 chain, let Privaty create Target Designation.
              duration = 30.0
              names = ['리타', '아니스', '프리바티']
              moris_squad = spec.build_squad(names)
              cfg = {'duration': duration, 'first_burst_time': 3.0, 'rng_mode': 'expected'}
              moris_cfg = spec.build_config(moris_squad, dict(cfg))
              moris = simulate(moris_squad, config=moris_cfg, enemy=dict(DEFAULT_ENEMY), seed=42, verbose=True)
              compiled = compile_moris_squad(moris_squad, require_five=False)
              policy = compile_burst_policy(moris_squad, compiled, dict(cfg))
              ld2 = next(e for e in compiled.effects if compiled.members[e.actor].name == '프리바티' and e.name == 'LD 어설트 2')
              ld3 = next(e for e in compiled.effects if compiled.members[e.actor].name == '프리바티' and e.name == 'LD 어설트 3')
              sink = TrackingSink(compiled, enemy(duration))
              print('CASE_B_BLOCKERS', static_score_blockers(compiled))
              print('CASE_B_SUPPORT', sink.supports(ld2), sink.supports(ld3))
              runtime = BurstRuntime(compiled, policy, enemy(duration), damage_sink=sink)
              try:
                  observer = StaticNormalAttackObserver(runtime, duration=duration)
                  result = runtime.run(duration=duration, score_observer=observer)
                  observer.finish(events_processed=result.events_processed)
                  print('CASE_B_RUN', 'observer')
              except Exception as exc:
                  print('CASE_B_RUN_ERROR', type(exc).__name__, str(exc))
                  runtime = BurstRuntime(compiled, policy, enemy(duration), damage_sink=sink)
                  runtime.run(duration=duration)
              fast2 = [(t, d) for eid, t, d in sink.events if eid == ld2.effect_id]
              fast3 = [(t, d) for eid, t, d in sink.events if eid == ld3.effect_id]
              moris2 = [(float(h.t), float(h.damage)) for h in moris.hits if h.caster == '프리바티' and h.skill_name == 'LD 어설트 2']
              moris3 = [(float(h.t), float(h.damage)) for h in moris.hits if h.caster == '프리바티' and h.skill_name == 'LD 어설트 3']
              print('CASE_B_COUNTS', len(moris2), len(fast2), len(moris3), len(fast3))
              for label, ms, fs in [('LD2', moris2, fast2), ('LD3', moris3, fast3)]:
                  for i, (m, f) in enumerate(zip(ms, fs)):
                      rel = f[1] / m[1] - 1.0 if m[1] else 0.0
                      print(f'CASE_B_{label}|{i}|m_t={m[0]:.12f}|f_t={f[0]:.12f}|dt={f[0]-m[0]:+.12f}|m_d={m[1]:.6f}|f_d={f[1]:.6f}|rel={rel:+.8%}')
          finally:
              dr._SAFE_EVENT_KEYS = old
          PY
