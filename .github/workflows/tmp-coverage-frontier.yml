name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  trace-crown-mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Trace Moris Crown chain
        run: |
          PYTHONPATH=. python - <<'PY'
          from unittest.mock import patch
          from calculator.buff_manager import BuffManager
          from calculator.timeline import simulate
          from context import snapshot, spec

          members=list(snapshot.SQUADS['스쿼드1']['members'])
          raw=spec.build_squad(members)
          events=[]
          activations=[]
          orig_notify=BuffManager.notify
          orig_activate=BuffManager._activate

          def traced_notify(bm,event,t,caster,**ctx):
              if caster=='크라운' and (
                  event.startswith('stack_reach:릴렉스:')
                  or event=='event:heal_received'
                  or event=='event:state_end:릴렉스'
              ):
                  events.append((round(float(t),9),event))
              return orig_notify(bm,event,t,caster,**ctx)

          def traced_activate(bm,eff,caster,t,*args,**kwargs):
              if caster=='크라운' and eff.get('name') in {
                  '릴렉스','로얄 에타이어','로얄 에타이어 3','로얄 에타이어 4'
              }:
                  before=next((ab.stack for ab in bm._active
                               if ab.caster==caster and ab.effect.get('name')=='릴렉스'),None)
                  out=orig_activate(bm,eff,caster,t,*args,**kwargs)
                  after=next((ab.stack for ab in bm._active
                              if ab.caster==caster and ab.effect.get('name')=='릴렉스'),None)
                  activations.append((round(float(t),9),eff.get('name'),before,after))
                  return out
              return orig_activate(bm,eff,caster,t,*args,**kwargs)

          cfg={'duration':180.0,'first_burst_time':3.0,'rng_mode':'expected'}
          with patch.object(BuffManager,'notify',new=traced_notify), patch.object(BuffManager,'_activate',new=traced_activate):
              result=simulate(raw,config=cfg,verbose=True)

          print('MEMBERS',members)
          print('CHAIN_EVENTS')
          for row in events: print(row)
          print('CHAIN_ACTIVATIONS')
          for row in activations: print(row)
          print('CROWN_BUFF_WINDOWS')
          for ev in result.log.buff_events:
              if getattr(ev,'name',None)=='로얄 에타이어 4': print(ev)
          PY
      - name: Locate existing Fast ammo and sequential primitives
        run: |
          echo '=== squad_ammo_consume ==='
          grep -RIn --exclude-dir=__pycache__ 'squad_ammo_consume' fast_engine || true
          echo '=== sequential_damage ==='
          grep -RIn --exclude-dir=__pycache__ 'sequential_damage' fast_engine || true
          echo '=== sequential_dmg ==='
          grep -RIn --exclude-dir=__pycache__ 'sequential_dmg' fast_engine || true
          echo '=== stack_reach / remove_named_buff / heal_received ==='
          grep -RIn --exclude-dir=__pycache__ -E 'stack_reach|remove_named_buff|heal_received' fast_engine || true
