name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rank generic blocker mechanics
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter, defaultdict
          from fast_engine.research.public_blocker_frontier import scan_public_blockers, _conceptual_key

          def shape(item: str) -> str:
              parts = item.split(':')
              family = parts[0]
              if family in {'damage_delivery', 'normal_delivery', 'skill_state_delivery', 'cadence'}:
                  return f'{family}:{parts[-1]}'
              if family == 'skill_damage':
                  # sequential_damage:N variants share one mechanic family.
                  stat = ':'.join(parts[3:]) if len(parts) > 3 else parts[-1]
                  if stat.startswith('sequential_damage:'):
                      stat = 'sequential_damage'
                  return f'skill_damage:{stat}'
              if family in {'weapon_change', 'control', 'normal_state'}:
                  return family
              return family

          report = scan_public_blockers()
          unique = {}
          for row in report['rows']:
              unique.setdefault(tuple(row['members']), row)

          teams_by_shape = defaultdict(set)
          concepts_by_shape = defaultdict(set)
          for members, row in unique.items():
              raw = tuple(row['blockers']) + tuple('unsupported:' + x for x in row['unsupported'])
              concepts = tuple(dict.fromkeys(_conceptual_key(x) for x in raw))
              for concept in concepts:
                  s = shape(concept)
                  teams_by_shape[s].add(row['source_name'])
                  concepts_by_shape[s].add(concept)

          ranking = sorted(teams_by_shape, key=lambda s: (-len(teams_by_shape[s]), s))
          for s in ranking:
              print(f'SHAPE|teams={len(teams_by_shape[s])}|concepts={len(concepts_by_shape[s])}|{s}')
              print('  teams=', sorted(teams_by_shape[s]))
              for c in sorted(concepts_by_shape[s]):
                  print('  concept=', c)
          PY
