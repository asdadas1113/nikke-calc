name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect statless named-state marker shapes
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import defaultdict
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.capabilities import CapabilityDisposition
          from fast_engine.research.public_ranking_probe import _source_corpus

          seen=set(); markers={}; marker_teams=defaultdict(set)
          grave_printed=False
          for members, source_name in _source_corpus():
              if members in seen: continue
              seen.add(members)
              squad=compile_moris_squad(spec.build_squad(list(members)))
              for e in squad.effects:
                  if e.effect_type=='buff' and not (e.stat or '') and e.capability.disposition is CapabilityDisposition.PLANNED:
                      key=(squad.members[e.actor].name,e.name,repr(e.target_spec),e.duration,e.max_stack,tuple(sorted(e.parameters)),tuple((r.event_key,r.mode.value) for r in e.triggers),tuple(r.mode.value for r in e.condition_rules))
                      markers.setdefault(key,e); marker_teams[key].add(source_name)
              if '그레이브' in members and not grave_printed:
                  grave_printed=True
                  print('GRAVE_TEAM', source_name, members)
                  for e in squad.effects:
                      if squad.members[e.actor].name=='그레이브':
                          print('GRAVE_EFFECT',repr(e))

          print('MARKER_COUNT',len(markers))
          for key,e in sorted(markers.items(),key=lambda kv:(-len(marker_teams[kv[0]]),kv[0][0],str(kv[0][1]))):
              print('MARKER|teams=',len(marker_teams[key]),'sources=',sorted(marker_teams[key]))
              print(' ',repr(e))
          PY
