name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  inspect-brady:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Brady team, state producer, and DoT sink support
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.dispatcher import TriggerDispatcher

          name='레이드_앨리스브래디'
          members=tuple(snapshot.SQUADS[name]['members'])
          raw=spec.build_squad(list(members)); squad=compile_moris_squad(raw)
          print('TEAM',members)
          print('BLOCKERS',static_score_blockers(squad))
          sink=SimpleDamageScoreSink(squad,EnemyStaticProfile(defense=0,duration=180))
          print('\nBRADY EFFECTS')
          actor=members.index('브래디')
          for e in squad.effects:
              if e.actor!=actor: continue
              print({
                  'id':e.effect_id,'name':e.name,'type':e.effect_type,'stat':e.stat,'value':e.value,
                  'target':e.target,'target_mode':e.target_spec.mode.value,'duration':e.duration,
                  'tick_interval':e.tick_interval,'max_stack':e.max_stack,'max_trigger':e.max_trigger,
                  'parameters':dict(e.parameters),
                  'triggers':[(r.mode.value,r.event_key,r.threshold,r.interval,r.raw,r.is_runtime_supported) for r in e.triggers],
                  'conditions':[(r.mode.value,r.key,r.value,r.raw,r.is_runtime_supported) for r in e.condition_rules],
                  'cap':e.capability.disposition.value,'cap_blockers':tuple(e.capability.blockers),
                  'dispatcher_exec':TriggerDispatcher.is_executable_effect(e),
                  'sink_support':sink.supports(e) if e.effect_type=='damage' else None,
                  'sink_unsupported':e.effect_id in sink.unsupported_effect_ids,
              })
          print('DOT_SPECS',sink.dot_specs)
          print('STATEFUL_DOT_SPECS',sink.stateful_dot_specs)
          PY
