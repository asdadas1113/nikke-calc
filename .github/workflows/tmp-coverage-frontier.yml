name: tmp-coverage-frontier

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: read

jobs:
  find-asuka-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Find a low-blocker Asuka control squad
        run: |
          PYTHONPATH=. python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          candidates=[
            ['라피 : 레드 후드','레드 후드','프리카','민트','아스카 : WILLE'],
            ['미란다','브리드 : 사일런트 트랙','헬름','루주','아스카 : WILLE'],
            ['미란다','브리드 : 사일런트 트랙','헬름','미하라 : 본딩 체인','아스카 : WILLE'],
            ['라피 : 레드 후드','프리카','민트','퀀시 : 이스케이프 퀸','아스카 : WILLE'],
          ]
          for names in candidates:
              try:
                  squad=compile_moris_squad(spec.build_squad(names))
                  blockers=static_score_blockers(squad)
                  print('\nTEAM',tuple(names),'N',len(blockers))
                  for b in blockers: print(' ',b)
              except Exception as exc:
                  print('\nTEAM_FAIL',tuple(names),type(exc).__name__,str(exc))
          PY
