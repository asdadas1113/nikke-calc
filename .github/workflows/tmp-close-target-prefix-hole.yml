name: tmp-close-target-prefix-hole

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-close-target-prefix-hole.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch exact burst3 target grammar and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fast_engine/engine/targets.py')
          text = path.read_text(encoding='utf-8')
          old = '    if raw.startswith("allies_burst3"):\n        return TargetSpec(raw, TargetMode.BURST3)\n'
          new = '    if raw == "allies_burst3":\n        return TargetSpec(raw, TargetMode.BURST3)\n'
          if text.count(old) != 1:
              raise SystemExit('burst3 target grammar anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('fast_engine/tests/test_target_grammar_safety.py')
          test.write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom fast_engine.engine.targets import TargetMode, compile_target\n\n\nclass TargetGrammarSafetyTests(unittest.TestCase):\n    def test_burst3_requires_exact_owned_grammar(self):\n        actor_by_name = {"리타": 0}\n\n        exact = compile_target("allies_burst3", actor_by_name=actor_by_name)\n        persona = compile_target(\n            "allies_burst3_persona_excl_self", actor_by_name=actor_by_name\n        )\n        unknown = compile_target(\n            "allies_burst3_future_suffix", actor_by_name=actor_by_name\n        )\n        numeric_suffix = compile_target("allies_burst30", actor_by_name=actor_by_name)\n\n        self.assertEqual(exact.mode, TargetMode.BURST3)\n        for spec in (persona, unknown, numeric_suffix):\n            self.assertEqual(spec.mode, TargetMode.UNSUPPORTED)\n            self.assertFalse(spec.runtime_supported)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Focused regression
        run: python -m unittest fast_engine.tests.test_target_grammar_safety fast_engine.tests.test_target_snapshot
      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Public frontier unchanged
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus

          unique = {}
          for members, source in _source_corpus():
              unique.setdefault(tuple(members), source)
          family = Counter()
          certified = 0
          for members in unique:
              blockers = static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              certified += not blockers
              for blocker in blockers:
                  family[blocker.split(':', 1)[0]] += 1
          expected = {
              'cadence': 59,
              'skill_state_delivery': 43,
              'normal_delivery': 41,
              'skill_damage': 27,
              'weapon_change': 12,
              'normal_state': 7,
              'control': 4,
              'periodic_grid': 1,
          }
          print('unique', len(unique), 'certified', certified, 'families', dict(family))
          assert len(unique) == 23
          assert certified == 2
          assert dict(family) == expected
          PY
      - name: Commit semantic guard and remove temporary workflow
        run: |
          rm -f .github/workflows/tmp-close-target-prefix-hole.yml
          git diff --check
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fast: reject unowned burst3 target suffixes"
          git push origin HEAD:fast-engine-phase2-20260901
