name: tmp-frontier-rescan-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Write checkpoint and handoff update
        run: python .github/scripts/tmp_finalize_periodic_docs.py
      - name: Validate docs and permanent regression
        run: |
          python -m context.doclint
          python -m unittest fast_engine.tests.test_damage_periodic_self_crit
          python -m unittest fast_engine.tests.test_periodic_runtime
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/research/PERIODIC_FINITE_SELF_CRIT_CHECKPOINT_20260905.md fast_engine/research/HANDOFF_FAST_ENGINE_20260905.md fast_engine/research/LESSONS.md
          git diff --cached --check
          git commit -m "docs: record finite periodic self crit checkpoint"
          git push origin HEAD:fast-engine-phase2-20260901
