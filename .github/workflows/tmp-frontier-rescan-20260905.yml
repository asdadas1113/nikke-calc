name: tmp-frontier-rescan-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Find source-proof-only gaps
        run: |
          python - <<'PY'
          from collections import defaultdict
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          import fast_engine.engine.score as score
          from fast_engine.engine.dispatcher import TriggerDispatcher

          seen = set()
          rows = []
          for team, entry in snapshot.SQUADS.items():
              if team.startswith('지그_'):
                  continue
              members = tuple(entry['members'])
              if members in seen:
                  continue
              seen.add(members)
              squad = compile_moris_squad(spec.build_squad(list(members)))
              blockers = set(score.static_score_blockers(squad))
              for effect in squad.effects:
                  actor = squad.members[effect.actor].name
                  normal = f'normal_delivery:{actor}:{effect.name}:{effect.stat}'
                  state = f'skill_state_delivery:{actor}:{effect.name}:{effect.stat}'
                  cadence = f'cadence:{actor}:{effect.name}:{effect.stat}'
                  if normal in blockers or state in blockers:
                      try: dd = score._direct_damage_buff_score_supported(squad, effect)
                      except Exception: dd = False
                      if dd:
                          rows.append(('DELIVERY_RUNTIME_OK', team, actor, effect, normal in blockers, state in blockers))
                  if cadence in blockers:
                      stat = effect.stat or ''
                      helper = None
                      if stat in {'charge_speed_pct','charge_speed_caster_based_pct'}:
                          helper = getattr(score, '_is_dynamic_charge_score_supported', None)
                      elif stat == 'reload_speed_pct':
                          helper = getattr(score, '_is_dynamic_reload_score_supported', None)
                      elif stat in {'max_ammo_pct','max_ammo_flat'}:
                          helper = getattr(score, '_is_dynamic_max_ammo_score_supported', None)
                      elif stat in {'ammo_charge_pct','ammo_charge_flat'}:
                          helper = getattr(score, '_is_dynamic_ammo_charge_score_supported', None)
                      if helper is not None:
                          try: ok = helper(squad, effect)
                          except Exception: ok = False
                          if ok:
                              rows.append(('CADENCE_HELPER_OK', team, actor, effect, True, False))

          print('ROWS=', len(rows))
          for kind, team, actor, effect, a, b in rows:
              print('\nROW', kind, team, actor, effect.name, effect.stat, 'normal=', a, 'state=', b)
              print(' type=', effect.effect_type, 'value=', effect.value, 'duration=', effect.duration, 'max_stack=', effect.max_stack)
              print(' target=', repr(effect.target_spec))
              print(' triggers=', [repr(r) for r in effect.triggers])
              print(' conditions=', [repr(c) for c in effect.condition_rules])
              print(' params=', dict(effect.parameters))
              print(' executable=', TriggerDispatcher.is_executable_effect(effect))
              try: print(' targets=', score._possible_ally_targets(squad, effect))
              except Exception as e: print(' targets_err=', repr(e))
          PY
