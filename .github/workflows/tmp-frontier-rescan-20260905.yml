name: tmp-frontier-rescan-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Snow White periodic direct-state shape
        run: |
          python - <<'PY'
          from calculator.timeline import simulate
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher

          team = '레이드_헬름아쿠아스노우'
          moris_squad = spec.build_squad(list(snapshot.SQUADS[team]['members']))
          compiled = compile_moris_squad(moris_squad)
          sw = next(i for i,m in enumerate(compiled.members) if m.name == '스노우 화이트')
          effect = next(e for e in compiled.members[sw].effects if e.name == '세븐스 드워프 : V&VI 2')
          print('EFFECT=', effect)
          print('CAP_DISPOSITION=', effect.capability.disposition)
          print('CAP_BLOCKERS=', effect.capability.blockers)
          print('POLARITY=', effect.polarity)
          print('EXECUTABLE_NOW=', TriggerDispatcher.is_executable_effect(effect))

          result = simulate(moris_squad, config={'duration': 70.0, 'rng_mode':'expected'}, verbose=True)
          print('SIMLOG_ATTRS=', [x for x in dir(result.log) if not x.startswith('_')])
          for attr in [x for x in dir(result.log) if not x.startswith('_')]:
              try:
                  rows = getattr(result.log, attr)
                  if isinstance(rows, list):
                      hits = [r for r in rows if '세븐스 드워프 : V&VI 2' in repr(r)]
                      if hits:
                          print('LOG_MATCH', attr, len(hits))
                          for r in hits[:30]: print(' ', repr(r))
              except Exception as e:
                  print('LOG_ERR', attr, repr(e))
          print('RESULT_ATTRS=', [x for x in dir(result) if not x.startswith('_')])
          PY
      - name: Locate Moris periodic path
        run: |
          grep -n -E 'periodic|tick_interval|next_proc|every:|interval' calculator/timeline.py calculator/buff_manager.py | head -n 160 || true
