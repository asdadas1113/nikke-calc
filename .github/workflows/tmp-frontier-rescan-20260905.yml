name: tmp-frontier-rescan-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose frontier candidates
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          import fast_engine.engine.score as score
          from fast_engine.engine.dispatcher import TriggerDispatcher

          wanted = {
              '레이드_앨리스브래디': {'브래디': {'머물고 싶은 맛','나누고 싶은 맛','뉴 플레이버 2','맛의 여운'}, '아니스 : 스타': {'슈팅 스타2','슈팅 스타1','스타더스트 3'}},
              '스쿼드5': {'아니스 : 스타': {'슈팅 스타2','슈팅 스타1','스타더스트 3'}},
              '레이드_일레그': {'아니스 : 스타': {'슈팅 스타2','슈팅 스타1','스타더스트 3'}},
              '레이드_소다': {'토브': {'급조 탄환','임시 개조','개조 성공 2'}},
              '스쿼드3': {'토브': {'급조 탄환','임시 개조','개조 성공 2'}},
          }

          def dump_effect(squad, effect):
              print('EFFECT', effect.actor, squad.members[effect.actor].name, effect.name)
              print('  type/stat/value=', effect.effect_type, effect.stat, effect.value)
              print('  target=', effect.target_spec)
              print('  duration/max_stack=', effect.duration, effect.max_stack)
              print('  params=', dict(effect.parameters))
              print('  triggers=', [(r.mode.value, r.event_key, r.threshold, r.trigger_count_reducible) for r in effect.triggers])
              print('  conditions=', [(c.mode.value, c.key, c.value) for c in effect.condition_rules])
              print('  capability=', effect.capability.value, 'blockers=', effect.blockers)
              print('  executable=', TriggerDispatcher.is_executable_effect(effect))
              try: print('  possible_targets=', score._possible_ally_targets(squad, effect))
              except Exception as e: print('  possible_targets_err=', repr(e))
              for fn in ['_is_dynamic_charge_score_supported','_is_dynamic_ammo_charge_score_supported','_direct_damage_buff_score_supported','_is_dynamic_reload_score_supported','_is_dynamic_max_ammo_score_supported']:
                  f = getattr(score, fn, None)
                  if f is not None:
                      try: print(' ', fn, '=', f(squad, effect))
                      except Exception as e: print(' ', fn, 'ERR', repr(e))

          for team, actors in wanted.items():
              squad = compile_moris_squad(spec.build_squad(list(snapshot.SQUADS[team]['members'])))
              print('\n===', team, '===')
              print('BLOCKERS=', score.static_score_blockers(squad))
              for actor_idx, member in enumerate(squad.members):
                  if member.name not in actors:
                      continue
                  names = actors[member.name]
                  print('ACTOR', actor_idx, member.name, 'weapon=', member.weapon)
                  try: print('  charge_safe=', score._charge_actor_score_safe(squad, actor_idx))
                  except Exception as e: print('  charge_safe_err=', repr(e))
                  try: print('  rapid_safe=', score._rapid_actor_score_safe(squad, actor_idx))
                  except Exception as e: print('  rapid_safe_err=', repr(e))
                  for effect in member.effects:
                      if effect.name in names:
                          dump_effect(squad, effect)
          PY
