name: tmp-frontier-rescan-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply production candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('fast_engine/engine/dispatcher.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    @staticmethod\n    def _periodic_timing_is_only_blocker(effect: "CompiledEffect") -> bool:\n'''
          helper = '''    @staticmethod\n    def _periodic_finite_self_crit_shape_supported(\n        effect: "CompiledEffect",\n    ) -> bool:\n        """Certify a fixed-grid finite one-stack self crit buff during full burst."""\n        return (\n            effect.capability.disposition is CapabilityDisposition.PLANNED\n            and set(effect.capability.blockers) == {\n                "category:hit_formula",\n                "stat:crit_rate",\n                "timing:periodic",\n                "condition:simple_runtime",\n            }\n            and effect.effect_type == "buff"\n            and bool(effect.name)\n            and (effect.stat or "") == "crit_rate"\n            and effect.polarity == "beneficial"\n            and effect.target_spec.mode is TargetMode.SELF\n            and effect.value is not None\n            and float(effect.value) >= 0.0\n            and effect.duration is not None\n            and float(effect.duration) > 0.0\n            and effect.max_stack in (1, 1.0)\n            and effect.max_trigger is None\n            and effect.tick_interval is None\n            and not effect.parameters\n            and len(effect.condition_rules) == 1\n            and effect.condition_rules[0].mode is ConditionMode.DURING_FULL_BURST\n            and len(effect.triggers) == 1\n            and effect.triggers[0].mode is TriggerMode.PERIODIC\n            and effect.triggers[0].interval is not None\n            and float(effect.triggers[0].interval) > 0.0\n        )\n\n'''
          if helper.strip() not in s:
              if anchor not in s:
                  raise SystemExit('dispatcher insertion anchor not found')
              s = s.replace(anchor, helper + anchor, 1)
          old = '''            TriggerDispatcher._periodic_permanent_self_direct_stack_shape_supported(effect)\n            or TriggerDispatcher._self_stack_reach_marker_shape_supported(effect)\n'''
          new = '''            TriggerDispatcher._periodic_permanent_self_direct_stack_shape_supported(effect)\n            or TriggerDispatcher._periodic_finite_self_crit_shape_supported(effect)\n            or TriggerDispatcher._self_stack_reach_marker_shape_supported(effect)\n'''
          if new not in s:
              if old not in s:
                  raise SystemExit('dispatcher executable anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('fast_engine/engine/score.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _is_score_safe_fixed_periodic(effect) -> bool:\n    if TriggerDispatcher._periodic_permanent_self_direct_stack_shape_supported(effect):\n        return True\n'''
          new = '''def _is_score_safe_fixed_periodic(effect) -> bool:\n    if (\n        TriggerDispatcher._periodic_permanent_self_direct_stack_shape_supported(effect)\n        or TriggerDispatcher._periodic_finite_self_crit_shape_supported(effect)\n    ):\n        return True\n'''
          if new not in s:
              if old not in s:
                  raise SystemExit('score periodic anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Write permanent regression
        run: |
          cat > fast_engine/tests/test_damage_periodic_self_crit.py <<'PY'
          from __future__ import annotations

          import unittest
          from unittest.mock import patch

          from calculator.timeline import simulate
          from context import snapshot, spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers


          class PeriodicFiniteSelfCritTests(unittest.TestCase):
              TEAM = '레이드_헬름아쿠아스노우'

              def _compiled(self):
                  moris = spec.build_squad(list(snapshot.SQUADS[self.TEAM]['members']))
                  compiled = compile_moris_squad(moris)
                  sw = next(i for i, m in enumerate(compiled.members) if m.name == '스노우 화이트')
                  effect = next(
                      e for e in compiled.members[sw].effects
                      if e.name == '세븐스 드워프 : V&VI 2'
                  )
                  return moris, compiled, effect

              def test_real_shape_removes_only_periodic_crit_delivery_blockers(self):
                  _moris, compiled, effect = self._compiled()
                  self.assertTrue(
                      TriggerDispatcher._periodic_finite_self_crit_shape_supported(effect)
                  )
                  blockers = set(static_score_blockers(compiled))
                  self.assertNotIn(
                      'normal_delivery:스노우 화이트:세븐스 드워프 : V&VI 2:crit_rate',
                      blockers,
                  )
                  self.assertNotIn(
                      'skill_state_delivery:스노우 화이트:세븐스 드워프 : V&VI 2:crit_rate',
                      blockers,
                  )
                  self.assertIn(
                      'weapon_change:스노우 화이트:세븐스 드워프 : I', blockers
                  )
                  self.assertIn(
                      'normal_delivery:스노우 화이트:세븐스 드워프 : I 2:pierce_enabled',
                      blockers,
                  )
                  self.assertIn(
                      'normal_delivery:헬름 : 아쿠아마린:이지스 캐논 견제 사격 2:received_dmg_pct',
                      blockers,
                  )

              def test_fast_activation_times_match_moris_outer_tick_observation(self):
                  moris_squad, compiled, effect = self._compiled()
                  duration = 70.0
                  policy = compile_burst_policy(
                      moris_squad, compiled, {'duration': duration}
                  )
                  fast_times = []
                  original = TriggerDispatcher.dispatch_periodic

                  def traced(dispatcher, effect_id, rule_index, *, time, context):
                      result = original(
                          dispatcher,
                          effect_id,
                          rule_index,
                          time=time,
                          context=context,
                      )
                      if (
                          effect_id == effect.effect_id
                          and effect_id in result.activated_effect_ids
                      ):
                          fast_times.append(time)
                      return result

                  with patch.object(TriggerDispatcher, 'dispatch_periodic', new=traced):
                      BurstRuntime(compiled, policy).run(duration=duration)

                  moris = simulate(
                      moris_squad,
                      config={'duration': duration, 'rng_mode': 'expected'},
                      verbose=True,
                  )
                  moris_times = [
                      row.t
                      for row in moris.log.buff_events
                      if row.kind == 'activate'
                      and row.name == '세븐스 드워프 : V&VI 2'
                  ]
                  self.assertEqual(len(fast_times), 3, fast_times)
                  self.assertEqual(len(moris_times), 3, moris_times)
                  for actual, expected in zip(fast_times, moris_times):
                      self.assertAlmostEqual(actual, expected, places=9)

              def test_other_periodic_shapes_remain_fail_closed(self):
                  _moris, compiled, _effect = self._compiled()
                  helm = next(
                      i for i, m in enumerate(compiled.members)
                      if m.name == '헬름 : 아쿠아마린'
                  )
                  enemy_stack = next(
                      e for e in compiled.members[helm].effects
                      if e.name == '이지스 캐논 견제 사격 2'
                  )
                  self.assertFalse(
                      TriggerDispatcher._periodic_finite_self_crit_shape_supported(
                          enemy_stack
                      )
                  )
                  self.assertFalse(TriggerDispatcher.is_executable_effect(enemy_stack))


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Focused regression
        run: |
          python -m unittest fast_engine.tests.test_damage_periodic_self_crit
          python -m unittest fast_engine.tests.test_periodic_runtime

      - name: Public scope gate
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers

          seen = set()
          certified = 0
          matches = []
          for team, entry in snapshot.SQUADS.items():
              if team.startswith('지그_'):
                  continue
              members = tuple(entry['members'])
              if members in seen:
                  continue
              seen.add(members)
              squad = compile_moris_squad(spec.build_squad(list(members)))
              blockers = static_score_blockers(squad)
              if not blockers:
                  certified += 1
              for effect in squad.effects:
                  if TriggerDispatcher._periodic_finite_self_crit_shape_supported(effect):
                      matches.append(
                          (team, squad.members[effect.actor].name, effect.name, effect.stat)
                      )
          assert len(seen) == 23, len(seen)
          assert certified == 2, certified
          assert matches == [
              ('레이드_헬름아쿠아스노우', '스노우 화이트', '세븐스 드워프 : V&VI 2', 'crit_rate')
          ], matches
          print('PUBLIC_SCOPE_OK', len(seen), certified, len(seen) - certified, matches)
          PY

      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'

      - name: Commit production
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/engine/dispatcher.py fast_engine/engine/score.py fast_engine/tests/test_damage_periodic_self_crit.py
          git diff --cached --check
          git commit -m "fast: certify finite periodic self crit state"
          git push origin HEAD:fast-engine-phase2-20260901
