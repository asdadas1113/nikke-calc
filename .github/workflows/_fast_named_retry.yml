name: Fast named-buff patch retry

on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: [.github/workflows/_fast_named_retry.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply staged patch and correct test field
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/_fast_public_frontier.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(helper) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(helper)) if helper[i].strip() == 'PY')
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper[start:end]) + '\n'
          exec(compile(source, '<staged-named-buff-patch>', 'exec'), {})

          test_path = Path('fast_engine/tests/test_named_buff_event_runtime.py')
          test = test_path.read_text(encoding='utf-8').replace('runtime.burst.', 'runtime.machine.')
          test_path.write_text(test, encoding='utf-8')
          compile(test, str(test_path), 'exec')
          PY
      - name: Run focused and Fast suites
        run: |
          python -m unittest fast_engine.tests.test_named_buff_event_runtime
          python -m unittest fast_engine.tests.test_damage_shield_runtime
          python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Commit implementation and remove helpers
        run: |
          rm .github/workflows/_fast_public_frontier.yml .github/workflows/_fast_named_retry.yml
          git config user.name "fast-engine-bot"
          git config user.email "fast-engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "impl: bridge deterministic named buff events"
          git push origin HEAD:fast-engine-phase2-20260901
