name: Fast live max-ammo performance-safe implementation
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/_fast_max_ammo_perf_fix.yml']
permissions:
  contents: write
jobs:
  impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/engine/score.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('_DYNAMIC_RELOAD_SCORE_STATS = frozenset({"reload_speed_pct"})\n','_DYNAMIC_RELOAD_SCORE_STATS = frozenset({"reload_speed_pct"})\n_DYNAMIC_MAX_AMMO_SCORE_STATS = frozenset({"max_ammo_pct", "max_ammo_flat"})\n',1)
          anchor='''def _valid_dynamic_bullet_lifetime(effect) -> bool:\n'''
          insert='''def _max_ammo_recipient_score_safe(squad: CompiledSquad, actor: int) -> bool:\n    mode = str(squad.members[actor].weapon.get("fire_mode") or "")\n    if mode in {"auto", "auto_warmup"}:\n        return _rapid_actor_score_safe(squad, actor)\n    if mode == "charge":\n        return _charge_actor_score_safe(squad, actor)\n    return False\n\n\ndef _is_dynamic_max_ammo_score_supported(squad: CompiledSquad, effect) -> bool:\n    if (effect.stat or "") not in _DYNAMIC_MAX_AMMO_SCORE_STATS:\n        return False\n    # Permanent unconditional self modifiers stay in the existing static cadence\n    # compiler. Promoting them would turn ordinary teams into dynamic weapon sims.\n    if _is_folded_static_self_modifier(effect):\n        return False\n    if (\n        effect.effect_type != "buff"\n        or effect.value is None\n        or effect.parameters\n        or effect.condition_rules\n        or not target_scope_is_static(effect.target_spec)\n        or not TriggerDispatcher.is_executable_effect(effect)\n    ):\n        return False\n    targets = _possible_ally_targets(squad, effect)\n    return bool(targets) and all(_max_ammo_recipient_score_safe(squad, a) for a in targets)\n\n\ndef _dynamic_max_ammo_score_actors(squad: CompiledSquad) -> tuple[int, ...]:\n    actors: set[int] = set()\n    for effect in squad.effects:\n        if _is_dynamic_max_ammo_score_supported(squad, effect):\n            actors.update(_possible_ally_targets(squad, effect))\n    return tuple(sorted(actors))\n\n\n'''
          if anchor not in s: raise SystemExit('anchor max ammo')
          s=s.replace(anchor,insert+anchor,1)
          s=s.replace('''    actors.update(charge & set(_dynamic_ammo_charge_score_actors(squad)))\n    actors.update(_dynamic_charge_bullet_lifetime_score_actors(squad))\n''','''    actors.update(charge & set(_dynamic_ammo_charge_score_actors(squad)))\n    actors.update(charge & set(_dynamic_max_ammo_score_actors(squad)))\n    actors.update(_dynamic_charge_bullet_lifetime_score_actors(squad))\n''',1)
          s=s.replace('''    actors.update(_dynamic_mg_warmup_score_actors(squad))\n    actors.update(_dynamic_force_reload_score_actors(squad))\n    return tuple(sorted(actors))\n''','''    actors.update(_dynamic_mg_warmup_score_actors(squad))\n    actors.update(_dynamic_force_reload_score_actors(squad))\n    actors.update(a for a in _dynamic_max_ammo_score_actors(squad) if str(squad.members[a].weapon.get("fire_mode") or "") in {"auto", "auto_warmup"})\n    return tuple(sorted(actors))\n''',1)
          old='''            if stat == "reload_speed_pct" and _is_dynamic_reload_score_supported(squad, effect):\n                continue\n            if stat in {"ammo_charge_pct", "ammo_charge_flat"} and _is_dynamic_ammo_charge_score_supported(squad, effect):\n'''
          new='''            if stat == "reload_speed_pct" and _is_dynamic_reload_score_supported(squad, effect):\n                continue\n            if stat in _DYNAMIC_MAX_AMMO_SCORE_STATS and _is_dynamic_max_ammo_score_supported(squad, effect):\n                continue\n            if stat in {"ammo_charge_pct", "ammo_charge_flat"} and _is_dynamic_ammo_charge_score_supported(squad, effect):\n'''
          if old not in s: raise SystemExit('cadence anchor')
          s=s.replace(old,new,1)
          old='''        if _is_patternless_unreachable(effect):\n            continue\n\n        if stat in _CADENCE_OR_SHAPE_STATS:\n'''
          new='''        if _is_patternless_unreachable(effect):\n            continue\n\n        if effect.effect_type == "weapon_change":\n            if not TriggerDispatcher.is_executable_effect(effect):\n                blockers.append(f"weapon_change:{owner}:{effect.name or 'unnamed'}")\n            continue\n\n        if stat in _CADENCE_OR_SHAPE_STATS:\n'''
          if old not in s: raise SystemExit('wc anchor')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('fast_engine/engine/dynamic_reload.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('from .weapon import WeaponCadenceMachine, _EPS\n','from .weapon import WeaponCadenceMachine, _EPS, _round_half_up\n',1)
          anchor='''    def _signature(self, actor: int, now: float) -> tuple[float, ...]:\n'''
          insert='''    @staticmethod\n    def _is_static_folded_max_ammo(effect: "CompiledEffect") -> bool:\n        return (\n            (effect.stat or "") in {"max_ammo_pct", "max_ammo_flat"}\n            and effect.effect_type == "buff"\n            and effect.target_spec.mode.value == "self"\n            and effect.duration in (None, -1.0)\n            and not effect.condition_rules\n            and bool(effect.triggers)\n            and all(rule.event_key == "battle_start" for rule in effect.triggers)\n        )\n\n    def _full_ammo(self, actor: int, now: float) -> int:\n        base_full = self._machine(actor)._full_ammo()\n        base_weapon = int(self.squad.members[actor].weapon["max_ammo"])\n        pct_gain = 0; flat_gain = 0.0\n        for stat in ("max_ammo_pct", "max_ammo_flat"):\n            for effect, active in self.effects.iter_stat(stat, now=now):\n                if active.target != actor or self._is_static_folded_max_ammo(effect):\n                    continue\n                value=float(effect.value or 0.0)*active.stacks\n                if stat=="max_ammo_pct": pct_gain += _round_half_up(base_weapon*value/100.0)\n                else: flat_gain += value\n        return max(1, base_full+pct_gain+_round_half_up(flat_gain))\n\n'''
          if anchor not in s: raise SystemExit('reload anchor')
          s=s.replace(anchor,insert+anchor,1)
          s=s.replace('''        return (\n            self.effects.sum_stat(actor, "reload_speed_pct", now=now),\n            warmup_speed,\n        )\n''','''        return (\n            self.effects.sum_stat(actor, "reload_speed_pct", now=now),\n            warmup_speed,\n            float(self._full_ammo(actor, now)),\n        )\n''',1)
          s=s.replace('st.ammo = self._machine(actor)._full_ammo()','st.ammo = self._full_ammo(actor, transition_time)')
          s=s.replace('full = self._machine(actor)._full_ammo()\n            st = _RapidActorState(','full = self._full_ammo(actor, now)\n            st = _RapidActorState(',1)
          p.write_text(s,encoding='utf-8')
          p=Path('fast_engine/engine/dynamic_rapid.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('st.ammo = self._machine(actor)._full_ammo()','st.ammo = self._full_ammo(actor, transition_time)')
          s=s.replace('full = self._machine(actor)._full_ammo()\n            if st.phase != "reloading" and st.ammo < full:','full = self._full_ammo(actor, now)\n            if st.phase != "reloading" and st.ammo < full:')
          p.write_text(s,encoding='utf-8')
          p=Path('fast_engine/engine/dynamic_weapon.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('full = runtime._machine(actor)._full_ammo()\n                gain = self._ammo_charge_gain(full, stat, value)','full = runtime._full_ammo(actor, float(now))\n                gain = self._ammo_charge_gain(full, stat, value)',1)
          p.write_text(s,encoding='utf-8')

          p=Path('fast_engine/tests/test_damage_dynamic_reload_scoring.py'); s=p.read_text(encoding='utf-8')
          anchor='''    def test_reload_time_fixed_is_explicit_cadence_blocker(self):\n'''
          tests='''    def test_live_max_ammo_refills_new_cap_without_changing_current_magazine(self):\n        base=_reload_effect(duration=5.0)\n        effect=replace(base,name="live max ammo",stat="max_ammo_pct",value=100.0,capability=_capability("max_ammo_pct"))\n        squad=_squad(effect); self.assertEqual(static_normal_score_blockers(squad),())\n        runtime=BurstRuntime(squad,BurstPolicy(duration=4.0,first_burst_time=10.0),EnemyStaticProfile(defense=0.0,core_uptime=0.0,core_px=0.0,duration=4.0))\n        StaticNormalAttackObserver(runtime,duration=4.0); runtime.start(duration=4.0); rapid=runtime.weapons._rapid_reload\n        runtime.weapons.advance_to(0.25,inclusive=True); self.assertEqual(rapid._states[0].ammo,1)\n        runtime.dispatcher.effects.activate(effect,0,0.25,runtime.scheduler); runtime.weapons.sync(0.25)\n        self.assertEqual(rapid._states[0].ammo,1); self.assertEqual(rapid._full_ammo(0,0.25),4)\n        runtime.weapons.advance_to(3.01,inclusive=True); self.assertEqual(rapid._states[0].ammo,3)\n\n    def test_live_max_ammo_expiry_does_not_clamp_current_ammo(self):\n        base=_reload_effect(duration=0.2)\n        effect=replace(base,name="live max ammo",stat="max_ammo_pct",value=200.0,capability=_capability("max_ammo_pct"))\n        squad=_squad(effect); runtime=BurstRuntime(squad,BurstPolicy(duration=1.0,first_burst_time=10.0),EnemyStaticProfile(defense=0.0,core_uptime=0.0,core_px=0.0,duration=1.0))\n        StaticNormalAttackObserver(runtime,duration=1.0); runtime.start(duration=1.0); rapid=runtime.weapons._rapid_reload\n        runtime.dispatcher.effects.activate(effect,0,0.01,runtime.scheduler); runtime.weapons.sync(0.01); rapid._states[0].ammo=5\n        self.assertEqual(rapid._full_ammo(0,0.02),6); runtime.weapons.sync(0.25)\n        self.assertEqual(rapid._full_ammo(0,0.25),2); self.assertEqual(rapid._states[0].ammo,5)\n\n'''
          if anchor not in s: raise SystemExit('test anchor')
          s=s.replace(anchor,tests+anchor,1); p.write_text(s,encoding='utf-8')
          p=Path('fast_engine/tests/test_damage_dynamic_charge_scoring.py'); s=p.read_text(encoding='utf-8')
          anchor='''    def test_uncertified_charge_speed_delivery_remains_fail_closed(self):\n'''
          test='''    def test_public_red_wolf_weapon_change_is_explicit_fail_closed(self):\n        names=["라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"]\n        blockers=static_normal_score_blockers(compile_moris_squad(build_squad(names)))\n        self.assertTrue(any(x.startswith("weapon_change:레드 후드:레드 울프 무기변경") for x in blockers))\n\n'''
          if anchor not in s: raise SystemExit('wc test anchor')
          s=s.replace(anchor,test+anchor,1); p.write_text(s,encoding='utf-8')
          PY
      - name: Focused tests and performance contract
        run: |
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring fast_engine.tests.test_damage_dynamic_charge_scoring fast_engine.tests.test_performance_contract -v
      - name: Full Fast suite
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Public audit
        run: python -m fast_engine.research.public_ranking_probe | tee /tmp/probe.txt
      - name: Commit implementation
        run: |
          git config user.name fast-engine-bot; git config user.email fast-engine-bot@users.noreply.github.com
          git add fast_engine/engine fast_engine/tests
          git commit -m "impl: support performance-safe live max ammo and fail closed weapon changes"
          git push origin HEAD:fast-engine-phase2-20260901
      - name: Remove helper
        if: always()
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then git reset --hard HEAD; fi
          git pull --rebase origin fast-engine-phase2-20260901 || true
          rm -f .github/workflows/_fast_max_ammo_perf_fix.yml
          git config user.name fast-engine-bot; git config user.email fast-engine-bot@users.noreply.github.com
          git add -A; git commit -m "chore: remove max-ammo performance helper" || exit 0
          git push origin HEAD:fast-engine-phase2-20260901
