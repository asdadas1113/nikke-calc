name: Fast dynamic max-ammo implementation
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/_fast_dynamic_max_ammo.yml']
permissions:
  contents: write
jobs:
  impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply dynamic max-ammo slice
        run: |
          python - <<'PY'
          from pathlib import Path

          # score.py: certify simple live max-ammo buffs and route affected actors
          p=Path('fast_engine/engine/score.py')
          s=p.read_text(encoding='utf-8')
          old='''_DYNAMIC_RELOAD_SCORE_STATS = frozenset({"reload_speed_pct"})\n'''
          new='''_DYNAMIC_RELOAD_SCORE_STATS = frozenset({"reload_speed_pct"})\n_DYNAMIC_MAX_AMMO_SCORE_STATS = frozenset({"max_ammo_pct", "max_ammo_flat"})\n'''
          if old not in s: raise SystemExit('score stats anchor missing')
          s=s.replace(old,new,1)

          anchor='''def _valid_dynamic_bullet_lifetime(effect) -> bool:\n'''
          insert='''def _max_ammo_recipient_score_safe(squad: CompiledSquad, actor: int) -> bool:\n    mode = str(squad.members[actor].weapon.get("fire_mode") or "")\n    if mode in {"auto", "auto_warmup"}:\n        return _rapid_actor_score_safe(squad, actor)\n    if mode == "charge":\n        return _charge_actor_score_safe(squad, actor)\n    return False\n\n\ndef _is_dynamic_max_ammo_score_supported(squad: CompiledSquad, effect) -> bool:\n    if (effect.stat or "") not in _DYNAMIC_MAX_AMMO_SCORE_STATS:\n        return False\n    if (\n        effect.effect_type != "buff"\n        or effect.value is None\n        or effect.parameters\n        or effect.condition_rules\n        or effect.parameters.get("duration_bullets") is not None\n        or not target_scope_is_static(effect.target_spec)\n        or not TriggerDispatcher.is_executable_effect(effect)\n    ):\n        return False\n    targets = _possible_ally_targets(squad, effect)\n    return bool(targets) and all(\n        _max_ammo_recipient_score_safe(squad, actor) for actor in targets\n    )\n\n\ndef _dynamic_max_ammo_score_actors(squad: CompiledSquad) -> tuple[int, ...]:\n    actors: set[int] = set()\n    for effect in squad.effects:\n        if _is_dynamic_max_ammo_score_supported(squad, effect):\n            actors.update(_possible_ally_targets(squad, effect))\n    return tuple(sorted(actors))\n\n\n'''
          if anchor not in s: raise SystemExit('score max ammo insert anchor missing')
          s=s.replace(anchor,insert+anchor,1)

          old='''    actors.update(charge & set(_dynamic_ammo_charge_score_actors(squad)))\n    actors.update(_dynamic_charge_bullet_lifetime_score_actors(squad))\n'''
          new='''    actors.update(charge & set(_dynamic_ammo_charge_score_actors(squad)))\n    actors.update(charge & set(_dynamic_max_ammo_score_actors(squad)))\n    actors.update(_dynamic_charge_bullet_lifetime_score_actors(squad))\n'''
          if old not in s: raise SystemExit('charge actor routing anchor missing')
          s=s.replace(old,new,1)

          old='''    actors.update(_dynamic_mg_warmup_score_actors(squad))\n    actors.update(_dynamic_force_reload_score_actors(squad))\n    return tuple(sorted(actors))\n'''
          new='''    actors.update(_dynamic_mg_warmup_score_actors(squad))\n    actors.update(_dynamic_force_reload_score_actors(squad))\n    actors.update(\n        actor\n        for actor in _dynamic_max_ammo_score_actors(squad)\n        if str(squad.members[actor].weapon.get("fire_mode") or "")\n        in {"auto", "auto_warmup"}\n    )\n    return tuple(sorted(actors))\n'''
          if old not in s: raise SystemExit('rapid actor routing anchor missing')
          s=s.replace(old,new,1)

          old='''            if stat == "reload_speed_pct" and _is_dynamic_reload_score_supported(squad, effect):\n                continue\n            if stat in {"ammo_charge_pct", "ammo_charge_flat"} and _is_dynamic_ammo_charge_score_supported(squad, effect):\n'''
          new='''            if stat == "reload_speed_pct" and _is_dynamic_reload_score_supported(squad, effect):\n                continue\n            if stat in _DYNAMIC_MAX_AMMO_SCORE_STATS and _is_dynamic_max_ammo_score_supported(squad, effect):\n                continue\n            if stat in {"ammo_charge_pct", "ammo_charge_flat"} and _is_dynamic_ammo_charge_score_supported(squad, effect):\n'''
          if old not in s: raise SystemExit('blocker allowance anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # dynamic_reload.py: live max-ammo is sampled at initialization/reload completion;
          # activation/expiry never clamps current ammo.
          p=Path('fast_engine/engine/dynamic_reload.py')
          s=p.read_text(encoding='utf-8')
          old='''from .weapon import WeaponCadenceMachine, _EPS\n'''
          new='''from .weapon import WeaponCadenceMachine, _EPS, _round_half_up\n'''
          if old not in s: raise SystemExit('dynamic reload import anchor missing')
          s=s.replace(old,new,1)

          anchor='''    def _signature(self, actor: int, now: float) -> tuple[float, ...]:\n'''
          insert='''    def _full_ammo(self, actor: int, now: float) -> int:\n        """Resolve the magazine cap at the moment Moris samples it.\n\n        Current ammo is deliberately not clamped when this value changes. Moris\n        only samples live max-ammo when initializing/refilling a magazine; a\n        later buff expiry may therefore leave ammo temporarily above the new cap.\n        """\n        base = int(self.squad.members[actor].weapon["max_ammo"])\n        pct_gain = 0\n        for effect, active in self.effects.iter_stat("max_ammo_pct", now=now):\n            if active.target != actor:\n                continue\n            pct_gain += _round_half_up(\n                base * float(effect.value or 0.0) * active.stacks / 100.0\n            )\n        flat = self.effects.sum_stat(actor, "max_ammo_flat", now=now)\n        return max(1, base + pct_gain + _round_half_up(flat))\n\n'''
          if anchor not in s: raise SystemExit('dynamic reload full ammo anchor missing')
          s=s.replace(anchor,insert+anchor,1)

          old='''        return (\n            self.effects.sum_stat(actor, "reload_speed_pct", now=now),\n            warmup_speed,\n        )\n'''
          new='''        return (\n            self.effects.sum_stat(actor, "reload_speed_pct", now=now),\n            warmup_speed,\n            self.effects.sum_stat(actor, "max_ammo_pct", now=now),\n            self.effects.sum_stat(actor, "max_ammo_flat", now=now),\n        )\n'''
          if old not in s: raise SystemExit('dynamic reload signature anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''            st.ammo = self._machine(actor)._full_ammo()\n''','''            st.ammo = self._full_ammo(actor, transition_time)\n''')
          s=s.replace('''            full = self._machine(actor)._full_ammo()\n            st = _RapidActorState(\n''','''            full = self._full_ammo(actor, now)\n            st = _RapidActorState(\n''',1)
          p.write_text(s,encoding='utf-8')

          # dynamic_rapid.py override must use the same live reload-completion cap.
          p=Path('fast_engine/engine/dynamic_rapid.py')
          s=p.read_text(encoding='utf-8')
          old='''            st.ammo = self._machine(actor)._full_ammo()\n'''
          new='''            st.ammo = self._full_ammo(actor, transition_time)\n'''
          if old not in s: raise SystemExit('dynamic rapid reload completion anchor missing')
          s=s.replace(old,new,1)
          old='''            full = self._machine(actor)._full_ammo()\n            if st.phase != "reloading" and st.ammo < full:\n'''
          new='''            full = self._full_ammo(actor, now)\n            if st.phase != "reloading" and st.ammo < full:\n'''
          if old not in s: raise SystemExit('dynamic rapid cover full anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # dynamic_weapon ammo-charge cap for rapid actors must consult live max ammo too.
          p=Path('fast_engine/engine/dynamic_weapon.py')
          s=p.read_text(encoding='utf-8')
          old='''                full = runtime._machine(actor)._full_ammo()\n                gain = self._ammo_charge_gain(full, stat, value)\n'''
          new='''                full = runtime._full_ammo(actor, float(now))\n                gain = self._ammo_charge_gain(full, stat, value)\n'''
          if old not in s: raise SystemExit('dynamic weapon ammo cap anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Tests: synthetic rapid semantics + real Mint public team blocker removal.
          p=Path('fast_engine/tests/test_damage_dynamic_reload_scoring.py')
          s=p.read_text(encoding='utf-8')
          old='''from fast_engine.engine.score import StaticNormalAttackObserver, static_normal_score_blockers\n'''
          new='''from fast_engine.engine.score import StaticNormalAttackObserver, static_normal_score_blockers\nfrom context.spec import build_squad\nfrom fast_engine.engine.compiler import compile_moris_squad\n'''
          if old not in s: raise SystemExit('test import anchor missing')
          s=s.replace(old,new,1)

          anchor='''    def test_reload_time_fixed_is_explicit_cadence_blocker(self):\n'''
          tests='''    def test_live_max_ammo_activation_keeps_current_ammo_and_refills_new_cap(self):\n        base = _reload_effect(duration=5.0)\n        effect = replace(\n            base,\n            name="live max ammo",\n            stat="max_ammo_pct",\n            value=100.0,\n            capability=_capability("max_ammo_pct"),\n        )\n        squad = _squad(effect)\n        self.assertNotIn(\n            "cadence:synthetic-reload:live max ammo:max_ammo_pct",\n            static_normal_score_blockers(squad),\n        )\n        runtime = BurstRuntime(\n            squad,\n            BurstPolicy(duration=4.0, first_burst_time=10.0),\n            EnemyStaticProfile(defense=0.0, core_uptime=0.0, core_px=0.0, duration=4.0),\n        )\n        observer = StaticNormalAttackObserver(runtime, duration=4.0)\n        runtime.start(duration=4.0)\n        # First base-magazine shot at 0.0 leaves 1/2. Activating +100% max ammo\n        # must not retroactively grant ammo to the current magazine.\n        runtime.weapons.advance_to(0.25, inclusive=True)\n        rapid = runtime.weapons._rapid_reload\n        self.assertEqual(rapid._states[0].ammo, 1)\n        runtime.dispatcher.effects.activate(effect, 0, 0.25, runtime.scheduler)\n        runtime.weapons.sync(0.25)\n        self.assertEqual(rapid._states[0].ammo, 1)\n        self.assertEqual(rapid._full_ammo(0, 0.25), 4)\n        # The second shot empties the old magazine; reload completes at 3.0\n        # while the buff is still live, filling 4. The same-time shot consumes\n        # one, so immediately after 3.01 there are 3 rounds left.\n        runtime.weapons.advance_to(3.01, inclusive=True)\n        self.assertEqual(rapid._states[0].ammo, 3)\n\n    def test_live_max_ammo_expiry_does_not_clamp_existing_ammo(self):\n        base = _reload_effect(duration=1.0)\n        effect = replace(\n            base,\n            name="live max ammo",\n            stat="max_ammo_pct",\n            value=200.0,\n            duration=0.2,\n            capability=_capability("max_ammo_pct"),\n        )\n        squad = _squad(effect)\n        runtime = BurstRuntime(\n            squad,\n            BurstPolicy(duration=1.0, first_burst_time=10.0),\n            EnemyStaticProfile(defense=0.0, core_uptime=0.0, core_px=0.0, duration=1.0),\n        )\n        StaticNormalAttackObserver(runtime, duration=1.0)\n        runtime.start(duration=1.0)\n        rapid = runtime.weapons._rapid_reload\n        # Install the buff before replacing the magazine directly to isolate the\n        # expiry contract from reload timing: cap becomes 6, ammo is 5.\n        runtime.dispatcher.effects.activate(effect, 0, 0.01, runtime.scheduler)\n        runtime.weapons.sync(0.01)\n        rapid._states[0].ammo = 5\n        runtime.state.set_ammo(0, 5)\n        self.assertEqual(rapid._full_ammo(0, 0.02), 6)\n        # At 0.25 the timed state is no longer live; sync must invalidate future\n        # planning but must not clamp 5 current rounds to the base cap of 2.\n        runtime.weapons.sync(0.25)\n        self.assertEqual(rapid._full_ammo(0, 0.25), 2)\n        self.assertEqual(rapid._states[0].ammo, 5)\n\n    def test_public_mint_max_ammo_is_certified(self):\n        names = ["라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"]\n        squad = compile_moris_squad(build_squad(names))\n        blockers = static_normal_score_blockers(squad)\n        self.assertFalse(any("민트:다 함께 불러주세요! 2:max_ammo_pct" in x for x in blockers))\n\n'''
          if anchor not in s: raise SystemExit('test insertion anchor missing')
          s=s.replace(anchor,tests+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Focused tests
        run: |
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring fast_engine.tests.test_damage_dynamic_charge_scoring -v
      - name: Full Fast suite
        run: |
          python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Public audit and ranking probe
        run: |
          python -m fast_engine.research.public_ranking_probe | tee /tmp/public_probe.txt
          grep -E '^(teams=|coverage:|clean:|clean_relative_error=|blocker_families=)' /tmp/public_probe.txt
      - name: Commit implementation
        run: |
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add fast_engine/engine/score.py fast_engine/engine/dynamic_reload.py fast_engine/engine/dynamic_rapid.py fast_engine/engine/dynamic_weapon.py fast_engine/tests/test_damage_dynamic_reload_scoring.py
          git commit -m "impl: support live max-ammo cadence scoring"
          git push origin HEAD:fast-engine-phase2-20260901
      - name: Remove helper
        if: always()
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then git reset --hard HEAD; fi
          git pull --rebase origin fast-engine-phase2-20260901 || true
          rm -f .github/workflows/_fast_dynamic_max_ammo.yml
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add -A
          git commit -m "chore: remove dynamic max-ammo helper" || exit 0
          git push origin HEAD:fast-engine-phase2-20260901
