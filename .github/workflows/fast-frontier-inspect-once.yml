name: Fast frontier inspect once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect first certified squad parity
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          names = ['미란다', '브리드 : 사일런트 트랙', '헬름', '루주', '미하라 : 본딩 체인']
          config = {'duration': 180.0, 'first_burst_time': 3.0, 'rng_mode': 'expected'}

          def run(label, disable_control=False):
              squad = spec.build_squad(names)
              if disable_control:
                  next(c for c in squad if c['name'] == '미하라 : 본딩 체인')['control'] = {}
              compiled = compile_moris_squad(squad)
              policy = compile_burst_policy(squad, compiled, dict(config))
              blockers = static_score_blockers(compiled)
              print(label, 'BLOCKERS', blockers)
              moris = simulate(
                  squad,
                  config=spec.build_config(squad, dict(config)),
                  enemy=dict(DEFAULT_ENEMY),
                  seed=42,
                  verbose=False,
              )
              fast = score_static_squad(
                  compiled,
                  policy,
                  EnemyStaticProfile(
                      defense=float(DEFAULT_ENEMY.get('def', 31784.0)),
                      element=DEFAULT_ENEMY.get('code'),
                      core_uptime=0.0,
                      core_px=float(DEFAULT_ENEMY.get('core_px', 0.0) or 0.0),
                      duration=180.0,
                  ),
              )
              print(label, 'TOTAL', {
                  'moris': moris.squad_total,
                  'fast': fast.squad_total,
                  'rel': fast.squad_total / moris.squad_total - 1.0,
                  'events': fast.events_processed,
              })
              for i, name in enumerate(names):
                  m = moris.char_total.get(name, 0)
                  f = fast.char_total[i]
                  print(label, 'CHAR', name, {
                      'moris': m,
                      'fast': f,
                      'rel': None if not m else f / m - 1.0,
                  })

          run('CONTROL_ON', disable_control=False)
          run('CONTROL_OFF', disable_control=True)
          PY
