name: Fast frontier inspect once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Helm reload special threshold
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import _possible_ally_targets

          names = ['리틀 머메이드', '크라운', '라피 : 레드 후드', '미하라 : 본딩 체인', '헬름']
          squad = compile_moris_squad(spec.build_squad(names))
          actor = 4
          print('HELM', squad.members[actor].weapon)

          upper = 0.0
          for effect in squad.effects:
              if effect.stat == 'reload_speed_pct' and effect.effect_type == 'buff':
                  targets = _possible_ally_targets(squad, effect)
                  if actor not in targets:
                      continue
                  value = max(0.0, float(effect.value or 0.0))
                  stacks = effect.max_stack
                  if stacks is None or stacks <= 1:
                      mult = 1.0
                  elif stacks == -1:
                      mult = float('inf')
                  else:
                      mult = float(stacks)
                  contrib = value * mult
                  upper += contrib
                  print('RELOAD_SOURCE', squad.members[effect.actor].name, effect.name, {
                      'value': effect.value,
                      'max_stack': effect.max_stack,
                      'duration': effect.duration,
                      'target': effect.target,
                      'triggers': [r.raw for r in effect.triggers],
                      'conditions': [r.raw for r in effect.condition_rules],
                      'contrib_upper': contrib,
                  })
          print('RELOAD_UPPER_BOUND', upper)

          for effect in squad.members[actor].effects:
              if not TriggerDispatcher.is_executable_effect(effect):
                  continue
              keys = sorted({r.event_key for r in effect.triggers})
              if any(k in {'last_bullet_fire','last_bullet','on_attack','event:full_reload','full_reload','event:cover'} for k in keys):
                  print('HELM_EVENT_CONSUMER', effect.name, effect.stat, {
                      'keys': keys,
                      'type': effect.effect_type,
                      'value': effect.value,
                      'duration': effect.duration,
                      'target': effect.target,
                      'parameters': effect.parameters,
                  })
          PY
