name: Fast blocker frontier once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public blocker frontier
        run: python -m fast_engine.research.public_blocker_frontier
