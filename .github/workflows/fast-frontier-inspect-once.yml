name: Fast frontier inspect once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect squad1 blocker causes
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import (
              static_score_blockers,
              _possible_ally_targets,
              _reload_recipient_score_safe,
              _actor_has_executable_event,
              _actor_has_unhandled_count_event,
              _actor_has_executable_core_count,
              _direct_damage_buff_score_supported,
          )
          from fast_engine.engine.shot_blocks import static_bullet_lifetime_cadence_safe

          names = ['리틀 머메이드', '크라운', '라피 : 레드 후드', '미하라 : 본딩 체인', '헬름']
          squad = compile_moris_squad(spec.build_squad(names))
          print('BLOCKERS', static_score_blockers(squad))

          interesting = {
              ('리틀 머메이드', '세이렌 송 2', 'ammo_charge_pct'),
              ('크라운', '원 포 올 2', 'reload_speed_pct'),
              ('크라운', '로얄 에타이어 4', 'atk_dmg_pct'),
              ('헬름', '이지스 캐논 3', 'charge_dmg_mag_pct'),
          }
          for effect in squad.effects:
              owner = squad.members[effect.actor].name
              key = (owner, effect.name, effect.stat)
              if key not in interesting:
                  continue
              targets = _possible_ally_targets(squad, effect)
              print('EFFECT', key, {
                  'id': effect.effect_id,
                  'type': effect.effect_type,
                  'value': effect.value,
                  'duration': effect.duration,
                  'target': effect.target,
                  'target_mode': effect.target_spec.mode.value,
                  'targets': [(a, squad.members[a].name) for a in targets],
                  'parameters': effect.parameters,
                  'triggers': [(r.raw, r.event_key, r.mode.value, r.threshold, r.trigger_count_reducible) for r in effect.triggers],
                  'conditions': [(r.raw, r.mode.value, r.key, r.threshold) for r in effect.condition_rules],
                  'runtime_executable_base': TriggerDispatcher.is_executable_effect(effect),
                  'damage_delivery_safe': _direct_damage_buff_score_supported(squad, effect),
              })
              for actor in targets:
                  member = squad.members[actor]
                  print(' TARGET', member.name, {
                      'weapon': member.weapon,
                      'reload_safe': _reload_recipient_score_safe(squad, actor),
                      'bullet_static_safe': static_bullet_lifetime_cadence_safe(squad, actor),
                      'core_count': _actor_has_executable_core_count(squad, actor),
                      'last_or_reload': _actor_has_executable_event(squad, actor, frozenset({'last_bullet_fire','last_bullet','on_attack','event:full_reload','full_reload','event:cover'})),
                      'raw_counts': _actor_has_unhandled_count_event(squad, actor, frozenset({'hit_count','pellet_hit'})),
                  })
          PY
