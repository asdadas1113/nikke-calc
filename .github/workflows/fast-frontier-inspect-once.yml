name: Fast frontier inspect once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply charge bullet lifetime slice
        run: |
          python fast_engine/research/_apply_charge_bullet_patch_once.py
          python fast_engine/research/_fix_charge_patch_test_once.py
      - name: Targeted Fast regressions
        run: |
          python -m unittest \
            fast_engine.tests.test_damage_dynamic_charge_scoring \
            fast_engine.tests.test_damage_dynamic_reload_scoring \
            fast_engine.tests.test_damage_helm_bullet_lifetime \
            fast_engine.tests.test_damage_real_squad_certification
      - name: Commit implementation if changed
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'fast-engine-bot'
          git config user.email 'fast-engine-bot@users.noreply.github.com'
          git add fast_engine/engine/effects.py fast_engine/engine/dynamic_weapon.py fast_engine/engine/score.py fast_engine/tests/test_damage_helm_bullet_lifetime.py
          git diff --cached --check
          git commit -m 'impl: charge bullet lifetime runtime'
          git push origin HEAD:fast-engine-phase2-20260901
