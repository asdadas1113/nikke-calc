name: tmp-reference-stack-restore-v3

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-reference-stack-restore-v3.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reference-stack patch with corrected regression
        run: |
          cat > fast_engine/engine/reference_stack.py <<'PY'
          from __future__ import annotations

          def finite_reference_stack_capture_shape(effect) -> bool:
              ref = effect.parameters.get("scaling_ref")
              duration = effect.duration
              max_stack = effect.max_stack if effect.max_stack is not None else 1.0
              return (
                  effect.effect_type == "buff"
                  and effect.parameters.get("scaling") == "stack_count"
                  and isinstance(ref, str) and bool(ref)
                  and set(effect.parameters) == {"scaling", "scaling_ref"}
                  and duration is not None and float(duration) > 0.0
                  and float(max_stack) == 1.0
                  and effect.max_trigger is None and effect.tick_interval is None
              )
          PY
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/tmp-reference-stack-probe.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.find(marker) + len(marker)
          stop = source.find("\n          PY", start)
          if start < len(marker) or stop < 0:
              raise SystemExit('patch block missing')
          patch = textwrap.dedent(source[start:stop])
          patch = patch.replace(
              "old = '''            self._index_remove(effect, key)\\n            self.state.touch(token.target, StateDomain.EFFECT)\\n            return effect\\n'''",
              "old = '''        self._index_remove(effect, key)\\n        self.state.touch(token.target, StateDomain.EFFECT)\\n        return effect\\n'''",
              1,
          ).replace(
              "new = '''            self._index_remove(effect, key)\\n            self.state.touch(token.target, StateDomain.EFFECT)\\n            if effect.name:\\n                self._touch_live_reference_consumers(active.source_actor, effect.name, now=event.time)\\n            return effect\\n'''",
              "new = '''        self._index_remove(effect, key)\\n        self.state.touch(token.target, StateDomain.EFFECT)\\n        if effect.name:\\n            self._touch_live_reference_consumers(active.source_actor, effect.name, now=event.time)\\n        return effect\\n'''",
              1,
          )
          exec(compile(patch, '<reference-stack-patch>', 'exec'), {})

          test_marker = "          cat > fast_engine/tests/test_damage_reference_stack_capture.py <<'PY'\n"
          start = source.find(test_marker) + len(test_marker)
          stop = source.find("\n          PY", start)
          body = textwrap.dedent(source[start:stop])
          old = '''        self.assertNotIn(\n            "cadence:마스트 : 로망틱 메이드:파이레츠 스피릿 2:reload_speed_pct", blockers\n        )\n'''
          new = '''        # Reference capture is owned, but all-allies dynamic reload still has\n        # an independent recipient-cadence blocker outside this checkpoint.\n        self.assertIn(\n            "cadence:마스트 : 로망틱 메이드:파이레츠 스피릿 2:reload_speed_pct", blockers\n        )\n'''
          if old not in body:
              raise SystemExit('Maid cadence test anchor missing')
          body = body.replace(old, new, 1)
          Path('fast_engine/tests/test_damage_reference_stack_capture.py').write_text(body, encoding='utf-8')
          PY
      - name: Focused reference-stack regressions
        run: |
          python -m unittest fast_engine.tests.test_damage_reference_stack_capture
          python -m unittest fast_engine.tests.test_damage_false_supported_guards
          python -m unittest fast_engine.tests.test_damage_real_squad_certification
          python -m unittest fast_engine.tests.test_damage_moris_frame_timing
      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Verify public frontier remains fail-closed
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus
          unique = {}
          for members, source in _source_corpus(): unique.setdefault(tuple(members), source)
          families = Counter(); certified = []
          for members, source in unique.items():
              blockers = static_score_blockers(compile_moris_squad(spec.build_squad(list(members))))
              if not blockers: certified.append(source)
              for blocker in blockers: families[blocker.split(':', 1)[0]] += 1
          print('FRONTIER', len(unique), 'CERTIFIED', certified, 'FAMILIES', dict(families))
          assert len(unique) == 23
          assert set(certified) == {'컨트롤_미란다미하라', '레이드_레드후드퀀시'}, certified
          PY
      - name: Commit semantic restoration and remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-reference-stack-probe.yml
          rm -f .github/workflows/tmp-reference-stack-restore-v2.yml
          rm -f .github/workflows/tmp-reference-stack-restore-v3.yml
          git diff --check
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fast: own finite reference-stack capture"
          git push origin HEAD:fast-engine-phase2-20260901
