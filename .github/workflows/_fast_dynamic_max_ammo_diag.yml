name: Fast dynamic max-ammo diagnosis
on:
  push:
    branches: [fast-engine-phase2-20260901]
    paths: ['.github/workflows/_fast_dynamic_max_ammo_diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Diagnose recipients
        run: |
          python - <<'PY'
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import _rapid_actor_score_safe, _charge_actor_score_safe, static_normal_score_blockers
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.target_scope import target_scope_is_static, possible_ally_targets
          names=["라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"]
          squad=compile_moris_squad(build_squad(names))
          print('BLOCKERS', static_normal_score_blockers(squad))
          mint=names.index('민트')
          eff=next(e for e in squad.members[mint].effects if e.name=='다 함께 불러주세요! 2')
          print('MINT', eff.effect_type, eff.stat, eff.value, eff.duration, eff.max_stack, eff.parameters, eff.target_spec.mode.value, 'static=',target_scope_is_static(eff.target_spec), 'exec=',TriggerDispatcher.is_executable_effect(eff), 'conds=',eff.condition_rules)
          print('TARGETS', possible_ally_targets(squad, eff))
          for i,m in enumerate(squad.members):
              mode=str(m.weapon.get('fire_mode') or '')
              print('RECIPIENT',i,m.name,'weapon=',m.weapon_type,'mode=',mode,'clip=',m.weapon.get('is_clip'),'control=',m.weapon.get('control'),'cover_delay=',m.weapon.get('cover_during_delay'))
              print('  rapid_safe=',_rapid_actor_score_safe(squad,i),'charge_safe=',_charge_actor_score_safe(squad,i))
              events=[]
              for e in m.effects:
                  if TriggerDispatcher.is_executable_effect(e):
                      for r in e.triggers:
                          if r.event_key in {'last_bullet_fire','on_attack','event:full_reload','full_reload','event:cover','pellet_hit','hit_count'}:
                              events.append((e.name,e.stat,r.event_key,r.mode.value,r.threshold,r.trigger_count_reducible))
              print('  relevant_events=',events)
          PY
      - name: Remove helper
        if: always()
        run: |
          rm -f .github/workflows/_fast_dynamic_max_ammo_diag.yml
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add -A
          git commit -m "chore: remove max-ammo diagnosis helper" || exit 0
          git push origin HEAD:fast-engine-phase2-20260901
