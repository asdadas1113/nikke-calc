name: tmp-frontier-shape-audit-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Write checkpoint and update handoff
        run: |
          cat > fast_engine/research/FULL_CHARGE_HIT_CHARGE_SPEED_CHECKPOINT_20260905.md <<'EOF'
          # Fast Engine — full-charge-hit self charge-speed checkpoint (2026-09-05)

          ## 1. 목적

          unique-23 public frontier를 다시 shape 단위로 분류한 뒤, 새 global shot chronology 없이 기존 dynamic charge runtime이 이미 소유한 물리 경계를 재사용할 수 있는 다음 작은 generic slice를 선택했다.

          실데이터 anchor는 신데렐라 `무결한 유리 2`다.

          - effect: `buff`
          - stat: `charge_speed_pct +100`
          - target: `self`
          - duration: permanent
          - max stack: `1`
          - trigger: raw `full_charge_hit`
          - condition: none
          - capability blocker: exactly `timing:weapon_hit`

          목표는 신데렐라 이름을 특별취급하는 것이 아니라, 이 좁은 post-shot permanent self charge-speed shape만 generic하게 runtime/score ownership하는 것이다.

          ## 2. 기존 Fast runtime 재사용

          새 per-shot scheduler나 1/60 combat loop를 추가하지 않았다.

          기존 `MultiSignalChargeCadenceRuntime`은 executable raw `full_charge_hit` consumer가 있는 charge actor의 물리 shot boundary를 이미 소유한다. `BurstRuntime` ordering은 다음과 같다.

          1. 물리 charge shot 처리 및 score
          2. raw `full_charge_hit` signal dispatch
          3. effect activation
          4. `weapons.sync()`로 live charge-speed signature 변화 반영

          따라서 triggering shot에는 새 charge speed가 소급 적용되지 않고, 그 shot 이후의 charge cadence부터 바뀐다.

          ## 3. narrow certification shape

          `TriggerDispatcher._full_charge_hit_permanent_self_charge_speed_shape_supported()`가 다음 조건을 모두 만족할 때만 PLANNED effect를 executable로 승격한다.

          - capability disposition `PLANNED`
          - blocker set exactly `{timing:weapon_hit}`
          - effect type exactly `buff`
          - stat exactly `charge_speed_pct`
          - target exactly `SELF`
          - non-negative numeric value
          - permanent duration (`None` or `-1`)
          - max stack absent or `1`
          - no max trigger
          - no tick interval
          - no parameters
          - no conditions
          - exactly one EVENT trigger
          - event key exactly `full_charge_hit`

          finite duration, multi-stack, negative value, 다른 weapon-hit event, Brady의 named `stat_applied` 계열은 그대로 fail closed다.

          ## 4. runner-only A/B

          A/B:

          - run: `33924314982`
          - job: `101189364921`
          - result: success

          Moris와 Fast의 `무결한 유리 2` activation sequence가 20초 구간에서 직접 일치했다.

          첫 구간:

          - `1.0000000000000013`
          - `1.3333333333333335`
          - `1.6666666666666656`
          - `1.9999999999999978`
          - `2.33333333333333`
          - `2.666666666666662`

          Fast raw full-charge shot 시각과 Fast buff activation 시각도 동일했다.

          의미론:

          - 첫 shot은 base 1.0초 charge를 사용한다.
          - 그 shot의 `full_charge_hit` 뒤 +100% charge speed가 활성화된다.
          - 이후 shot 간격은 약 `1/3`초가 된다.
          - triggering shot 자체에는 새 상태가 소급되지 않는다.

          A/B gate:

          - semantic trace: success
          - public scope/fail-closed gate: success
          - full Fast regression: `251/251`

          ## 5. public blocker delta

          baseline cadence blocker family는 `66`이었다.

          이번 helper는 public unique memberships에서 정확히 두 effect instance만 매칭한다.

          - `스쿼드5 / 신데렐라 / 무결한 유리 2 / charge_speed_pct`
          - `레이드_루주 / 신데렐라 / 무결한 유리 2 / charge_speed_pct`

          따라서 cadence blocker family는 `66 -> 64`로 감소했다.

          표준 accounting은 그대로다.

          - source cases: `24`
          - unique ordered memberships: `23`
          - certified: `2`
          - coverage gaps: `21`

          certified universe가 늘지 않았으므로 standardized ranking probe는 재실행하지 않았다.

          ## 6. production promotion

          production semantic commit:

          - `721cd9a8720766c14a814eb8973ca5cd685d7c73` — `fast: certify full-charge-hit self charge speed`

          promotion:

          - run: `33924481342`
          - job: `101189880430`
          - focused new regression: `3/3`
          - existing one-shot charge-speed regression: `6/6`
          - public scope gate: success
          - full Fast regression: `254/254`
          - production commit/push: success

          permanent regression:

          - `fast_engine/tests/test_damage_full_charge_hit_charge_speed.py`

          첫 promotion attempt의 실패는 존재하지 않는 회귀 모듈 `test_dynamic_charge_score`를 호출한 harness 오류였다. 새 regression `3/3`과 기존 one-shot `6/6`은 그 run에서도 이미 통과했으며, 잘못된 호출만 제거한 뒤 최종 promotion이 성공했다.

          ## 7. fail-closed 유지

          이번 checkpoint는 다음을 지원한다고 주장하지 않는다.

          - arbitrary `full_charge_hit` effects
          - finite-lifetime full-charge-hit charge speed
          - multi-stack full-charge-hit charge speed
          - negative charge-speed states
          - Brady `event:stat_applied:*` source semantics
          - broad weapon-hit trigger family
          - cross-class weapon change
          - global shot chronology

          다음 checkpoint는 updated frontier를 다시 보고 선정한다. blocker 숫자가 적다는 이유만으로 보류 축을 broad-enable하지 않는다.

          ## 8. canonical CI

          docs/cleanup 뒤 clean HEAD에서 canonical CI를 user-authored metadata commit으로 다시 실행한다. 최종 run/result는 이 문서에 후속 기록한다.
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          handoff = Path('fast_engine/research/HANDOFF_FAST_ENGINE_20260905.md')
          text = handoff.read_text(encoding='utf-8')

          docs = '''가장 먼저 읽을 문서:

          1. `fast_engine/research/HANDOFF_FAST_ENGINE_20260905.md`
          2. `fast_engine/research/FULL_CHARGE_HIT_CHARGE_SPEED_CHECKPOINT_20260905.md`
          3. `fast_engine/research/PERIODIC_FINITE_SELF_CRIT_CHECKPOINT_20260905.md`
          4. `fast_engine/research/TOVE_AMMO_PCT_NAMED_EVENT_CHECKPOINT_20260905.md`
          5. `fast_engine/research/ADA_CHARGE_HOLD_CONTROL_CHECKPOINT_20260905.md`
          6. `fast_engine/research/ADA_ONE_SHOT_CHARGE_SPEED_CHECKPOINT_20260905.md`
          7. `fast_engine/research/PATTERNLESS_ENCOUNTER_EVENT_CHECKPOINT_20260905.md`
          8. `fast_engine/research/COVERAGE_FRONTIER_CHECKPOINT_20260904.md`
          9. `fast_engine/research/CROWN_SELF_STACK_HEAL_CHECKPOINT_20260904.md`
          10. `fast_engine/research/TIMING_SEMANTICS_RANKING_CHECKPOINT_20260904.md`

          현재 최신 production semantic commit:'''
          text, n = re.subn(
              r'가장 먼저 읽을 문서:\n\n.*?\n현재 최신 production semantic commit:',
              docs,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('handoff docs-list replacement failed')

          text = text.replace(
              '- `fee2fe343cf75861185dd780d9191bbf6f48da8f` — finite periodic self `crit_rate` state certification\n\n직전 production semantic commit:\n\n- `47e8c47278bbd9125b42a8f08bde632638796026` — percent-ammo instant named-event emission / source certification',
              '- `721cd9a8720766c14a814eb8973ca5cd685d7c73` — full-charge-hit permanent self `charge_speed_pct` certification\n\n직전 production semantic commit:\n\n- `fee2fe343cf75861185dd780d9191bbf6f48da8f` — finite periodic self `crit_rate` state certification',
              1,
          )
          text = text.replace(
              '이번 Tove slice 뒤에도 certified count가 `2`라 ranking probe는 재실행하지 않았다.',
              '이번 Cinderella full-charge-hit charge-speed slice 뒤에도 certified count가 `2`라 ranking probe는 재실행하지 않았다.',
              1,
          )

          latest = '''## 1A. 최신 완료 — full-charge-hit self charge speed

          신데렐라 `무결한 유리 2`를 anchor로 raw `full_charge_hit` 뒤 영구 self `charge_speed_pct`를 좁게 generic certification했다.

          production:

          - `721cd9a8720766c14a814eb8973ca5cd685d7c73`

          새 global shot loop를 만들지 않았다. 기존 dynamic charge runtime의 물리 shot boundary를 재사용하며 ordering은 `shot/score -> full_charge_hit -> effect activation -> cadence sync`다.

          A/B run `33924314982` / job `101189364921`에서 Moris와 Fast activation sequence가 직접 일치했다. 첫 shot은 약 `1.0s`, 이후 +100% charge speed 활성화 뒤 간격은 약 `0.333333s`다.

          production promotion run `33924481342` / job `101189880430`:

          - focused new regression `3/3`
          - existing one-shot charge-speed `6/6`
          - public scope success
          - full Fast `254/254`
          - production commit/push success

          public cadence blocker family는 `66 -> 64`, accounting은 `23 unique / 2 certified / 21 gaps`로 유지됐다. 따라서 ranking probe는 재실행하지 않았다.

          상세:

          - `fast_engine/research/FULL_CHARGE_HIT_CHARGE_SPEED_CHECKPOINT_20260905.md`

          ---

          ## 1B. 직전 완료 — finite periodic self crit'''
          text = text.replace('## 1A. 최신 완료 — finite periodic self crit', latest, 1)

          next_section = '''## 7. 다음 단일 checkpoint

          다음 작업은 **Cinderella slice 이후 cadence `64` 기준으로 unique-23 frontier를 다시 shape 단위로 분류하고, 다음 작은 generic ownership을 하나만 고르는 것**이다.

          기존 no-patch/hold 축은 그대로 제외한다.

          - Mihara / executable `squad_body_hit`
          - Little Mermaid / `squad_ammo_consume`
          - Crown external heal
          - broad/cross-class weapon change

          인접 후보로는 all-allies reload/max-ammo recipient safety, `charge_time_fixed`, Brady `stat_applied` source proof 등이 있으나 아직 다음 production slice로 확정하지 않는다. real Moris semantic probe와 기존 runtime 재사용 가능성을 먼저 비교한다.

          certified universe가 실제 증가할 때만 ranking validation을 재실행한다.

          목표는 blocker 숫자를 줄이는 것이 아니라 comparison-critical 의미론을 증명할 수 있는 작은 generic ownership을 늘리는 것이다.

          ---

          ## 8. 고정 원칙'''
          text, n = re.subn(
              r'## 7\. 다음 단일 checkpoint\n.*?\n---\n\n## 8\. 고정 원칙',
              next_section,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('handoff next-checkpoint replacement failed')

          cleanup = '''## 9. CI / cleanup 계약

          이번 Cinderella checkpoint의 production semantic commit은 `721cd9a8720766c14a814eb8973ca5cd685d7c73`이다.

          finalizer는 `FULL_CHARGE_HIT_CHARGE_SPEED_CHECKPOINT_20260905.md`, handoff, `LESSONS.md`를 갱신하고 조사용 `tmp-frontier-shape-audit-20260905.yml`을 같은 cleanup commit에서 제거한다.

          cleanup 뒤 `.github/workflows`에는 `ci.yml`, `pages.yml`만 남겨야 한다.

          bot cleanup commit은 recursive push CI를 만들지 않으므로, user-authored checkpoint metadata commit으로 canonical CI를 다시 실행한다. 최종 run/result는 `FULL_CHARGE_HIT_CHARGE_SPEED_CHECKPOINT_20260905.md`의 canonical CI 절에 기록한다.

          `master`는 그대로 둔다.'''
          text, n = re.subn(
              r'## 9\. CI / cleanup 계약\n.*\Z',
              cleanup,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('handoff cleanup replacement failed')
          handoff.write_text(text.rstrip() + '\n', encoding='utf-8')

          lessons = Path('fast_engine/research/LESSONS.md')
          lt = lessons.read_text(encoding='utf-8')
          marker = 'raw weapon-hit state는 이미 소유한 물리 boundary를 재사용할 때 가장 싸다'
          if marker not in lt:
              lt = lt.rstrip() + '''

          ## 2026-09-05 — raw weapon-hit state는 이미 소유한 물리 boundary를 재사용할 때 가장 싸다

          - 모든 hit-trigger 상태가 global per-shot scheduler를 요구하는 것은 아니다.
          - dynamic charge runtime이 해당 actor의 실제 shot boundary를 이미 소유한다면, 필요한 raw hit signal만 post-shot에 노출하고 state activation 뒤 cadence sync를 수행하는 편이 Fast 설계에 맞다.
          - 핵심 ordering은 `shot/score -> hit trigger -> state activation -> cadence sync`다. triggering shot에 새 cadence 상태를 소급 적용하면 안 된다.
          - blocker 제거만 보지 말고 Moris/Fast의 실제 activation sequence와 다음 shot interval을 직접 대조하면 ordering proof가 강해진다.
          '''
              lessons.write_text(lt.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate finalizer output
        run: |
          python -m context.doclint
          python -m unittest fast_engine.tests.test_damage_full_charge_hit_charge_speed
          python -m unittest fast_engine.tests.test_damage_charge_speed_bullet_lifetime
          git diff --check

      - name: Commit docs and self-clean workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-frontier-shape-audit-20260905.yml
          git add fast_engine/research/FULL_CHARGE_HIT_CHARGE_SPEED_CHECKPOINT_20260905.md fast_engine/research/HANDOFF_FAST_ENGINE_20260905.md fast_engine/research/LESSONS.md
          git diff --cached --check
          git commit -m "docs: close full-charge-hit charge-speed checkpoint"
          git push origin HEAD:fast-engine-phase2-20260901
