name: tmp-frontier-shape-audit-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply production candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fast_engine/engine/dispatcher.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    @staticmethod\n    def _on_attack_charge_speed_shape_supported(effect: "CompiledEffect") -> bool:\n'''
          helper = '''    @staticmethod\n    def _full_charge_hit_permanent_self_charge_speed_shape_supported(\n        effect: "CompiledEffect",\n    ) -> bool:\n        """Certify a permanent self charge-speed state applied after a full-charge hit."""\n        if not (\n            effect.capability.disposition is CapabilityDisposition.PLANNED\n            and set(effect.capability.blockers) == {"timing:weapon_hit"}\n            and effect.effect_type == "buff"\n            and (effect.stat or "") == "charge_speed_pct"\n            and effect.target_spec.mode is TargetMode.SELF\n            and effect.value is not None\n            and float(effect.value) >= 0.0\n            and effect.duration in (None, -1.0)\n            and effect.max_stack in (None, 1, 1.0)\n            and effect.max_trigger is None\n            and effect.tick_interval is None\n            and not effect.parameters\n            and not effect.condition_rules\n            and len(effect.triggers) == 1\n        ):\n            return False\n        rule = effect.triggers[0]\n        return rule.mode is TriggerMode.EVENT and rule.event_key == "full_charge_hit"\n\n'''
          if helper.strip() not in s:
              if anchor not in s:
                  raise SystemExit('dispatcher insertion anchor missing')
              s = s.replace(anchor, helper + anchor, 1)
          old = '''            or TriggerDispatcher._on_attack_charge_speed_shape_supported(effect)\n            or TriggerDispatcher._charge_overflow_conversion_shape_supported(effect)\n'''
          new = '''            or TriggerDispatcher._on_attack_charge_speed_shape_supported(effect)\n            or TriggerDispatcher._full_charge_hit_permanent_self_charge_speed_shape_supported(effect)\n            or TriggerDispatcher._charge_overflow_conversion_shape_supported(effect)\n'''
          if new not in s:
              if old not in s:
                  raise SystemExit('dispatcher executable anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Write permanent regression
        run: |
          cat > fast_engine/tests/test_damage_full_charge_hit_charge_speed.py <<'PY'
          from __future__ import annotations

          from dataclasses import replace
          import unittest
          from unittest.mock import patch

          from calculator.timeline import simulate
          from context import snapshot, spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.dynamic_weapon import MultiSignalChargeCadenceRuntime
          from fast_engine.engine.effects import ActiveEffectStore
          from fast_engine.engine.score import static_score_blockers


          class FullChargeHitChargeSpeedTests(unittest.TestCase):
              BLOCKER = 'cadence:신데렐라:무결한 유리 2:charge_speed_pct'

              def _fixture(self):
                  team = next(
                      name for name, entry in snapshot.SQUADS.items()
                      if not name.startswith('지그_') and '신데렐라' in entry['members']
                  )
                  moris = spec.build_squad(list(snapshot.SQUADS[team]['members']))
                  compiled = compile_moris_squad(moris)
                  actor = next(i for i, member in enumerate(compiled.members) if member.name == '신데렐라')
                  effect = next(
                      effect for effect in compiled.members[actor].effects
                      if effect.name == '무결한 유리 2'
                  )
                  return team, moris, compiled, actor, effect

              def test_real_shape_removes_only_its_cadence_blocker(self):
                  _team, _moris, compiled, _actor, effect = self._fixture()
                  helper = TriggerDispatcher._full_charge_hit_permanent_self_charge_speed_shape_supported
                  self.assertTrue(helper(effect))
                  blockers = set(static_score_blockers(compiled))
                  self.assertNotIn(self.BLOCKER, blockers)
                  self.assertTrue(blockers)

                  seen = set()
                  matches = []
                  cadence = 0
                  certified = 0
                  for team, entry in snapshot.SQUADS.items():
                      if team.startswith('지그_'):
                          continue
                      members = tuple(entry['members'])
                      if members in seen:
                          continue
                      seen.add(members)
                      squad = compile_moris_squad(spec.build_squad(list(members)))
                      team_blockers = static_score_blockers(squad)
                      cadence += sum(row.startswith('cadence:') for row in team_blockers)
                      certified += not team_blockers
                      for candidate in squad.effects:
                          if helper(candidate):
                              matches.append(
                                  (team, squad.members[candidate.actor].name, candidate.name, candidate.stat)
                              )
                  self.assertEqual(len(seen), 23)
                  self.assertEqual(certified, 2)
                  self.assertEqual(cadence, 64)
                  self.assertEqual(len(matches), 2)
                  self.assertEqual(
                      {(row[1], row[2], row[3]) for row in matches},
                      {('신데렐라', '무결한 유리 2', 'charge_speed_pct')},
                  )

              def test_fast_full_charge_activation_sequence_matches_moris(self):
                  _team, moris_squad, compiled, actor, effect = self._fixture()
                  duration = 20.0
                  policy = compile_burst_policy(moris_squad, compiled, {'duration': duration})
                  fast_activations = []
                  fast_shots = []
                  original_activate = ActiveEffectStore.activate_group
                  original_boundary = MultiSignalChargeCadenceRuntime.handle_boundary

                  def traced_activate(store, candidate, targets, now, scheduler):
                      if candidate.effect_id == effect.effect_id:
                          fast_activations.append(float(now))
                      return original_activate(store, candidate, targets, now, scheduler)

                  def traced_boundary(runtime, event):
                      row = original_boundary(runtime, event)
                      if row is not None and row.actor == actor and any(
                          signal.event_key == 'full_charge_hit' for signal in row.signals
                      ):
                          fast_shots.append(float(event.time))
                      return row

                  with patch.object(ActiveEffectStore, 'activate_group', new=traced_activate), patch.object(
                      MultiSignalChargeCadenceRuntime, 'handle_boundary', new=traced_boundary
                  ):
                      BurstRuntime(compiled, policy).run(duration=duration)

                  moris = simulate(
                      moris_squad,
                      config={'duration': duration, 'rng_mode': 'expected'},
                      verbose=True,
                  )
                  moris_times = [
                      row.t for row in moris.log.buff_events
                      if row.name == '무결한 유리 2' and row.kind == 'activate'
                  ]
                  self.assertEqual(fast_activations, fast_shots)
                  self.assertEqual(len(fast_activations), len(moris_times))
                  for actual, expected in zip(fast_activations, moris_times):
                      self.assertAlmostEqual(actual, expected, places=9)
                  self.assertAlmostEqual(fast_activations[0], 1.0, places=9)
                  self.assertAlmostEqual(
                      fast_activations[1] - fast_activations[0], 1.0 / 3.0, places=9
                  )

              def test_neighboring_weapon_hit_shapes_remain_fail_closed(self):
                  _team, _moris, _compiled, _actor, effect = self._fixture()
                  helper = TriggerDispatcher._full_charge_hit_permanent_self_charge_speed_shape_supported
                  self.assertFalse(helper(replace(effect, duration=5.0)))
                  self.assertFalse(helper(replace(effect, max_stack=2.0)))
                  self.assertFalse(helper(replace(effect, value=-1.0)))

                  brady_entry = next(
                      entry for entry in snapshot.SQUADS.values()
                      if '브래디' in entry['members']
                  )
                  brady = compile_moris_squad(spec.build_squad(list(brady_entry['members'])))
                  self.assertFalse(any(
                      helper(candidate)
                      for candidate in brady.effects
                      if brady.members[candidate.actor].name == '브래디'
                  ))


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Focused regression
        run: |
          python -m unittest fast_engine.tests.test_damage_full_charge_hit_charge_speed
          python -m unittest fast_engine.tests.test_damage_charge_speed_bullet_lifetime

      - name: Public scope gate
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers
          seen = set()
          matches = []
          cadence = 0
          certified = 0
          helper = TriggerDispatcher._full_charge_hit_permanent_self_charge_speed_shape_supported
          for team, entry in snapshot.SQUADS.items():
              if team.startswith('지그_'):
                  continue
              members = tuple(entry['members'])
              if members in seen:
                  continue
              seen.add(members)
              squad = compile_moris_squad(spec.build_squad(list(members)))
              blockers = static_score_blockers(squad)
              cadence += sum(row.startswith('cadence:') for row in blockers)
              certified += not blockers
              for effect in squad.effects:
                  if helper(effect):
                      matches.append((team, squad.members[effect.actor].name, effect.name, effect.stat))
          assert len(seen) == 23
          assert certified == 2
          assert cadence == 64
          assert len(matches) == 2
          assert {(row[1], row[2], row[3]) for row in matches} == {
              ('신데렐라', '무결한 유리 2', 'charge_speed_pct')
          }
          print('PUBLIC_SCOPE_OK', len(seen), certified, len(seen)-certified, cadence, matches)
          PY

      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'

      - name: Commit production
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/engine/dispatcher.py fast_engine/tests/test_damage_full_charge_hit_charge_speed.py
          git diff --cached --check
          git commit -m "fast: certify full-charge-hit self charge speed"
          git push origin HEAD:fast-engine-phase2-20260901
