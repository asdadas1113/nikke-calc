name: tmp-close-conditional-passive-hole

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-close-conditional-passive-hole.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Add fail-closed guard for unowned conditional passives
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('fast_engine/engine/damage_policy.py')
          t = p.read_text(encoding='utf-8')
          old_import = 'from .targets import TargetMode\nfrom .triggers import TriggerMode\n'
          new_import = 'from .targets import TargetMode\nfrom .target_scope import target_scope_is_static\nfrom .triggers import TriggerMode\n'
          if t.count(old_import) != 1:
              raise SystemExit('damage policy import anchor changed')
          t = t.replace(old_import, new_import, 1)

          anchor = '''def is_static_element_override_score_supported(effect) -> bool:\n'''
          helper = '''def _conditional_passive_runtime_owned(effect) -> bool:\n    """Only accept permanent passive condition families with sparse edge sync.\n\n    A Moris ``passive`` is registered at battle start even while its condition is\n    false. Fast currently owns only the self-stack and named self-state variants,\n    which dispatcher materializes on their sparse state edges. Other conditional\n    passives (for example ``during_full_burst``) must fail closed until an\n    equivalent edge bridge exists.\n    """\n\n    if not (\n        len(effect.triggers) == 1\n        and effect.triggers[0].raw == "passive"\n        and effect.condition_rules\n    ):\n        return True\n    if (\n        effect.duration not in (None, -1.0)\n        or effect.max_stack not in (None, 1, 1.0)\n        or not target_scope_is_static(effect.target_spec)\n        or not effect.target_spec.runtime_supported\n    ):\n        return False\n    if all(\n        rule.mode is ConditionMode.SELF_STACK_AT_LEAST and bool(rule.key)\n        for rule in effect.condition_rules\n    ):\n        return True\n    return all(\n        rule.mode in {ConditionMode.SELF_STATE, ConditionMode.NOT_SELF_STATE}\n        and bool(rule.key)\n        for rule in effect.condition_rules\n    )\n\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('conditional passive helper anchor changed')
          t = t.replace(anchor, helper + anchor, 1)

          old = '''    if not _target_supported(effect.target_spec):\n        return False\n    unsupported_conditions = tuple(\n'''
          new = '''    if not _target_supported(effect.target_spec):\n        return False\n    if not _conditional_passive_runtime_owned(effect):\n        return False\n    unsupported_conditions = tuple(\n'''
          if t.count(old) != 1:
              raise SystemExit('direct support conditional anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('fast_engine/tests/test_damage_false_supported_guards.py')
          t = p.read_text(encoding='utf-8')
          insert = '''\n\ndef _conditional_passive(name: str, stat: str, condition: str):\n    return {\n        "source": "skill1", "type": "buff", "name": name, "stat": stat,\n        "fixed_value": 100.0, "polarity": "beneficial", "target": "self",\n        "duration": -1.0,\n        "trigger": {"timing": ["passive"], "condition": [condition]},\n    }\n'''
          anchor = '\ndef _compiled(raw_effects):\n'
          if t.count(anchor) != 1:
              raise SystemExit('false-supported test helper anchor changed')
          t = t.replace(anchor, insert + anchor, 1)
          old = '''    def test_reference_scaled_permanent_cadence_buff_is_not_static_folded(self):\n        squad = _compiled([_effect("AUDIT scaled reload", "reload_speed_pct", target="self", duration=-1.0, timing="battle_start")])\n        self.assertIn("cadence:라피:AUDIT scaled reload:reload_speed_pct", static_score_blockers(squad))\n'''
          new = old + '''\n    def test_unowned_full_burst_conditional_passive_fails_closed(self):\n        squad = _compiled([_conditional_passive(\n            "AUDIT conditional", "atk_pct", "during_full_burst"\n        )])\n        blockers = static_score_blockers(squad)\n        self.assertIn("normal_delivery:라피:AUDIT conditional:atk_pct", blockers)\n        self.assertIn("skill_state_delivery:라피:AUDIT conditional:atk_pct", blockers)\n'''
          if t.count(old) != 1:
              raise SystemExit('false-supported test insertion anchor changed')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused safety regressions
        run: |
          python -m unittest fast_engine.tests.test_damage_false_supported_guards
          python -m unittest fast_engine.tests.test_conditional_passive_self_stack
      - name: Full Fast regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Recompute public frontier and Dorothy anchors
        run: |
          python - <<'PY'
          from collections import Counter
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus

          unique = {}
          for members, source in _source_corpus():
              unique.setdefault(tuple(members), source)
          family = Counter(); rows=[]
          for members, source in unique.items():
              squad = compile_moris_squad(spec.build_squad(list(members)))
              blockers = static_score_blockers(squad)
              rows.append((source, blockers))
              for blocker in blockers:
                  family[blocker.split(':',1)[0]] += 1
              if any(member.name == '도로시 : 세렌디피티' for member in squad.members):
                  print('DOROTHY', source, len(blockers), tuple(b for b in blockers if '도로시 : 세렌디피티' in b))
          certified = sum(not blockers for _, blockers in rows)
          print('FRONTIER', len(unique), 'CERTIFIED', certified, 'FAMILIES', dict(family))
          assert len(unique) == 23
          assert certified == 2
          PY
      - name: Commit passive guard and remove temporary workflow
        run: |
          rm -f .github/workflows/tmp-close-conditional-passive-hole.yml
          git diff --check
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fast: fail closed on unowned conditional passives"
          git push origin HEAD:fast-engine-phase2-20260901
