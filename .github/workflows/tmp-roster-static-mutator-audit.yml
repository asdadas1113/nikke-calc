name: tmp roster static mutator patch

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - '.github/workflows/tmp-roster-static-mutator-audit.yml'
      - 'fast_engine/research/tmp_roster_static_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply narrow score patch
        run: PYTHONPATH=. python fast_engine/research/tmp_roster_static_patch.py
      - name: Run focused regressions
        run: >-
          PYTHONPATH=. python -m unittest
          fast_engine.tests.test_damage_roster_static_named_remove
          fast_engine.tests.test_damage_named_remove_dependency
          fast_engine.tests.test_damage_false_supported_guards
          fast_engine.tests.test_damage_real_squad_certification
          -v
      - name: Commit semantic patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/engine/score.py fast_engine/tests/test_damage_roster_static_named_remove.py
          git commit -m 'Fast: prove roster-static named removal unreachable'
          git push origin HEAD:fast-engine-phase2-20260901
