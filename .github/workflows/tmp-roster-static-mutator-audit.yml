name: tmp roster static mutator promotion

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - '.github/workflows/tmp-roster-static-mutator-audit.yml'
      - 'fast_engine/research/tmp_roster_static_promotion.py'

jobs:
  promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit public frontier
        run: PYTHONPATH=. python fast_engine/research/tmp_roster_static_promotion.py
      - name: Run complete Fast discovery
        run: PYTHONPATH=. python -m unittest discover -s fast_engine/tests -p 'test_*.py'
