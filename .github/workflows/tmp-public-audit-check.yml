name: tmp-public-audit-check
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public audit count check
        env:
          PYTHONPATH: .
        run: |
          python fast_engine/research/public_ranking_probe.py | head -n 8
