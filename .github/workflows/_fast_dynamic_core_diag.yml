name: Fast weapon-count ammo patch

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply narrow weapon-count ammo bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "fast_engine/engine/dispatcher.py"
          old = "    @staticmethod\n    def is_executable_effect(effect: \"CompiledEffect\") -> bool:\n"
          new = "\n".join([
              "    @staticmethod",
              "    def _weapon_count_ammo_timing_is_only_runtime_blocker(effect: \"CompiledEffect\") -> bool:",
              "        \"\"\"Bridge only reducible physical-count instant ammo refills.\"\"\"",
              "",
              "        blockers = effect.capability.blockers",
              "        if not (",
              "            effect.capability.disposition is CapabilityDisposition.PLANNED",
              "            and set(blockers) == {\"timing:weapon_hit\"}",
              "            and effect.effect_type == \"instant\"",
              "            and (effect.stat or \"\") in {\"ammo_charge_pct\", \"ammo_charge_flat\"}",
              "            and effect.value is not None",
              "            and float(effect.value) >= 0.0",
              "            and effect.target_spec.runtime_supported",
              "            and not effect.condition_rules",
              "            and len(effect.triggers) == 1",
              "        ):",
              "            return False",
              "        rule = effect.triggers[0]",
              "        return (",
              "            rule.mode is TriggerMode.MODULO",
              "            and rule.trigger_count_reducible",
              "            and rule.event_key in {\"hit_count\", \"pellet_hit\"}",
              "            and int(rule.threshold or 0) > 0",
              "        )",
              "",
              "    @staticmethod",
              "    def is_executable_effect(effect: \"CompiledEffect\") -> bool:",
              "",
          ])
          replace_once(path, old, new)
          old = "        capability_ok = (\n            effect.capability.disposition is CapabilityDisposition.READY\n            or TriggerDispatcher._periodic_timing_is_only_blocker(effect)\n            or TriggerDispatcher._state_end_timing_is_only_runtime_blocker(effect)\n        )\n"
          new = "        capability_ok = (\n            effect.capability.disposition is CapabilityDisposition.READY\n            or TriggerDispatcher._periodic_timing_is_only_blocker(effect)\n            or TriggerDispatcher._state_end_timing_is_only_runtime_blocker(effect)\n            or TriggerDispatcher._weapon_count_ammo_timing_is_only_runtime_blocker(effect)\n        )\n"
          replace_once(path, old, new)

          path = "fast_engine/tests/test_damage_dynamic_ammo_charge.py"
          old = "def _named_consumer(effect_id: int = 1) -> CompiledEffect:\n"
          new = "\n".join([
              "def _weapon_count_ammo_effect(*, reducible: bool = True) -> CompiledEffect:",
              "    rule = (",
              "        TriggerRule(\"hit_count:2\", \"hit_count\", TriggerMode.MODULO, threshold=2.0, trigger_count_reducible=True)",
              "        if reducible",
              "        else TriggerRule(\"hit_count\", \"hit_count\", TriggerMode.EVENT)",
              "    )",
              "    return CompiledEffect(",
              "        effect_id=0, actor=0, actor_effect_index=0, source=\"synthetic\", source_tag=\"skill\",",
              "        name=\"count refill\", effect_type=\"instant\", stat=\"ammo_charge_flat\", polarity=\"beneficial\",",
              "        target=\"self\", target_spec=compile_target(\"self\", actor_by_name={\"synthetic-reload\": 0}),",
              "        conditions=(), condition_rules=(), triggers=(rule,), value=2.0, duration=None, max_stack=None,",
              "        max_trigger=None, tick_interval=None, parameters={},",
              "        capability=EffectCapability(",
              "            character=\"synthetic-reload\", index=0, source=\"synthetic\", name=\"count refill\",",
              "            effect_type=\"instant\", stat=\"ammo_charge_flat\", category=EffectCategory.CADENCE_TIMELINE,",
              "            timing_families=(\"weapon_hit\",), condition_families=(), target_family=\"ally_static\",",
              "            advanced_fields=(), disposition=CapabilityDisposition.PLANNED, blockers=(\"timing:weapon_hit\",),",
              "        ),",
              "    )",
              "",
              "",
              "def _named_consumer(effect_id: int = 1) -> CompiledEffect:",
              "",
          ])
          replace_once(path, old, new)

          old = "    def test_named_event_consumer_keeps_ammo_effect_fail_closed(self):\n"
          new = "\n".join([
              "    def test_reducible_hit_count_refill_replans_rapid_cadence(self):",
              "        effect = _weapon_count_ammo_effect()",
              "        squad = _squad((effect,))",
              "        self.assertNotIn(\"cadence:synthetic-reload:count refill:ammo_charge_flat\", static_score_blockers(squad))",
              "        runtime = BurstRuntime(squad, BurstPolicy(duration=2.1, first_burst_time=30.0), EnemyStaticProfile(defense=0.0, duration=2.1))",
              "        observer = StaticNormalAttackObserver(runtime, duration=2.1)",
              "        result = runtime.run(duration=2.1, score_observer=observer)",
              "        observer.finish(events_processed=result.events_processed)",
              "        self.assertEqual(runtime.weapons._rapid_reload._states[0].hit_count, 5)",
              "        self.assertEqual(runtime.dispatcher._activation_counts.get(0, 0), 2)",
              "",
              "    def test_nonreducible_hit_count_refill_stays_fail_closed(self):",
              "        effect = _weapon_count_ammo_effect(reducible=False)",
              "        self.assertIn(\"cadence:synthetic-reload:count refill:ammo_charge_flat\", static_score_blockers(_squad((effect,))))",
              "",
              "    def test_named_event_consumer_keeps_ammo_effect_fail_closed(self):",
              "",
          ])
          replace_once(path, old, new)

          old = "    def test_public_squad1_little_mermaid_ammo_blocker_is_removed(self):\n"
          new = "\n".join([
              "    def test_public_asuka_ludmilla_weapon_count_ammo_blocker_is_removed(self):",
              "        names = [\"리틀 머메이드\", \"나가\", \"크라운\", \"아스카 : WILLE\", \"루드밀라 : 윈터 오너\"]",
              "        compiled = __import__(\"fast_engine.engine.compiler\", fromlist=[\"compile_moris_squad\"]).compile_moris_squad(build_squad(names))",
              "        blockers = static_score_blockers(compiled)",
              "        self.assertNotIn(\"cadence:루드밀라 : 윈터 오너:여왕의 시선 3:ammo_charge_flat\", blockers)",
              "        self.assertIn(\"normal_delivery:크라운:로얄 에타이어 4:atk_dmg_pct\", blockers)",
              "",
              "    def test_public_squad1_little_mermaid_ammo_blocker_is_removed(self):",
              "",
          ])
          replace_once(path, old, new)
          PY

      - name: Focused regression
        run: |
          python -m unittest fast_engine.tests.test_damage_dynamic_ammo_charge
          python -m unittest fast_engine.tests.test_dynamic_weapon_signals
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring
          python -m unittest discover -s fast_engine/tests -p 'test_damage*.py'

      - name: Commit source patch and remove helper
        run: |
          rm .github/workflows/_fast_dynamic_core_diag.yml
          git config user.name "fast-engine-bot"
          git config user.email "fast-engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "impl: support reducible weapon-count ammo refill"
          git push origin HEAD:fast-engine-phase2-20260901
