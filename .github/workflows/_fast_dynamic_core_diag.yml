name: Fast dynamic core diag

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose Ludmilla ammo support
        run: |
          python - <<'PY'
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          import fast_engine.engine.score as s

          names = ["리틀 머메이드", "나가", "크라운", "아스카 : WILLE", "루드밀라 : 윈터 오너"]
          squad = compile_moris_squad(build_squad(names))
          actor = 4
          effect = next(e for e in squad.members[actor].effects if e.name == "여왕의 시선 3")
          print("effect", effect.effect_type, effect.stat, effect.value, [(r.raw, r.event_key, r.mode.value, r.threshold, r.trigger_count_reducible) for r in effect.triggers])
          print("capability", effect.capability.disposition.value, effect.capability.blockers)
          print("dispatcher_executable", TriggerDispatcher.is_executable_effect(effect))
          print("named_safe", s._ammo_charge_named_event_safe(squad, effect))
          print("targets", s._possible_ally_targets(squad, effect))
          print("live_max_ammo", s._actor_has_live_max_ammo_mutation(squad, actor))
          print("rapid_safe", s._rapid_actor_score_safe(squad, actor))
          print("recipient_safe", s._ammo_charge_recipient_score_safe(squad, actor))
          print("dynamic_supported", s._is_dynamic_ammo_charge_score_supported(squad, effect))
          print("member_effects", [
              (e.name, e.effect_type, e.stat, e.value, e.duration, [r.raw for r in e.triggers], e.capability.disposition.value, e.capability.blockers)
              for e in squad.members[actor].effects
          ])
          PY
