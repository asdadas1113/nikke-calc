name: tmp-audit-mutator-dependencies

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-audit-mutator-dependencies.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enumerate state mutators and public dependencies
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.damage_policy import is_direct_damage_buff_runtime_supported
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.engine.target_scope import possible_ally_targets
          from fast_engine.research.public_ranking_probe import _source_corpus

          mutator_stats = {
              'remove_named_buff','buff_stack_add','buff_stack_remove','buff_max_stack_add',
              'buff_stack_init','named_buff_duration_extend','debuff_stack_add','debuff_stack_remove',
          }
          unique={}
          for members,source in _source_corpus(): unique.setdefault(tuple(members),source)
          for members,source in unique.items():
              squad=compile_moris_squad(spec.build_squad(list(members)))
              blockers=static_score_blockers(squad)
              rows=[]
              for e in squad.effects:
                  stat=e.stat or ''
                  if stat not in mutator_stats:
                      continue
                  target_effect=e.parameters.get('target_effect')
                  provider=[]
                  if isinstance(target_effect,str) and target_effect:
                      for p in squad.effects:
                          if p.name != target_effect:
                              continue
                          provider.append({
                              'owner': squad.members[p.actor].name,
                              'name': p.name,
                              'stat': p.stat,
                              'type': p.effect_type,
                              'direct_supported': is_direct_damage_buff_runtime_supported(p),
                              'exec': TriggerDispatcher.is_executable_effect(p),
                          })
                  rows.append({
                      'owner':squad.members[e.actor].name,'name':e.name,'stat':stat,
                      'target':e.target_spec.raw,'target_effect':target_effect,
                      'timings':tuple((r.raw,r.event_key,r.mode.value) for r in e.triggers),
                      'conditions':tuple((r.mode.value,r.key,r.threshold) for r in e.condition_rules),
                      'possible_targets':possible_ally_targets(squad,e),
                      'exec':TriggerDispatcher.is_executable_effect(e),
                      'providers':provider,
                  })
              if rows:
                  print('TEAM',source,'CERTIFIED',not blockers,'BLOCKERS',len(blockers))
                  for row in rows: print('MUT',row)
          PY
      - name: Inspect certified Mint team effects
        run: |
          python - <<'PY'
          from context import snapshot,spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers
          squad=compile_moris_squad(spec.build_squad(list(snapshot.SQUADS['레이드_레드후드퀀시']['members'])))
          print('BLOCKERS',static_score_blockers(squad))
          for e in squad.effects:
              owner=squad.members[e.actor].name
              if owner=='민트':
                  print('MINT',e.effect_id,e.name,e.effect_type,e.stat,e.target_spec.raw,tuple((r.raw,r.event_key,r.mode.value) for r in e.triggers),tuple((r.mode.value,r.key,r.threshold) for r in e.condition_rules),dict(e.parameters),'EXEC',TriggerDispatcher.is_executable_effect(e))
          PY
