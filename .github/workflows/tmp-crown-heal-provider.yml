name: tmp-crown-heal-provider

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Baseline Crown blockers
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.research.public_ranking_probe import _source_corpus
          for members, source_name in _source_corpus():
              if '크라운' not in members:
                  continue
              compiled = compile_moris_squad(spec.build_squad(list(members)))
              rows = [b for b in static_score_blockers(compiled) if '크라운:로얄 에타이어 4:atk_dmg_pct' in b]
              print(source_name, rows)
          PY
      - name: Apply temporary generic stack-heal bridge
        run: python -m fast_engine.research.tmp_apply_crown_stack_heal_bridge
      - name: Trace Crown 43-hit cadence on score runtime
        run: python -m fast_engine.research.tmp_crown_hit43_probe
      - name: Validate Crown stack-heal semantics on score runtime
        run: python -m fast_engine.research.tmp_validate_crown_stack_heal_bridge
      - name: Score Crown self-only public teams
        run: python -m fast_engine.research.tmp_crown_self_only_score_probe
      - name: Focused timing regression
        run: |
          python -m unittest fast_engine.tests.test_damage_dynamic_reload_scoring -v
          python -m unittest fast_engine.tests.test_damage_dynamic_mg_warmup -v
          python -m unittest fast_engine.tests.test_damage_moris_frame_timing -v
          python -m unittest fast_engine.tests.test_damage_rapid_cover_control -v
