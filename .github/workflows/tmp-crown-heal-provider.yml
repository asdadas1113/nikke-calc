name: tmp-crown-heal-provider

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: "contains(github.event.head_commit.message, 'tmp: audit Crown production') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Production public ranking audit
        run: python -m fast_engine.research.public_ranking_probe
      - name: Crown production regressions
        run: python -m unittest fast_engine.tests.test_stack_heal_received_runtime fast_engine.tests.test_damage_moris_frame_timing -v
