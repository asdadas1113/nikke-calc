name: tmp-crown-heal-provider

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe Crown Fast state path
        run: python -m fast_engine.research.tmp_crown_fast_state_probe
