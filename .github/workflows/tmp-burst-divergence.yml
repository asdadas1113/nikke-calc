name: tmp-burst-divergence

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  trace:
    if: ${{ !contains(github.event.head_commit.message, '[skip-burst-divergence]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Trace 100-140s burst divergence
        run: |
          set -o pipefail
          PYTHONPATH=. python fast_engine/research/tmp_trace_burst_divergence.py \
            2>&1 | tee fast_engine/research/tmp_burst_divergence_report.txt
      - name: Record trace report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/research/tmp_burst_divergence_report.txt
          git commit -m 'tmp: record burst divergence trace [skip-burst-divergence] [skip-expiry-core] [skip-expiry-ab] [skip-mg-gate]'
          git push
