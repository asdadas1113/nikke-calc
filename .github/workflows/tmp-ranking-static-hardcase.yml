name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace Moris Red Hood charge window
        shell: bash
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, CharState, simulate
          from calculator.buff_manager import _QUANT_PARTS_KEY
          from context import spec

          names=["라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"]
          squad=spec.build_squad(names)
          cfg=spec.build_config(squad,{'duration':20.0,'first_burst_time':3.0,'rng_mode':'expected'})
          enemy=dict(DEFAULT_ENEMY); enemy['def']=55000.0; enemy['code']='작열'; enemy['core_px']=10.0

          orig=CharState._tick_charge
          def wrapped(self,t,bm,enemy,cfg):
              watch=self.name=='레드 후드' and 13.0<=t<=18.5
              if watch:
                  buffs=bm.get_buffs(self.name,'__enemy__',t)
                  parts=(buffs.get(_QUANT_PARTS_KEY) or {}).get('charge_speed_pct')
                  before=(self._charge_phase,self._charge_start_t,self._charge_end_t,self._post_delay_end_t,self.ammo)
                  eff=self._effective_charge_time(bm,t)
              out=orig(self,t,bm,enemy,cfg)
              if watch:
                  after=(self._charge_phase,self._charge_start_t,self._charge_end_t,self._post_delay_end_t,self.ammo)
                  if before!=after or out:
                      print('TRACE',{
                          't':round(t,9),'before':before,'after':after,'eff':eff,
                          'speed':buffs.get('charge_speed_pct',0.0),'parts':parts,
                          'shots':len(out),
                      })
              return out
          CharState._tick_charge=wrapped
          result=simulate(squad,config=cfg,enemy=enemy,seed=42,verbose=False)
          CharState._tick_charge=orig
          print('DONE',result.total_damage)
          PY
