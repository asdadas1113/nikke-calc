name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trial strict effect expiry with validated cadence
        shell: bash
        run: |
          python - <<'PY'
          from bisect import bisect_left, bisect_right
          from collections import defaultdict
          from dataclasses import replace
          from math import inf

          from calculator.timeline import DEFAULT_ENEMY, DT, simulate
          from context import spec
          from fast_engine.engine.burst import BurstMachine, compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.effects import ActiveEffect
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers
          from fast_engine.engine.weapon import DynamicChargeCadenceRuntime

          MM=("미란다","브리드 : 사일런트 트랙","헬름","루주","미하라 : 본딩 체인")
          RHQ=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          D=180.0; CFG={'duration':D,'first_burst_time':3.0,'rng_mode':'expected'}
          profile=EnemyStaticProfile(defense=55000.0,element='작열',core_uptime=1.0,core_px=10.0,duration=D)
          enemy=dict(DEFAULT_ENEMY); enemy['def']=55000.0; enemy['code']='작열'; enemy['core_px']=10.0

          ticks=[]; t=0.0
          while t<=D+1.0: ticks.append(t); t+=DT
          def charge_tick(x):
              i=bisect_left(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)
          def next_tick(x):
              i=bisect_right(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)+DT
          def burst_tick(x):
              i=bisect_left(ticks,float(x)-1e-9); return ticks[i] if i<len(ticks) else float(x)

          # Moris-style burst observer lattice.
          obsched=BurstMachine._schedule
          def bs(self,scheduler,time,kind,*,stage=None): return obsched(self,scheduler,burst_tick(time),kind,stage=stage)
          BurstMachine._schedule=bs

          # Moris timed buffs remain active until the true stored expiry, with no 1e-9 early cut.
          oactive=ActiveEffect.active
          def strict_active(self,now): return self.expires_at==inf or float(now)<self.expires_at
          ActiveEffect.active=strict_active

          # Validated dynamic-charge cadence + inherited weapon-change magazine semantics.
          oe=DynamicChargeCadenceRuntime._enter_charge; oa=DynamicChargeCadenceRuntime._after_shot
          of=DynamicChargeCadenceRuntime._finish_nonshot_phase; op=DynamicChargeCadenceRuntime._predict_next_boundary; os=DynamicChargeCadenceRuntime.sync
          pending={}
          def pkey(self,a): return (id(self),int(a))
          def pe(self,st,at,now): oe(self,st,at,now); st.phase_end=charge_tick(st.phase_end)
          def pa(self,st,shot):
              oa(self,st,shot)
              if pending.get(pkey(self,st.actor),False) and st.ammo<=0 and st.phase=='post_fire_reload': st.phase='post_fire'
              st.phase_end=charge_tick(st.phase_end)
          def pf(self,st,when,now):
              k=pkey(self,st.actor)
              if st.phase=='post_fire' and pending.get(k,False) and st.ammo<=0:
                  st.phase='post_reload'; st.phase_end=next_tick(when); return
              if st.phase=='post_reload' and pending.get(k,False):
                  st.ammo=self._full_ammo(st.actor,now); pending[k]=False; pe(self,st,when,now); return
              before=st.phase; of(self,st,when,now)
              if before=='post_fire_reload' and st.phase=='reloading': st.phase_end=charge_tick(st.phase_end)
              elif st.phase in {'charging','post_reload'}: st.phase_end=charge_tick(st.phase_end)
          def pp(self,a,now):
              st=replace(self._states[a]); pend=bool(pending.get(pkey(self,a),False))
              while st.phase_end<=self.duration+1e-9:
                  when=st.phase_end
                  if st.phase=='charging':
                      n=st.full_charge_count+1
                      if self._shot_is_boundary(a,n): return when,n
                      oa(self,st,when)
                      if pend and st.ammo<=0 and st.phase=='post_fire_reload': st.phase='post_fire'
                      st.phase_end=charge_tick(st.phase_end); continue
                  if st.phase=='post_fire' and pend and st.ammo<=0:
                      st.phase='post_reload'; st.phase_end=next_tick(when); continue
                  if st.phase=='post_reload' and pend:
                      st.ammo=self._full_ammo(a,now); pend=False; oe(self,st,when,now); st.phase_end=charge_tick(st.phase_end); continue
                  before=st.phase; of(self,st,when,now)
                  if before=='post_fire_reload' and st.phase=='reloading': st.phase_end=charge_tick(st.phase_end)
                  elif st.phase=='charging': st.phase_end=charge_tick(st.phase_end)
              return None
          def ps(self,now):
              for a in self.actors:
                  st=self._states[a]; k=pkey(self,a)
                  while st.phase!='charging' and st.phase_end<=now+1e-9: pf(self,st,st.phase_end,now)
                  wc=self._weapon_change_id(a,now); wc_changed=wc!=st.weapon_change_id
                  if wc_changed:
                      entering=wc is not None; inherited=entering and st.phase in {'charging','post_fire'} and st.ammo>0
                      st.weapon_change_id=wc; self._invalidate(st)
                      if inherited: pending[k]=True
                      else: pending[k]=False; st.ammo=self._full_ammo(a,now)
                      if entering and st.phase=='charging':
                          st.charge_start=float(now); st.phase_end=charge_tick(float(now)+self._effective_charge_time(a,now))
                      elif st.phase in {'post_fire_reload','reloading','post_reload'}: pe(self,st,float(now),float(now))
                      elif not entering and st.phase=='charging': st.phase_end=charge_tick(st.charge_start+self._effective_charge_time(a,now))
                  old=st.signature; new=self._signature(a,now)
                  if new!=old:
                      st.signature=new
                      if not wc_changed:
                          self._invalidate(st)
                          if st.phase=='charging' and (new[4],new[5])!=(old[4],old[5]): st.phase_end=charge_tick(st.charge_start+self._effective_charge_time(a,now))
                  if st.scheduled_time is None: self._plan(a,now)
                  self.state.set_ammo(a,st.ammo)
          DynamicChargeCadenceRuntime._enter_charge=pe; DynamicChargeCadenceRuntime._after_shot=pa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=pf; DynamicChargeCadenceRuntime._predict_next_boundary=pp; DynamicChargeCadenceRuntime.sync=ps

          def build(names,duration=D):
              squad=spec.build_squad(list(names)); cp=compile_moris_squad(squad)
              if static_score_blockers(cp): raise RuntimeError(static_score_blockers(cp))
              policy=compile_burst_policy(squad,cp,dict(CFG, duration=duration))
              return squad,cp,policy
          def moris(names):
              squad,cp,policy=build(names)
              return simulate(squad,config=spec.build_config(squad,dict(CFG)),enemy=enemy,seed=42,verbose=False),cp
          def fast(names):
              squad,cp,policy=build(names)
              return score_static_squad(cp,policy,profile,duration=D),cp

          mm_m,_=moris(MM); rhq_m,_=moris(RHQ)
          mm_f,_=fast(MM); rhq_f,_=fast(RHQ)
          M1=float(mm_m.squad_total); M2=float(rhq_m.squad_total); F1=float(mm_f.squad_total); F2=float(rhq_f.squad_total)
          print('TEAM|MM|m=%.3f|f=%.3f|err=%+.8f' % (M1,F1,F1/M1-1))
          print('TEAM|RHQ|m=%.3f|f=%.3f|err=%+.8f' % (M2,F2,F2/M2-1))
          print('MARGIN|m=%+.8f|f=%+.8f' % ((M1-M2)/max(M1,M2),(F1-F2)/max(F1,F2)))
          print('MM_ACTORS')
          for i,n in enumerate(MM):
              m=float(mm_m.char_total[n]); f=float(mm_f.char_total[i]); print(n,m,f,f/m-1 if m else 0)
          print('RHQ_ACTORS')
          for i,n in enumerate(RHQ):
              m=float(rhq_m.char_total[n]); f=float(rhq_f.char_total[i]); print(n,m,f,f/m-1 if m else 0)

          # Locate Miranda's permanent top-ATK Wake Up! 4 target in Fast.
          squad,cp,policy=build(MM,30.0)
          p30=EnemyStaticProfile(defense=55000.0,element='작열',core_uptime=1.0,core_px=10.0,duration=30.0)
          sink=SimpleDamageScoreSink(cp,p30); rt=BurstRuntime(cp,policy,p30,damage_sink=sink); rt.run(duration=30.0)
          target_effects=[]
          for ae in rt.dispatcher.effects._active.values():
              e=cp.effects[ae.effect_id]
              if e.name=='웨이크업! 4': target_effects.append((ae.effect_id,cp.names[ae.source_actor],cp.names[ae.target],ae.expires_at,ae.stacks))
          print('FAST_WAKEUP4_TARGETS',target_effects)

          ActiveEffect.active=oactive; BurstMachine._schedule=obsched
          DynamicChargeCadenceRuntime._enter_charge=oe; DynamicChargeCadenceRuntime._after_shot=oa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=of; DynamicChargeCadenceRuntime._predict_next_boundary=op; DynamicChargeCadenceRuntime.sync=os
          PY
