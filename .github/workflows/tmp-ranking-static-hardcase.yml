name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply validated timing patch
        if: ${{ !contains(github.event.head_commit.message, '[timing-apply]') }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import urllib.request
          url = 'https://raw.githubusercontent.com/asdadas1113/nikke-calc/64e9524586244e9e9910cce065b9bb69666c6bf1/.github/workflows/tmp-ranking-static-hardcase.yml'
          text = urllib.request.urlopen(url).read().decode()
          marker = "cat > /tmp/payload.b64 <<'EOF'\n"
          payload = text.split(marker, 1)[1].split('\nEOF', 1)[0].strip()
          open('/tmp/apply_timing.py', 'wb').write(base64.b64decode(payload))
          PY
          python /tmp/apply_timing.py
          python -m unittest fast_engine.tests.test_damage_moris_frame_timing
          python -m unittest fast_engine.tests.test_dynamic_weapon_change
          python -m unittest fast_engine.tests.test_damage_dynamic_charge_scoring
          python -m unittest fast_engine.tests.test_burst_machine
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/engine/frame_lattice.py fast_engine/engine/burst.py fast_engine/engine/effects.py fast_engine/engine/weapon.py fast_engine/tests/test_damage_moris_frame_timing.py
          git commit -m "fix: align Fast timing with Moris outer ticks [timing-apply]"
          git push origin HEAD:fast-engine-phase2-20260901
      - name: Applied commit is a no-op
        if: ${{ contains(github.event.head_commit.message, '[timing-apply]') }}
        run: echo "timing patch already applied"
