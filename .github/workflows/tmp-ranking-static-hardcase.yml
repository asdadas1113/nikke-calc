name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run residual normal-skill bias probe
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_normal_squad, score_static_squad, static_score_blockers

          TEAMS = {
              "MM": ("미란다", "브리드 : 사일런트 트랙", "헬름", "루주", "미하라 : 본딩 체인"),
              "RHQ": ("라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"),
          }
          CONFIG = {"duration": 180.0, "first_burst_time": 3.0, "rng_mode": "expected"}
          DEFENSE = 55000.0
          CODE = "작열"
          CORE_PX = 10.0

          for key, members in TEAMS.items():
              squad = spec.build_squad(list(members))
              config = spec.build_config(squad, dict(CONFIG))
              compiled = compile_moris_squad(squad)
              blockers = static_score_blockers(compiled)
              if blockers:
                  raise RuntimeError(f"{key} blockers={blockers}")
              policy = compile_burst_policy(squad, compiled, dict(CONFIG))
              enemy = dict(DEFAULT_ENEMY)
              enemy["def"] = DEFENSE
              enemy["code"] = CODE
              enemy["core_px"] = CORE_PX
              moris = simulate(squad, config=config, enemy=enemy, seed=42, verbose=False)
              profile = EnemyStaticProfile(
                  defense=DEFENSE,
                  element=CODE,
                  core_uptime=1.0,
                  core_px=CORE_PX,
                  duration=policy.duration,
              )
              fast_total = score_static_squad(compiled, policy, profile)
              fast_normal = score_static_normal_squad(compiled, policy, profile)

              m_normal = defaultdict(float)
              m_skill = defaultdict(float)
              normal_hits = Counter()
              skill_hits = Counter()
              skill_damage = defaultdict(lambda: defaultdict(float))
              for hit in moris.hits:
                  if _is_normal(hit):
                      m_normal[hit.caster] += float(hit.damage)
                      normal_hits[hit.caster] += 1
                  else:
                      m_skill[hit.caster] += float(hit.damage)
                      skill_hits[hit.caster] += 1
                      skill_damage[hit.caster][hit.skill_name or hit.hit_tag] += float(hit.damage)

              print(f"TEAM|team={key}|moris={float(moris.squad_total):.3f}|fast={float(fast_total.squad_total):.3f}")
              for idx, name in enumerate(members):
                  mn = m_normal[name]
                  ms = m_skill[name]
                  fn = float(fast_normal.char_total[idx])
                  fs = float(fast_total.char_total[idx]) - fn
                  nerr = fn / mn - 1.0 if mn else 0.0
                  serr = fs / ms - 1.0 if ms else 0.0
                  terr = float(fast_total.char_total[idx]) / float(moris.char_total.get(name, 1.0)) - 1.0
                  print(
                      f"CAT|team={key}|name={name}|moris_normal={mn:.3f}|fast_normal={fn:.3f}|normal_err={nerr:.8f}|"
                      f"moris_skill={ms:.3f}|fast_skill={fs:.3f}|skill_err={serr:.8f}|total_err={terr:.8f}|"
                      f"normal_hits={normal_hits[name]}|skill_hits={skill_hits[name]}"
                  )
                  for skill, dmg in sorted(skill_damage[name].items(), key=lambda kv: -kv[1])[:8]:
                      print(f"SKILL|team={key}|name={name}|skill={skill}|moris_damage={dmg:.3f}")
          PY
