name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate residual charge timing mismatches
        shell: bash
        run: |
          python - <<'PY'
          from bisect import bisect_left, bisect_right
          from dataclasses import replace
          from calculator.timeline import DEFAULT_ENEMY, DT, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, score_static_squad, static_score_blockers
          from fast_engine.engine.weapon import DynamicChargeCadenceRuntime

          NAMES=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          TARGETS=("레드 후드","프리카","민트")
          D=180.0; CFG={'duration':D,'first_burst_time':3.0,'rng_mode':'expected'}
          squad=spec.build_squad(list(NAMES)); config=spec.build_config(squad,dict(CFG)); cp=compile_moris_squad(squad)
          blockers=static_score_blockers(cp)
          if blockers: raise RuntimeError(blockers)
          policy=compile_burst_policy(squad,cp,dict(CFG))
          profile=EnemyStaticProfile(defense=55000.0,element='작열',core_uptime=1.0,core_px=10.0,duration=D)
          enemy=dict(DEFAULT_ENEMY); enemy['def']=55000.0; enemy['code']='작열'; enemy['core_px']=10.0

          moris=simulate(squad,config=config,enemy=enemy,seed=42,verbose=False)
          mts={name:sorted({float(h.t) for h in moris.hits if h.caster==name and _is_normal(h)}) for name in TARGETS}

          ticks=[]; t=0.0
          while t<=181.0:
              ticks.append(t); t+=DT
          def snap(x):
              i=bisect_left(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)
          def next_tick(x):
              i=bisect_right(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)+DT

          oe=DynamicChargeCadenceRuntime._enter_charge
          oa=DynamicChargeCadenceRuntime._after_shot
          of=DynamicChargeCadenceRuntime._finish_nonshot_phase
          op=DynamicChargeCadenceRuntime._predict_next_boundary
          os=DynamicChargeCadenceRuntime.sync
          pending_by_actor={}

          def install(selective):
              pending_by_actor.clear()
              def pe(self,st,at,now_for_mods):
                  oe(self,st,at,now_for_mods); st.phase_end=snap(st.phase_end)
              def pa(self,st,shot_time):
                  oa(self,st,shot_time)
                  if pending_by_actor.get(st.actor,False) and st.ammo<=0 and st.phase=='post_fire_reload':
                      st.phase='post_fire'
                  st.phase_end=snap(st.phase_end)
              def pf(self,st,transition_time,now_for_mods):
                  actor=st.actor
                  if st.phase=='post_fire' and pending_by_actor.get(actor,False) and st.ammo<=0:
                      st.phase='post_reload'; st.phase_end=next_tick(transition_time); return
                  if st.phase=='post_reload' and pending_by_actor.get(actor,False):
                      st.ammo=self._full_ammo(actor,now_for_mods); pending_by_actor[actor]=False
                      pe(self,st,transition_time,now_for_mods); return
                  before=st.phase; of(self,st,transition_time,now_for_mods)
                  if before=='post_fire_reload' and st.phase=='reloading': st.phase_end=snap(st.phase_end)
              def pp(self,actor,now):
                  src=self._states[actor]; st=replace(src); pending=bool(pending_by_actor.get(actor,False))
                  while st.phase_end<=self.duration+1e-9:
                      when=st.phase_end
                      if st.phase=='charging':
                          next_count=st.full_charge_count+1
                          if self._shot_is_boundary(actor,next_count): return when,next_count
                          oa(self,st,when)
                          if pending and st.ammo<=0 and st.phase=='post_fire_reload': st.phase='post_fire'
                          st.phase_end=snap(st.phase_end); continue
                      if st.phase=='post_fire' and pending and st.ammo<=0:
                          st.phase='post_reload'; st.phase_end=next_tick(when); continue
                      if st.phase=='post_reload' and pending:
                          st.ammo=self._full_ammo(actor,now); pending=False
                          oe(self,st,when,now); st.phase_end=snap(st.phase_end); continue
                      before=st.phase; of(self,st,when,now)
                      if before=='post_fire_reload' and st.phase=='reloading': st.phase_end=snap(st.phase_end)
                  return None
              def psy(self,now):
                  for actor in self.actors:
                      st=self._states[actor]
                      while st.phase!='charging' and st.phase_end<=now+1e-9:
                          pf(self,st,st.phase_end,now)
                      current_wc_id=self._weapon_change_id(actor,now)
                      wc_changed=current_wc_id!=st.weapon_change_id
                      if wc_changed:
                          entering=current_wc_id is not None
                          inherited=entering and st.phase in {'charging','post_fire'} and st.ammo>0
                          st.weapon_change_id=current_wc_id; self._invalidate(st)
                          if inherited: pending_by_actor[actor]=True
                          else:
                              pending_by_actor[actor]=False; st.ammo=self._full_ammo(actor,now)
                          if entering and st.phase=='charging':
                              st.charge_start=float(now)
                              st.phase_end=float(now)+self._effective_charge_time(actor,now)
                          elif st.phase in {'post_fire_reload','reloading','post_reload'}:
                              self._enter_charge(st,float(now),float(now))
                          elif not entering and st.phase=='charging':
                              st.phase_end=st.charge_start+self._effective_charge_time(actor,now)
                      old=st.signature; new=self._signature(actor,now)
                      if new!=old:
                          st.signature=new
                          if not wc_changed:
                              self._invalidate(st)
                              if st.phase=='charging':
                                  if selective:
                                      if (new[4],new[5])!=(old[4],old[5]):
                                          st.phase_end=snap(st.charge_start+self._effective_charge_time(actor,now))
                                  else:
                                      st.phase_end=st.charge_start+self._effective_charge_time(actor,now)
                      if st.scheduled_time is None: self._plan(actor,now)
                      self.state.set_ammo(actor,st.ammo)
              DynamicChargeCadenceRuntime._enter_charge=pe
              DynamicChargeCadenceRuntime._after_shot=pa
              DynamicChargeCadenceRuntime._finish_nonshot_phase=pf
              DynamicChargeCadenceRuntime._predict_next_boundary=pp
              DynamicChargeCadenceRuntime.sync=psy

          def reset():
              DynamicChargeCadenceRuntime._enter_charge=oe
              DynamicChargeCadenceRuntime._after_shot=oa
              DynamicChargeCadenceRuntime._finish_nonshot_phase=of
              DynamicChargeCadenceRuntime._predict_next_boundary=op
              DynamicChargeCadenceRuntime.sync=os

          def run_variant(label,selective):
              install(selective)
              pending_by_actor.clear()
              score=score_static_squad(cp,policy,profile)
              pending_by_actor.clear()
              sink=SimpleDamageScoreSink(cp,profile); rt=BurstRuntime(cp,policy,profile,damage_sink=sink)
              target_idx={cp.names.index(name):name for name in TARGETS}
              class O(StaticNormalAttackObserver):
                  def __init__(self,*a,**k): self.ts={n:[] for n in TARGETS}; super().__init__(*a,**k)
                  def _score_shots(self,actor,count,*,eval_time):
                      name=target_idx.get(actor)
                      if name: self.ts[name].extend([float(eval_time)]*int(count))
                      return super()._score_shots(actor,count,eval_time=eval_time)
              obs=O(rt,duration=D); rr=rt.run(duration=D,score_observer=obs); obs.finish(events_processed=rr.events_processed)
              print('VARIANT',label)
              for name in TARGETS:
                  m=mts[name]; f=obs.ts[name]; idx=cp.names.index(name)
                  print(f'HEAD|variant={label}|name={name}|m_count={len(m)}|f_count={len(f)}|score={float(score.char_total[idx]):.3f}')
                  diffs=[]
                  for i,(a,b) in enumerate(zip(m,f)):
                      if abs(a-b)>1e-7:
                          diffs.append((i,a,b,b-a))
                          if len(diffs)>=12: break
                  for i,a,b,d in diffs:
                      print(f'DIFF|variant={label}|name={name}|i={i}|m={a:.9f}|f={b:.9f}|delta={d:+.9f}')
                  for lo in range(0,180,10):
                      mc=sum(lo<=x<lo+10 for x in m); fc=sum(lo<=x<lo+10 for x in f)
                      if mc!=fc: print(f'BIN|variant={label}|name={name}|lo={lo}|m={mc}|f={fc}|delta={fc-mc:+d}')
                  print(f'MTAIL|variant={label}|name={name}|'+','.join(f'{x:.6f}' for x in m[-15:]))
                  print(f'FTAIL|variant={label}|name={name}|'+','.join(f'{x:.6f}' for x in f[-15:]))
              reset()
              return obs.ts

          base=run_variant('base',False)
          sel=run_variant('selective',True)
          for name in TARGETS:
              shown=0
              for i,(a,b) in enumerate(zip(base[name],sel[name])):
                  if abs(a-b)>1e-7:
                      print(f'VAR_DIFF|name={name}|i={i}|base={a:.9f}|selective={b:.9f}|delta={b-a:+.9f}')
                      shown+=1
                      if shown>=12: break
          PY
