name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect certified charge controls
        shell: bash
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          TEAMS={
            'MM':("미란다","브리드 : 사일런트 트랙","헬름","루주","미하라 : 본딩 체인"),
            'RHQ':("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"),
          }
          for label,names in TEAMS.items():
              squad=spec.build_squad(list(names)); compiled=compile_moris_squad(squad)
              for raw,c in zip(squad,compiled.members):
                  w=c.weapon
                  if str(w.get('fire_mode'))=='charge' or w.get('charge_time') is not None:
                      print(f'CHARGE|team={label}|name={c.name}|control={raw.get("control")}|weapon={w}')
                      for e in c.effects:
                          if (e.stat or '') in {'charge_speed_pct','charge_time_flat','post_fire_delay','reload_speed_pct','max_ammo_pct','max_ammo_flat'}:
                              print(f'EFFECT|name={c.name}|source={e.source}|ename={e.name}|stat={e.stat}|value={e.value}|duration={e.duration}|triggers={[r.event_key for r in e.triggers]}')
          PY
