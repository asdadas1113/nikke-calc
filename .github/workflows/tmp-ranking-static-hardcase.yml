name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Moris burst readiness semantics
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import calculator.timeline as tl
          names=[n for n in dir(tl) if 'Burst' in n or 'burst' in n.lower()]
          print('NAMES',names)
          for n in names:
              obj=getattr(tl,n)
              if inspect.isclass(obj) or inspect.isfunction(obj):
                  try:
                      src=inspect.getsource(obj)
                  except Exception:
                      continue
                  if 'cooldown' in src.lower() or 'burst' in n.lower():
                      print('SOURCE_BEGIN',n)
                      print(src)
                      print('SOURCE_END',n)
          PY
