name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DEF actor decomposition probe
        shell: bash
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          TEAMS = {
              "MM": ("미란다", "브리드 : 사일런트 트랙", "헬름", "루주", "미하라 : 본딩 체인"),
              "RHQ": ("라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"),
          }
          CONFIG = {"duration": 180.0, "first_burst_time": 3.0, "rng_mode": "expected"}
          DEF_POINTS = (31784, 40000, 55000, 60000)
          CODE = "작열"
          CORE_PX = 10.0

          built = {}
          for key, members in TEAMS.items():
              squad = spec.build_squad(list(members))
              config = spec.build_config(squad, dict(CONFIG))
              compiled = compile_moris_squad(squad)
              blockers = static_score_blockers(compiled)
              if blockers:
                  raise RuntimeError(f"{key} blockers={blockers}")
              policy = compile_burst_policy(squad, compiled, dict(CONFIG))
              built[key] = (members, squad, config, compiled, policy)

          previous = {}
          for defense in DEF_POINTS:
              for key in ("MM", "RHQ"):
                  members, squad, config, compiled, policy = built[key]
                  enemy = dict(DEFAULT_ENEMY)
                  enemy["def"] = float(defense)
                  enemy["code"] = CODE
                  enemy["core_px"] = CORE_PX
                  moris = simulate(squad, config=config, enemy=enemy, seed=42, verbose=False)
                  fast = score_static_squad(
                      compiled,
                      policy,
                      EnemyStaticProfile(
                          defense=float(defense),
                          element=CODE,
                          core_uptime=1.0,
                          core_px=CORE_PX,
                          duration=policy.duration,
                      ),
                  )
                  if fast.unsupported:
                      raise RuntimeError(f"{key} unsupported={fast.unsupported}")
                  print(f"TEAM|def={defense}|team={key}|moris={float(moris.squad_total):.3f}|fast={float(fast.squad_total):.3f}")
                  for idx, name in enumerate(members):
                      m = float(moris.char_total.get(name, 0.0))
                      f = float(fast.char_total[idx])
                      err = f / m - 1.0 if m else 0.0
                      prev = previous.get((key, name))
                      if prev is None:
                          m_resp = f_resp = 1.0
                      else:
                          pm, pf = prev
                          m_resp = m / pm if pm else 0.0
                          f_resp = f / pf if pf else 0.0
                      print(
                          f"ACTOR|def={defense}|team={key}|name={name}|moris={m:.3f}|fast={f:.3f}|"
                          f"err={err:.8f}|moris_resp={m_resp:.8f}|fast_resp={f_resp:.8f}"
                      )
                      previous[(key, name)] = (m, f)
          PY
