name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Skip applied commit
        if: ${{ contains(github.event.head_commit.message, '[timing-apply]') }}
        run: echo "timing commit already applied"
      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.head_commit.message, '[timing-apply]') }}
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: ${{ !contains(github.event.head_commit.message, '[timing-apply]') }}
        with:
          python-version: '3.13'
      - name: Apply validated timing patch
        if: ${{ !contains(github.event.head_commit.message, '[timing-apply]') }}
        shell: bash
        run: |
          echo '...TRUNCATED...'
