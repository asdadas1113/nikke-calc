name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Red Hood cadence effects
        shell: bash
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad

          names=["라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"]
          cp=compile_moris_squad(spec.build_squad(names))
          actor=cp.names.index('레드 후드')
          print('WEAPON',cp.members[actor].weapon)
          for e in cp.members[actor].effects:
              if e.effect_type=='weapon_change' or (e.stat or '') in {
                  'charge_speed_pct','charge_speed_caster_based_pct','charge_time_flat',
                  'max_ammo_pct','max_ammo_flat','reload_speed_pct','max_ammo_infinite',
                  'charge_speed_overflow_conversion_pct'
              }:
                  print('EFFECT',{
                      'id':e.effect_id,'name':e.name,'type':e.effect_type,'stat':e.stat,
                      'value':e.value,'duration':e.duration,'max_stack':e.max_stack,
                      'max_trigger':e.max_trigger,'params':e.parameters,
                      'triggers':[(r.event_key,r.mode.value,r.threshold) for r in e.triggers],
                      'conditions':[(r.kind,r.key,r.value) for r in e.condition_rules],
                  })
          PY
