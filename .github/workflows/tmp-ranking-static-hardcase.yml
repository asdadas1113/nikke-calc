name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure 180s burst-frame impact
        shell: bash
        run: |
          python - <<'PY'
          from math import ceil
          from calculator.timeline import DEFAULT_ENEMY, DT, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import BurstMachine, compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers

          MEMBERS=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          TARGET="퀀시 : 이스케이프 퀸"; DURATION=180.0
          CONFIG={"duration":DURATION,"first_burst_time":3.0,"rng_mode":"expected"}
          squad=spec.build_squad(list(MEMBERS)); config=spec.build_config(squad,dict(CONFIG))
          compiled=compile_moris_squad(squad); blockers=static_score_blockers(compiled)
          if blockers: raise RuntimeError(blockers)
          policy=compile_burst_policy(squad,compiled,dict(CONFIG)); idx=MEMBERS.index(TARGET)
          enemy=dict(DEFAULT_ENEMY); enemy["def"]=55000.0; enemy["code"]="작열"; enemy["core_px"]=10.0
          profile=EnemyStaticProfile(defense=55000.0,element="작열",core_uptime=1.0,core_px=10.0,duration=DURATION)

          moris=simulate(squad,config=config,enemy=enemy,seed=42,verbose=False)
          m_normal=sum(float(h.damage) for h in moris.hits if h.caster==TARGET and _is_normal(h))
          print(f"M_NORMAL|{m_normal:.3f}")

          def run_fast(label):
              sink=SimpleDamageScoreSink(compiled,profile)
              runtime=BurstRuntime(compiled,policy,profile,damage_sink=sink)
              obs=StaticNormalAttackObserver(runtime,duration=DURATION)
              rr=runtime.run(duration=DURATION,score_observer=obs)
              res=obs.finish(events_processed=rr.events_processed)
              val=float(res.char_total[idx])
              print(f"RESULT|set={label}|normal={val:.3f}|err={val/m_normal-1:.8f}|shots={res.shot_blocks[idx].shots if hasattr(res,'shot_blocks') else 'na'}")
              print(f"STARTS|set={label}|"+",".join(f"{x:.6f}" for x in rr.full_burst_starts))
              return val

          base=run_fast("base")
          orig=BurstMachine._schedule
          def framed_schedule(self,scheduler,time,kind,*,stage=None):
              t=float(time)
              framed=ceil((t-1e-9)/DT)*DT
              return orig(self,scheduler,framed,kind,stage=stage)
          BurstMachine._schedule=framed_schedule
          framed=run_fast("burst_frame")
          print(f"DELTA|base_err={base/m_normal-1:.8f}|frame_err={framed/m_normal-1:.8f}")
          PY
