name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Rouge Moris buff source
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          from calculator.timeline import DEFAULT_ENEMY, CharState, simulate
          from calculator.buff_manager import BuffManager
          from context import spec

          MEMBERS = ("미란다", "브리드 : 사일런트 트랙", "헬름", "루주", "미하라 : 본딩 체인")
          TARGET = "루주"
          print("RESOLVE_SOURCE")
          print(inspect.getsource(BuffManager._resolve_target))

          orig = CharState._charge_fire
          def traced(self, t, bm, enemy, cfg, is_full):
              if self.name == TARGET and t <= 5.3:
                  buffs = bm.get_buffs(self.name, "__enemy__", t)
                  print(f"SHOT_STATE|t={t:.6f}|atk_dmg={buffs.get('atk_dmg_pct')}|received={buffs.get('received_dmg')}|atk_pct={buffs.get('atk_pct')}|atk_flat={buffs.get('atk_flat')}|crit={buffs.get('crit_rate')}|charge_mag={buffs.get('charge_dmg_mag_pct')}")
                  for ab in bm._active:
                      if ab.effect.get("name") in {"소드 코인", "포문 개방 2", "풀 마스콘", "파워 업!"}:
                          print(f"ACTIVE|t={t:.6f}|name={ab.effect.get('name')}|caster={ab.caster}|targets={ab.target_chars}|stat={ab.effect.get('stat')}|value={bm._get_value(ab.effect, ab, ab.caster)}|expires={ab.expires_at}")
              return orig(self, t, bm, enemy, cfg, is_full)
          CharState._charge_fire = traced

          squad = spec.build_squad(list(MEMBERS))
          config = spec.build_config(squad, {"duration": 5.3, "first_burst_time": 3.0, "rng_mode": "expected"})
          enemy = dict(DEFAULT_ENEMY)
          enemy["def"] = 55000.0
          enemy["code"] = "작열"
          enemy["core_px"] = 10.0
          result = simulate(squad, config=config, enemy=enemy, seed=42, verbose=False)
          for h in result.hits:
              if h.caster == TARGET:
                  print(f"HIT|t={h.t:.6f}|tag={h.hit_tag}|skill={h.skill_name}|damage={float(h.damage):.3f}")
          PY
