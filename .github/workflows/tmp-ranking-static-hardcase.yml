name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace Red Hood first cadence divergence
        shell: bash
        run: |
          python - <<'PY'
          from bisect import bisect_left
          from calculator.timeline import DEFAULT_ENEMY, DT, CharState, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers
          from fast_engine.engine.weapon import DynamicChargeCadenceRuntime

          RHQ=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          D=180.0; CFG={'duration':D,'first_burst_time':3.0,'rng_mode':'expected'}
          enemy=dict(DEFAULT_ENEMY); enemy['def']=55000.0; enemy['code']='작열'; enemy['core_px']=10.0
          profile=EnemyStaticProfile(defense=55000.0,element='작열',core_uptime=1.0,core_px=10.0,duration=D)
          ticks=[]; t=0.0
          while t<=181.0: ticks.append(t); t+=DT
          def snap(x):
              i=bisect_left(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)

          squad=spec.build_squad(list(RHQ)); config=spec.build_config(squad,dict(CFG)); cp=compile_moris_squad(squad)
          bl=static_score_blockers(cp)
          if bl: raise RuntimeError(bl)
          po=compile_burst_policy(squad,cp,dict(CFG))

          # Moris frame trace.
          omt=CharState._tick_charge
          def mt(self,t,bm,enemy,cfg):
              if self.name=='레드 후드' and 6.78 <= t <= 7.22:
                  eff=self._effective_charge_time(bm,t)
                  print('M_PRE|t='+repr(t)+f'|phase={self._charge_phase}|charge_start='+repr(self._charge_start_t)+'|charge_end='+repr(self._charge_end_t)+'|post_end='+repr(self._post_delay_end_t)+f'|post={self.post_fire_delay!r}|eff_charge={eff!r}|ammo={self.ammo}')
              ev=omt(self,t,bm,enemy,cfg)
              if self.name=='레드 후드' and 6.78 <= t <= 7.22:
                  print('M_POST|t='+repr(t)+f'|phase={self._charge_phase}|charge_start='+repr(self._charge_start_t)+'|charge_end='+repr(self._charge_end_t)+'|post_end='+repr(self._post_delay_end_t)+f'|events={len(ev)}|ammo={self.ammo}')
              return ev
          CharState._tick_charge=mt
          m=simulate(squad,config=config,enemy=enemy,seed=42,verbose=False)
          CharState._tick_charge=omt
          print('M_SHOTS|'+','.join(repr(float(h.t)) for h in m.hits if h.caster=='레드 후드' and 6.78<=float(h.t)<=7.22))

          # Fast EA + reload-end frame semantics trace.
          oe=DynamicChargeCadenceRuntime._enter_charge
          oa=DynamicChargeCadenceRuntime._after_shot
          of=DynamicChargeCadenceRuntime._finish_nonshot_phase
          def pe(self,st,at,now_for_mods):
              oe(self,st,at,now_for_mods)
              raw=st.phase_end; st.phase_end=snap(st.phase_end)
              if self.squad.names[st.actor]=='레드 후드' and 6.78 <= at <= 7.22:
                  print('F_ENTER|at='+repr(at)+'|raw_end='+repr(raw)+'|snap_end='+repr(st.phase_end)+'|eff_charge='+repr(self._effective_charge_time(st.actor,now_for_mods)))
          def pa(self,st,shot_time):
              oa(self,st,shot_time)
              raw=st.phase_end; post=self.effective_weapon(st.actor,shot_time).get('post_fire_delay',0.0); st.phase_end=snap(st.phase_end)
              if self.squad.names[st.actor]=='레드 후드' and 6.78 <= shot_time <= 7.22:
                  print('F_AFTER|shot='+repr(shot_time)+'|raw_end='+repr(raw)+'|snap_end='+repr(st.phase_end)+'|post='+repr(post)+'|phase='+st.phase)
          def pf(self,st,transition_time,now_for_mods):
              before=st.phase; of(self,st,transition_time,now_for_mods)
              if before=='post_fire_reload' and st.phase=='reloading': st.phase_end=snap(st.phase_end)
          DynamicChargeCadenceRuntime._enter_charge=pe
          DynamicChargeCadenceRuntime._after_shot=pa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=pf
          sink=SimpleDamageScoreSink(cp,profile); runtime=BurstRuntime(cp,po,profile,damage_sink=sink)
          class O(StaticNormalAttackObserver):
              def __init__(self,*a,**k): self.ts=[]; super().__init__(*a,**k)
              def _score_shots(self,actor,count,*,eval_time):
                  if cp.names[actor]=='레드 후드' and 6.78<=float(eval_time)<=7.22: self.ts.extend([float(eval_time)]*int(count))
                  return super()._score_shots(actor,count,eval_time=eval_time)
          obs=O(runtime,duration=D); rr=runtime.run(duration=D,score_observer=obs); obs.finish(events_processed=rr.events_processed)
          print('F_SHOTS|'+','.join(repr(x) for x in obs.ts))
          DynamicChargeCadenceRuntime._enter_charge=oe
          DynamicChargeCadenceRuntime._after_shot=oa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=of
          PY
