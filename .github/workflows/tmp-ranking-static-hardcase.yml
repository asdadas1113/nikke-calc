name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply timing patch
        if: ${{ !contains(github.event.head_commit.message, '[timing-apply]') }}
        run: python fast_engine/research/tmp_apply_moris_timing.py
      - name: Validate focused timing tests
        if: ${{ !contains(github.event.head_commit.message, '[timing-apply]') }}
        run: |
          python -m py_compile fast_engine/engine/frame_lattice.py fast_engine/engine/burst.py fast_engine/engine/effects.py fast_engine/engine/weapon.py fast_engine/tests/test_damage_moris_frame_timing.py
          python -m unittest fast_engine.tests.test_damage_moris_frame_timing
          python -m unittest fast_engine.tests.test_dynamic_weapon_change
          python -m unittest fast_engine.tests.test_damage_dynamic_charge_scoring
          python -m unittest fast_engine.tests.test_burst_machine
          git diff --check
      - name: Commit timing fix
        if: ${{ !contains(github.event.head_commit.message, '[timing-apply]') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/engine/frame_lattice.py fast_engine/engine/burst.py fast_engine/engine/effects.py fast_engine/engine/weapon.py fast_engine/tests/test_damage_moris_frame_timing.py
          git commit -m "fix: align Fast timing with Moris outer ticks [timing-apply]"
          git push origin HEAD:fast-engine-phase2-20260901
      - name: Applied commit no-op
        if: ${{ contains(github.event.head_commit.message, '[timing-apply]') }}
        run: echo "timing patch already applied"
