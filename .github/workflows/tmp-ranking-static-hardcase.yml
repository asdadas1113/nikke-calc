name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate Quency cadence divergence
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers

          MEMBERS = ("라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸")
          TARGET = "퀀시 : 이스케이프 퀸"
          CONFIG = {"duration": 40.0, "first_burst_time": 3.0, "rng_mode": "expected"}
          DEFENSE = 55000.0
          CODE = "작열"
          CORE_PX = 10.0

          squad = spec.build_squad(list(MEMBERS))
          config = spec.build_config(squad, dict(CONFIG))
          compiled = compile_moris_squad(squad)
          if static_score_blockers(compiled):
              raise RuntimeError(static_score_blockers(compiled))
          policy = compile_burst_policy(squad, compiled, dict(CONFIG))
          idx = MEMBERS.index(TARGET)
          enemy = dict(DEFAULT_ENEMY)
          enemy["def"] = DEFENSE; enemy["code"] = CODE; enemy["core_px"] = CORE_PX
          moris = simulate(squad, config=config, enemy=enemy, seed=42, verbose=False)

          grouped = defaultdict(float)
          for h in moris.hits:
              if h.caster == TARGET and _is_normal(h):
                  grouped[round(float(h.t), 6)] += float(h.damage)
          mrows = list(grouped.items())

          profile = EnemyStaticProfile(defense=DEFENSE, element=CODE, core_uptime=1.0, core_px=CORE_PX, duration=40.0)
          class TraceObserver(StaticNormalAttackObserver):
              def __init__(self, runtime, *, duration):
                  self.rows = []
                  super().__init__(runtime, duration=duration)
              def _score_shots(self, actor, count, *, eval_time):
                  before = self.char_total[actor]
                  terms = self.resolver.resolve(actor, now=eval_time) if actor == idx else None
                  super()._score_shots(actor, count, eval_time=eval_time)
                  if actor == idx:
                      self.rows.append((float(eval_time), int(count), self.char_total[actor]-before, terms))

          sink = SimpleDamageScoreSink(compiled, profile)
          runtime = BurstRuntime(compiled, policy, profile, damage_sink=sink)
          observer = TraceObserver(runtime, duration=40.0)
          result = runtime.run(duration=40.0, score_observer=observer)
          observer.finish(events_processed=result.events_processed)
          frows = [(t,d,terms) for t,c,d,terms in observer.rows for _ in range(c)]

          print(f"COUNTS|m={len(mrows)}|f={len(frows)}")
          first = None
          for i in range(min(len(mrows), len(frows))):
              mt, md = mrows[i]
              ft, fd, terms = frows[i]
              if abs(mt-ft) > 0.009 or abs(fd-md) / max(md,1.0) > 0.002:
                  first = i
                  break
          print(f"FIRST_DIVERGENCE|{first}")
          if first is not None:
              lo = max(0, first-12); hi = min(len(mrows), len(frows), first+40)
              for i in range(lo, hi):
                  mt, md = mrows[i]
                  ft, fd, terms = frows[i]
                  print(f"ROW|i={i}|mt={mt:.6f}|ft={ft:.6f}|dt={ft-mt:.6f}|md={md:.3f}|fd={fd:.3f}|ratio={fd/md:.8f}|atk={terms.atk_pct:.3f}|acc={terms.accuracy_pct:.3f}|crit={terms.crit_rate:.3f}|core={terms.core_dmg_pct:.3f}|atk_dmg={terms.atk_dmg_pct:.3f}")

          for lo in range(0,40):
              hi = lo+1
              mc = sum(1 for t,d in mrows if lo <= t < hi)
              fc = sum(1 for t,d,terms in frows if lo <= t < hi)
              md = sum(d for t,d in mrows if lo <= t < hi)
              fd = sum(d for t,d,terms in frows if lo <= t < hi)
              if mc != fc or (md and abs(fd/md-1.0) > 0.003):
                  print(f"BIN|{lo}-{hi}|mc={mc}|fc={fc}|m={md:.3f}|f={fd:.3f}|ratio={(fd/md if md else 0):.8f}")

          print("M_LAST|" + ",".join(f"{t:.6f}:{d:.1f}" for t,d in mrows[-20:]))
          print("F_LAST|" + ",".join(f"{t:.6f}:{d:.1f}" for t,d,terms in frows[-20:]))
          PY
