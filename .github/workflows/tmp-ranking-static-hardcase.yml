name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect stage buff source semantics
        shell: bash
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad

          names=["라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"]
          cp=compile_moris_squad(spec.build_squad(names))
          print('MEMBERS')
          for i,m in enumerate(cp.members):
              print(i,m.name,'base_atk',m.base_atk,'burst',m.burst_stage)
          print('MATCHING_EFFECTS')
          for e in cp.effects:
              if e.name in {'무대, 시작할게.','무대, 시작할게. 2','무대, 시작할게. 3','보컬 효과','계승되는 힘 3'}:
                  print({
                      'id':e.effect_id,
                      'actor':e.actor,
                      'actor_name':cp.members[e.actor].name,
                      'name':e.name,
                      'type':e.effect_type,
                      'stat':e.stat,
                      'value':e.value,
                      'target':e.target,
                      'target_mode':e.target_spec.mode.value,
                      'duration':e.duration,
                      'max_stack':e.max_stack,
                      'max_trigger':e.max_trigger,
                      'triggers':[(r.event_key,r.mode.value,r.threshold) for r in e.triggers],
                      'conditions':[(r.mode.value,r.key,r.value) for r in e.condition_rules],
                      'parameters':e.parameters,
                  })
          PY
