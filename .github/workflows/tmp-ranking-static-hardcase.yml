name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static ranking hardcase probe
        shell: bash
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          TEAMS = {
              "MM": ("미란다", "브리드 : 사일런트 트랙", "헬름", "루주", "미하라 : 본딩 체인"),
              "RHQ": ("라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"),
          }
          CONFIG = {"duration": 180.0, "first_burst_time": 3.0, "rng_mode": "expected"}

          built = {}
          for key, members in TEAMS.items():
              squad = spec.build_squad(list(members))
              config = spec.build_config(squad, dict(CONFIG))
              compiled = compile_moris_squad(squad)
              blockers = static_score_blockers(compiled)
              if blockers:
                  raise RuntimeError(f"{key} blockers={blockers}")
              policy = compile_burst_policy(squad, compiled, dict(CONFIG))
              built[key] = (squad, config, compiled, policy)

          def score_one(key, defense, code, core_px):
              squad, config, compiled, policy = built[key]
              enemy = dict(DEFAULT_ENEMY)
              enemy["def"] = float(defense)
              enemy["code"] = code
              enemy["core_px"] = float(core_px)
              moris = float(simulate(squad, config=config, enemy=enemy, seed=42, verbose=False).squad_total)
              fast = score_static_squad(
                  compiled,
                  policy,
                  EnemyStaticProfile(
                      defense=float(defense),
                      element=code,
                      core_uptime=1.0 if core_px > 0 else 0.0,
                      core_px=float(core_px),
                      duration=policy.duration,
                  ),
              )
              if fast.unsupported:
                  raise RuntimeError(f"{key} unsupported={fast.unsupported}")
              return moris, float(fast.squad_total)

          def row(axis, value, defense, code, core_px):
              mm_m, mm_f = score_one("MM", defense, code, core_px)
              rh_m, rh_f = score_one("RHQ", defense, code, core_px)
              moris_margin = (mm_m - rh_m) / max(mm_m, rh_m)
              fast_margin = (mm_f - rh_f) / max(mm_f, rh_f)
              agree = (moris_margin == 0.0) or (fast_margin == 0.0) or ((moris_margin > 0) == (fast_margin > 0))
              print(
                  "ROW|"
                  f"axis={axis}|value={value}|def={defense}|code={code}|core_px={core_px}|"
                  f"moris_mm={mm_m:.3f}|moris_rhq={rh_m:.3f}|fast_mm={mm_f:.3f}|fast_rhq={rh_f:.3f}|"
                  f"moris_margin={moris_margin:.8f}|fast_margin={fast_margin:.8f}|agree={agree}"
              )

          for defense in (0, 20000, 31784, 40000, 50000, 55000, 60000, 65000, 70000, 80000, 90000):
              row("def", defense, defense, "작열", 10.0)

          for code in ("작열", "수냉", "전격", "철갑", "풍압"):
              row("code", code, 60000, code, 10.0)
          PY
