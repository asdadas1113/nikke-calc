name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace Moris and Fast charge phases
        shell: bash
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, CharState, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers
          from fast_engine.engine.weapon import DynamicChargeCadenceRuntime

          MEMBERS = ("라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸")
          CONFIG = {"duration": 10.0, "first_burst_time": 3.0, "rng_mode": "expected"}
          TARGET = "레드 후드"

          orig_tick = CharState._tick_charge
          def traced_tick(self, t, bm, enemy, cfg):
              if self.name != TARGET:
                  return orig_tick(self, t, bm, enemy, cfg)
              before = (
                  self._charge_phase,
                  round(float(self._charge_start_t), 6),
                  round(float(self._charge_end_t), 6),
                  round(float(self._post_delay_end_t), 6),
                  int(self.ammo),
              )
              out = orig_tick(self, t, bm, enemy, cfg)
              after = (
                  self._charge_phase,
                  round(float(self._charge_start_t), 6),
                  round(float(self._charge_end_t), 6),
                  round(float(self._post_delay_end_t), 6),
                  int(self.ammo),
              )
              if 2.8 <= t <= 7.2 and (before != after or out):
                  eff = float(self._effective_charge_time(bm, t))
                  print(
                      f"MSTATE|t={t:.6f}|before={before}|after={after}|"
                      f"eff_charge={eff:.6f}|post={float(self.post_fire_delay):.6f}|hits={len(out)}"
                  )
              return out
          CharState._tick_charge = traced_tick

          squad = spec.build_squad(list(MEMBERS))
          config = spec.build_config(squad, dict(CONFIG))
          compiled = compile_moris_squad(squad)
          blockers = static_score_blockers(compiled)
          if blockers:
              raise RuntimeError(f"blockers={blockers}")
          policy = compile_burst_policy(squad, compiled, dict(CONFIG))
          idx = MEMBERS.index(TARGET)
          print(f"WEAPON|{compiled.members[idx].weapon}")

          enemy = dict(DEFAULT_ENEMY)
          enemy["def"] = 55000.0
          enemy["code"] = "작열"
          enemy["core_px"] = 0.0
          simulate(squad, config=config, enemy=enemy, seed=42, verbose=False)

          orig_enter = DynamicChargeCadenceRuntime._enter_charge
          orig_after = DynamicChargeCadenceRuntime._after_shot
          orig_sync = DynamicChargeCadenceRuntime.sync

          def f_enter(self, st, at, now_for_mods):
              orig_enter(self, st, at, now_for_mods)
              if st.actor == idx and 2.8 <= at <= 7.2:
                  print(
                      f"FENTER|at={at:.6f}|mods={now_for_mods:.6f}|end={st.phase_end:.6f}|"
                      f"eff_charge={self._effective_charge_time(st.actor, now_for_mods):.6f}"
                  )
          def f_after(self, st, shot_time):
              orig_after(self, st, shot_time)
              if st.actor == idx and 2.8 <= shot_time <= 7.2:
                  print(f"FSHOT|t={shot_time:.6f}|phase={st.phase}|end={st.phase_end:.6f}|ammo={st.ammo}")
          def f_sync(self, now):
              before = None
              st0 = self._states.get(idx)
              if st0 is not None:
                  before = (st0.phase, st0.phase_end, st0.charge_start, st0.ammo)
              orig_sync(self, now)
              st = self._states.get(idx)
              if st is not None and 2.8 <= now <= 7.2:
                  after = (st.phase, st.phase_end, st.charge_start, st.ammo)
                  if before != after:
                      print(f"FSYNC|t={now:.6f}|before={before}|after={after}")
          DynamicChargeCadenceRuntime._enter_charge = f_enter
          DynamicChargeCadenceRuntime._after_shot = f_after
          DynamicChargeCadenceRuntime.sync = f_sync

          profile = EnemyStaticProfile(defense=55000.0, element="작열", core_uptime=0.0, core_px=0.0, duration=10.0)
          sink = SimpleDamageScoreSink(compiled, profile)
          runtime = BurstRuntime(compiled, policy, profile, damage_sink=sink)
          observer = StaticNormalAttackObserver(runtime, duration=policy.duration)
          result = runtime.run(duration=policy.duration, score_observer=observer)
          observer.finish(events_processed=result.events_processed)
          PY
