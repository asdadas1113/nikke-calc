name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure same-frame weapon ordering contribution
        shell: bash
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers
          from fast_engine.engine.scheduler import EventKind, _EVENT_PHASE

          TEAMS = {
              "MM": ("미란다", "브리드 : 사일런트 트랙", "헬름", "루주", "미하라 : 본딩 체인"),
              "RHQ": ("라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"),
          }
          CONFIG = {"duration": 180.0, "first_burst_time": 3.0, "rng_mode": "expected"}
          enemy = dict(DEFAULT_ENEMY)
          enemy["def"] = 55000.0; enemy["code"] = "작열"; enemy["core_px"] = 10.0
          profile = EnemyStaticProfile(defense=55000.0, element="작열", core_uptime=1.0, core_px=10.0, duration=180.0)

          built={}; ms={}
          for key,members in TEAMS.items():
              squad=spec.build_squad(list(members))
              config=spec.build_config(squad, dict(CONFIG))
              compiled=compile_moris_squad(squad)
              blockers=static_score_blockers(compiled)
              if blockers: raise RuntimeError(f"{key}:{blockers}")
              policy=compile_burst_policy(squad, compiled, dict(CONFIG))
              moris=simulate(squad, config=config, enemy=enemy, seed=42, verbose=False)
              built[key]=(members,compiled,policy,moris)
              ms[key]=float(moris.squad_total)

          def fast_scores():
              out={}
              rows={}
              for key,(members,compiled,policy,moris) in built.items():
                  fast=score_static_squad(compiled,policy,profile)
                  out[key]=float(fast.squad_total)
                  rows[key]=[(name,float(moris.char_total[name]),float(fast.char_total[i])) for i,name in enumerate(members)]
              return out,rows

          before,brows=fast_scores()
          old=_EVENT_PHASE[EventKind.WEAPON_BOUNDARY]
          _EVENT_PHASE[EventKind.WEAPON_BOUNDARY]=29
          after,arows=fast_scores()
          _EVENT_PHASE[EventKind.WEAPON_BOUNDARY]=old

          def margin(scores):
              return (scores['MM']-scores['RHQ'])/max(scores['MM'],scores['RHQ'])
          print(f"MARGIN|moris={margin(ms):.8f}|before={margin(before):.8f}|after={margin(after):.8f}")
          for key in TEAMS:
              print(f"TEAM|{key}|m={ms[key]:.3f}|before={before[key]:.3f}|after={after[key]:.3f}|before_err={before[key]/ms[key]-1:.8f}|after_err={after[key]/ms[key]-1:.8f}")
              for (name,mt,fb),(_,_,fa) in zip(brows[key],arows[key]):
                  print(f"ACTOR|team={key}|name={name}|m={mt:.3f}|before={fb:.3f}|after={fa:.3f}|before_err={fb/mt-1:.8f}|after_err={fa/mt-1:.8f}")
          PY
