name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate charge cadence drift
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers

          MEMBERS = ("라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸")
          TARGETS = ("레드 후드", "프리카", "민트")
          CONFIG = {"duration": 180.0, "first_burst_time": 3.0, "rng_mode": "expected"}

          class TraceObserver(StaticNormalAttackObserver):
              def __init__(self, runtime, *, duration):
                  self.trace = defaultdict(list)
                  super().__init__(runtime, duration=duration)
              def _score_shots(self, actor, count, *, eval_time):
                  if actor in self.dynamic_charge_actors:
                      self.trace[actor].extend([float(eval_time)] * int(count))
                  return super()._score_shots(actor, count, eval_time=eval_time)

          squad = spec.build_squad(list(MEMBERS))
          config = spec.build_config(squad, dict(CONFIG))
          compiled = compile_moris_squad(squad)
          blockers = static_score_blockers(compiled)
          if blockers:
              raise RuntimeError(f"blockers={blockers}")
          policy = compile_burst_policy(squad, compiled, dict(CONFIG))
          enemy = dict(DEFAULT_ENEMY)
          enemy["def"] = 55000.0
          enemy["code"] = "작열"
          enemy["core_px"] = 0.0
          moris = simulate(squad, config=config, enemy=enemy, seed=42, verbose=False)

          profile = EnemyStaticProfile(defense=55000.0, element="작열", core_uptime=0.0, core_px=0.0, duration=policy.duration)
          sink = SimpleDamageScoreSink(compiled, profile)
          runtime = BurstRuntime(compiled, policy, profile, damage_sink=sink)
          observer = TraceObserver(runtime, duration=policy.duration)
          print("DYNAMIC|" + ",".join(MEMBERS[i] for i in observer.dynamic_charge_actors))
          result = runtime.run(duration=policy.duration, score_observer=observer)
          observer.finish(events_processed=result.events_processed)

          moris_times = defaultdict(list)
          for hit in moris.hits:
              if _is_normal(hit) and hit.caster in TARGETS:
                  moris_times[hit.caster].append(float(hit.t))

          for name in TARGETS:
              idx = MEMBERS.index(name)
              if idx in observer.dynamic_charge_actors:
                  fast_times = observer.trace[idx]
              else:
                  fast_times = []
                  for block in observer.cursors[idx].blocks:
                      fast_times.extend(block.first_time + j * block.interval for j in range(block.count))
              mt = moris_times[name]
              print(f"TIME|name={name}|moris_count={len(mt)}|fast_count={len(fast_times)}")
              print(f"FIRST|name={name}|moris={','.join(f'{x:.4f}' for x in mt[:12])}|fast={','.join(f'{x:.4f}' for x in fast_times[:12])}")
              print(f"LAST|name={name}|moris={','.join(f'{x:.4f}' for x in mt[-12:])}|fast={','.join(f'{x:.4f}' for x in fast_times[-12:])}")
              mb = Counter(int(x // 20) for x in mt)
              fb = Counter(int(x // 20) for x in fast_times)
              print("BINS|name=" + name + "|" + ",".join(f"{20*b}-{20*b+20}:M{mb[b]}/F{fb[b]}" for b in range(9)))
          PY
