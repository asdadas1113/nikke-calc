name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decompose Quency 60s damage
        shell: bash
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, score_static_normal_squad, static_score_blockers

          MEMBERS=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          TARGET="퀀시 : 이스케이프 퀸"; DURATION=60.0
          CONFIG={"duration":DURATION,"first_burst_time":3.0,"rng_mode":"expected"}
          squad=spec.build_squad(list(MEMBERS)); config=spec.build_config(squad,dict(CONFIG))
          compiled=compile_moris_squad(squad); blockers=static_score_blockers(compiled)
          if blockers: raise RuntimeError(blockers)
          policy=compile_burst_policy(squad,compiled,dict(CONFIG)); idx=MEMBERS.index(TARGET)
          enemy=dict(DEFAULT_ENEMY); enemy["def"]=55000.0; enemy["code"]="작열"; enemy["core_px"]=10.0
          profile=EnemyStaticProfile(defense=55000.0,element="작열",core_uptime=1.0,core_px=10.0,duration=DURATION)

          moris=simulate(squad,config=config,enemy=enemy,seed=42,verbose=False)
          m_normal=sum(float(h.damage) for h in moris.hits if h.caster==TARGET and _is_normal(h))
          m_total=float(moris.char_total[TARGET]); m_skill=m_total-m_normal
          m_shots=len({round(float(h.t),9) for h in moris.hits if h.caster==TARGET and _is_normal(h)})

          fast_total=score_static_squad(compiled,policy,profile)
          fast_normal=score_static_normal_squad(compiled,policy,profile,duration=DURATION)
          f_total=float(fast_total.char_total[idx]); f_normal=float(fast_normal.char_total[idx]); f_skill=f_total-f_normal

          print(f"TOTAL|m={m_total:.3f}|f={f_total:.3f}|err={f_total/m_total-1:.8f}")
          print(f"NORMAL|m={m_normal:.3f}|f={f_normal:.3f}|err={f_normal/m_normal-1:.8f}|m_shots={m_shots}")
          print(f"SKILL|m={m_skill:.3f}|f={f_skill:.3f}|err={f_skill/m_skill-1:.8f}")
          PY
