name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect decoded patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import urllib.request
          url = 'https://raw.githubusercontent.com/asdadas1113/nikke-calc/64e9524586244e9e9910cce065b9bb69666c6bf1/.github/workflows/tmp-ranking-static-hardcase.yml'
          text = urllib.request.urlopen(url).read().decode()
          marker = "cat > /tmp/payload.b64 <<'EOF'\n"
          payload = text.split(marker, 1)[1].split('\nEOF', 1)[0].strip()
          decoded = base64.b64decode(payload).decode()
          for i, line in enumerate(decoded.splitlines(), 1):
              if 88 <= i <= 130:
                  print(f'{i:04d}: {line!r}')
          try:
              compile(decoded, '/tmp/apply_timing.py', 'exec')
          except SyntaxError as exc:
              print('SYNTAX', exc.lineno, exc.offset, exc.msg)
              raise
          PY
