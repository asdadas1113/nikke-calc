name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate inherited-ammo overcorrection
        shell: bash
        run: |
          python - <<'PY'
          from bisect import bisect_left, bisect_right
          from calculator.timeline import DEFAULT_ENEMY, DT, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers
          from fast_engine.engine.weapon import DynamicChargeCadenceRuntime

          NAMES=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          D=180.0; CFG={'duration':D,'first_burst_time':3.0,'rng_mode':'expected'}
          enemy=dict(DEFAULT_ENEMY); enemy['def']=55000.0; enemy['code']='작열'; enemy['core_px']=10.0
          profile=EnemyStaticProfile(defense=55000.0,element='작열',core_uptime=1.0,core_px=10.0,duration=D)
          ticks=[]; t=0.0
          while t<=181.0: ticks.append(t); t+=DT
          def snap(x):
              i=bisect_left(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)
          def next_tick(x):
              i=bisect_right(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)+DT

          squad=spec.build_squad(list(NAMES)); config=spec.build_config(squad,dict(CFG)); cp=compile_moris_squad(squad)
          bl=static_score_blockers(cp)
          if bl: raise RuntimeError(bl)
          po=compile_burst_policy(squad,cp,dict(CFG)); actor=cp.names.index('레드 후드')
          moris=simulate(squad,config=config,enemy=enemy,seed=42,verbose=False)
          mts=sorted({float(h.t) for h in moris.hits if h.caster=='레드 후드' and h.skill_name is None})

          oe=DynamicChargeCadenceRuntime._enter_charge; oa=DynamicChargeCadenceRuntime._after_shot
          of=DynamicChargeCadenceRuntime._finish_nonshot_phase; os=DynamicChargeCadenceRuntime.sync
          actor_pending={}; copy_pending={}
          def actual(self,st): return self._states.get(st.actor) is st
          def pending(self,st):
              if actual(self,st): return actor_pending.get(st.actor,False)
              return copy_pending.setdefault(id(st),actor_pending.get(st.actor,False))
          def set_pending(self,st,value):
              if actual(self,st): actor_pending[st.actor]=bool(value)
              else: copy_pending[id(st)]=bool(value)
          def pe(self,st,at,now_for_mods): oe(self,st,at,now_for_mods); st.phase_end=snap(st.phase_end)
          def pa(self,st,shot_time):
              oa(self,st,shot_time)
              if pending(self,st) and st.ammo<=0 and st.phase=='post_fire_reload': st.phase='post_fire'
              st.phase_end=snap(st.phase_end)
          def pf(self,st,transition_time,now_for_mods):
              if st.phase=='post_fire' and pending(self,st) and st.ammo<=0:
                  st.phase='post_reload'; st.phase_end=next_tick(transition_time); return
              if st.phase=='post_reload' and pending(self,st):
                  st.ammo=self._full_ammo(st.actor,now_for_mods); set_pending(self,st,False); pe(self,st,transition_time,now_for_mods); return
              before=st.phase; of(self,st,transition_time,now_for_mods)
              if before=='post_fire_reload' and st.phase=='reloading': st.phase_end=snap(st.phase_end)
          def psy(self,now):
              for a in self.actors:
                  st=self._states[a]
                  while st.phase!='charging' and st.phase_end<=now+1e-9: pf(self,st,st.phase_end,now)
                  current=self._weapon_change_id(a,now); changed_wc=current!=st.weapon_change_id
                  if changed_wc:
                      entering=current is not None; inherited=entering and st.phase in {'charging','post_fire'}
                      st.weapon_change_id=current; self._invalidate(st)
                      if inherited: actor_pending[a]=True
                      else: actor_pending[a]=False; st.ammo=self._full_ammo(a,now)
                      if entering and st.phase=='charging': st.charge_start=float(now); st.phase_end=snap(float(now)+self._effective_charge_time(a,now))
                      elif st.phase in {'post_fire_reload','reloading','post_reload'} and not inherited: pe(self,st,float(now),float(now))
                      elif not entering and st.phase=='charging': st.phase_end=snap(st.charge_start+self._effective_charge_time(a,now))
                  signature=self._signature(a,now); changed=signature!=st.signature
                  if changed:
                      st.signature=signature
                      if not changed_wc:
                          self._invalidate(st)
                          if st.phase=='charging': st.phase_end=st.charge_start+self._effective_charge_time(a,now)
                  if st.scheduled_time is None: self._plan(a,now)
                  self.state.set_ammo(a,st.ammo)
          DynamicChargeCadenceRuntime._enter_charge=pe; DynamicChargeCadenceRuntime._after_shot=pa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=pf; DynamicChargeCadenceRuntime.sync=psy

          sink=SimpleDamageScoreSink(cp,profile); rt=BurstRuntime(cp,po,profile,damage_sink=sink)
          class O(StaticNormalAttackObserver):
              def __init__(self,*a,**k): self.ts=[]; super().__init__(*a,**k)
              def _score_shots(self,a,count,*,eval_time):
                  if a==actor: self.ts.extend([float(eval_time)]*int(count))
                  return super()._score_shots(a,count,eval_time=eval_time)
          obs=O(rt,duration=D); rr=rt.run(duration=D,score_observer=obs); obs.finish(events_processed=rr.events_processed)
          fts=obs.ts
          print(f'TOTAL|m={len(mts)}|f={len(fts)}|delta={len(fts)-len(mts)}')
          for lo in range(0,180,10):
              hi=lo+10
              mc=sum(lo<=x<hi for x in mts); fc=sum(lo<=x<hi for x in fts)
              if mc!=fc: print(f'BIN|lo={lo}|hi={hi}|m={mc}|f={fc}|delta={fc-mc}')
          print('M_0_20|'+','.join(f'{x:.6f}' for x in mts if x<20))
          print('F_0_20|'+','.join(f'{x:.6f}' for x in fts if x<20))
          # nearest same-index divergence after allowing tiny floating noise
          for i,(m,f) in enumerate(zip(mts,fts)):
              if abs(m-f)>0.02:
                  print(f'FIRST_INDEX_DIVERGENCE|i={i}|m={m:.9f}|f={f:.9f}|delta={f-m:+.9f}')
                  print('M_AROUND|'+','.join(f'{x:.6f}' for x in mts[max(0,i-6):i+12]))
                  print('F_AROUND|'+','.join(f'{x:.6f}' for x in fts[max(0,i-6):i+12]))
                  break
          DynamicChargeCadenceRuntime._enter_charge=oe; DynamicChargeCadenceRuntime._after_shot=oa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=of; DynamicChargeCadenceRuntime.sync=os
          PY
