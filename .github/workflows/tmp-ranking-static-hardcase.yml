name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decompose matched charge cadence damage
        shell: bash
        run: |
          python - <<'PY'
          from bisect import bisect_left
          from calculator.timeline import DT
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers
          from fast_engine.engine.weapon import DynamicChargeCadenceRuntime

          TEAMS={
            'MM':("미란다","브리드 : 사일런트 트랙","헬름","루주","미하라 : 본딩 체인"),
            'RHQ':("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"),
          }
          MORIS_ACTOR={
            '미란다':293239789.0,'브리드 : 사일런트 트랙':172087812.0,'헬름':1365843066.0,'루주':136122279.0,'미하라 : 본딩 체인':1565317726.0,
            '라피 : 레드 후드':475777021.0,'레드 후드':924584568.0,'프리카':454595046.0,'민트':205844576.0,'퀀시 : 이스케이프 퀸':1468108292.0,
          }
          MORIS_TEAM={'MM':3532610672.0,'RHQ':3528909503.0}
          D=180.0; CFG={'duration':D,'first_burst_time':3.0,'rng_mode':'expected'}
          profile=EnemyStaticProfile(defense=55000.0,element='작열',core_uptime=1.0,core_px=10.0,duration=D)
          ticks=[]; t=0.0
          while t<=181.0: ticks.append(t); t+=DT
          def snap(x):
              i=bisect_left(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)

          built={}
          for label,names in TEAMS.items():
              sq=spec.build_squad(list(names)); cp=compile_moris_squad(sq); bl=static_score_blockers(cp)
              if bl: raise RuntimeError((label,bl))
              built[label]=(names,cp,compile_burst_policy(sq,cp,dict(CFG)))

          oe=DynamicChargeCadenceRuntime._enter_charge
          oa=DynamicChargeCadenceRuntime._after_shot
          of=DynamicChargeCadenceRuntime._finish_nonshot_phase
          def reset():
              DynamicChargeCadenceRuntime._enter_charge=oe
              DynamicChargeCadenceRuntime._after_shot=oa
              DynamicChargeCadenceRuntime._finish_nonshot_phase=of
          def install(ea=False,reload_end=False):
              reset()
              if ea:
                  def pe(self,st,at,now_for_mods): oe(self,st,at,now_for_mods); st.phase_end=snap(st.phase_end)
                  def pa(self,st,shot_time): oa(self,st,shot_time); st.phase_end=snap(st.phase_end)
                  DynamicChargeCadenceRuntime._enter_charge=pe; DynamicChargeCadenceRuntime._after_shot=pa
              if reload_end:
                  def pf(self,st,transition_time,now_for_mods):
                      before=st.phase; of(self,st,transition_time,now_for_mods)
                      if before=='post_fire_reload' and st.phase=='reloading': st.phase_end=snap(st.phase_end)
                  DynamicChargeCadenceRuntime._finish_nonshot_phase=pf

          def run(tag,ea=False,reload_end=False):
              install(ea,reload_end); totals={}
              for label,(names,cp,po) in built.items():
                  r=score_static_squad(cp,po,profile); total=sum(float(v) for v in r.char_total); totals[label]=total
                  print(f'TEAM|set={tag}|team={label}|m={MORIS_TEAM[label]:.3f}|f={total:.3f}|err={total/MORIS_TEAM[label]-1:.8f}|delta={total-MORIS_TEAM[label]:.3f}')
                  for i,name in enumerate(names):
                      f=float(r.char_total[i]); m=MORIS_ACTOR[name]
                      print(f'ACTOR|set={tag}|team={label}|name={name}|m={m:.3f}|f={f:.3f}|err={f/m-1:.8f}|delta={f-m:.3f}')
              margin=(totals['MM']-totals['RHQ'])/max(totals.values())
              mm=(MORIS_TEAM['MM']-MORIS_TEAM['RHQ'])/max(MORIS_TEAM.values())
              print(f'MARGIN|set={tag}|fast={margin:.8f}|moris={mm:.8f}|delta={margin-mm:+.8f}')

          run('base')
          run('ea',ea=True)
          run('ea_reload_end',ea=True,reload_end=True)
          reset()
          PY
