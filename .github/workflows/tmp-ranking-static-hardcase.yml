name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decompose MM residual under combined cadence trial
        shell: bash
        run: |
          python - <<'PY'
          from bisect import bisect_left
          from calculator.timeline import DEFAULT_ENEMY, DT, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import BurstMachine, compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, _dynamic_charge_score_actors, static_score_blockers
          from fast_engine.engine.weapon import DynamicChargeCadenceRuntime

          NAMES=("미란다","브리드 : 사일런트 트랙","헬름","루주","미하라 : 본딩 체인")
          D=180.0; CFG={'duration':D,'first_burst_time':3.0,'rng_mode':'expected'}
          enemy=dict(DEFAULT_ENEMY); enemy['def']=55000.0; enemy['code']='작열'; enemy['core_px']=10.0
          profile=EnemyStaticProfile(defense=55000.0,element='작열',core_uptime=1.0,core_px=10.0,duration=D)
          squad=spec.build_squad(list(NAMES)); cp=compile_moris_squad(squad)
          if static_score_blockers(cp): raise RuntimeError(static_score_blockers(cp))
          policy=compile_burst_policy(squad,cp,dict(CFG))
          print('DYNAMIC_CHARGE',[(a,cp.names[a],cp.members[a].weapon.get('weapon_type')) for a in _dynamic_charge_score_actors(cp)])
          print('WEAPON_CHANGES',[(e.actor,cp.names[e.actor],e.name) for e in cp.effects if e.effect_type=='weapon_change'])

          moris=simulate(squad,config=spec.build_config(squad,dict(CFG)),enemy=enemy,seed=42,verbose=False)
          mnormal={n:0.0 for n in NAMES}
          for h in moris.hits:
              if h.caster in mnormal and _is_normal(h): mnormal[h.caster]+=float(h.damage)

          ticks=[]; t=0.0
          while t<=D+1.0: ticks.append(t); t+=DT
          def ct(x):
              i=bisect_left(ticks,float(x)); return ticks[i] if i<len(ticks) else float(x)
          def bt(x):
              i=bisect_left(ticks,float(x)-1e-9); return ticks[i] if i<len(ticks) else float(x)

          obsched=BurstMachine._schedule
          def bs(self,scheduler,time,kind,*,stage=None): return obsched(self,scheduler,bt(time),kind,stage=stage)
          BurstMachine._schedule=bs

          oe=DynamicChargeCadenceRuntime._enter_charge; oa=DynamicChargeCadenceRuntime._after_shot
          of=DynamicChargeCadenceRuntime._finish_nonshot_phase; os=DynamicChargeCadenceRuntime.sync
          def pe(self,st,at,now): oe(self,st,at,now); st.phase_end=ct(st.phase_end)
          def pa(self,st,shot): oa(self,st,shot); st.phase_end=ct(st.phase_end)
          def pf(self,st,when,now): of(self,st,when,now); st.phase_end=ct(st.phase_end)
          def ps(self,now):
              for a in self.actors:
                  st=self._states[a]
                  while st.phase!='charging' and st.phase_end<=now+1e-9: pf(self,st,st.phase_end,now)
                  wc=self._weapon_change_id(a,now); wc_changed=wc!=st.weapon_change_id
                  if wc_changed:
                      entering=wc is not None; st.weapon_change_id=wc; self._invalidate(st); st.ammo=self._full_ammo(a,now)
                      if entering and st.phase=='charging':
                          st.charge_start=float(now); st.phase_end=ct(float(now)+self._effective_charge_time(a,now))
                      elif st.phase in {'post_fire_reload','reloading','post_reload'}: pe(self,st,float(now),float(now))
                      elif not entering and st.phase=='charging': st.phase_end=ct(st.charge_start+self._effective_charge_time(a,now))
                  old=st.signature; new=self._signature(a,now)
                  if new!=old:
                      st.signature=new
                      if not wc_changed:
                          self._invalidate(st)
                          if st.phase=='charging' and (new[4],new[5])!=(old[4],old[5]):
                              st.phase_end=ct(st.charge_start+self._effective_charge_time(a,now))
                  if st.scheduled_time is None: self._plan(a,now)
                  self.state.set_ammo(a,st.ammo)
          DynamicChargeCadenceRuntime._enter_charge=pe; DynamicChargeCadenceRuntime._after_shot=pa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=pf; DynamicChargeCadenceRuntime.sync=ps

          sink=SimpleDamageScoreSink(cp,profile); rt=BurstRuntime(cp,policy,profile,damage_sink=sink)
          obs=StaticNormalAttackObserver(rt,duration=D); rr=rt.run(duration=D,score_observer=obs); fnormal=obs.finish(events_processed=rr.events_processed)
          print('TEAM|m=%.3f|f=%.3f|err=%+.8f' % (float(moris.squad_total),sum(fnormal.char_total)+sum(sink.char_total),(sum(fnormal.char_total)+sum(sink.char_total))/float(moris.squad_total)-1))
          for i,n in enumerate(NAMES):
              mt=float(moris.char_total[n]); mn=mnormal[n]; ms=mt-mn
              fn=float(fnormal.char_total[i]); fs=float(sink.char_total[i]); ft=fn+fs
              print('ACTOR|%s|total_m=%.3f|total_f=%.3f|terr=%+.8f|normal_m=%.3f|normal_f=%.3f|nerr=%+.8f|skill_m=%.3f|skill_f=%.3f|serr=%+.8f' % (
                  n,mt,ft,ft/mt-1 if mt else 0,mn,fn,fn/mn-1 if mn else 0,ms,fs,fs/ms-1 if ms else 0))

          BurstMachine._schedule=obsched
          DynamicChargeCadenceRuntime._enter_charge=oe; DynamicChargeCadenceRuntime._after_shot=oa
          DynamicChargeCadenceRuntime._finish_nonshot_phase=of; DynamicChargeCadenceRuntime.sync=os
          PY
