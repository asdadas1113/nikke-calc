name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trial rapid nonshot frame boundaries
        shell: bash
        run: |
          python - <<'PY'
          from math import ceil
          from calculator.timeline import DEFAULT_ENEMY, DT, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers
          from fast_engine.engine.dynamic_reload import DynamicRapidReloadRuntime
          from fast_engine.engine.dynamic_rapid import DynamicRapidCadenceRuntime

          TEAMS={
              "MM":("미란다","브리드 : 사일런트 트랙","헬름","루주","미하라 : 본딩 체인"),
              "RHQ":("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"),
          }
          DURATION=180.0
          CONFIG={"duration":DURATION,"first_burst_time":3.0,"rng_mode":"expected"}
          enemy=dict(DEFAULT_ENEMY); enemy["def"]=55000.0; enemy["code"]="작열"; enemy["core_px"]=10.0
          profile=EnemyStaticProfile(defense=55000.0,element="작열",core_uptime=1.0,core_px=10.0,duration=DURATION)
          built={}; moris_scores={}
          for key,members in TEAMS.items():
              squad=spec.build_squad(list(members)); config=spec.build_config(squad,dict(CONFIG))
              compiled=compile_moris_squad(squad); blockers=static_score_blockers(compiled)
              if blockers: raise RuntimeError(f"{key}:{blockers}")
              policy=compile_burst_policy(squad,compiled,dict(CONFIG))
              moris=simulate(squad,config=config,enemy=enemy,seed=42,verbose=False)
              built[key]=(members,compiled,policy,moris); moris_scores[key]=float(moris.squad_total)

          def score_set(label):
              out={}; rows={}
              for key,(members,compiled,policy,moris) in built.items():
                  fast=score_static_squad(compiled,policy,profile)
                  out[key]=float(fast.squad_total)
                  rows[key]=[(n,float(moris.char_total[n]),float(fast.char_total[i])) for i,n in enumerate(members)]
              print(f"SET|{label}")
              for key in TEAMS:
                  print(f"TEAM|set={label}|team={key}|m={moris_scores[key]:.3f}|f={out[key]:.3f}|err={out[key]/moris_scores[key]-1:.8f}")
                  for n,m,f in rows[key]: print(f"ACTOR|set={label}|team={key}|name={n}|m={m:.3f}|f={f:.3f}|err={f/m-1:.8f}")
              return out
          def margin(s): return (s['MM']-s['RHQ'])/max(s['MM'],s['RHQ'])
          base=score_set('base')

          def frame_at_or_after(t):
              x=float(t)
              return ceil((x-1e-9)/DT)*DT

          orig_base=DynamicRapidReloadRuntime._finish_nonshot_phase
          def q_base(self,st,transition_time):
              q=frame_at_or_after(transition_time)
              if q>transition_time+1e-9:
                  st.phase_end=q
                  return
              return orig_base(self,st,transition_time)
          DynamicRapidReloadRuntime._finish_nonshot_phase=q_base

          orig_rapid=DynamicRapidCadenceRuntime._finish_nonshot_phase
          def q_rapid(self,st,transition_time):
              q=frame_at_or_after(transition_time)
              if q>transition_time+1e-9:
                  st.phase_end=q
                  return
              return orig_rapid(self,st,transition_time)
          DynamicRapidCadenceRuntime._finish_nonshot_phase=q_rapid

          framed=score_set('rapid_nonshot_frame')
          print(f"MARGINS|moris={margin(moris_scores):.8f}|base={margin(base):.8f}|framed={margin(framed):.8f}")
          PY
