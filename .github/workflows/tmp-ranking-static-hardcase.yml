name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Mihara body-contact effect
        shell: bash
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          names=["미란다","브리드 : 사일런트 트랙","헬름","루주","미하라 : 본딩 체인"]
          cp=compile_moris_squad(spec.build_squad(names))
          a=cp.names.index('미하라 : 본딩 체인')
          print('MEMBER',cp.members[a])
          for e in cp.effects:
              if e.actor!=a: continue
              print({
                  'id':e.effect_id,'idx':e.actor_effect_index,'name':e.name,'type':e.effect_type,
                  'stat':e.stat,'value':e.value,'duration':e.duration,'max_stack':e.max_stack,
                  'triggers':[(r.event_key,r.mode.value,r.threshold,r.raw) for r in e.triggers],
                  'conditions':[(r.mode.value,r.key,r.value) for r in e.condition_rules],
                  'target':e.target,'params':e.parameters,
              })
          PY
