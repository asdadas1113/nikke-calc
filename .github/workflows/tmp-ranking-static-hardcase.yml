name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trial paired rapid reload frame latching
        shell: bash
        run: |
          python - <<'PY'
          from bisect import bisect_left
          from collections import defaultdict
          from calculator.timeline import DEFAULT_ENEMY, DT, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.dynamic_rapid import DynamicRapidCadenceRuntime
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers

          MEMBERS=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          TARGET="퀀시 : 이스케이프 퀸"; DURATION=180.0
          CONFIG={"duration":DURATION,"first_burst_time":3.0,"rng_mode":"expected"}
          squad=spec.build_squad(list(MEMBERS)); config=spec.build_config(squad,dict(CONFIG))
          compiled=compile_moris_squad(squad); blockers=static_score_blockers(compiled)
          if blockers: raise RuntimeError(blockers)
          policy=compile_burst_policy(squad,compiled,dict(CONFIG)); idx=MEMBERS.index(TARGET)
          enemy=dict(DEFAULT_ENEMY); enemy["def"]=55000.0; enemy["code"]="작열"; enemy["core_px"]=10.0
          profile=EnemyStaticProfile(defense=55000.0,element="작열",core_uptime=1.0,core_px=10.0,duration=DURATION)

          print("WEAPON|"+repr(compiled.members[idx].weapon))
          ticks=[]; t=0.0
          while t <= DURATION + 1.0:
              ticks.append(t); t += DT
          def frame_at_or_after(deadline):
              i=bisect_left(ticks,float(deadline))
              return ticks[i] if i < len(ticks) else float(deadline)

          moris=simulate(squad,config=config,enemy=enemy,seed=42,verbose=True)
          for row in moris.log.reload_log[:20]:
              if getattr(row,'caster','')==TARGET:
                  print(f"M_RELOAD|t={float(row.t):.9f}|event={row.event}")
          mstarts=[float(r.t) for r in moris.log.burst_log if r.event=="full_burst 시작"]
          mends=[float(r.t) for r in moris.log.burst_log if r.event=="full_burst 종료"]
          mcaster=[getattr(r,'caster','') for r in moris.log.burst_log if r.event=="stage:3 사용"]
          mrows=defaultdict(lambda:[0,0.0]); by_time=defaultdict(float)
          for h in moris.hits:
              if h.caster==TARGET and _is_normal(h): by_time[round(float(h.t),9)]+=float(h.damage)
          def classify(t,starts,ends,casters):
              for i,(s,e) in enumerate(zip(starts,ends)):
                  if s-1e-9 <= t < e-1e-9:
                      return 'FB_Q' if i < len(casters) and casters[i]==TARGET else 'FB_OTHER'
              return 'OUT'
          for shot_t,d in by_time.items():
              k=classify(shot_t,mstarts,mends,mcaster); mrows[k][0]+=1; mrows[k][1]+=d
          m_normal=sum(v[1] for v in mrows.values())

          class O(StaticNormalAttackObserver):
              def __init__(self,*a,**k): self.rows=[]; super().__init__(*a,**k)
              def _score_shots(self,actor,count,*,eval_time):
                  before=float(self.char_total[actor]); out=super()._score_shots(actor,count,eval_time=eval_time)
                  if actor==idx: self.rows.append((float(eval_time),int(count),float(self.char_total[actor])-before))
                  return out
          def run_fast(label):
              sink=SimpleDamageScoreSink(compiled,profile); runtime=BurstRuntime(compiled,policy,profile,damage_sink=sink)
              obs=O(runtime,duration=DURATION); rr=runtime.run(duration=DURATION,score_observer=obs); res=obs.finish(events_processed=rr.events_processed)
              fcaster=[compiled.names[a] for t,a,s in rr.casts if s=='3']; frows=defaultdict(lambda:[0,0.0])
              for shot_t,c,d in obs.rows:
                  k=classify(shot_t,rr.full_burst_starts,rr.full_burst_ends,fcaster); frows[k][0]+=c; frows[k][1]+=d
              total=float(res.char_total[idx]); print(f"TOTAL|set={label}|f={total:.3f}|err={total/m_normal-1:.8f}")
              for k in ('OUT','FB_OTHER','FB_Q'):
                  mc,md=mrows[k]; fc,fd=frows[k]
                  print(f"PART|set={label}|{k}|m_shots={mc}|f_shots={fc}|delta={fc-mc}|dmg_err={fd/md-1:.8f}")
              return total

          base=run_fast('base')
          orig_after=DynamicRapidCadenceRuntime._after_shot
          orig_finish=DynamicRapidCadenceRuntime._finish_nonshot_phase
          actual_logs=[]
          def patched_after(self,st,shot_time):
              orig_after(self,st,shot_time)
              if st.phase=='reload_wait':
                  before=st.phase_end; st.phase_end=frame_at_or_after(before)
                  if self._states.get(st.actor) is st and st.actor==idx and len(actual_logs)<20:
                      actual_logs.append(('wait',shot_time,before,st.phase_end))
          def patched_finish(self,st,transition_time):
              was=st.phase
              orig_finish(self,st,transition_time)
              if was=='reload_wait' and st.phase=='reloading':
                  before=st.phase_end; st.phase_end=frame_at_or_after(before)
                  if self._states.get(st.actor) is st and st.actor==idx and len(actual_logs)<20:
                      actual_logs.append(('reload',transition_time,before,st.phase_end))
          DynamicRapidCadenceRuntime._after_shot=patched_after
          DynamicRapidCadenceRuntime._finish_nonshot_phase=patched_finish
          paired=run_fast('reload_start_complete_frame')
          print(f"DELTA|base_err={base/m_normal-1:.8f}|paired_err={paired/m_normal-1:.8f}")
          for kind,anchor,before,after in actual_logs:
              print(f"F_PHASE|kind={kind}|anchor={anchor:.9f}|deadline={before:.9f}|frame={after:.9f}|delay={after-before:.9f}")
          PY
