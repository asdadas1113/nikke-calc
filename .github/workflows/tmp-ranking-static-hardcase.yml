name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast-only post-clamp ranking grid
        shell: bash
        run: |
          python - <<'PY'
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          MM=("미란다","브리드 : 사일런트 트랙","헬름","루주","미하라 : 본딩 체인")
          RHQ=("라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸")
          DURATION=180.0
          CONFIG={"duration":DURATION,"first_burst_time":3.0,"rng_mode":"expected"}

          def prepare(members):
              squad=spec.build_squad(list(members)); compiled=compile_moris_squad(squad)
              blockers=static_score_blockers(compiled)
              if blockers: raise RuntimeError((members,blockers))
              return compiled,compile_burst_policy(squad,compiled,dict(CONFIG))
          prepared={"MM":prepare(MM),"RHQ":prepare(RHQ)}

          def total(team,defense,core):
              compiled,policy=prepared[team]
              profile=EnemyStaticProfile(defense=float(defense),element="작열",core_uptime=1.0 if core>0 else 0.0,core_px=float(core),duration=DURATION)
              result=score_static_squad(compiled,policy,profile)
              return sum(float(v) for v in result.char_total)

          mismatches=[]
          def row(axis,value,defense,core,expected):
              mm=total("MM",defense,core); rhq=total("RHQ",defense,core)
              margin=(mm-rhq)/max(mm,rhq)
              order="MM" if margin>0 else "RHQ" if margin<0 else "TIE"
              agree=order==expected
              if not agree: mismatches.append((axis,value,expected,order,margin))
              print(f"FASTGRID|axis={axis}|value={value}|def={defense}|core={core}|mm={mm:.3f}|rhq={rhq:.3f}|margin={margin:.8f}|expected_moris={expected}|fast_order={order}|agree={agree}")

          for defense,expected in ((0,"MM"),(20000,"MM"),(31784,"MM"),(40000,"MM"),(50000,"MM"),(55000,"MM"),(60000,"RHQ"),(65000,"RHQ"),(70000,"RHQ"),(80000,"RHQ"),(90000,"RHQ")):
              row("def",defense,defense,10,expected)
          for core,expected in ((0,"MM"),(10,"RHQ"),(20,"RHQ"),(30,"RHQ"),(40,"RHQ"),(52,"RHQ")):
              row("core",core,60000,core,expected)
          print(f"SUMMARY|points=17|mismatches={len(mismatches)}|rows={mismatches}")
          PY
