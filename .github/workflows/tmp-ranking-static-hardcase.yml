name: tmp-ranking-static-hardcase

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace Moris stage buff activations
        shell: bash
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec

          names=["라피 : 레드 후드","레드 후드","프리카","민트","퀀시 : 이스케이프 퀸"]
          squad=spec.build_squad(names)
          cfg=spec.build_config(squad,{'duration':130.0,'first_burst_time':3.0,'rng_mode':'expected'})
          enemy=dict(DEFAULT_ENEMY); enemy['def']=55000.0; enemy['code']='작열'; enemy['core_px']=10.0
          r=simulate(squad,config=cfg,enemy=enemy,seed=42,verbose=False)
          print('RESULT_ATTRS',sorted(k for k in vars(r) if not k.startswith('_')))
          for attr in ('buff_events','events','buffs'):
              rows=getattr(r,attr,None)
              if rows is None: continue
              print('ATTR',attr,'len',len(rows))
              for row in rows:
                  s=str(row)
                  t=getattr(row,'t',getattr(row,'time',None))
                  if t is not None and 120.0<=float(t)<=130.0 and ('무대, 시작할게. 3' in s or '무대, 시작할게.' in s):
                      print('ROW',row)
          PY
