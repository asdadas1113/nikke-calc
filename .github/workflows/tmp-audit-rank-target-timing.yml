name: tmp-audit-rank-target-timing

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-audit-rank-target-timing.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit public dynamic-rank target timing surfaces
        run: |
          python - <<'PY'
          from collections import defaultdict
          from context import spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_policy import is_direct_damage_buff_runtime_supported
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers
          from fast_engine.engine.targets import TargetMode
          from fast_engine.research.public_ranking_probe import _source_corpus

          rank_modes={TargetMode.TOP_ATK,TargetMode.TOP_ATK_EXCL_SELF,TargetMode.LOWEST_ATK_BURST3}
          atk_stats={'atk_pct','atk_flat','atk_caster_based_pct','atk_from_hp_pct','atk_copy','atk_buff_mag_pct'}
          unique={}
          for members,source in _source_corpus(): unique.setdefault(tuple(members),source)
          for members,source in unique.items():
              squad=compile_moris_squad(spec.build_squad(list(members)))
              blockers=static_score_blockers(squad)
              rank=[e for e in squad.effects if e.target_spec.mode in rank_modes]
              if not rank: continue
              print('TEAM',source,'CERTIFIED',not blockers,'BLOCKERS',len(blockers),'MEMBERS',members)
              by_event=defaultdict(list)
              for e in squad.effects:
                  for r in e.triggers:
                      by_event[(e.actor,r.event_key)].append(e)
              for e in rank:
                  keys=tuple(r.event_key for r in e.triggers)
                  print('RANK',e.effect_id,squad.members[e.actor].name,e.name,e.stat,e.effect_type,e.target_spec.raw,
                        'TRIG',keys,'COND',tuple(r.raw for r in e.condition_rules),
                        'EXEC',TriggerDispatcher.is_executable_effect(e),
                        'DIRECT',is_direct_damage_buff_runtime_supported(e))
                  for key in keys:
                      siblings=by_event.get((e.actor,key),())
                      for s in siblings:
                          if s.effect_id==e.effect_id: continue
                          if (s.stat or '') in atk_stats:
                              print('  SAME_ACTOR_EVENT_ATK',s.effect_id,s.name,s.stat,s.effect_type,s.target_spec.raw,
                                    'COND',tuple(r.raw for r in s.condition_rules),
                                    'EXEC',TriggerDispatcher.is_executable_effect(s),
                                    'DIRECT',is_direct_damage_buff_runtime_supported(s))
                      # Also show all ATK-changing effects from any actor on this global lifecycle event.
                      if key in {'battle_start','burst_cast','full_burst_start','full_burst_end'} or (key or '').startswith('burst_enter:'):
                          for s in squad.effects:
                              if s.effect_id==e.effect_id or (s.stat or '') not in atk_stats: continue
                              if any(r.event_key==key for r in s.triggers):
                                  print('  GLOBAL_EVENT_ATK',s.effect_id,squad.members[s.actor].name,s.name,s.stat,s.target_spec.raw,
                                        'EXEC',TriggerDispatcher.is_executable_effect(s),
                                        'DIRECT',is_direct_damage_buff_runtime_supported(s))
          PY
      - name: Audit certified Miranda ordering details
        run: |
          python - <<'PY'
          from context import snapshot,spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          squad=compile_moris_squad(spec.build_squad(list(snapshot.SQUADS['컨트롤_미란다미하라']['members'])))
          print('BLOCKERS',static_score_blockers(squad))
          for e in squad.effects:
              print('EFFECT',e.effect_id,squad.members[e.actor].name,e.name,e.effect_type,e.stat,e.target_spec.raw,
                    tuple((r.raw,r.event_key) for r in e.triggers),tuple(r.raw for r in e.condition_rules),dict(e.parameters))
          PY
