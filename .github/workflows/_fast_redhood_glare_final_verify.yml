name: Fast Glaring Eyes final verification
on:
  push:
    branches: [fast-engine-phase2-20260901]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Update stale expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fast_engine/tests/test_named_buff_event_runtime.py')
          s=p.read_text(encoding='utf-8')
          old='''        self.assertTrue(any("레드 후드:글레링 아이즈:charge_speed_pct" in item for item in blockers))\n'''
          new='''        self.assertFalse(any("레드 후드:글레링 아이즈:charge_speed_pct" in item for item in blockers))\n'''
          if old not in s: raise SystemExit('stale expectation anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Run focused and full Fast tests
        run: |
          python -m unittest fast_engine.tests.test_damage_dynamic_charge_scoring fast_engine.tests.test_named_buff_event_runtime -v
          python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Standard public audit and Mint diagnosis
        run: |
          python - <<'PY'
          from context.snapshot import SQUADS
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers
          rows=[]
          target=None
          for name,row in SQUADS.items():
              if name.startswith('지그_'): continue
              members=list(row.get('members') or ())
              if len(members)!=5: continue
              squad=compile_moris_squad(build_squad(members))
              blockers=static_score_blockers(squad)
              rows.append((name,blockers))
              if name=='레이드_레드후드퀀시': target=(members,squad,blockers)
          print('PUBLIC_COUNT',len(rows))
          cert=[n for n,b in rows if not b]
          print('CERTIFIED_COUNT',len(cert))
          print('CERTIFIED',cert)
          if target:
              members,squad,blockers=target
              print('REDHOOD_BLOCKERS',list(blockers))
              mint=members.index('민트')
              for e in squad.members[mint].effects:
                  if '다 함께 불러주세요! 2' == (e.name or ''):
                      print('MINT_EFFECT',e.effect_id,e.name,'type=',e.effect_type,'stat=',e.stat,'value=',e.value,'duration=',e.duration,'max_stack=',e.max_stack,'target=',e.target,'params=',e.parameters,'cap=',e.capability.disposition,e.capability.blockers,'exec=',TriggerDispatcher.is_executable_effect(e))
                      print('MINT_TRIGGERS',[(r.raw,r.event_key,r.mode.value,r.threshold,r.trigger_count_reducible) for r in e.triggers])
                      print('MINT_CONDS',[(r.raw,r.mode.value,r.key,r.threshold) for r in e.condition_rules])
          PY
      - name: Commit expectation update
        run: |
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add fast_engine/tests/test_named_buff_event_runtime.py
          git commit -m "test: update Glaring Eyes certification expectation"
          git push origin HEAD:fast-engine-phase2-20260901
      - name: Remove helper
        if: always()
        run: |
          git pull --rebase origin fast-engine-phase2-20260901 || true
          rm -f .github/workflows/_fast_redhood_glare_final_verify.yml
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add -A
          git commit -m "chore: remove final Glaring Eyes verification helper" || exit 0
          git push origin HEAD:fast-engine-phase2-20260901
