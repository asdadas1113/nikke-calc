name: tmp-frontier-next-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brady:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Brady compiled shape
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.score import static_score_blockers

          for team, entry in snapshot.SQUADS.items():
              if team.startswith('지그_') or '브래디' not in entry['members']:
                  continue
              squad = compile_moris_squad(spec.build_squad(list(entry['members'])))
              print('\nTEAM', team, tuple(m.name for m in squad.members))
              print('BLOCKERS', static_score_blockers(squad))
              for effect in squad.effects:
                  owner = squad.members[effect.actor].name
                  keys = tuple(rule.event_key for rule in effect.triggers)
                  if owner != '브래디' and not any('stat_applied' in (key or '') for key in keys):
                      continue
                  print('---')
                  print('OWNER', owner)
                  print('ID', effect.effect_id)
                  print('NAME', effect.name)
                  print('TYPE', effect.effect_type, 'STAT', effect.stat)
                  print('CAP', effect.capability.disposition.value, tuple(effect.capability.blockers))
                  print('EXEC', TriggerDispatcher.is_executable_effect(effect))
                  print('TARGET', effect.target_spec.mode.value, 'runtime=', effect.target_spec.runtime_supported)
                  print('VALUE', effect.value, 'DURATION', effect.duration, 'MAX_STACK', effect.max_stack, 'MAX_TRIGGER', effect.max_trigger)
                  print('PARAMS', dict(effect.parameters))
                  print('TRIGGERS', [(r.mode.value, r.event_key, r.interval, r.threshold, r.trigger_count_reducible) for r in effect.triggers])
                  print('CONDS', [(r.mode.value, getattr(r, 'stat', None), getattr(r, 'threshold', None)) for r in effect.condition_rules])
          PY
      - name: Locate stat-applied source semantics
        run: |
          echo '=== stat_applied grep ==='
          grep -Rni --exclude-dir=.git -E 'stat[_:-]?applied|stat applied' calculator fast_engine context || true
          echo '=== named-event grep ==='
          grep -Rni --exclude-dir=.git -E 'named_event|named event|event:\{' calculator fast_engine | head -200 || true
      - name: Moris Brady trace
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from calculator.timeline import simulate

          team = next(name for name, entry in snapshot.SQUADS.items() if not name.startswith('지그_') and '브래디' in entry['members'])
          squad = spec.build_squad(list(snapshot.SQUADS[team]['members']))
          result = simulate(squad, config={'duration': 40.0, 'rng_mode': 'expected'}, verbose=True)
          print('TEAM', team)
          for row in result.log.buff_events:
              if row.caster == '브래디' or row.target == '브래디' or '브래디' in str(row):
                  print('BUFF_EVENT', row)
          print('ALL_BRADY_SKILLS')
          brady = next(member for member in squad.members if member.name == '브래디')
          for effect in brady.effects:
              print(effect)
          PY
