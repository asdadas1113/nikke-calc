name: tmp-frontier-next-20260905

on:
  push:
    branches:
      - fast-engine-phase2-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brady-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply runner-only patch and public semantic probe
        run: python .github/scripts/tmp_brady_stat_applied_ab.py
      - name: Focused regressions
        run: |
          python -m unittest -v \
            fast_engine.tests.test_damage_full_charge_hit_charge_speed \
            fast_engine.tests.test_damage_charge_speed_bullet_lifetime \
            fast_engine.tests.test_damage_charge_hold_control \
            fast_engine.tests.test_named_event_control \
            fast_engine.tests.test_named_buff_duration_extend
