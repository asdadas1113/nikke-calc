name: Fast Red Hood Glaring Eyes implementation
on:
  push:
    branches: [fast-engine-phase2-20260901]
permissions:
  contents: write
jobs:
  impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Apply narrow on-attack charge stack and overflow conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          # dispatcher: narrowly execute self on_attack charge-speed stacks and static overflow conversion
          p=Path('fast_engine/engine/dispatcher.py')
          s=p.read_text(encoding='utf-8')
          anchor='''    @classmethod\n    def _timed_shield_shape_supported(cls, effect: "CompiledEffect") -> bool:\n'''
          insert='''    @staticmethod\n    def _on_attack_charge_speed_shape_supported(effect: "CompiledEffect") -> bool:\n        """Bridge only a simple self charge-speed stack driven by one physical attack."""\n        if not (\n            effect.capability.disposition is CapabilityDisposition.PLANNED\n            and set(effect.capability.blockers) == {"timing:weapon_hit"}\n            and effect.effect_type == "buff"\n            and (effect.stat or "") == "charge_speed_pct"\n            and effect.target_spec.mode is TargetMode.SELF\n            and effect.value is not None\n            and effect.duration is not None\n            and float(effect.duration) > 0.0\n            and effect.max_stack is not None\n            and float(effect.max_stack) >= 1.0\n            and not effect.parameters\n            and not effect.condition_rules\n            and len(effect.triggers) == 1\n        ):\n            return False\n        rule = effect.triggers[0]\n        return rule.mode is TriggerMode.EVENT and rule.event_key == "on_attack"\n\n    @staticmethod\n    def _charge_overflow_conversion_shape_supported(effect: "CompiledEffect") -> bool:\n        """Certify immutable self charge-speed overflow conversion."""\n        return (\n            effect.effect_type == "buff"\n            and (effect.stat or "") == "charge_speed_overflow_conversion_pct"\n            and effect.target_spec.mode is TargetMode.SELF\n            and effect.value is not None\n            and float(effect.value) >= 0.0\n            and effect.duration in (None, -1.0)\n            and effect.max_stack in (None, 1, 1.0)\n            and not effect.parameters\n            and not effect.condition_rules\n            and len(effect.triggers) == 1\n            and effect.triggers[0].mode is TriggerMode.EVENT\n            and effect.triggers[0].event_key == "battle_start"\n        )\n\n'''
          if anchor not in s: raise SystemExit('dispatcher helper anchor missing')
          s=s.replace(anchor,insert+anchor,1)
          old='''        if (\n            TriggerDispatcher._named_event_control_shape_supported(effect)\n            or TriggerDispatcher._named_duration_extend_shape_supported(effect)\n        ):\n            return True\n'''
          new='''        if (\n            TriggerDispatcher._named_event_control_shape_supported(effect)\n            or TriggerDispatcher._named_duration_extend_shape_supported(effect)\n            or TriggerDispatcher._on_attack_charge_speed_shape_supported(effect)\n            or TriggerDispatcher._charge_overflow_conversion_shape_supported(effect)\n        ):\n            return True\n'''
          if old not in s: raise SystemExit('dispatcher executable anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # dynamic weapon: every physical charge shot can emit on_attack after scoring
          p=Path('fast_engine/engine/dynamic_weapon.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''        "_raw_full_charge_actors",\n        "_score_actors",\n''','''        "_raw_full_charge_actors",\n        "_raw_on_attack_actors",\n        "_score_actors",\n''',1)
          old='''        hit_thresholds: dict[int, tuple[int, ...]] = {}\n        raw_full_charge_actors: set[int] = set()\n'''
          new='''        hit_thresholds: dict[int, tuple[int, ...]] = {}\n        raw_full_charge_actors: set[int] = set()\n        raw_on_attack_actors: set[int] = set()\n'''
          if old not in s: raise SystemExit('dynamic declarations anchor missing')
          s=s.replace(old,new,1)
          old='''                    if (\n                        rule.event_key == "full_charge_hit"\n                        and rule.mode is TriggerMode.EVENT\n                    ):\n                        raw_full_charge_actors.add(actor)\n'''
          new='''                    if (\n                        rule.event_key == "full_charge_hit"\n                        and rule.mode is TriggerMode.EVENT\n                    ):\n                        raw_full_charge_actors.add(actor)\n                    if (\n                        rule.event_key == "on_attack"\n                        and rule.mode is TriggerMode.EVENT\n                    ):\n                        raw_on_attack_actors.add(actor)\n'''
          if old not in s: raise SystemExit('dynamic trigger anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''        interesting = set(hit_thresholds) | raw_full_charge_actors\n''','''        interesting = set(hit_thresholds) | raw_full_charge_actors | raw_on_attack_actors\n''',1)
          old='''            if str(character.weapon.get("fire_mode") or "") != "charge":\n                if actor in raw_full_charge_actors:\n                    raise NotImplementedError(\n                        "Fast raw full_charge_hit consumer on non-charge weapon is not certified: "\n                        + character.name\n                    )\n'''
          new='''            if str(character.weapon.get("fire_mode") or "") != "charge":\n                if actor in raw_full_charge_actors:\n                    raise NotImplementedError(\n                        "Fast raw full_charge_hit consumer on non-charge weapon is not certified: "\n                        + character.name\n                    )\n                if actor in raw_on_attack_actors:\n                    raise NotImplementedError(\n                        "Fast raw on_attack consumer on non-charge weapon is not certified: "\n                        + character.name\n                    )\n'''
          if old not in s: raise SystemExit('dynamic noncharge anchor missing')
          s=s.replace(old,new,1)
          old='''        self._hit_thresholds = hit_thresholds\n        self._raw_full_charge_actors = frozenset(raw_full_charge_actors)\n        self._score_actors: frozenset[int] = frozenset()\n'''
          new='''        self._hit_thresholds = hit_thresholds\n        self._raw_full_charge_actors = frozenset(raw_full_charge_actors)\n        self._raw_on_attack_actors = frozenset(raw_on_attack_actors)\n        self._score_actors: frozenset[int] = frozenset()\n'''
          if old not in s: raise SystemExit('dynamic state anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''            or actor in self._raw_full_charge_actors\n            or actor in self._score_actors\n''','''            or actor in self._raw_full_charge_actors\n            or actor in self._raw_on_attack_actors\n            or actor in self._score_actors\n''',1)
          s=s.replace('''        if actor in self._score_actors or actor in self._raw_full_charge_actors:\n            return True\n''','''        if (\n            actor in self._score_actors\n            or actor in self._raw_full_charge_actors\n            or actor in self._raw_on_attack_actors\n        ):\n            return True\n''',1)
          old='''        if actor in self._hit_thresholds:\n            signals.append(DynamicCountSignal("hit_count", count_increment))\n        if self.effects.has_dynamic_bullet_lifetime(actor, now=float(event.time)):\n'''
          new='''        if actor in self._hit_thresholds:\n            signals.append(DynamicCountSignal("hit_count", count_increment))\n        if actor in self._raw_on_attack_actors:\n            signals.append(DynamicCountSignal("on_attack", 1))\n        if self.effects.has_dynamic_bullet_lifetime(actor, now=float(event.time)):\n'''
          if old not in s: raise SystemExit('dynamic signal anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # score safety: allow only the narrow on_attack charge-speed shape; certify static overflow conversion
          p=Path('fast_engine/engine/score.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''    "charge_speed_overflow_conversion_pct",\n''','',1)
          old='''    if _actor_has_executable_event(\n        squad,\n        actor,\n        frozenset({"last_bullet_fire", "on_attack", "event:full_reload", "full_reload"}),\n    ):\n        return False\n'''
          new='''    if _actor_has_executable_event(\n        squad,\n        actor,\n        frozenset({"last_bullet_fire", "event:full_reload", "full_reload"}),\n    ):\n        return False\n    for effect in squad.members[actor].effects:\n        if not any(rule.event_key == "on_attack" for rule in effect.triggers):\n            continue\n        if not TriggerDispatcher.is_executable_effect(effect):\n            continue\n        if not TriggerDispatcher._on_attack_charge_speed_shape_supported(effect):\n            return False\n'''
          if old not in s: raise SystemExit('charge safety anchor missing')
          s=s.replace(old,new,1)
          old='''        if stat == "element_code_override":\n            if not is_static_element_override_score_supported(effect):\n                blockers.append(f"normal_state:{label}")\n            continue\n\n        if stat in _UNRESOLVED_NORMAL_DAMAGE_STATS:\n'''
          new='''        if stat == "element_code_override":\n            if not is_static_element_override_score_supported(effect):\n                blockers.append(f"normal_state:{label}")\n            continue\n\n        if stat == "charge_speed_overflow_conversion_pct":\n            if not TriggerDispatcher._charge_overflow_conversion_shape_supported(effect):\n                blockers.append(f"normal_state:{label}")\n            continue\n\n        if stat in _UNRESOLVED_NORMAL_DAMAGE_STATS:\n'''
          if old not in s: raise SystemExit('overflow blocker anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # damage terms: mirror Moris overflow -> charge_dmg_pct calculation
          p=Path('fast_engine/engine/damage_state.py')
          s=p.read_text(encoding='utf-8')
          anchor='''    def _caster_based_atk_flat(self, actor: int, now: float) -> float:\n'''
          insert='''    def _caster_based_charge_speed(self, actor: int, now: float) -> float:\n        target_base = float(self.squad.members[actor].weapon.get("charge_time") or 0.0)\n        if target_base <= 1e-12:\n            return 0.0\n        total = 0.0\n        for effect, active in self.effects.iter_stat(\n            "charge_speed_caster_based_pct", now=now\n        ):\n            if active.target != actor or not self._runtime_condition_ok(effect):\n                continue\n            caster_base = float(\n                self.squad.members[active.source_actor].weapon.get("charge_time") or 0.0\n            )\n            total += caster_base * float(effect.value or 0.0) * active.stacks / target_base\n        return total\n\n    def _charge_overflow_damage_pct(self, actor: int, now: float) -> float:\n        conv = self._sum(actor, "charge_speed_overflow_conversion_pct", now)\n        if conv <= 0.0:\n            return 0.0\n        speed = self._sum(actor, "charge_speed_pct", now) + self._caster_based_charge_speed(actor, now)\n        overflow = max(0.0, speed - 100.0)\n        return overflow * conv / 100.0\n\n'''
          if anchor not in s: raise SystemExit('damage resolver anchor missing')
          s=s.replace(anchor,insert+anchor,1)
          old='''            charge_dmg_pct=self._sum(actor, "charge_dmg_pct", now),\n'''
          new='''            charge_dmg_pct=(\n                self._sum(actor, "charge_dmg_pct", now)\n                + self._charge_overflow_damage_pct(actor, now)\n            ),\n'''
          if old not in s: raise SystemExit('charge dmg anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # tests: real blocker removal + post-shot stacking/overflow semantics
          p=Path('fast_engine/tests/test_damage_dynamic_charge_scoring.py')
          s=p.read_text(encoding='utf-8')
          old='''from fast_engine.engine.score import StaticNormalAttackObserver, static_normal_score_blockers\n'''
          new='''from fast_engine.engine.score import StaticNormalAttackObserver, static_normal_score_blockers\nfrom context.spec import build_squad\nfrom fast_engine.engine.compiler import compile_moris_squad\n'''
          if old not in s: raise SystemExit('test import anchor missing')
          s=s.replace(old,new,1)
          anchor='''    def test_uncertified_charge_speed_delivery_remains_fail_closed(self):\n'''
          test='''    def test_public_red_hood_glaring_eyes_pair_is_certified(self):\n        names = ["라피 : 레드 후드", "레드 후드", "프리카", "민트", "퀀시 : 이스케이프 퀸"]\n        squad = compile_moris_squad(build_squad(names))\n        blockers = static_normal_score_blockers(squad)\n        self.assertFalse(any("레드 후드:글레링 아이즈:charge_speed_pct" in x for x in blockers))\n        self.assertFalse(any("레드 후드:글레링 아이즈 2:charge_speed_overflow_conversion_pct" in x for x in blockers))\n        self.assertTrue(any("민트:다 함께 불러주세요! 2:max_ammo_pct" in x for x in blockers))\n\n    def test_on_attack_charge_speed_stacks_after_consuming_shot(self):\n        base = _charge_speed_effect()\n        planned = replace(base.capability, disposition=CapabilityDisposition.PLANNED, blockers=("timing:weapon_hit",))\n        effect = replace(\n            base,\n            value=60.0,\n            duration=5.0,\n            max_stack=2.0,\n            triggers=(TriggerRule("on_attack", "on_attack", TriggerMode.EVENT),),\n            capability=planned,\n        )\n        squad = _squad(effect)\n        self.assertFalse(static_normal_score_blockers(squad))\n        runtime = BurstRuntime(squad, BurstPolicy(duration=2.1, first_burst_time=10.0), EnemyStaticProfile(defense=0.0, core_uptime=0.0, core_px=0.0, duration=2.1))\n        observer = StaticNormalAttackObserver(runtime, duration=2.1)\n        runtime.run(duration=2.1, score_observer=observer)\n        # First shot is at base 1.0s. Only then does +60% activate, replanning the\n        # next charge from its post-shot start; the effect must have one stack.\n        self.assertAlmostEqual(runtime.dispatcher.effects.sum_stat(0, "charge_speed_pct", now=1.01), 60.0, places=9)\n\n    def test_charge_speed_overflow_adds_charge_damage_only_above_100(self):\n        speed = _charge_speed_effect()\n        speed = replace(speed, value=120.0, duration=-1.0, max_stack=None, triggers=(TriggerRule("battle_start", "battle_start", TriggerMode.EVENT),))\n        conv_cap = _ready_capability(stat="charge_speed_overflow_conversion_pct")\n        conv = replace(\n            speed,\n            effect_id=1, actor_effect_index=1, name="overflow",\n            stat="charge_speed_overflow_conversion_pct", value=240.0, capability=conv_cap,\n        )\n        member = _squad(speed).members[0]\n        member = replace(member, effects=(speed, conv))\n        squad = CompiledSquad((member,), TriggerIndex.from_effects((speed, conv), actor_count=1))\n        runtime = BurstRuntime(squad, BurstPolicy(duration=1.0, first_burst_time=10.0), EnemyStaticProfile(defense=0.0, core_uptime=0.0, core_px=0.0, duration=1.0))\n        runtime.dispatcher.dispatch(__import__('fast_engine.engine.burst', fromlist=['BurstSignal']).BurstSignal(0.0, 'battle_start', 0, 0))\n        from fast_engine.engine.damage_state import DamageTermResolver\n        terms = DamageTermResolver(squad, runtime.dispatcher.effects, runtime.state, runtime.enemy).resolve(0, now=0.01)\n        self.assertAlmostEqual(terms.charge_dmg_pct, 48.0, places=9)\n\n'''
          if anchor not in s: raise SystemExit('test insertion anchor missing')
          s=s.replace(anchor,test+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run focused tests and full Fast suite
        run: |
          python -m unittest fast_engine.tests.test_damage_dynamic_charge_scoring -v
          python -m unittest discover -s fast_engine/tests -p 'test_*.py'
      - name: Audit target team
        run: |
          python - <<'PY'
          from context.spec import build_squad
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers
          names=['라피 : 레드 후드','레드 후드','프리카','민트','퀀시 : 이스케이프 퀸']
          print('BLOCKERS', static_score_blockers(compile_moris_squad(build_squad(names))))
          PY
      - name: Commit implementation
        run: |
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add fast_engine/engine/dispatcher.py fast_engine/engine/dynamic_weapon.py fast_engine/engine/score.py fast_engine/engine/damage_state.py fast_engine/tests/test_damage_dynamic_charge_scoring.py
          git commit -m "impl: support stacked charge-speed overflow conversion"
          git push origin HEAD:fast-engine-phase2-20260901
      - name: Remove helper
        if: always()
        run: |
          git pull --rebase origin fast-engine-phase2-20260901 || true
          rm -f .github/workflows/_fast_redhood_glare_impl.yml
          git config user.name fast-engine-bot
          git config user.email fast-engine-bot@users.noreply.github.com
          git add -A
          git commit -m "chore: remove Glaring Eyes implementation helper" || exit 0
          git push origin HEAD:fast-engine-phase2-20260901
