name: tmp Ada hold safety diagnosis

on:
  workflow_dispatch:
  push:
    branches: [fast-engine-phase2-20260901]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose post-control charge safety
        run: |
          python - <<'PY'
          from dataclasses import replace
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          import fast_engine.engine.score as score
          from fast_engine.engine.dispatcher import TriggerDispatcher

          keys = frozenset({'last_bullet_fire', 'event:full_reload', 'full_reload'})
          for name in ('레이드_미하라에이다', '레이드_헬름아쿠아스노우'):
              squad = compile_moris_squad(spec.build_squad(list(snapshot.SQUADS[name]['members'])))
              actor = next(i for i,m in enumerate(squad.members) if m.name == '에이다')
              member = squad.members[actor]
              members = list(squad.members)
              members[actor] = replace(member, weapon={**member.weapon, 'control': {}})
              probe = replace(squad, members=tuple(members))
              print('\nTEAM', name)
              print('weapon', {k: member.weapon.get(k) for k in ('fire_mode','weapon_type','is_clip','cover_during_delay','control')})
              print('score_safe_without_control', score._charge_actor_score_safe(probe, actor))
              print('reload_upper', score._reload_speed_positive_upper_bound(probe, actor))
              print('weapon_changes', [e.name for e in probe.effects if e.effect_type == 'weapon_change' and actor in score._possible_ally_targets(probe, e)])
              print('core_count', score._actor_has_executable_core_count(probe, actor))
              print('last_reload_event', score._actor_has_executable_event(probe, actor, keys))
              unsafe_on_attack=[]
              for effect in probe.members[actor].effects:
                  if not any(r.event_key == 'on_attack' for r in effect.triggers):
                      continue
                  if not TriggerDispatcher.is_executable_effect(effect):
                      continue
                  if not TriggerDispatcher._on_attack_charge_speed_shape_supported(effect):
                      unsafe_on_attack.append((effect.name,effect.stat,[r.event_key for r in effect.triggers]))
              print('unsafe_on_attack', unsafe_on_attack)
              print('pellet_event', score._actor_has_executable_event(probe, actor, frozenset({'pellet_hit'})))
              print('unhandled_hit_count', score._actor_has_unhandled_count_event(probe, actor, frozenset({'hit_count'})))
              print('effects')
              for e in probe.members[actor].effects:
                  if TriggerDispatcher.is_executable_effect(e):
                      print(' ',e.name,e.effect_type,e.stat,[r.event_key+':'+r.mode.value for r in e.triggers])
          PY
