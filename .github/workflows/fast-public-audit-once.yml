name: Fast public audit once

on:
  push:
    branches:
      - fast-engine-phase2-20260901

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Standardized 24-team public audit
        run: python -m fast_engine.research.public_ranking_probe
