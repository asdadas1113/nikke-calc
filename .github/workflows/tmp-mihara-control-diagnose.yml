name: tmp Mihara control safety diagnosis

on:
  workflow_dispatch:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - .github/workflows/tmp-mihara-control-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare Mihara rapid safety gates
        run: |
          python - <<'PY'
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          import fast_engine.engine.score as score
          from fast_engine.engine.dispatcher import TriggerDispatcher
          from fast_engine.engine.dynamic_rapid import is_supported_rapid_cover_control

          teams = ('컨트롤_미란다미하라', '레이드_미하라에이다')
          event_keys = frozenset({
              'last_bullet_fire', 'on_attack', 'event:full_reload',
              'full_reload', 'event:cover',
          })
          count_keys = frozenset({'hit_count', 'pellet_hit'})

          for team in teams:
              squad = compile_moris_squad(
                  spec.build_squad(list(snapshot.SQUADS[team]['members']))
              )
              actor = next(
                  i for i, member in enumerate(squad.members)
                  if member.name == '미하라 : 본딩 체인'
              )
              member = squad.members[actor]
              weapon = member.weapon
              print('\n===', team, '===')
              print('members', [m.name for m in squad.members])
              print('actor', actor)
              print('weapon', {
                  k: weapon.get(k) for k in (
                      'fire_mode','weapon_type','is_clip','cover_during_delay','control',
                      'max_ammo','reload_time','fire_rate','fire_rate_max'
                  )
              })
              print('supported_cover_control', is_supported_rapid_cover_control(member))
              print('rapid_score_safe', score._rapid_actor_score_safe(
                  squad, actor, require_cover_control=True
              ))

              weapon_changes=[]
              for effect in squad.effects:
                  if effect.effect_type != 'weapon_change':
                      continue
                  targets = score._possible_ally_targets(squad, effect)
                  if actor in targets:
                      weapon_changes.append((
                          squad.members[effect.actor].name, effect.name,
                          effect.stat, list(targets),
                          [r.event_key for r in effect.triggers],
                          TriggerDispatcher.is_executable_effect(effect),
                      ))
              print('weapon_changes_targeting_mihara', weapon_changes)
              print('core_count', score._actor_has_executable_core_count(squad, actor))
              print('blocked_event', score._actor_has_executable_event(squad, actor, event_keys))
              print('unhandled_count', score._actor_has_unhandled_count_event(squad, actor, count_keys))

              actor_event_effects=[]
              for effect in member.effects:
                  if not TriggerDispatcher.is_executable_effect(effect):
                      continue
                  keys=[r.event_key for r in effect.triggers]
                  if any(k in event_keys or k in count_keys or k == 'core_hit_count' for k in keys):
                      actor_event_effects.append((
                          effect.name, effect.effect_type, effect.stat, keys,
                          [(r.mode.value, r.threshold, r.trigger_count_reducible) for r in effect.triggers],
                      ))
              print('mihara_relevant_executable_effects', actor_event_effects)

              body=[]
              for effect in squad.effects:
                  if not TriggerDispatcher.is_executable_effect(effect):
                      continue
                  if not any(r.event_key == 'squad_body_hit' for r in effect.triggers):
                      continue
                  body.append({
                      'owner': squad.members[effect.actor].name,
                      'name': effect.name,
                      'type': effect.effect_type,
                      'stat': effect.stat,
                      'target': effect.target,
                      'possible_targets': list(score._possible_ally_targets(squad, effect)),
                      'triggers': [
                          (r.event_key, r.mode.value, r.threshold, r.trigger_count_reducible)
                          for r in effect.triggers
                      ],
                      'capability': (
                          effect.capability.disposition.value if effect.capability else None,
                          tuple(effect.capability.blockers) if effect.capability else (),
                      ),
                  })
              print('squad_body_hit_effects', body)

              # Print every executable effect that can mutate Mihara's rapid cadence.
              cadence_stats={
                  'reload_speed_pct','reload_time_fixed','max_ammo_pct','max_ammo_flat',
                  'max_ammo_infinite','ammo_charge_flat','ammo_charge_pct','attack_speed_pct',
                  'mg_warmup_speed_pct','force_reload','pellet_count','pellet_count_fixed',
              }
              mutators=[]
              for effect in squad.effects:
                  if (effect.stat or '') not in cadence_stats:
                      continue
                  if actor not in score._possible_ally_targets(squad, effect):
                      continue
                  mutators.append({
                      'owner': squad.members[effect.actor].name,
                      'name': effect.name,
                      'stat': effect.stat,
                      'target': effect.target,
                      'executable': TriggerDispatcher.is_executable_effect(effect),
                      'duration': effect.duration,
                      'triggers': [r.event_key for r in effect.triggers],
                  })
              print('cadence_mutators_targeting_mihara', mutators)
          PY
