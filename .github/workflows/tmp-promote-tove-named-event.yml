name: tmp promote Tove pct named-event slice

on:
  workflow_dispatch:
  push:
    branches: [fast-engine-phase2-20260901]
    paths:
      - .github/workflows/tmp-promote-tove-named-event.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply validated production patch
        run: |
          PYTHONPATH=. python - <<'PY'
          from fast_engine.research.tmp_tove_named_event_ab import patch_runner_worktree, write_tmp_regression
          patch_runner_worktree()
          write_tmp_regression()
          PY
          mv fast_engine/tests/test_tmp_tove_pct_named_event.py fast_engine/tests/test_ammo_pct_named_event.py
          git diff --check
      - name: Focused production regression
        run: |
          python -m unittest -v \
            fast_engine.tests.test_damage_dynamic_ammo_charge \
            fast_engine.tests.test_named_buff_event_runtime \
            fast_engine.tests.test_ammo_pct_named_event
      - name: Commit production slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fast_engine/engine/dispatcher.py \
            fast_engine/engine/score.py \
            fast_engine/tests/test_named_buff_event_runtime.py \
            fast_engine/tests/test_ammo_pct_named_event.py
          git commit -m "fix: emit percent ammo refill named events"
          git push origin HEAD:fast-engine-phase2-20260901
