# PR 검증. `pages.yml`이 master push를 이미 전부 검사하고 배포까지 하므로, 여기서는
# **PR과 그 밖의 브랜치**만 맡는다 — 지금까지 그쪽이 통째로 비어 있었다.
# (master를 여기서도 돌리면 같은 7분짜리 스냅샷을 두 번 태우게 된다)
#
# Fast Engine 장기 개발 브랜치는 PR 없이 checkpoint를 쌓으므로 해당 브랜치 push도
# 직접 검증한다. master push는 여전히 pages.yml만 담당한다.
#
# Fast 브랜치에서는 개발 중인 Fast 테스트를 먼저 돌린다. Fast가 깨진 checkpoint에서
# 30초+ calculator 회귀를 먼저 태우면 진단 주기가 불필요하게 길어진다. Fast가 모두
# 통과한 뒤에만 기존 calculator/optimizer/site/golden 회귀를 수행한다.

name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - fast-engine-phase2-20260901

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 파이썬 쪽은 표준 라이브러리만 쓴다 — `pip install` 단계가 없는 게 정상이다.
      - name: 문서·데이터 정합 (doclint)
        run: python -m context.doclint

      # Fast는 개발 중인 독립 runtime이라 파일 단위로 쪼갠다. 하나가 실패해도
      # 나머지는 실행하되, 새 push로 run 자체가 취소되면 즉시 멈춘다.
      - name: Fast — burst machine
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_burst_machine
      - name: Fast — capabilities/state
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_capabilities_state
      - name: Fast — compiled triggers
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_compiled_triggers
      - name: Fast — core semantics
        if: ${{ !cancelled() }}
        run: |
          python -m unittest fast_engine.tests.test_core_probability
          python -m unittest fast_engine.tests.test_core_hit_events
      - name: Fast — damage
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s fast_engine/tests -p 'test_damage*.py'
      - name: Fast — dispatch/burst runtime
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_dispatch_burst_runtime
      - name: Fast — dynamic weapon signals
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_dynamic_weapon_signals
      - name: Fast — greenfield core
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_greenfield_core
      - name: Fast — periodic runtime
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_periodic_runtime
      - name: Fast — target snapshot
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_target_snapshot
      - name: Fast — weapon
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s fast_engine/tests -p 'test_weapon*.py'
      - name: Fast — structural performance
        if: ${{ !cancelled() }}
        run: python -m unittest fast_engine.tests.test_performance_contract
      - name: Fast — public ranking probe
        if: ${{ !cancelled() }}
        run: python -m fast_engine.research.public_ranking_probe

      # 아래는 Fast가 모두 초록일 때만 기존 정본 회귀를 돈다.
      - name: 엔진 단위 테스트
        run: |
          python -m unittest discover -s calculator -p 'test_*.py'
          python calculator/damage.py

      - name: 옵티마이저 단위 테스트
        run: python -m unittest discover -s tests -p 'test_optimizer_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: 브리지 스모크 테스트
        working-directory: site
        run: python scripts/test-bridge.py

      - name: 브라우저 사이트 테스트
        working-directory: site
        run: npm test -- --run

      - name: 딜 계산 회귀 (golden snapshot 29개)
        run: python -m context.snapshot

      # 실패해도 붙인다 — 무엇이 움직였는지는 빨간불일 때 더 알고 싶다.
      - name: 스냅샷 변동 요약
        if: always() && github.event_name == 'pull_request'
        run: |
          python .github/scripts/baseline_delta.py \
            "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_STEP_SUMMARY"
