name: tmp-crown-probe
on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-crown-probe.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remaining public frontier pressure
        run: |
          python - <<'PY'
          from collections import Counter
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          source=[]
          for label,row in snapshot.SQUADS.items():
              if str(label).startswith('지그_'):
                  continue
              members=tuple(row.get('members') or ())
              if len(members)!=5 or any(str(member).startswith('test_') for member in members):
                  continue
              source.append((label,members))
          unique=[]; seen=set()
          for label,members in source:
              if members in seen:
                  continue
              seen.add(members); unique.append((label,members))

          exact=Counter(); actor_effect=Counter(); category=Counter()
          gaps=[]
          for label,members in unique:
              blockers=tuple(static_score_blockers(compile_moris_squad(spec.build_squad(list(members)))))
              if not blockers:
                  continue
              gaps.append((label,blockers))
              for blocker in blockers:
                  exact[blocker]+=1
                  parts=blocker.split(':')
                  category[parts[0]]+=1
                  if len(parts) >= 3:
                      actor_effect[':'.join(parts[1:3])]+=1

          print('GAP_COUNT',len(gaps))
          print('TOP_EXACT')
          for key,count in exact.most_common(30):
              print(count,key)
          print('TOP_ACTOR_EFFECT')
          for key,count in actor_effect.most_common(30):
              print(count,key)
          print('GAP_ROWS')
          for label,blockers in gaps:
              print(label)
              for blocker in blockers:
                  print('  ',blocker)
          PY
