name: tmp-next-frontier-audit

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-next-frontier-audit.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply narrow production change and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          score = Path('fast_engine/engine/score.py')
          text = score.read_text(encoding='utf-8')
          needle = '    "event:part_destroy",\n})'
          replacement = '    "event:part_destroy",\n    "squad_part_hit",\n})'
          if needle not in text:
              raise SystemExit('score insertion point not found or already changed')
          score.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          test = Path('fast_engine/tests/test_damage_patternless_encounter_events.py')
          text = test.read_text(encoding='utf-8')
          needle = '''    def test_other_named_events_remain_fail_closed(self):\n        compiled = _compile_case("스쿼드1")\n        blockers = static_score_blockers(compiled)\n        self.assertIn("normal_delivery:크라운:로얄 에타이어 4:atk_dmg_pct", blockers)\n'''
          replacement = '''    def test_squad_part_hit_is_unreachable_but_body_hit_stays_fail_closed(self):\n        compiled = _compile_case("레이드_미하라에이다")\n        blockers = static_score_blockers(compiled)\n        self.assertNotIn(\n            "normal_delivery:D : 킬러 와이프:타겟 섬멸 코어:core_dmg_pct",\n            blockers,\n        )\n        self.assertNotIn(\n            "skill_state_delivery:D : 킬러 와이프:타겟 섬멸 코어:core_dmg_pct",\n            blockers,\n        )\n        self.assertIn(\n            "normal_delivery:D : 킬러 와이프:타겟 섬멸 ATK:atk_caster_based_pct",\n            blockers,\n        )\n        self.assertIn(\n            "skill_state_delivery:D : 킬러 와이프:타겟 섬멸 ATK:atk_caster_based_pct",\n            blockers,\n        )\n\n        part = next(effect for effect in compiled.effects if effect.name == "타겟 섬멸 코어")\n        body = next(effect for effect in compiled.effects if effect.name == "타겟 섬멸 ATK")\n        self.assertFalse(TriggerDispatcher.is_executable_effect(part))\n        self.assertTrue(any(rule.event_key == "squad_part_hit" for rule in part.triggers))\n        self.assertTrue(any(rule.event_key == "squad_body_hit" for rule in body.triggers))\n\n    def test_other_named_events_remain_fail_closed(self):\n        compiled = _compile_case("스쿼드1")\n        blockers = static_score_blockers(compiled)\n        self.assertIn("normal_delivery:크라운:로얄 에타이어 4:atk_dmg_pct", blockers)\n'''
          if needle not in text:
              raise SystemExit('test insertion point not found')
          test.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Focused regression
        run: python -m unittest -q fast_engine.tests.test_damage_patternless_encounter_events
      - name: Full Fast damage regression
        run: python -m unittest discover -s fast_engine/tests -p 'test_damage*.py'
      - name: Verify exact public delta shape
        run: |
          python - <<'PY'
          from collections import Counter
          from context import snapshot, spec
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.score import static_score_blockers

          seen=set(); rows=[]
          for name, entry in snapshot.SQUADS.items():
              if str(name).startswith('지그_'):
                  continue
              members=tuple(str(x) for x in entry['members'])
              if len(members)!=5 or any(x.startswith('test_') for x in members) or members in seen:
                  continue
              seen.add(members)
              blockers=tuple(static_score_blockers(compile_moris_squad(spec.build_squad(list(members)))))
              rows.append((str(name),blockers))
          fam=Counter(b.split(':',1)[0] for _,bs in rows for b in bs)
          print('UNIQUE',len(rows),'CERTIFIED',sum(not bs for _,bs in rows))
          print('FAMILIES',sorted(fam.items(),key=lambda x:(-x[1],x[0])))
          d=next(bs for name,bs in rows if name=='레이드_미하라에이다')
          print('D_BLOCKERS',len(d),d)
          if len(rows)!=23 or sum(not bs for _,bs in rows)!=2:
              raise SystemExit('public accounting changed unexpectedly')
          if any('타겟 섬멸 코어' in b for b in d):
              raise SystemExit('part-hit blockers remain')
          required={
              'normal_delivery:D : 킬러 와이프:타겟 섬멸 ATK:atk_caster_based_pct',
              'skill_state_delivery:D : 킬러 와이프:타겟 섬멸 ATK:atk_caster_based_pct',
          }
          if not required.issubset(set(d)):
              raise SystemExit('body-hit fail-closed boundary was lost')
          PY
      - name: Commit production slice
        run: |
          git config user.name "asdadas1113"
          git config user.email "crony06@gmail.com"
          git add fast_engine/engine/score.py fast_engine/tests/test_damage_patternless_encounter_events.py
          git diff --cached --check
          git commit -m "Fast: ignore patternless squad part hit"
          git push origin HEAD:fast-engine-phase2-20260901
