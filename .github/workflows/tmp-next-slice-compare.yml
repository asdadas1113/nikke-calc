name: tmp-next-slice-compare

on:
  push:
    branches:
      - fast-engine-phase2-20260901
    paths:
      - .github/workflows/tmp-next-slice-compare.yml

permissions:
  contents: write

jobs:
  finalize-helm-periodic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Write checkpoint docs and handoff
        run: PYTHONPATH=. python .github/scripts/tmp_helm_finalize.py
      - name: Validate docs and permanent regression
        run: |
          python -m context.doclint
          python -m unittest -v \
            fast_engine.tests.test_damage_periodic_enemy_received \
            fast_engine.tests.test_damage_periodic_self_crit
      - name: Remove temporary investigation files
        run: |
          rm -f .github/scripts/tmp_next_slice_compare.py
          rm -f .github/scripts/tmp_helm_refine_candidate.py
          rm -f .github/scripts/tmp_helm_periodic_write_tests.py
          rm -f .github/scripts/tmp_helm_finalize.py
          rm -f .github/workflows/tmp-next-slice-compare.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "ci.yml pages.yml "
      - name: Verify finalizer diff
        run: |
          git diff --check
          git status --short
      - name: Commit docs and cleanup
        run: |
          git config user.name 'asdadas1113'
          git config user.email 'crony06@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: finalize periodic enemy checkpoint'
          git push origin HEAD:fast-engine-phase2-20260901
