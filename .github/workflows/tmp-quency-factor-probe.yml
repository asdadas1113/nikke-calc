name: tmp-public-ranking-rerun

on:
  push:
    branches: [fast-engine-phase2-20260901]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standardized public ranking audit
        run: |
          python -m fast_engine.research.public_ranking_probe > fast_engine/research/tmp_public_ranking_after_self_state.txt
      - name: Persist audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/research/tmp_public_ranking_after_self_state.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist post-fix public ranking audit"
          git push origin HEAD:fast-engine-phase2-20260901
