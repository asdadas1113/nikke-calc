name: tmp-self-state-passive-fix

on:
  push:
    branches: [fast-engine-phase2-20260901]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply generic self-state passive synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('fast_engine/engine/dispatcher.py')
          s = p.read_text()
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing dispatcher patch anchor:\n'+old)
              s=s.replace(old,new,1)

          rep(
          '        "_activation_counts", "_state_dependency_names", "_self_stack_passive_ids",\n        "_self_stack_dependency_names", "_gauge_maxima",',
          '        "_activation_counts", "_state_dependency_names", "_self_stack_passive_ids",\n        "_self_stack_dependency_names", "_self_state_passive_ids",\n        "_self_state_dependency_names", "_gauge_maxima",')

          anchor = '''        self._self_stack_dependency_names = frozenset(\n            rule.key\n            for effect_id in self._self_stack_passive_ids\n            for rule in self._effect_table[effect_id].condition_rules\n            if rule.key\n        )\n'''
          rep(anchor, anchor + '''        self._self_state_passive_ids = tuple(\n            effect.effect_id\n            for effect in self._effect_table\n            if self._self_state_conditional_passive_shape_supported(effect)\n            and self.is_runtime_executable_effect(effect)\n        )\n        self._self_state_dependency_names = frozenset(\n            rule.key\n            for effect_id in self._self_state_passive_ids\n            for rule in self._effect_table[effect_id].condition_rules\n            if rule.key\n        )\n''')

          marker='    def _sync_self_stack_conditional_passives(self, *, now: float) -> None:\n'
          insert='''    @staticmethod\n    def _self_state_conditional_passive_shape_supported(effect: "CompiledEffect") -> bool:\n        """Certify permanent passives gated only by a named self-state edge."""\n        return (\n            effect.effect_type == "buff"\n            and effect.duration in (None, -1.0)\n            and effect.max_stack in (None, 1, 1.0)\n            and target_scope_is_static(effect.target_spec)\n            and effect.target_spec.runtime_supported\n            and len(effect.triggers) == 1\n            and effect.triggers[0].mode is TriggerMode.EVENT\n            and effect.triggers[0].raw == "passive"\n            and bool(effect.condition_rules)\n            and all(\n                rule.mode in {ConditionMode.SELF_STATE, ConditionMode.NOT_SELF_STATE}\n                and bool(rule.key)\n                for rule in effect.condition_rules\n            )\n        )\n\n'''
          rep(marker,insert+marker)

          marker2='    def can_activate_effect(self, effect: "CompiledEffect") -> bool:\n'
          insert2='''    def _sync_self_state_conditional_passives(self, *, now: float) -> None:\n        """Materialize/de-materialize certified permanent passives on self-state edges."""\n        for effect_id in self._self_state_passive_ids:\n            effect = self._effect_table[effect_id]\n            targets = self.targets.resolve(\n                effect.target_spec,\n                owner_actor=effect.actor,\n                now=now,\n            )\n            should_be_active = self.conditions.evaluate_all(\n                effect.condition_rules,\n                effect_id=effect.effect_id,\n                owner_actor=effect.actor,\n                target_actor=None,\n                now=now,\n                context=SignalContext(),\n            )\n            is_active = self.effects.group_active(effect.effect_id, targets, now=now)\n            if should_be_active and not is_active:\n                self.effects.activate_group(effect, targets, now, self.scheduler)\n            elif not should_be_active and is_active:\n                self.effects.deactivate_group(effect.effect_id, targets, now=now)\n\n'''
          rep(marker2,insert2+marker2)

          old='''            if (\n                activated_group\n                and effect.name\n                and effect.name in self._self_stack_dependency_names\n            ):\n                self._sync_self_stack_conditional_passives(now=now)\n'''
          new=old+'''            if (\n                activated_group\n                and effect.name\n                and effect.name in self._self_state_dependency_names\n            ):\n                self._sync_self_state_conditional_passives(now=now)\n'''
          rep(old,new)

          old='''            if any(\n                self._effect_table[effect_id].name in self._self_stack_dependency_names\n                for effect_id in removed\n            ):\n                self._sync_self_stack_conditional_passives(now=signal.time)\n'''
          new='''            if any(\n                self._effect_table[effect_id].name in self._self_stack_dependency_names\n                for effect_id in removed\n            ):\n                self._sync_self_stack_conditional_passives(now=signal.time)\n            if any(\n                self._effect_table[effect_id].name in self._self_state_dependency_names\n                for effect_id in removed\n            ):\n                self._sync_self_state_conditional_passives(now=signal.time)\n'''
          rep(old,new)

          old='''        if expired.name and expired.name in self._self_stack_dependency_names:\n            self._sync_self_stack_conditional_passives(now=event.time)\n'''
          new=old+'''        if expired.name and expired.name in self._self_state_dependency_names:\n            self._sync_self_state_conditional_passives(now=event.time)\n'''
          rep(old,new)
          p.write_text(s)

          t=Path('fast_engine/tests/test_conditional_passive_self_stack.py')
          ts=t.read_text()
          test='''\n    def test_frika_performance_materializes_self_state_pierce_passive(self) -> None:\n        members = [\n            "라피 : 레드 후드",\n            "레드 후드",\n            "프리카",\n            "민트",\n            "퀀시 : 이스케이프 퀸",\n        ]\n        squad = spec.build_squad(members)\n        compiled = compile_moris_squad(squad)\n        fi = members.index("프리카")\n        config = {"duration": 5.0, "first_burst_time": 3.0, "rng_mode": "expected"}\n        enemy = EnemyStaticProfile(\n            defense=float(DEFAULT_ENEMY.get("def", 31784.0)),\n            element=DEFAULT_ENEMY.get("code"),\n            core_uptime=0.0,\n            core_px=0.0,\n            duration=5.0,\n        )\n        policy = compile_burst_policy(squad, compiled, config)\n        sink = SimpleDamageScoreSink(compiled, enemy)\n        runtime = BurstRuntime(compiled, policy, enemy, damage_sink=sink)\n        runtime.run(duration=5.0)\n\n        effects = runtime.dispatcher.effects\n        now = 4.0\n        self.assertTrue(effects.has_named_state(fi, "퍼포먼스", now=now))\n        self.assertTrue(effects.has_stat(fi, "pierce_enabled", now=now))\n'''
          anchor='\n\nif __name__ == "__main__":\n'
          if anchor not in ts: raise SystemExit('missing test anchor')
          t.write_text(ts.replace(anchor,test+anchor,1))
          PY
          python -m unittest fast_engine.tests.test_conditional_passive_self_stack
      - name: Commit generic fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/engine/dispatcher.py fast_engine/tests/test_conditional_passive_self_stack.py
          git commit -m "fix: sync self-state conditional passives"
          git push origin HEAD:fast-engine-phase2-20260901
