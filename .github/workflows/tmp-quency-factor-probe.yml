name: tmp-ranking-baseline-probe

on:
  push:
    branches: [fast-engine-phase2-20260901]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rerun public ranking and certified crossover baseline
        run: |
          mkdir -p fast_engine/research
          python -m fast_engine.research.public_ranking_probe > fast_engine/research/tmp_ranking_baseline_probe.txt
          python - <<'PY' >> fast_engine/research/tmp_ranking_baseline_probe.txt
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          teams = {
              'A': ['루마니','레드 후드','페퍼','마키마','헬름'],
              'B': ['루마니','홍련 : 흑영','류드밀라 : 윈터 오너','퀀시 : 이스케이프 퀸','노이즈'],
          }
          cfg = {'duration':180.0,'first_burst_time':3.0,'rng_mode':'expected'}

          print('\n=== CERTIFIED CORE CROSSOVER CURRENT ===')
          for core_px in (0.0, 10.0, 20.0, 30.0):
              print('CORE_PX', core_px)
              for label, members in teams.items():
                  enemy = dict(DEFAULT_ENEMY)
                  enemy['core_px'] = core_px
                  squad = spec.build_squad(members)
                  moris = simulate(squad, config=spec.build_config(squad, dict(cfg)), enemy=dict(enemy), seed=42, verbose=False)
                  compiled = compile_moris_squad(squad)
                  blockers = static_score_blockers(compiled)
                  policy = compile_burst_policy(squad, compiled, dict(cfg))
                  fast = score_static_squad(
                      compiled,
                      policy,
                      EnemyStaticProfile(
                          defense=float(enemy.get('def',31784.0)),
                          element=enemy.get('code'),
                          core_uptime=1.0 if core_px > 0 else 0.0,
                          core_px=core_px,
                          duration=180.0,
                      ),
                  )
                  print(label, 'M', moris.squad_total, 'F', fast.squad_total,
                        'ERR', fast.squad_total / moris.squad_total - 1.0,
                        'BLOCKERS', blockers, 'UNSUPPORTED', fast.unsupported)
                  print(label, 'M_CHAR', [(name, moris.char_total[name]) for name in members])
                  print(label, 'F_CHAR', list(zip(members, fast.char_total)))
          PY
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/research/tmp_ranking_baseline_probe.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: persist temporary ranking baseline probe"
          git push origin HEAD:fast-engine-phase2-20260901
