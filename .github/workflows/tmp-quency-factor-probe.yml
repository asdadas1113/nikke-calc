name: tmp-frika-breakdown-probe

on:
  push:
    branches: [fast-engine-phase2-20260901]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decompose Frika Moris and Fast damage
        run: |
          mkdir -p fast_engine/research
          python - <<'PY' > fast_engine/research/tmp_frika_breakdown_probe.txt
          from collections import defaultdict
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver, static_score_blockers

          members = ['라피 : 레드 후드','레드 후드','프리카','민트','퀀시 : 이스케이프 퀸']
          target = '프리카'
          ti = members.index(target)
          cfg = {'duration':180.0,'first_burst_time':3.0,'rng_mode':'expected'}

          class BreakdownSink(SimpleDamageScoreSink):
              def __init__(self, squad, enemy):
                  super().__init__(squad, enemy)
                  self.by_effect = defaultdict(float)
                  self.by_effect_hits = defaultdict(int)
              def _score_spec(self, effect_id, *, now, full_burst):
                  eff = self.squad.effects[effect_id]
                  actor = eff.actor
                  before = self.char_total[actor]
                  fired = super()._score_spec(effect_id, now=now, full_burst=full_burst)
                  delta = self.char_total[actor] - before
                  if fired and delta:
                      key = (self.squad.members[actor].name, eff.name, eff.effect_type, eff.stat)
                      self.by_effect[key] += delta
                      self.by_effect_hits[key] += 1
                  return fired

          for core_px in (0.0,10.0):
              print('=== CORE', core_px, '===')
              enemy = dict(DEFAULT_ENEMY)
              enemy['def'] = 60000
              enemy['code'] = '작열'
              enemy['core_px'] = core_px
              squad = spec.build_squad(members)
              moris = simulate(squad, config=spec.build_config(squad, dict(cfg)), enemy=dict(enemy), seed=42, verbose=True)
              mhits = [h for h in moris.hits if h.caster == target]
              mnormal = [h for h in mhits if _is_normal(h)]
              mskill = [h for h in mhits if not _is_normal(h)]
              print('M_TOTAL', moris.char_total[target])
              print('M_NORMAL', sum(h.damage for h in mnormal), 'HITS', len(mnormal))
              mb = defaultdict(lambda:[0.0,0])
              for h in mskill:
                  mb[(h.skill_name,h.hit_tag)][0] += h.damage
                  mb[(h.skill_name,h.hit_tag)][1] += 1
              print('M_SKILLS', dict(mb))

              compiled = compile_moris_squad(squad)
              print('BLOCKERS', static_score_blockers(compiled))
              print('FRIKA_WEAPON', dict(compiled.members[ti].weapon))
              if core_px == 0.0:
                  print('FRIKA_EFFECTS')
                  for e in compiled.members[ti].effects:
                      print(e.actor_effect_index,e.effect_id,e.effect_type,e.name,e.stat,e.value,e.duration,e.max_stack,e.parameters,
                            [(r.raw,r.event_key,r.mode.value,r.threshold) for r in e.triggers],
                            [(r.raw,r.mode.value,r.key,r.threshold) for r in e.condition_rules])

              ep = EnemyStaticProfile(defense=60000.0,element='작열',core_uptime=1.0 if core_px>0 else 0.0,core_px=core_px,duration=180.0)
              policy = compile_burst_policy(squad,compiled,dict(cfg))
              sink = BreakdownSink(compiled,ep)
              runtime = BurstRuntime(compiled,policy,ep,damage_sink=sink)
              observer = StaticNormalAttackObserver(runtime,duration=180.0)
              result = runtime.run(duration=180.0,score_observer=observer)
              normal = observer.finish(events_processed=result.events_processed)
              print('F_NORMAL',normal.char_total[ti])
              print('F_SKILL',sink.char_total[ti])
              print('F_TOTAL',normal.char_total[ti]+sink.char_total[ti])
              print('F_SKILLS')
              for key,val in sorted(sink.by_effect.items()):
                  if key[0] == target:
                      print(key,'DAMAGE',val,'FIRES',sink.by_effect_hits[key])
              print('CASTS',[c for c in result.casts if c[1] == ti])
          PY
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/research/tmp_frika_breakdown_probe.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist temporary Frika breakdown probe"
          git push origin HEAD:fast-engine-phase2-20260901
