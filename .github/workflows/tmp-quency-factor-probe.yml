name: tmp-public-ranking-rerun

on:
  push:
    branches: [fast-engine-phase2-20260901]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standardized public ranking audit
        run: |
          python - <<'PY' > fast_engine/research/tmp_public_ranking_after_self_state.txt
          from fast_engine.research import public_ranking_probe as probe

          source = probe._source_corpus()
          unique = []
          seen = set()
          for members, source_name in source:
              if members in seen:
                  continue
              seen.add(members)
              unique.append((members, source_name))

          print('SOURCE_CASE_COUNT', len(source))
          print('UNIQUE_MEMBERSHIP_COUNT', len(unique))
          probe._source_corpus = lambda: tuple(unique)
          probe.main()
          PY
      - name: Persist audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/research/tmp_public_ranking_after_self_state.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist post-fix public ranking audit"
          git push origin HEAD:fast-engine-phase2-20260901
