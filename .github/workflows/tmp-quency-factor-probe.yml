name: tmp-frika-shotcount-probe

on:
  push:
    branches: [fast-engine-phase2-20260901]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-engine-phase2-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare Frika shot counts
        run: |
          mkdir -p fast_engine/research
          python - <<'PY' > fast_engine/research/tmp_frika_shotcount_probe.txt
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.burst_runtime import BurstRuntime
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.damage_runtime import SimpleDamageScoreSink
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import StaticNormalAttackObserver

          members = ['라피 : 레드 후드','레드 후드','프리카','민트','퀀시 : 이스케이프 퀸']
          target = '프리카'
          ti = members.index(target)
          cfg = {'duration':180.0,'first_burst_time':3.0,'rng_mode':'expected'}
          enemy = dict(DEFAULT_ENEMY); enemy.update({'def':60000,'code':'작열','core_px':0.0})
          squad = spec.build_squad(members)
          moris = simulate(squad,config=spec.build_config(squad,dict(cfg)),enemy=dict(enemy),seed=42,verbose=True)
          mh = [h for h in moris.hits if h.caster == target and _is_normal(h)]
          print('M_SHOTS',len(mh),'M_TOTAL',sum(h.damage for h in mh))
          print('M_FIRST10',[(h.t,h.damage,h.hit_tag) for h in mh[:10]])
          print('M_LAST10',[(h.t,h.damage,h.hit_tag) for h in mh[-10:]])

          compiled = compile_moris_squad(squad)
          ep = EnemyStaticProfile(defense=60000.0,element='작열',core_uptime=0.0,core_px=0.0,duration=180.0)
          policy = compile_burst_policy(squad,compiled,dict(cfg))
          sink = SimpleDamageScoreSink(compiled,ep)
          runtime = BurstRuntime(compiled,policy,ep,damage_sink=sink)

          class CountObserver(StaticNormalAttackObserver):
              __slots__ = ('shot_counts','calls')
              def __init__(self,*args,**kwargs):
                  super().__init__(*args,**kwargs)
                  self.shot_counts = [0]*len(self.runtime.squad.members)
                  self.calls = []
              def _score_shots(self,actor,count,*,eval_time):
                  self.shot_counts[actor] += count
                  before = self.char_total[actor]
                  super()._score_shots(actor,count,eval_time=eval_time)
                  if actor == ti:
                      self.calls.append((eval_time,count,self.char_total[actor]-before,
                                         self.runtime.machine.phase,
                                         self.resolver.resolve(actor,now=eval_time)))

          observer = CountObserver(runtime,duration=180.0)
          result = runtime.run(duration=180.0,score_observer=observer)
          normal = observer.finish(events_processed=result.events_processed)
          print('F_SHOTS',observer.shot_counts[ti],'F_TOTAL',normal.char_total[ti])
          print('F_CALLS',observer.calls)
          PY
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_engine/research/tmp_frika_shotcount_probe.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist temporary Frika shot-count probe"
          git push origin HEAD:fast-engine-phase2-20260901
