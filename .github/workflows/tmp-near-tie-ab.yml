name: tmp-near-tie-ab

on:
  push:
    branches:
      - fast-engine-phase2-20260901

permissions:
  contents: write

jobs:
  near-tie-ab:
    if: ${{ !contains(github.event.head_commit.message, '[skip-near-tie-ab]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run near-tie component matrix
        run: |
          set -u
          REPORT=fast_engine/research/tmp_near_tie_ab_report.txt
          : > "$REPORT"

          reset_runtime() {
            git checkout "$GITHUB_SHA" -- \
              fast_engine/engine/scheduler.py \
              fast_engine/engine/dynamic_reload.py \
              fast_engine/engine/dynamic_rapid.py
          }

          run_variant() {
            name="$1"
            echo "===== VARIANT: $name =====" | tee -a "$REPORT"
            PYTHONPATH=. python fast_engine/research/tmp_near_tie_diagnostic.py \
              2>&1 | tee -a "$REPORT"
            echo | tee -a "$REPORT"
          }

          reset_runtime
          run_variant baseline

          reset_runtime
          PYTHONPATH=. python fast_engine/research/tmp_apply_phase_monotonic_scheduler.py
          run_variant phase_guard_only

          reset_runtime
          PYTHONPATH=. python fast_engine/research/tmp_apply_mg_v2.py
          run_variant mg_v2_only

          reset_runtime
          PYTHONPATH=. python fast_engine/research/tmp_apply_phase_monotonic_scheduler.py
          PYTHONPATH=. python fast_engine/research/tmp_apply_mg_v2.py
          run_variant phase_guard_plus_mg_v2

          reset_runtime
          git diff --check

      - name: Record report only
        if: always()
        run: |
          git checkout "$GITHUB_SHA" -- \
            fast_engine/engine/scheduler.py \
            fast_engine/engine/dynamic_reload.py \
            fast_engine/engine/dynamic_rapid.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fast_engine/research/tmp_near_tie_ab_report.txt
          git commit -m 'tmp: record near-tie component A/B [skip-near-tie-ab] [skip-phase-guard-ab] [skip-burst-divergence] [skip-expiry-core] [skip-expiry-ab] [skip-mg-gate]'
          git push
