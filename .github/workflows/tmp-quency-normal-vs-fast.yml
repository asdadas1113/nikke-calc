name: tmp-quency-normal-vs-fast
on:
  push:
    branches: [fast-engine-phase2-20260901]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare Quency short windows
        run: |
          python - <<'PY'
          from calculator.timeline import DEFAULT_ENEMY, simulate
          from calculator.sim_result import _is_normal
          from context import spec
          from fast_engine.engine.burst import compile_burst_policy
          from fast_engine.engine.compiler import compile_moris_squad
          from fast_engine.engine.model import EnemyStaticProfile
          from fast_engine.engine.score import score_static_squad, static_score_blockers

          members=['라피 : 레드 후드','레드 후드','프리카','민트','퀀시 : 이스케이프 퀸']
          q='퀀시 : 이스케이프 퀸'; qi=members.index(q)
          for duration in (2.5,10.0,30.0,180.0):
              cfg={'duration':duration,'first_burst_time':3.0,'rng_mode':'expected'}
              squad=spec.build_squad(members); mcfg=spec.build_config(squad,dict(cfg)); enemy=dict(DEFAULT_ENEMY)
              m=simulate(squad,config=mcfg,enemy=dict(enemy),seed=42,verbose=False)
              c=compile_moris_squad(squad); assert not static_score_blockers(c)
              p=compile_burst_policy(squad,c,dict(cfg))
              f=score_static_squad(c,p,EnemyStaticProfile(defense=31784.0,duration=duration,core_px=0.0))
              normals=[e for e in m.hits if e.caster==q and _is_normal(e)]
              skills=[e for e in m.hits if e.caster==q and not _is_normal(e)]
              print('D',duration,'M',m.char_total[q],'F',f.char_total[qi],'ERR',f.char_total[qi]/m.char_total[q]-1)
              print('M_NORMAL',sum(e.damage for e in normals),'N',len(normals),'M_SKILL',sum(e.damage for e in skills),'N',len(skills))
          PY
